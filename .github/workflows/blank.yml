name: IREXT_WEB_UI_AND_SIGNATURE_BUILD

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取代码并初始化
        run: |
          rm -rf *
          mkdir -p app/src/main/java/com/irext/decodesdk
          mkdir -p app/src/main/java/hap/re00660/re
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/jniLibs
          echo "✅ 兵工厂目录初始化完成"

      - name: 2. 自动化注入 JNI 驱动库
        run: |
          wget "https://irext-lib-release.oss-cn-hangzhou.aliyuncs.com/1.5.2/decode_sdk/libirdecode_jni_1.5.2-android.zip" -O jni.zip
          unzip jni.zip -d jni_temp
          SOURCE_DIR=$(find jni_temp -name "arm64-v8a" -type d | head -n 1 | xargs dirname)
          cp -r $SOURCE_DIR/* app/src/main/jniLibs/
          echo "✅ 硬件解码 .so 驱动已就绪"

      - name: 3. 编写 JNI 桥接 Java 代码
        run: |
          cat <<EOF > app/src/main/java/com/irext/decodesdk/IRDecode.java
          package com.irext.decodesdk;
          public class IRDecode {
              static { System.loadLibrary("irdecode"); }
              public native int init();
              public native int open(int category, int subCategory, byte[] bin, int binLength);
              public native int[] decode(int keyCode, int[] acStatus);
              public native void close();
          }
          EOF

      - name: 4. 编写核心服务 (带 Web 面板 UI 逻辑)
        run: |
          cat <<EOF > app/src/main/java/hap/re00660/re/IRService.java
          package hap.re00660.re;
          import android.app.*;
          import android.content.*;
          import android.hardware.ConsumerIrManager;
          import android.os.IBinder;
          import com.irext.decodesdk.IRDecode;
          import fi.iki.elonen.NanoHTTPD;
          import java.util.Map;

          public class IRService extends Service {
              private WebServer server;
              private ConsumerIrManager ir;
              private IRDecode decoder = new IRDecode();
              private SharedPreferences pref;

              @Override
              public void onCreate() {
                  super.onCreate();
                  pref = getSharedPreferences("IREXT_CFG", MODE_PRIVATE);
                  String ID = "IR_HAP";
                  if (android.os.Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel(ID, "IR", NotificationManager.IMPORTANCE_LOW);
                      getSystemService(NotificationManager.class).createNotificationChannel(ch);
                  }
                  startForeground(1, new Notification.Builder(this, ID).setContentTitle("红外网关运行中").setContentText("控制面板端口: 8080").setSmallIcon(android.R.drawable.ic_dialog_info).build());
                  ir = (ConsumerIrManager) getSystemService(CONSUMER_IR_SERVICE);
                  decoder.init();
                  try { server = new WebServer(8080); server.start(); } catch (Exception e) {}
              }

              private class WebServer extends NanoHTTPD {
                  public WebServer(int port) { super(port); }
                  @Override
                  public Response serve(IHTTPSession session) {
                      Map<String, String> p = session.getParms();
                      
                      // 1. 保存 Key/Secret 接口
                      if (p.get("save_auth") != null) {
                          pref.edit().putString("ak", p.get("ak")).putString("as", p.get("as")).apply();
                          return newFixedLengthResponse("认证信息已保存！");
                      }

                      // 2. 发射接口 (供 HA 调用)
                      if (p.get("raw") != null) {
                          try {
                              String[] s = p.get("raw").split(",");
                              int[] pat = new int[s.length];
                              for(int i=0; i<s.length; i++) pat[i] = Integer.parseInt(s[i].trim());
                              ir.transmit(38000, pat);
                              return newFixedLengthResponse("OK_SENT");
                          } catch (Exception e) { return newFixedLengthResponse("ERR"); }
                      }

                      // 3. Web 网页 UI
                      String html = "<html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'>" +
                          "<style>body{background:#f0f2f5;font-family:sans-serif;text-align:center;padding:15px;} " +
                          ".card{background:#fff;border-radius:15px;padding:20px;box-shadow:0 4px 15px rgba(0,0,0,0.1);margin-bottom:20px;}" +
                          "button{width:100%;padding:15px;margin:8px 0;border:none;border-radius:10px;background:#1890ff;color:white;font-size:16px;font-weight:bold;} " +
                          "input{width:90%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px;}</style></head>" +
                          "<body><h2>📡 IREXT 官方终端网关</h2>" +
                          "<div class='card'><h3>1. 官方授权认证</h3>" +
                          "<input id='ak' placeholder='App Key' value='"+pref.getString("ak","")+"'/>" +
                          "<input id='as' placeholder='App Secret' value='"+pref.getString("as","")+"'/>" +
                          "<button onclick='save()'>保存配置并认证</button></div>" +
                          "<div class='card'><h3>2. 快速测试 (格力空调)</h3>" +
                          "<button style='background:#52c41a' onclick='tx(\"9000,4500,560,560,560,560,560,1690,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,1690,560\")'>开机测试</button></div>" +
                          "<script>function save(){ fetch(\"/?save_auth=1&ak=\"+document.getElementById(\"ak\").value+\"&as=\"+document.getElementById(\"as\").value).then(r=>r.text()).then(alert); }" +
                          "function tx(c){ fetch(\"/?raw=\"+c).then(r=>r.text()).then(t=>alert(t)); }</script>" +
                          "</body></html>";
                      return newFixedLengthResponse(html);
                  }
              }
              @Override public IBinder onBind(Intent intent) { return null; }
          }
          EOF

      - name: 5. 编写 MainActivity (简体中文 + Root提权)
        run: |
          cat <<EOF > app/src/main/java/hap/re00660/re/MainActivity.java
          package hap.re00660.re;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.TextView;
          import java.net.*;
          import java.util.*;

          public class MainActivity extends Activity {
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  TextView tv = new TextView(this); tv.setTextSize(18); tv.setPadding(40,40,40,40); setContentView(tv);
                  new Thread(() -> {
                      try {
                          Process p = Runtime.getRuntime().exec("su");
                          java.io.DataOutputStream os = new java.io.DataOutputStream(p.getOutputStream());
                          os.writeBytes("dumpsys deviceidle whitelist +" + getPackageName() + "\n");
                          os.writeBytes("exit\n"); os.flush();
                      } catch (Exception e) {}
                  }).start();
                  startService(new Intent(this, IRService.class));
                  tv.setText("🚀 不死鸟网关已启动\n\n包名: hap.re00660.re\n网页地址: http://" + getIP() + ":8080\n\n请去 GitHub 日志中查看 MD5 签名！");
              }
              private String getIP() {
                  try {
                      for (NetworkInterface nf : Collections.list(NetworkInterface.getNetworkInterfaces()))
                          for (InetAddress addr : Collections.list(nf.getInetAddresses()))
                              if (!addr.isLoopbackAddress() && addr.getHostAddress().indexOf(':') < 0) return addr.getHostAddress();
                  } catch (Exception e) {} return "0.0.0.0";
              }
          }
          EOF

      - name: 6. 编写清单文件 (支持 Boot 自启)
        run: |
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.TRANSMIT_IR" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <application android:label="HAP转发网关" android:theme="@android:style/Theme.DeviceDefault">
                  <activity android:name="hap.re00660.re.MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
                  <service android:name="hap.re00660.re.IRService" android:exported="false" />
              </application>
          </manifest>
          EOF

      - name: 7. 构建配置文件 (开启 AndroidX)
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "include ':app'" > settings.gradle
          cat <<EOF > build.gradle
          buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral(); maven { url "http://maven.irext.net/"; allowInsecureProtocol = true } } }
          EOF
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              compileSdk 34
              namespace "hap.re00660.re"
              defaultConfig { applicationId "hap.re00660.re"; minSdk 26; targetSdk 34; ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' } }
          }
          dependencies {
              implementation 'org.nanohttpd:nanohttpd:2.3.1'
              implementation 'net.irext.webapi:irext-androidapi:1.5.2'
          }
          EOF

      - name: 8. 执行云端编译并【打印签名】
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: 9. 编译并提取 MD5
        run: |
          gradle assembleDebug
          echo "------------------------------------------------------------"
          echo "老表！你的 MD5 签名在这里，复制去 IREXT 控制台："
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep MD5 | sed 's/MD5: //' | sed 's/://g' | tr '[:upper:]' '[:lower:]'
          echo "------------------------------------------------------------"

      - name: 10. 导出成品 APK
        uses: actions/upload-artifact@v4
        with:
          name: IREXT_FINAL_FULL_UI_APK
          path: app/build/outputs/apk/debug/app-debug.apk
