name: IREXT_PRO_OPTIMIZED

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 代码初始化
        run: |
          rm -rf *
          mkdir -p app/src/main/java/hap/re00660/re
          echo "✅ 初始化完成"

      - name: 2. 编写优化版网关服务
        run: |
          cat <<'EOF' > app/src/main/java/hap/re00660/re/IRService.java
          package hap.re00660.re;
          import android.app.*;
          import android.content.*;
          import android.hardware.ConsumerIrManager;
          import android.os.IBinder;
          import android.os.PowerManager;
          import fi.iki.elonen.NanoHTTPD;
          import java.io.*;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.*;
          import com.google.gson.*;

          public class IRService extends Service {
              private WebServer server;
              private ConsumerIrManager ir;
              private SharedPreferences db;
              private String dockerUrl = "";
              private String apiId = "", apiToken = "";
              private PowerManager.WakeLock wakeLock;
              private static final String TAG = "IRService";

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if(intent != null) {
                      String url = intent.getStringExtra("DOCKER_URL");
                      if(url != null && !url.isEmpty()) {
                          dockerUrl = url;
                          loginPrivateCloud();
                      }
                  }
                  return START_STICKY;
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  db = getSharedPreferences("IREXT_DB", MODE_PRIVATE);
                  
                  // 前台服务通知
                  try {
                      NotificationChannel ch = new NotificationChannel("IR", "ha红外网关", NotificationManager.IMPORTANCE_LOW);
                      getSystemService(NotificationManager.class).createNotificationChannel(ch);
                      Notification.Builder nb = new Notification.Builder(this, "IR")
                          .setContentTitle("红外网关运行中")
                          .setContentText("Web: http://0.0.0.0:8080")
                          .setSmallIcon(android.R.drawable.ic_dialog_info);
                      startForeground(1, nb.build());
                  } catch(Throwable t) {}
                  
                  // 唤醒锁（保活）
                  try {
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "IRService::WakeLock");
                      wakeLock.acquire();
                  } catch(Throwable t) {}
                  
                  try { ir = (ConsumerIrManager) getSystemService(CONSUMER_IR_SERVICE); } catch(Throwable t) {}
                  try { 
                      server = new WebServer(8080); 
                      server.start(); 
                      android.util.Log.d(TAG, "服务启动成功");
                  } catch (Exception e) { 
                      android.util.Log.e(TAG, "服务启动失败: " + e.getMessage());
                  }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if(wakeLock != null && wakeLock.isHeld()) wakeLock.release();
                  if(server != null) server.stop();
              }

              private String postJSON(String path, String jsonBody) {
                  HttpURLConnection conn = null;
                  try {
                      URL url = new URL(dockerUrl + path);
                      conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod("POST");
                      conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                      conn.setConnectTimeout(5000);
                      conn.setReadTimeout(5000);
                      conn.setDoOutput(true);
                      try(OutputStream os = conn.getOutputStream()) { 
                          os.write(jsonBody.getBytes(StandardCharsets.UTF_8)); 
                      }
                      int code = conn.getResponseCode();
                      InputStream is = code >= 400 ? conn.getErrorStream() : conn.getInputStream();
                      if (is == null) return "{}";
                      try(BufferedReader br = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8))) {
                          StringBuilder sb = new StringBuilder(); 
                          String line;
                          while((line = br.readLine()) != null) sb.append(line);
                          return sb.toString();
                      }
                  } catch (Exception e) { 
                      android.util.Log.e(TAG, "HTTP失败: " + e.getMessage());
                      return "{}"; 
                  }
                  finally { if(conn!=null) conn.disconnect(); }
              }

              private void loginPrivateCloud() {
                  new Thread(() -> {
                      String req = "{\"appKey\":\"55b1d89fda0658d6f851ee89cad564de\",\"appSecret\":\"83dfd86ad59843ce50342ec863a49bf0\",\"appType\":\"2\"}";
                      String res = postJSON("/irext-server/app/app_login", req);
                      try {
                          JsonObject entity = JsonParser.parseString(res).getAsJsonObject().getAsJsonObject("entity");
                          apiId = entity.get("id").getAsString();
                          apiToken = entity.get("token").getAsString();
                          android.util.Log.d(TAG, "登录成功");
                      } catch (Exception e) { 
                          android.util.Log.e(TAG, "登录失败: " + e.getMessage());
                      }
                  }).start();
              }

              private class WebServer extends NanoHTTPD {
                  public WebServer(int port) { super(port); }
                  
                  @Override
                  public Response serve(IHTTPSession session) {
                      String uri = session.getUri();
                      Map<String, String> p = session.getParms();
                      
                      try {
                          if ("/api/list".equals(uri)) {
                              String devs = db.getString("devs", "[]");
                              return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", devs);
                          }
                          
                          if ("/api/save".equals(uri)) {
                              int len = Integer.parseInt(session.getHeaders().get("content-length"));
                              byte[] buf = new byte[len]; 
                              session.getInputStream().read(buf, 0, len);
                              String body = new String(buf, StandardCharsets.UTF_8);
                              JsonArray list = JsonParser.parseString(db.getString("devs", "[]")).getAsJsonArray();
                              list.add(JsonParser.parseString(body));
                              db.edit().putString("devs", list.toString()).commit();
                              return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", "{\"ok\":true}");
                          }
                          
                          if ("/api/delete".equals(uri)) {
                              JsonArray list = JsonParser.parseString(db.getString("devs", "[]")).getAsJsonArray();
                              JsonArray newList = new JsonArray();
                              int idx = Integer.parseInt(p.get("i"));
                              for(int i=0; i<list.size(); i++) if(i != idx) newList.add(list.get(i));
                              db.edit().putString("devs", newList.toString()).commit();
                              return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", "{\"ok\":true}");
                          }
                          
                          if ("/api/tx".equals(uri)) {
                              if (ir == null || !ir.hasIrEmitter()) {
                                  return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", "{\"error\":\"no_ir\"}");
                              }
                              
                              JsonObject req = new JsonObject();
                              req.addProperty("id", apiId); 
                              req.addProperty("token", apiToken);
                              req.addProperty("indexId", p.get("id")); 
                              req.addProperty("keyCode", p.get("k"));
                              req.addProperty("directDecode", "0"); 
                              req.addProperty("paraData", "0");
                              
                              String cid = p.get("c");
                              if ("1".equals(cid)) {
                                  JsonObject ac = new JsonObject();
                                  ac.addProperty("acPower", "1".equals(p.get("p"))?"0":"1");
                                  ac.addProperty("acMode", p.get("m")); 
                                  ac.addProperty("acTemp", p.get("t"));
                                  ac.addProperty("acWindSpeed","0"); 
                                  ac.addProperty("acWindDir","0"); 
                                  ac.addProperty("changeWindDir","0");
                                  req.add("acStatus", ac);
                              }
                              
                              String res = postJSON("/irext-server/operation/decode", req.toString());
                              JsonObject root = JsonParser.parseString(res).getAsJsonObject();
                              
                              if (root.has("entity") && !root.get("entity").isJsonNull()) {
                                  JsonArray arr = root.getAsJsonArray("entity");
                                  int[] pat = new int[arr.size()];
                                  for (int i=0; i<arr.size(); i++) pat[i] = arr.get(i).getAsInt();
                                  ir.transmit(38000, pat);
                                  return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", "{\"ok\":true}");
                              }
                              return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", "{\"error\":\"decode_failed\"}");
                          }
                          
                          if ("/api/proxy".equals(uri)) {
                              String req = "{\"id\":\""+apiId+"\",\"token\":\""+apiToken+"\"," + p.get("b") + "}";
                              String res = postJSON(p.get("p"), req);
                              JsonObject obj = JsonParser.parseString(res).getAsJsonObject();
                              String result = obj.has("entity") ? obj.get("entity").toString() : "[]";
                              return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", result);
                          }
                          
                      } catch(Exception e) { 
                          return newFixedLengthResponse(Response.Status.INTERNAL_ERROR, "application/json; charset=UTF-8", "{\"error\":\""+e.getMessage()+"\"}");
                      }

                      // 前端页面 - 优化版
                      String html = "<!DOCTYPE html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>红外网关</title><style>"
                          + "*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5;padding:15px;margin:0 auto;max-width:480px;line-height:1.5}"
                          + ".card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:15px}"
                          + ".header{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}"
                          + ".header h2{margin:0;font-size:20px;color:#333}"
                          + ".btn-back{background:#f0f0f0;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px}"
                          + ".btn{display:block;width:100%;padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:500;margin-top:10px;cursor:pointer;transition:opacity .2s}"
                          + ".btn:active{opacity:.8}"
                          + ".btn-p{background:#1890ff;color:#fff}"
                          + ".btn-g{background:#52c41a;color:#fff}"
                          + ".btn-r{background:#ff4d4f;color:#fff}"
                          + ".btn-w{background:#f5f5f5;color:#333;border:1px solid #d9d9d9}"
                          + ".dev-item{background:#fff;border:1px solid #e8e8e8;padding:16px;border-radius:8px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all .2s}"
                          + ".dev-item:hover{border-color:#1890ff;box-shadow:0 2px 8px rgba(24,144,255,.1)}"
                          + ".dev-name{font-size:16px;font-weight:500;color:#262626}"
                          + ".dev-info{font-size:13px;color:#8c8c8c;margin-top:4px}"
                          + "select,input{width:100%;padding:12px;margin:8px 0;border:1px solid #d9d9d9;border-radius:6px;font-size:15px;outline:none}"
                          + "select:focus,input:focus{border-color:#1890ff}"
                          + "#views>div{display:none}#v_home{display:block}"
                          + ".panel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}"
                          + ".panel button{padding:16px 4px;font-size:14px}"
                          + ".num-grid{grid-template-columns:repeat(5,1fr);margin-top:10px;padding-top:10px;border-top:1px dashed #e8e8e8}"
                          + ".status-bar{background:#e6f7ff;border:1px solid #91d5ff;padding:10px 15px;border-radius:6px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center}"
                          + ".ac-state{font-family:monospace;font-size:14px;color:#1890ff}"
                          + "textarea{width:100%;height:200px;font-family:monospace;font-size:12px;background:#f6ffed;border:1px solid #b7eb8f;padding:12px;border-radius:6px;resize:none}"
                          + ".empty{text-align:center;padding:50px 20px;color:#999}"
                          + ".match-info{text-align:center;padding:25px;background:#f6ffed;border-radius:8px;margin:15px 0}"
                          + ".match-info .num{font-size:36px;font-weight:bold;color:#1890ff}"
                          + ".actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}"
                          + ".switch-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f0f0}"
                          + ".switch-row:last-child{border:none}"
                          + "label.switch{position:relative;display:inline-block;width:50px;height:26px}"
                          + "label.switch input{opacity:0;width:0;height:0}"
                          + ".slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ccc;transition:.4s;border-radius:26px}"
                          + ".slider:before{position:absolute;content:'';height:20px;width:20px;left:3px;bottom:3px;background:#fff;transition:.4s;border-radius:50%}"
                          + "input:checked+.slider{background:#1890ff}"
                          + "input:checked+.slider:before{transform:translateX(24px)}"
                          + "</style></head><body>"
                          
                          // 主页
                          + "<div id='views'><div id='v_home'><div class='card'><div class='header'><h2>🏠 我的设备</h2><button class='btn btn-g' style='width:auto;margin:0;padding:8px 16px' onclick='goAdd()'>+ 添加</button></div><div id='dev_list'><div class='empty'>加载中...</div></div></div></div>"
                          
                          // 添加流程
                          + "<div id='v_add'><div class='card'><div class='header'><button class='btn-back' onclick='goHome()'>← 返回</button><h2>选择类型</h2></div><label>设备类型</label><select id='sc' onchange='lb()'><option>加载中...</option></select><label>品牌</label><select id='sb' onchange='startMatch()'><option>请先选择类型</option></select></div></div>"
                          
                          // 匹配页面
                          + "<div id='v_match'><div class='card'><div class='header'><button class='btn-back' onclick='view(\"v_add\")'>← 返回</button><h2>智能匹配</h2></div><div class='match-info'><div class='num' id='midx'>1</div><div>共 <span id='mtotal'>0</span> 套方案</div></div><button class='btn btn-p' style='padding:20px' onclick='testPwr()'>📡 测试电源键</button><div class='actions'><button class='btn btn-w' onclick='next()'>❌ 无反应</button><button class='btn btn-g' onclick='preSave()'>✅ 有反应</button></div></div></div>"
                          
                          // 保存页面
                          + "<div id='v_save'><div class='card'><div class='header'><button class='btn-back' onclick='view(\"v_match\")'>← 返回</button><h2>保存设备</h2></div><label>设备名称</label><input id='d_name' placeholder='例如：客厅空调'><button class='btn btn-g' onclick='doSave()'>确认保存</button><button class='btn btn-w' onclick='goHome()'>取消</button></div></div>"
                          
                          // 控制页面
                          + "<div id='v_ctrl'><div class='card'><div class='header'><button class='btn-back' onclick='goHome()'>← 返回</button><h2 id='c_title'>控制</h2></div><div class='status-bar' id='ac_bar' style='display:none'><span>空调状态</span><span class='ac-state' id='ac_st'></span></div><div class='panel' id='btns'></div><div class='panel num-grid' id='num_btns' style='display:none'></div><div class='switch-row' style='margin-top:20px'><span>生成HA配置</span><label class='switch'><input type='checkbox' id='ha_toggle' onchange='toggleHA()'><span class='slider'></span></label></div><div id='ha_box' style='display:none;margin-top:15px'><textarea id='ha_code' readonly onclick='this.select()'></textarea><div style='font-size:12px;color:#666;margin-top:5px'>点击上方配置可复制</div></div><button class='btn btn-r' style='margin-top:20px' onclick='delDev()'>🗑️ 删除设备</button></div></div>"
                          
                          + "</div><script>"
                          + "const kmaps={'空调':{0:'电源',1:'模式',2:'温度+',3:'温度-',9:'风速',10:'扫风'},'电视机':{0:'电源',1:'静音',2:'上',3:'下',4:'左',5:'右',6:'确认',7:'音量+',8:'音量-',9:'返回',10:'菜单',11:'主页'},'机顶盒':{0:'电源',1:'静音',2:'上',3:'下',4:'左',5:'右',6:'确认',7:'音量+',8:'音量-',9:'返回',10:'菜单'},'风扇':{0:'电源',1:'风速+',2:'风速-',3:'摇头',4:'定时',5:'风类'},'投影仪':{0:'电源',1:'上',2:'下',3:'左',4:'右',5:'确认',6:'音量+',7:'音量-'},'音响':{0:'电源',1:'播放',2:'暂停',3:'上一首',4:'下一首',5:'音量+',6:'音量-',7:'静音'},'灯':{0:'电源',1:'亮度+',2:'亮度-',3:'颜色',4:'模式'},'空气净化器':{0:'电源',1:'自动',2:'睡眠',3:'强力',4:'风速'}};"
                          + "const $=i=>document.getElementById(i);let cs=[],bs=[],is=[],curr=0,ac={p:0,m:0,t:8},devs=[],curDev=null,curIdx=-1;"
                          + "function view(id){document.querySelectorAll('#views>div').forEach(d=>d.style.display='none');let el=$(id);if(el)el.style.display='block'}"
                          
                          // 加载设备
                          + "async function loadDevs(){"
                          + "  try{let r=await fetch('/api/list?t='+Date.now());let d=await r.json();devs=Array.isArray(d)?d:[];"
                          + "    let h='';if(devs.length===0){h='<div class=\\\"empty\\\">暂无设备<br><small>点击右上角添加</small></div>';}"
                          + "    else{devs.forEach((x,i)=>{h+=`<div class=\\\"dev-item\\\" onclick='openDev(${i})'><div><div class=\\\"dev-name\\\">${x.name}</div><div class=\\\"dev-info\\\">${x.brand||''} · ${x.cate||''}</div></div><span style=\\\"color:#ccc\\\">›</span></div>`});}"
                          + "    $('dev_list').innerHTML=h;}catch(e){$('dev_list').innerHTML='<div class=\\\"empty\\\" style=\\\"color:red\\\">加载失败</div>';}"
                          + "}"
                          + "function goHome(){loadDevs();view('v_home');if(window.Android)Android.refresh();}"
                          
                          // 添加流程
                          + "async function goAdd(){view('v_add');try{let r=await fetch('/api/proxy?p=/irext-server/indexing/list_categories&b=\\\"from\\\":\\\"0\\\",\\\"count\\\":\\\"100\\\"');cs=await r.json();$('sc').innerHTML='<option value=>选择设备类型</option>'+cs.map((c,i)=>'<option value='+i+'>'+(c.name_cn||c.name)+'</option>').join('');}catch(e){$('sc').innerHTML='<option>加载失败</option>';}}"
                          + "async function lb(){let v=$('sc').value;if(v==='')return;let cid=cs[v].id||cs[v].categoryId;$('sb').innerHTML='<option>加载中...</option>';try{let r=await fetch('/api/proxy?p=/irext-server/indexing/list_brands&b=\\\"categoryId\\\":\\\"'+cid+'\\\",\\\"from\\\":\\\"0\\\",\\\"count\\\":\\\"500\\\"');bs=await r.json();$('sb').innerHTML='<option value=>选择品牌</option>'+bs.map((b,i)=>'<option value='+i+'>'+(b.name_cn||b.name)+'</option>').join('');}catch(e){$('sb').innerHTML='<option>加载失败</option>';}}"
                          + "async function startMatch(){let vc=$('sc').value,vb=$('sb').value;if(vc===''||vb==='')return;let cid=cs[vc].id||cs[vc].categoryId,bid=bs[vb].id||bs[vb].brandId;try{let r=await fetch('/api/proxy?p=/irext-server/indexing/list_indexes&b=\\\"categoryId\\\":\\\"'+cid+'\\\",\\\"brandId\\\":\\\"'+bid+'\\\",\\\"cityCode\\\":\\\"\\\",\\\"from\\\":\\\"0\\\",\\\"count\\\":\\\"500\\\"');is=await r.json();curr=0;view('v_match');$('midx').innerText=1;$('mtotal').innerText=is.length;}catch(e){alert('加载失败');}}"
                          + "function testPwr(){if(is[curr])tx(0,is[curr],cs[$('sc').value]);}"
                          + "function next(){if(curr<is.length-1){curr++;$('midx').innerText=curr+1;}else{alert('已到最后一套方案');}}"
                          + "function preSave(){view('v_save');let c=cs[$('sc').value],b=bs[$('sb').value];$('d_name').value=(b.name_cn||b.name||'')+' '+(c.name_cn||c.name||'');}"
                          + "async function doSave(){let name=$('d_name').value.trim();if(!name){alert('请输入名称');return;}let d={name:name,cate:cs[$('sc').value].name_cn||cs[$('sc').value].name,brand:bs[$('sb').value].name_cn||bs[$('sb').value].name,idx:is[curr],cid:cs[$('sc').value].id||cs[$('sc').value].categoryId};try{await fetch('/api/save',{method:'POST',body:JSON.stringify(d)});goHome();}catch(e){alert('保存失败');}}"
                          
                          // 控制设备
                          + "function openDev(i){curDev=devs[i];curIdx=i;view('v_ctrl');$('c_title').innerText=curDev.name;renderPanel();if($('ha_toggle').checked)genHA();}"
                          + "async function delDev(){if(!confirm('确定删除 '+curDev.name+'?'))return;try{await fetch('/api/delete?i='+curIdx);goHome();}catch(e){alert('删除失败');}}"
                          + "function renderPanel(){let cid=curDev.cid||1,cate=curDev.cate||'';let h='';let m=kmaps[cate]||kmaps['电视机'];Object.keys(m).forEach(k=>{h+=`<button class=\\\"btn btn-w\\\" onclick='fire(${k})'>${m[k]}</button>`});$('btns').innerHTML=h;let isTV=(cate.includes('电视')||cate.includes('机顶盒')||cid===2||cid===3);if(isTV){let nh='';for(let i=0;i<=9;i++){nh+=`<button class=\\\"btn btn-w\\\" onclick='fire(${14+i})'>${i}</button>`}$('num_btns').innerHTML=nh;$('num_btns').style.display='grid';}else{$('num_btns').style.display='none';}if(cid===1||cate.includes('空调')){$('ac_bar').style.display='flex';updateAcUI();}else{$('ac_bar').style.display='none';}}"
                          + "function updateAcUI(){$('ac_st').innerText=(ac.p?'🟢':'⚪')+' '+['制冷','制热','自动','送风','除湿'][ac.m]+' '+(ac.t+16)+'°C';}"
                          + "function fire(k){let cid=curDev.cid||1,cate=curDev.cate||'';if(cid===1||cate.includes('空调')){if(k===0)ac.p=1-ac.p;if(k===1)ac.m=(ac.m+1)%5;if(k===2)ac.t=Math.min(14,ac.t+1);if(k===3)ac.t=Math.max(0,ac.t-1);updateAcUI();}let idx=curDev.idx;fetch(`/api/tx?id=${idx.id||idx.indexId}&c=${cid}&k=${k}&p=${ac.p}&m=${ac.m}&t=${ac.t}`).then(r=>r.json());}"
                          
                          // HA配置生成
                          + "function toggleHA(){if($('ha_toggle').checked){genHA();$('ha_box').style.display='block';}else{$('ha_box').style.display='none';}}"
                          + "function genHA(){if(!curDev)return;let u=location.origin,n=curDev.name.replace(/[^a-zA-Z0-9\\u4e00-\\u9fa5]/g,'_'),cid=curDev.cid||1,cate=curDev.cate||'',yaml='';"
                          + "if(cid===1||cate.includes('空调')){"
                          + "  yaml='# 空调配置 (climate)\\nrest_command:\\n  '+n+'_cmd:\\n    url: \"'+u+'/api/tx?id='+curDev.idx.id+'&c=1&k={{key}}&p={{pwr}}&m={{mode}}&t={{temp}}\"\\n    method: GET\\n\\nclimate:\\n  - platform: template\\n    name: \"'+curDev.name+'\"\\n    modes: [\\'off\\',\\'cool\\',\\'heat\\',\\'auto\\',\\'dry\\',\\'fan_only\\']\\n    min_temp: 16\\n    max_temp: 30\\n    turn_on:\\n      service: rest_command.'+n+'_cmd\\n      data: {key: 0, pwr: 1, mode: 0, temp: 24}\\n    turn_off:\\n      service: rest_command.'+n+'_cmd\\n      data: {key: 0, pwr: 0, mode: 0, temp: 24}\\n    set_temperature:\\n      service: rest_command.'+n+'_cmd\\n      data_template: {key: 2, pwr: 1, mode: 0, temp: \"{{temperature}}\"}';"
                          + "}else if(cate.includes('电视')||cate.includes('机顶盒')){"
                          + "  yaml='# 电视/机顶盒配置 (media_player)\\nrest_command:\\n  '+n+'_cmd:\\n    url: \"'+u+'/api/tx?id='+curDev.idx.id+'&c='+cid+'&k={{key}}&p=0&m=0&t=0\"\\n    method: GET\\n\\nmedia_player:\\n  - platform: template\\n    name: \"'+curDev.name+'\"\\n    turn_on:\\n      service: rest_command.'+n+'_cmd\\n      data: {key: 0}\\n    turn_off:\\n      service: rest_command.'+n+'_cmd\\n      data: {key: 0}\\n    volume_up:\\n      service: rest_command.'+n+'_cmd\\n      data: {key: 7}\\n    volume_down:\\n      service: rest_command.'+n+'_cmd\\n      data: {key: 8}';"
                          + "}else{"
                          + "  yaml='# 通用设备配置 (switch)\\nrest_command:\\n  '+n+'_on:\\n    url: \"'+u+'/api/tx?id='+curDev.idx.id+'&c='+cid+'&k=0\"\\n  '+n+'_off:\\n    url: \"'+u+'/api/tx?id='+curDev.idx.id+'&c='+cid+'&k=0\"\\n\\nswitch:\\n  - platform: template\\n    name: \"'+curDev.name+'\"\\n    turn_on:\\n      service: rest_command.'+n+'_on\\n    turn_off:\\n      service: rest_command.'+n+'_off';"
                          + "}$('ha_code').value=yaml;}"
                          
                          + "goHome();</script></body></html>";
                      
                      byte[] bytes = html.getBytes(StandardCharsets.UTF_8);
                      return newFixedLengthResponse(Response.Status.OK, "text/html; charset=UTF-8", new ByteArrayInputStream(bytes), bytes.length);
                  }
              }
              @Override public IBinder onBind(Intent intent) { return null; }
          }
          EOF

      - name: 3. 编写优化版主界面 (带Root保活开关)
        run: |
          cat <<EOF > app/src/main/java/hap/re00660/re/MainActivity.java
          package hap.re00660.re;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.*;
          import android.webkit.*;
          import android.widget.*;
          import androidx.cardview.widget.CardView; 
          import com.google.gson.*;
          import java.net.*;
          import java.util.*;
          import java.io.*;

          public class MainActivity extends Activity {
              private SharedPreferences db, cfg;
              private LinearLayout listArea;
              private WebView webView;
              private EditText ipInput;
              private TextView statusText, hintText;
              private Switch rootSwitch;
              private boolean isWeb = false;
              private boolean isServiceRunning = false;

              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  db = getSharedPreferences("IREXT_DB", MODE_PRIVATE);
                  cfg = getSharedPreferences("IREXT_CFG", MODE_PRIVATE);

                  ScrollView scroll = new ScrollView(this);
                  LinearLayout main = new LinearLayout(this);
                  main.setOrientation(LinearLayout.VERTICAL);
                  main.setPadding(40, 40, 40, 40);
                  main.setBackgroundColor(Color.parseColor("#F8FAFC"));

                  // 标题
                  TextView title = new TextView(this);
                  title.setText("📡 红外网关 Pro");
                  title.setTextSize(26);
                  title.setTextColor(Color.parseColor("#1e293b"));
                  title.setPadding(0, 0, 0, 10);
                  main.addView(title);

                  // 状态显示
                  statusText = new TextView(this);
                  statusText.setText("● 服务未启动");
                  statusText.setTextColor(Color.parseColor("#ef4444"));
                  statusText.setTextSize(16);
                  statusText.setPadding(0, 0, 0, 20);
                  main.addView(statusText);

                  // 服务器配置
                  CardView serverCard = createCard();
                  TextView serverTitle = new TextView(this);
                  serverTitle.setText("服务器配置");
                  serverTitle.setTextSize(18);
                  serverTitle.setTextColor(Color.parseColor("#334155"));
                  serverTitle.setPadding(0, 0, 0, 15);
                  serverCard.addView(serverTitle);

                  TextView hint = new TextView(this);
                  hint.setText("私有云服务器地址 (IP:端口)");
                  hint.setTextSize(13);
                  hint.setTextColor(Color.parseColor("#64748b"));
                  serverCard.addView(hint);

                  ipInput = new EditText(this);
                  ipInput.setHint("192.168.1.100:8081");
                  String savedUrl = cfg.getString("docker_ip", "192.168.1.100:8081");
                  if(savedUrl.startsWith("http://")) savedUrl = savedUrl.substring(7);
                  else if(savedUrl.startsWith("https://")) savedUrl = savedUrl.substring(8);
                  ipInput.setText(savedUrl);
                  ipInput.setBackgroundColor(Color.parseColor("#f1f5f9"));
                  ipInput.setPadding(20, 20, 20, 20);
                  serverCard.addView(ipInput);

                  // Root 保活开关
                  LinearLayout switchRow = new LinearLayout(this);
                  switchRow.setOrientation(LinearLayout.HORIZONTAL);
                  switchRow.setPadding(0, 15, 0, 0);
                  
                  TextView switchLabel = new TextView(this);
                  switchLabel.setText("使用 Root 保活");
                  switchLabel.setTextSize(15);
                  switchLabel.setTextColor(Color.parseColor("#475569"));
                  switchLabel.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1));
                  
                  rootSwitch = new Switch(this);
                  rootSwitch.setChecked(cfg.getBoolean("use_root", false));
                  rootSwitch.setOnCheckedChangeListener((btn, checked) -> {
                      cfg.edit().putBoolean("use_root", checked).apply();
                      if(checked) {
                          hintText.setText("Root 模式：将使用 dumpsys 加入系统白名单");
                          hintText.setVisibility(View.VISIBLE);
                      } else {
                          hintText.setVisibility(View.GONE);
                      }
                  });
                  
                  switchRow.addView(switchLabel);
                  switchRow.addView(rootSwitch);
                  serverCard.addView(switchRow);

                  // 提示文本
                  hintText = new TextView(this);
                  hintText.setText("Root 模式已开启，将使用系统级保活");
                  hintText.setTextSize(12);
                  hintText.setTextColor(Color.parseColor("#1890ff"));
                  hintText.setPadding(0, 10, 0, 0);
                  hintText.setVisibility(rootSwitch.isChecked() ? View.VISIBLE : View.GONE);
                  serverCard.addView(hintText);

                  main.addView(serverCard);

                  // 启动按钮
                  Button startBtn = new Button(this);
                  startBtn.setText("🚀 启动网关服务");
                  startBtn.setBackgroundColor(Color.parseColor("#1890ff"));
                  startBtn.setTextColor(Color.WHITE);
                  startBtn.setPadding(30, 30, 30, 30);
                  startBtn.setOnClickListener(v -> startGateway());
                  LinearLayout.LayoutParams btnParams = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  );
                  btnParams.setMargins(0, 20, 0, 20);
                  main.addView(startBtn, btnParams);

                  // 添加设备按钮
                  Button addBtn = new Button(this);
                  addBtn.setText("+ 添加/管理设备");
                  addBtn.setBackgroundColor(Color.parseColor("#52c41a"));
                  addBtn.setTextColor(Color.WHITE);
                  addBtn.setEnabled(false);
                  addBtn.setAlpha(0.5f);
                  addBtn.setOnClickListener(v -> openWeb());
                  main.addView(addBtn);

                  // 访问地址
                  TextView accessTitle = new TextView(this);
                  accessTitle.setText("\n📱 外部访问地址");
                  accessTitle.setTextSize(14);
                  accessTitle.setTextColor(Color.parseColor("#64748b"));
                  main.addView(accessTitle);

                  TextView accessUrl = new TextView(this);
                  accessUrl.setText("http://" + getLocalIp() + ":8080");
                  accessUrl.setTextColor(Color.parseColor("#059669"));
                  accessUrl.setTextSize(16);
                  accessUrl.setPadding(0, 5, 0, 20);
                  main.addView(accessUrl);

                  // 设备列表标题
                  TextView listTitle = new TextView(this);
                  listTitle.setText("已保存的设备 (" + getDeviceCount() + ")");
                  listTitle.setTextSize(16);
                  listTitle.setTextColor(Color.parseColor("#334155"));
                  listTitle.setPadding(0, 10, 0, 10);
                  main.addView(listTitle);

                  // 设备列表
                  listArea = new LinearLayout(this);
                  listArea.setOrientation(LinearLayout.VERTICAL);
                  main.addView(listArea);

                  scroll.addView(main);
                  setContentView(scroll);

                  // WebView（隐藏）
                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setCacheMode(WebSettings.LOAD_NO_CACHE);
                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface 
                      public void refresh() { 
                          runOnUiThread(() -> {
                              refreshList();
                                      Toast.makeText(MainActivity.this, "列表已刷新", Toast.LENGTH_SHORT).show();
                                  }); 
                      }
                  }, "Android");
                  webView.setVisibility(View.GONE);
                  addContentView(webView, new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  refreshList();
              }

              private CardView createCard() {
                  CardView card = new CardView(this);
                  card.setCardElevation(4);
                  card.setRadius(16);
                  card.setCardBackgroundColor(Color.WHITE);
                  card.setContentPadding(30, 30, 30, 30);
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  );
                  params.setMargins(0, 0, 0, 20);
                  card.setLayoutParams(params);
                  return card;
              }

              private void startGateway() {
                  String input = ipInput.getText().toString().trim();
                  if(input.isEmpty()) {
                      Toast.makeText(this, "请输入服务器地址", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  // 自动补全协议
                  String url = input;
                  if(!url.startsWith("http://") && !url.startsWith("https://")) {
                      url = "http://" + url;
                  }

                  cfg.edit().putString("docker_ip", url).apply();

                  // Root 保活
                  if(rootSwitch.isChecked()) {
                      new Thread(() -> {
                          try {
                              Process p = Runtime.getRuntime().exec("su");
                              DataOutputStream os = new DataOutputStream(p.getOutputStream());
                              os.writeBytes("dumpsys deviceidle whitelist +" + getPackageName() + "\n");
                              os.writeBytes("exit\n");
                              os.flush();
                              p.waitFor();
                              runOnUiThread(() -> Toast.makeText(this, "Root 保活已启用", Toast.LENGTH_SHORT).show());
                          } catch (Exception e) {
                              runOnUiThread(() -> {
                                  Toast.makeText(this, "Root 权限获取失败，使用普通模式", Toast.LENGTH_LONG).show();
                                  requestBatteryWhitelist();
                              });
                          }
                      }).start();
                  } else {
                      requestBatteryWhitelist();
                  }

                  // 启动服务
                  Intent i = new Intent(this, IRService.class);
                  i.putExtra("DOCKER_URL", url);
                  startForegroundService(i);

                  isServiceRunning = true;
                  statusText.setText("● 服务运行中 | " + url.replace("http://", ""));
                  statusText.setTextColor(Color.parseColor("#22c55e"));

                  // 启用添加设备按钮
                  View addBtn = ((LinearLayout)statusText.getParent()).getChildAt(3);
                  addBtn.setEnabled(true);
                  addBtn.setAlpha(1f);

                  Toast.makeText(this, "网关服务已启动", Toast.LENGTH_SHORT).show();
              }

              private void requestBatteryWhitelist() {
                  try {
                      Intent intent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                      intent.setData(Uri.parse("package:" + getPackageName()));
                      startActivity(intent);
                  } catch (Exception e) {
                      // 部分设备不支持
                  }
              }

              private void openWeb() {
                  if(!isServiceRunning) {
                      Toast.makeText(this, "请先启动服务", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  isWeb = true;
                  webView.setVisibility(View.VISIBLE);
                  webView.loadUrl("http://127.0.0.1:8080");
              }

              @Override
              public void onBackPressed() {
                  if(isWeb) {
                      if(webView.canGoBack()) {
                          webView.goBack();
                      } else {
                          isWeb = false;
                          webView.stopLoading();
                          webView.setVisibility(View.GONE);
                          refreshList();
                      }
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if(!isWeb) refreshList();
              }

              private int getDeviceCount() {
                  try {
                      String json = db.getString("devs", "[]");
                      return JsonParser.parseString(json).getAsJsonArray().size();
                  } catch(Exception e) { return 0; }
              }

              private void refreshList() {
                  listArea.removeAllViews();
                  try {
                      String json = db.getString("devs", "[]");
                      JsonArray arr = JsonParser.parseString(json).getAsJsonArray();

                      // 更新标题
                      ViewParent parent = listArea.getParent();
                      if(parent instanceof LinearLayout) {
                          LinearLayout main = (LinearLayout) parent;
                          for(int i=0; i<main.getChildCount(); i++) {
                              View child = main.getChildAt(i);
                              if(child instanceof TextView) {
                                  TextView tv = (TextView) child;
                                  if(tv.getText().toString().startsWith("已保存的设备")) {
                                      tv.setText("已保存的设备 (" + arr.size() + ")");
                                  }
                              }
                          }
                      }

                      if(arr.size() == 0) {
                          TextView empty = new TextView(this);
                          empty.setText("暂无设备");
                          empty.setTextColor(Color.parseColor("#94a3b8"));
                          empty.setPadding(20, 40, 20, 40);
                          empty.setGravity(Gravity.CENTER);
                          listArea.addView(empty);
                          return;
                      }

                      for(int i=0; i<arr.size(); i++) {
                          JsonObject dev = arr.get(i).getAsJsonObject();
                          final int index = i;
                          CardView card = createCard();
                          card.setCardElevation(2);
                          card.setRadius(12);
                          card.setContentPadding(25, 25, 25, 25);
                          ((LinearLayout.LayoutParams)card.getLayoutParams()).setMargins(0, 0, 0, 12);

                          LinearLayout item = new LinearLayout(this);
                          item.setOrientation(LinearLayout.VERTICAL);

                          TextView name = new TextView(this);
                          name.setText(dev.get("name").getAsString());
                          name.setTextSize(17);
                          name.setTextColor(Color.parseColor("#1e293b"));
                          name.setPadding(0, 0, 0, 6);
                          item.addView(name);

                          TextView info = new TextView(this);
                          String brand = dev.has("brand") ? dev.get("brand").getAsString() : "";
                          String cate = dev.has("cate") ? dev.get("cate").getAsString() : "";
                          info.setText(brand + " · " + cate);
                          info.setTextSize(13);
                          info.setTextColor(Color.parseColor("#64748b"));
                          item.addView(info);

                          card.addView(item);
                          card.setOnClickListener(v -> {
                              curDevIndex = index;
                              openWeb();
                          });

                          listArea.addView(card);
                      }
                  } catch(Exception e) {
                      TextView error = new TextView(this);
                      error.setText("加载失败");
                      error.setTextColor(Color.RED);
                      listArea.addView(error);
                  }
              }

              private int curDevIndex = -1;

              private String getLocalIp() {
                  try {
                      for(NetworkInterface n : Collections.list(NetworkInterface.getNetworkInterfaces())) {
                          for(InetAddress a : Collections.list(n.getInetAddresses())) {
                              if(!a.isLoopbackAddress() && a instanceof Inet4Address) {
                                  return a.getHostAddress();
                              }
                          }
                      }
                  } catch(Exception e) {}
                  return "127.0.0.1";
              }
          }
          EOF

