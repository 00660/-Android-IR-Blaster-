name: IREXT_PRIVATE_CLOUD_SMART_MATCH

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 代码初始化
        run: |
          rm -rf *
          mkdir -p app/src/main/java/hap/re00660/re
          mkdir -p app/src/main/res/layout
          echo "✅ 准备就绪"

      - name: 2. 编写满血版商用 Web 网关 (🌟引导式智能匹配 + 服务端存储)
        run: |
          cat <<'EOF' > app/src/main/java/hap/re00660/re/IRService.java
          package hap.re00660.re;
          import android.app.*;
          import android.content.*;
          import android.hardware.ConsumerIrManager;
          import android.os.IBinder;
          import android.util.Log;
          import fi.iki.elonen.NanoHTTPD;
          import java.io.*;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.*;
          import com.google.gson.Gson;
          import com.google.gson.JsonObject;
          import com.google.gson.JsonParser;
          import com.google.gson.JsonArray;

          public class IRService extends Service {
              private WebServer server;
              private ConsumerIrManager ir;
              private SharedPreferences prefs;
              
              private String APP_KEY = "55b1d89fda0658d6f851ee89cad564de";
              private String APP_SECRET = "83dfd86ad59843ce50342ec863a49bf0";
              private String dockerUrl = "http://127.0.0.1:8081";
              private String apiId = "", apiToken = "";

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if(intent != null && intent.getStringExtra("DOCKER_URL") != null) {
                      dockerUrl = intent.getStringExtra("DOCKER_URL");
                      if(dockerUrl.endsWith("/")) dockerUrl = dockerUrl.substring(0, dockerUrl.length()-1);
                      loginPrivateCloud();
                  }
                  return START_STICKY;
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  prefs = getSharedPreferences("IREXT_DEVICES", MODE_PRIVATE);
                  try {
                      NotificationChannel ch = new NotificationChannel("IR", "ha红外网关", NotificationManager.IMPORTANCE_LOW);
                      getSystemService(NotificationManager.class).createNotificationChannel(ch);
                      startForeground(1, new Notification.Builder(this, "IR").setContentTitle("网关运行中").setContentText("API端口: 8080").setSmallIcon(android.R.drawable.ic_dialog_info).build());
                  } catch(Throwable t) {}
                  try { ir = (ConsumerIrManager) getSystemService(CONSUMER_IR_SERVICE); } catch(Throwable t) {}
                  try { server = new WebServer(8080); server.start(); } catch (Exception e) {}
              }
              
              private String postJSON(String path, String jsonBody) {
                  try {
                      URL url = new URL(dockerUrl + path);
                      HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod("POST");
                      conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                      conn.setConnectTimeout(3000);
                      conn.setDoOutput(true);
                      try(OutputStream os = conn.getOutputStream()) { os.write(jsonBody.getBytes("UTF-8")); }
                      InputStream is = conn.getResponseCode() >= 400 ? conn.getErrorStream() : conn.getInputStream();
                      if (is == null) return "{}";
                      try(BufferedReader br = new BufferedReader(new InputStreamReader(is, "UTF-8"))) {
                          StringBuilder sb = new StringBuilder(); String line;
                          while((line = br.readLine()) != null) sb.append(line);
                          return sb.toString();
                      }
                  } catch (Exception e) { return "{\"error\":\"" + e.getMessage() + "\"}"; }
              }

              private void loginPrivateCloud() {
                  new Thread(() -> {
                      String req = "{\"appKey\":\"" + APP_KEY + "\",\"appSecret\":\"" + APP_SECRET + "\",\"appType\":\"2\"}";
                      String res = postJSON("/irext-server/app/app_login", req);
                      try {
                          JsonObject root = JsonParser.parseString(res).getAsJsonObject();
                          JsonObject entity = root.getAsJsonObject("entity");
                          apiId = entity.get("id").getAsString();
                          apiToken = entity.get("token").getAsString();
                      } catch (Exception e) { }
                  }).start();
              }
              
              private class WebServer extends NanoHTTPD {
                  public WebServer(int port) { super(port); }
                  @Override
                  public Response serve(IHTTPSession session) {
                      String uri = session.getUri();
                      Map<String, String> p = session.getParms();
                      
                      try {
                          // 设备列表 API
                          if ("/api/devices/list".equals(uri)) {
                              return newFixedLengthResponse(Response.Status.OK, "application/json", prefs.getString("list", "[]"));
                          }
                          // 保存设备 API
                          if ("/api/devices/save".equals(uri)) {
                              Map<String, String> files = new HashMap<>();
                              session.parseBody(files);
                              String body = files.get("postData");
                              JsonArray list = JsonParser.parseString(prefs.getString("list", "[]")).getAsJsonArray();
                              list.add(JsonParser.parseString(body));
                              prefs.edit().putString("list", list.toString()).apply();
                              return newFixedLengthResponse("OK");
                          }
                          // 删除设备 API
                          if ("/api/devices/delete".equals(uri)) {
                              int index = Integer.parseInt(p.get("index"));
                              JsonArray list = JsonParser.parseString(prefs.getString("list", "[]")).getAsJsonArray();
                              JsonArray newList = new JsonArray();
                              for(int i=0; i<list.size(); i++) if(i != index) newList.add(list.get(i));
                              prefs.edit().putString("list", newList.toString()).apply();
                              return newFixedLengthResponse("OK");
                          }
                          // 发射接口
                          if ("/api/transmit".equals(uri)) {
                              if (apiId.isEmpty()) return newFixedLengthResponse("Docker未连接");
                              JsonObject req = new JsonObject();
                              req.addProperty("id", apiId); req.addProperty("token", apiToken);
                              req.addProperty("indexId", p.get("indexId")); req.addProperty("keyCode", p.get("keyCode"));
                              req.addProperty("directDecode", "0"); req.addProperty("paraData", "0");
                              if ("1".equals(p.get("categoryId"))) { // 空调
                                  JsonObject ac = new JsonObject();
                                  ac.addProperty("acPower", "1".equals(p.get("ap"))?"0":"1");
                                  ac.addProperty("acMode", p.get("am")); ac.addProperty("acTemp", p.get("at"));
                                  ac.addProperty("acWindSpeed","0"); ac.addProperty("acWindDir","0"); ac.addProperty("changeWindDir","0");
                                  req.add("acStatus", ac);
                              }
                              String res = postJSON("/irext-server/operation/decode", req.toString());
                              JsonObject root = JsonParser.parseString(res).getAsJsonObject();
                              if (root.has("entity") && !root.get("entity").isJsonNull()) {
                                  JsonArray arr = root.getAsJsonArray("entity");
                                  int[] pat = new int[arr.size()];
                                  for (int i=0; i<arr.size(); i++) pat[i] = arr.get(i).getAsInt();
                                  ir.transmit(38000, pat);
                                  return newFixedLengthResponse("OK");
                              }
                              return newFixedLengthResponse("解码失败");
                          }
                          // 代理列表请求
                          if ("/api/proxy".equals(uri)) {
                              String req = "{\"id\":\""+apiId+"\",\"token\":\""+apiToken+"\"," + p.get("body") + "}";
                              String res = postJSON(p.get("path"), req);
                              JsonObject root = JsonParser.parseString(res).getAsJsonObject();
                              return newFixedLengthResponse(Response.Status.OK, "application/json", root.has("entity")?root.get("entity").toString():"[]");
                          }
                      } catch(Exception e) { return newFixedLengthResponse("ERR:"+e.getMessage()); }

                      // 🌟 智能引导式 UI 前端
                      String html = "<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>红外网关</title><style>body{font-family:sans-serif;background:#f5f7f9;padding:15px;margin:0 auto;max-width:500px}.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:15px}h3{margin:0 0 15px;color:#1890ff;display:flex;justify-content:space-between;align-items:center}.btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:16px;font-weight:bold;margin-top:10px;cursor:pointer}.btn-p{background:#1890ff;color:#fff}.btn-g{background:#52c41a;color:#fff}.btn-w{background:#eee;color:#333}.btn-r{background:#ff4d4f;color:#fff}.dev-item{display:flex;justify-content:space-between;align-items:center;background:#f9f9f9;padding:15px;border-radius:10px;margin-bottom:10px;border:1px solid #eee;cursor:pointer}select,input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box;font-size:15px}.panel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}#views>div{display:none}#v_home{display:block}</style></head><body>" +
                      "<div id='views'><div id='v_home'><h3>🏠 我的设备 <button class='btn-g' style='width:auto;padding:5px 12px' onclick='goAdd()'>+ 添加</button></h3><div id='dev_list'></div></div>" +
                      "<div id='v_add'><div class='card'><h3>📡 添加设备</h3><label>类型</label><select id='sc' onchange='lb()'></select><label>品牌</label><select id='sb' onchange='startMatch()'></select><button class='btn btn-w' onclick='goHome()'>返回列表</button></div></div>" +
                      "<div id='v_match'><div class='card'><h3>⚡ 引导匹配向导</h3><div style='text-align:center;margin:15px 0'>测试型号库 <b id='midx' style='color:#1890ff;font-size:24px'>1</b> / <span id='mtotal'>0</span></div><button class='btn btn-p' style='height:80px;font-size:20px' onclick='testPwr()'>📡 1. 测试电源键</button><div class='panel' style='grid-template-columns:1fr 1fr'><button class='btn btn-w' onclick='next()'>❌ 没反应，下一套</button><button class='btn btn-g' onclick='preSave()'>✅ 有反应，保存</button></div></div></div>" +
                      "<div id='v_save'><div class='card'><h3>💾 保存设备</h3><label>取个名字 (如: 客厅空调)</label><input id='d_name'><button class='btn btn-g' onclick='doSave()'>确认保存</button></div></div>" +
                      "<div id='v_ctrl'><div class='card'><h3><span id='c_title'></span> <button class='btn-w' style='width:auto;padding:5px 10px;font-size:12px' onclick='goHome()'>关闭</button></h3><div id='ac_st' style='text-align:center;margin-bottom:15px;color:#666'></div><div class='panel' id='btns'></div><button class='btn btn-r' style='margin-top:30px;opacity:0.4' onclick='delDev()'>删除此设备</button></div></div>" +
                      "</div><script>" +
                      "const $=i=>document.getElementById(i);let cs=[],bs=[],is=[],curr=0,ac={p:0,m:0,t:8},devs=[],curDev=null,curIdx=-1;" +
                      "function view(id){document.querySelectorAll('#views>div').forEach(d=>d.style.display='none');$(id).style.display='block'}" +
                      "function loadDevs(){fetch('/api/devices/list').then(r=>r.json()).then(d=>{devs=d;let h='';d.forEach((x,i)=>{h+=`<div class='dev-item' onclick='openDev(${i})'><div><b>${x.name}</b><br><small>${x.brand} | ${x.cate}</small></div><b>&gt;</b></div>`});$('dev_list').innerHTML=h||'<p style=\"text-align:center;color:#999\">还没有设备，点击右上角添加</p>'})}" +
                      "function goHome(){loadDevs();view('v_home')}" +
                      "function goAdd(){view('v_add');if(cs.length==0)fetch('/api/proxy?path=/irext-server/indexing/list_categories&body=\"from\":\"0\",\"count\":\"200\"').then(r=>r.json()).then(d=>{cs=d;$('sc').innerHTML='<option>请选择类型</option>'+d.map((c,i)=>'<option value='+i+'>'+(c.name||c.name_cn)+'</option>')})}" +
                      "function lb(){fetch('/api/proxy?path=/irext-server/indexing/list_brands&body=\"categoryId\":\"'+(cs[$('sc').value].id||cs[$('sc').value].categoryId)+'\",\"from\":\"0\",\"count\":\"500\"').then(r=>r.json()).then(d=>{bs=d;$('sb').innerHTML='<option>请选择品牌</option>'+d.map((b,i)=>'<option value='+i+'>'+(b.name||b.name_cn)+'</option>')})}" +
                      "function startMatch(){let ci=$('sc').value,bi=$('sb').value;fetch('/api/proxy?path=/irext-server/indexing/list_indexes&body=\"categoryId\":\"'+(cs[ci].id||cs[ci].categoryId)+'\",\"brandId\":\"'+(bs[bi].id||bs[bi].brandId)+'\",\"cityCode\":\"\",\"from\":\"0\",\"count\":\"500\"').then(r=>r.json()).then(d=>{is=d;curr=0;showMatchUI()})}" +
                      "function showMatchUI(){view('v_match');$('midx').innerText=curr+1;$('mtotal').innerText=is.length}" +
                      "function testPwr(){tx(0, is[curr], cs[$('sc').value])}" +
                      "function next(){if(curr<is.length-1){curr++;showMatchUI()}else{alert('已试完所有方案')}}" +
                      "function preSave(){view('v_save');$('d_name').value=bs[$('sb').value].name_cn+' '+cs[$('sc').value].name_cn}" +
                      "function doSave(){let d={name:$('d_name').value,cate:cs[$('sc').value].name_cn,brand:bs[$('sb').value].name_cn,idx:is[curr],cid:cs[$('sc').value].id||cs[$('sc').value].categoryId};fetch('/api/devices/save',{method:'POST',body:'postData='+JSON.stringify(d),headers:{'Content-Type':'application/x-www-form-urlencoded'}}).then(()=>{goHome()})}" +
                      "function openDev(i){curDev=devs[i];curIdx=i;view('v_ctrl');$('c_title').innerText=curDev.name;renderPanel()}" +
                      "function delDev(){if(confirm('删除?'))fetch('/api/devices/delete?index='+curIdx).then(goHome)}" +
                      "function renderPanel(){let n=curDev.cate;let h='';if(n==='空调'){h='<button class=\"btn btn-p\" onclick=\"fire(0)\">电源</button><button class=\"btn btn-w\" onclick=\"fire(1)\">模式</button><button class=\"btn\" onclick=\"fire(2)\">温度+</button><button class=\"btn\" onclick=\"fire(3)\">温度-</button>';updateAcUI()}else{h='<button class=\"btn btn-p\" onclick=\"fire(0)\">电源</button><button class=\"btn\" onclick=\"fire(6)\">确认</button><button class=\"btn\" onclick=\"fire(2)\">上</button><button class=\"btn\" onclick=\"fire(3)\">下</button><button class=\"btn\" onclick=\"fire(4)\">左</button><button class=\"btn\" onclick=\"fire(5)\">右</button>';$('ac_st').innerText=curDev.idx.remoteMap}$('btns').innerHTML=h}" +
                      "function updateAcUI(){$('ac_st').innerText=(ac.p?'已开机':'已关机')+' | '+['冷','热','自动','风','除湿'][ac.m]+' | '+(ac.t+16)+'℃'}" +
                      "function fire(k){tx(k, curDev.idx, {name_cn:curDev.cate, id:curDev.cid})}" +
                      "function tx(k, idx, cateObj){let sid=idx.id||idx.indexId;if(cateObj.name_cn==='空调'){if(k==0)ac.p=1-ac.p;if(k==1)ac.m=(ac.m+1)%5;if(k==2)ac.t=Math.min(14,ac.t+1);if(k==3)ac.t=Math.max(0,ac.t-1);updateAcUI()}fetch('/api/transmit?indexId='+sid+'&categoryId='+cateObj.id+'&keyCode='+k+'&ap='+ac.p+'&am='+ac.m+'&at='+ac.t).then(r=>r.text())}\n goHome();</script></body></html>";
                      return newFixedLengthResponse(Response.Status.OK, "text/html", html);
                  }
              }
              @Override public IBinder onBind(Intent intent) { return null; }
          }
          EOF

      - name: 3. 编写控制台 UI (显示 IP 地址)
        run: |
          cat <<EOF > app/src/main/java/hap/re00660/re/MainActivity.java
          package hap.re00660.re;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.*;
          import android.view.Gravity;
          import android.graphics.Color;
          import java.net.InetAddress;
          import java.net.NetworkInterface;
          import java.util.Collections;
          import java.util.List;

          public class MainActivity extends Activity {
              private TextView logTv;
              private EditText ipInput;
              private SharedPreferences prefs;

              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  prefs = getSharedPreferences("IREXT_CFG", MODE_PRIVATE);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(50, 50, 50, 50);
                  layout.setGravity(Gravity.CENTER_HORIZONTAL);

                  TextView title = new TextView(this);
                  title.setText("📡 ha红外网关");
                  title.setTextSize(26); title.setTextColor(Color.BLUE);
                  layout.addView(title);
                  
                  TextView myIp = new TextView(this);
                  myIp.setText("\n本手机访问地址: \nhttp://" + getLocalIp() + ":8080");
                  myIp.setTextSize(18); myIp.setGravity(Gravity.CENTER);
                  layout.addView(myIp);

                  TextView ipLabel = new TextView(this);
                  ipLabel.setText("\n👇 填入 Docker 私有云 IP:");
                  layout.addView(ipLabel);
                  
                  ipInput = new EditText(this);
                  ipInput.setSingleLine(true);
                  ipInput.setText(prefs.getString("docker_ip", "http://192.168.1.100:8081"));
                  layout.addView(ipInput);

                  Button btnStart = new Button(this);
                  btnStart.setText("保存并启动网关");
                  btnStart.setBackgroundColor(Color.parseColor("#1890ff"));
                  btnStart.setTextColor(Color.WHITE);
                  btnStart.setOnClickListener(v -> startGW());
                  layout.addView(btnStart);
                  
                  Button btnBattery = new Button(this);
                  btnBattery.setText("申请后台保活 (防断连)");
                  btnBattery.setOnClickListener(v -> {
                      try { startActivity(new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:"+getPackageName()))); } catch(Exception e){}
                  });
                  layout.addView(btnBattery);

                  logTv = new TextView(this);
                  logTv.setText("\n等待启动...");
                  layout.addView(logTv);
                  setContentView(layout);
              }

              private String getLocalIp() {
                  try {
                      List<NetworkInterface> interfaces = Collections.list(NetworkInterface.getNetworkInterfaces());
                      for (NetworkInterface intf : interfaces) {
                          List<InetAddress> addrs = Collections.list(intf.getInetAddresses());
                          for (InetAddress addr : addrs) {
                              if (!addr.isLoopbackAddress()) {
                                  String sAddr = addr.getHostAddress();
                                  if (sAddr.indexOf(':')<0) return sAddr;
                              }
                          }
                      }
                  } catch (Exception e) {}
                  return "未知IP";
              }

              private void startGW() {
                  String dockerIp = ipInput.getText().toString().trim();
                  prefs.edit().putString("docker_ip", dockerIp).apply();
                  Intent i = new Intent(this, IRService.class);
                  i.putExtra("DOCKER_URL", dockerIp);
                  startForegroundService(i);
                  logTv.setText("✅ 启动成功!");
              }
          }
          EOF

      - name: 4. 构建配置与清单
        run: |
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.TRANSMIT_IR" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <application android:label="ha红外网关" android:theme="@android:style/Theme.DeviceDefault.Light" android:usesCleartextTraffic="true">
                  <activity android:name="hap.re00660.re.MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
                  <service android:name="hap.re00660.re.IRService" android:exported="false" />
              </application>
          </manifest>
          EOF
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "include ':app'" > settings.gradle
          cat <<EOF > build.gradle
          buildscript { repositories { google(); mavenCentral() } ; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral(); } }
          EOF
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android { compileSdk 34; namespace "hap.re00660.re"; defaultConfig { applicationId "hap.re00660.re"; minSdk 26; targetSdk 34; } }
          dependencies { implementation 'org.nanohttpd:nanohttpd:2.3.1'; implementation 'com.google.code.gson:gson:2.10.1' }
          EOF

      - name: 5. 执行编译
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: 6. 上传 APK
        run: gradle assembleDebug

      - name: 7. 交付
        uses: actions/upload-artifact@v4
        with:
          name: IREXT_SUCCESS_APK
          path: app/build/outputs/apk/debug/app-debug.apk
