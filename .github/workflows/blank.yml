name: IREXT_FULL_APP_INTEGRATION_FIXED_V2

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 代码初始化
        run: |
          rm -rf *
          mkdir -p app/src/main/java/hap/re00660/re
          echo "✅ 准备就绪"

      - name: 2. 编写 Web 网关服务 (修复乱码和红外)
        run: |
          cat <<'EOF' > app/src/main/java/hap/re00660/re/IRService.java
          package hap.re00660.re;
          import android.app.*;
          import android.content.*;
          import android.hardware.ConsumerIrManager;
          import android.os.IBinder;
          import fi.iki.elonen.NanoHTTPD;
          import java.io.*;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.*;
          import com.google.gson.*;

          public class IRService extends Service {
              private WebServer server;
              private ConsumerIrManager ir;
              private SharedPreferences prefs;
              private String dockerUrl = "http://192.168.1.100:8081";
              private String apiId = "", apiToken = "";
              private static final String TAG = "IRService";

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if(intent != null) {
                      String url = intent.getStringExtra("DOCKER_URL");
                      if(url != null && !url.isEmpty()) {
                          dockerUrl = url.trim().replaceAll("\\s+", "");
                          // 自动补全 http://
                          if(!dockerUrl.startsWith("http://") && !dockerUrl.startsWith("https://")) {
                              dockerUrl = "http://" + dockerUrl;
                          }
                          android.util.Log.d(TAG, "Docker URL: " + dockerUrl);
                          loginPrivateCloud();
                      }
                  }
                  return START_STICKY;
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  prefs = getSharedPreferences("IREXT_DB", MODE_PRIVATE);
                  try {
                      NotificationChannel ch = new NotificationChannel("IR", "ha红外网关", NotificationManager.IMPORTANCE_LOW);
                      getSystemService(NotificationManager.class).createNotificationChannel(ch);
                      startForeground(1, new Notification.Builder(this, "IR").setContentTitle("网关运行中").setSmallIcon(android.R.drawable.ic_dialog_info).build());
                  } catch(Throwable t) {}
                  try { ir = (ConsumerIrManager) getSystemService(CONSUMER_IR_SERVICE); } catch(Throwable t) {}
                  try { 
                      server = new WebServer(8080); 
                      server.start(); 
                      android.util.Log.d(TAG, "Web服务器启动成功");
                  } catch (Exception e) { 
                      android.util.Log.e(TAG, "Web服务器启动失败: " + e.getMessage());
                  }
              }
              
              private String postJSON(String path, String jsonBody) {
                  HttpURLConnection conn = null;
                  try {
                      URL url = new URL(dockerUrl + path);
                      conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod("POST");
                      conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                      conn.setConnectTimeout(5000);
                      conn.setReadTimeout(5000);
                      conn.setDoOutput(true);
                      try(OutputStream os = conn.getOutputStream()) { 
                          os.write(jsonBody.getBytes(StandardCharsets.UTF_8)); 
                      }
                      int code = conn.getResponseCode();
                      InputStream is = code >= 400 ? conn.getErrorStream() : conn.getInputStream();
                      if (is == null) return "{}";
                      try(BufferedReader br = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8))) {
                          StringBuilder sb = new StringBuilder(); 
                          String line;
                          while((line = br.readLine()) != null) sb.append(line);
                          return sb.toString();
                      }
                  } catch (Exception e) { 
                      android.util.Log.e(TAG, "HTTP请求失败: " + e.getMessage());
                      return "{}"; 
                  }
                  finally { if(conn!=null) conn.disconnect(); }
              }

              private void loginPrivateCloud() {
                  new Thread(() -> {
                      String req = "{\"appKey\":\"55b1d89fda0658d6f851ee89cad564de\",\"appSecret\":\"83dfd86ad59843ce50342ec863a49bf0\",\"appType\":\"2\"}";
                      String res = postJSON("/irext-server/app/app_login", req);
                      android.util.Log.d(TAG, "登录响应: " + res);
                      try {
                          JsonObject root = JsonParser.parseString(res).getAsJsonObject();
                          if(root.has("entity") && !root.get("entity").isJsonNull()) {
                              JsonObject entity = root.getAsJsonObject("entity");
                              apiId = entity.get("id").getAsString();
                              apiToken = entity.get("token").getAsString();
                              android.util.Log.d(TAG, "登录成功");
                          }
                      } catch (Exception e) { 
                          android.util.Log.e(TAG, "登录失败: " + e.getMessage());
                      }
                  }).start();
              }
              
              private class WebServer extends NanoHTTPD {
                  public WebServer(int port) { super(port); }
                  
                  @Override
                  public Response serve(IHTTPSession session) {
                      String uri = session.getUri();
                      Map<String, String> p = session.getParms();
                      Method method = session.getMethod();
                      
                      android.util.Log.d(TAG, "请求: " + method + " " + uri);

                      try {
                          if ("/api/devices/list".equals(uri)) {
                              String devices = prefs.getString("devices", "[]");
                              return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", devices);
                          }
                          
                          if ("/api/devices/save".equals(uri) && Method.POST.equals(method)) {
                              Map<String, String> files = new HashMap<>();
                              session.parseBody(files);
                              String body = files.get("postData");
                              if (body == null || body.isEmpty()) {
                                  // 尝试从输入流读取
                                  int contentLength = Integer.parseInt(session.getHeaders().getOrDefault("content-length", "0"));
                                  if (contentLength > 0) {
                                      byte[] buffer = new byte[contentLength];
                                      session.getInputStream().read(buffer, 0, contentLength);
                                      body = new String(buffer, StandardCharsets.UTF_8);
                                  }
                              }
                              
                              android.util.Log.d(TAG, "保存设备: " + body);
                              
                              if (body == null || body.isEmpty()) {
                                  return newFixedLengthResponse(Response.Status.BAD_REQUEST, "text/plain; charset=UTF-8", "Empty body");
                              }
                              
                              JsonObject newDevice = JsonParser.parseString(body).getAsJsonObject();
                              String existing = prefs.getString("devices", "[]");
                              JsonArray list = JsonParser.parseString(existing).getAsJsonArray();
                              list.add(newDevice);
                              
                              boolean success = prefs.edit().putString("devices", list.toString()).commit();
                              android.util.Log.d(TAG, "保存结果: " + success);
                              
                              return newFixedLengthResponse(Response.Status.OK, "text/plain; charset=UTF-8", "OK");
                          }
                          
                          if ("/api/devices/delete".equals(uri)) {
                              int index = Integer.parseInt(p.get("index"));
                              String existing = prefs.getString("devices", "[]");
                              JsonArray list = JsonParser.parseString(existing).getAsJsonArray();
                              JsonArray newList = new JsonArray();
                              for(int i=0; i<list.size(); i++) {
                                  if(i != index) newList.add(list.get(i));
                              }
                              prefs.edit().putString("devices", newList.toString()).apply();
                              return newFixedLengthResponse(Response.Status.OK, "text/plain; charset=UTF-8", "OK");
                          }
                          
                          // 关键修复：红外发送逻辑恢复原始工作方式
                          if ("/api/transmit".equals(uri)) {
                              if (ir == null || !ir.hasIrEmitter()) {
                                  return newFixedLengthResponse(Response.Status.OK, "text/plain; charset=UTF-8", "错误: 手机没有红外发射器");
                              }
                              
                              String indexId = p.get("indexId");
                              String keyCode = p.get("keyCode");
                              String categoryId = p.get("categoryId");
                              
                              android.util.Log.d(TAG, "发射红外: indexId=" + indexId + ", keyCode=" + keyCode + ", categoryId=" + categoryId);
                              
                              // 构建解码请求 - 使用原始有效的格式
                              JsonObject req = new JsonObject();
                              req.addProperty("id", apiId); 
                              req.addProperty("token", apiToken);
                              req.addProperty("indexId", indexId); 
                              req.addProperty("keyCode", keyCode);
                              req.addProperty("directDecode", "0");
                              
                              // 空调状态处理 - 修复参数格式
                              if ("1".equals(categoryId)) {
                                  JsonObject ac = new JsonObject();
                                  // 注意：irext 的 API 可能使用字符串 "0"/"1" 或数字
                                  String ap = p.getOrDefault("ap", "0");
                                  String am = p.getOrDefault("am", "0"); 
                                  String at = p.getOrDefault("at", "24");
                                  
                                  ac.addProperty("acPower", "1".equals(ap) ? "0" : "1"); // 注意：irext 可能是反的
                                  ac.addProperty("acMode", am);
                                  ac.addProperty("acTemp", at);
                                  ac.addProperty("acWindSpeed", "0");
                                  ac.addProperty("acWindDir", "0");
                                  ac.addProperty("changeWindDir", "0");
                                  req.add("acStatus", ac);
                                  
                                  android.util.Log.d(TAG, "空调状态: power=" + ap + ", mode=" + am + ", temp=" + at);
                              }
                              
                              String res = postJSON("/irext-server/operation/decode", req.toString());
                              android.util.Log.d(TAG, "解码响应: " + res);
                              
                              JsonObject root = JsonParser.parseString(res).getAsJsonObject();
                              if (root.has("entity") && !root.get("entity").isJsonNull()) {
                                  JsonArray arr = root.getAsJsonArray("entity");
                                  // 转换为 int[] 数组
                                  int[] pattern = new int[arr.size()];
                                  for (int i=0; i<arr.size(); i++) {
                                      pattern[i] = arr.get(i).getAsInt();
                                  }
                                  
                                  // 发射红外 - 使用原始有效的 API
                                  if (pattern.length > 0) {
                                      ir.transmit(38000, pattern);
                                      android.util.Log.d(TAG, "红外发射成功，长度: " + pattern.length);
                                      return newFixedLengthResponse(Response.Status.OK, "text/plain; charset=UTF-8", "OK");
                                  }
                              }
                              return newFixedLengthResponse(Response.Status.OK, "text/plain; charset=UTF-8", "解码失败: " + res);
                          }
                          
                          if ("/api/proxy".equals(uri)) {
                              String path = p.get("path");
                              String body = p.get("body");
                              String req = "{\"id\":\""+apiId+"\",\"token\":\""+apiToken+"\"," + body + "}";
                              String res = postJSON(path, req);
                              JsonObject root = JsonParser.parseString(res).getAsJsonObject();
                              String entity = root.has("entity") && !root.get("entity").isJsonNull() ? root.get("entity").toString() : "[]";
                              return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", entity);
                          }
                          
                      } catch(Exception e) { 
                          android.util.Log.e(TAG, "处理请求异常: " + e.getMessage());
                          return newFixedLengthResponse(Response.Status.INTERNAL_ERROR, "text/plain; charset=UTF-8", "ERR: " + e.getMessage()); 
                      }
                      
                      // 前端页面 - 关键修复：确保 UTF-8 编码，添加返回按钮
                      String html = "<!DOCTYPE html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>ha红外网关</title><style>"
                          + "*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#f5f5f5;padding:15px;margin:0 auto;max-width:600px;line-height:1.6}"
                          + ".card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:15px}"
                          + ".header{display:flex;align-items:center;margin-bottom:20px;padding-bottom:15px;border-bottom:2px solid #e8e8e8}"
                          + ".back-btn{background:#f0f0f0;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;margin-right:15px;font-size:14px}"
                          + ".back-btn:hover{background:#e0e0e0}"
                          + "h3{margin:0;color:#1890ff;font-size:20px;flex:1}"
                          + ".btn{width:100%;padding:14px;border:none;border-radius:8px;font-size:16px;font-weight:bold;margin-top:10px;cursor:pointer;transition:all .2s}"
                          + ".btn-p{background:#1890ff;color:#fff}.btn-p:hover{background:#40a9ff}"
                          + ".btn-g{background:#52c41a;color:#fff}.btn-g:hover{background:#73d13d}"
                          + ".btn-w{background:#f5f5f5;color:#333;border:1px solid #d9d9d9}.btn-w:hover{border-color:#40a9ff;color:#40a9ff}"
                          + ".dev-card{background:#fff;border:1px solid #e8e8e8;padding:16px;border-radius:8px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all .2s}"
                          + ".dev-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.09);border-color:#d9d9d9}"
                          + ".dev-info b{font-size:17px;color:#262626;display:block;margin-bottom:4px}"
                          + ".dev-info span{font-size:13px;color:#8c8c8c}"
                          + "select,input{width:100%;padding:12px;margin:8px 0;border:1px solid #d9d9d9;border-radius:6px;box-sizing:border-box;font-size:15px;outline:none;transition:all .3s}"
                          + "select:focus,input:focus{border-color:#40a9ff;box-shadow:0 0 0 2px rgba(24,144,255,.2)}"
                          + "#views>div{display:none}#v_home{display:block}"
                          + ".panel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}"
                          + ".panel .btn{margin-top:0;padding:16px 5px;font-size:14px}"
                          + "#log{max-height:120px;overflow-y:auto;background:#262626;color:#52c41a;padding:12px;border-radius:6px;font-family:'Courier New',monospace;font-size:12px;margin-top:15px;line-height:1.4}"
                          + ".empty{text-align:center;padding:40px;color:#8c8c8c}"
                          + ".match-info{text-align:center;margin:20px 0;padding:20px;background:#f6ffed;border:1px solid #b7eb8f;border-radius:8px}"
                          + ".match-info b{color:#1890ff;font-size:32px;display:block;margin-bottom:8px}"
                          + ".match-info span{color:#52c41a;font-size:16px}"
                          + ".status-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding:10px 15px;background:#e6f7ff;border-radius:6px;font-size:13px;color:#1890ff}"
                          + "</style></head><body>"
                          
                          // 主页
                          + "<div id='v_home'><div class='card'><div class='header'><h3>🏠 我的设备</h3><button class='btn-g' style='width:auto;margin:0;padding:8px 20px' onclick='goAdd()'>+ 添加设备</button></div><div id='dev_list'></div></div></div>"
                          
                          // 添加流程 - 带返回按钮
                          + "<div id='v_add'><div class='card'><div class='header'><button class='back-btn' onclick='goHome()'>← 返回</button><h3>📡 选择品牌</h3></div><label>设备类型</label><select id='sc' onchange='lb()'><option>加载中...</option></select><label>品牌</label><select id='sb' onchange='startMatch()'><option>请先选择类型</option></select></div></div>"
                          
                          // 匹配页面
                          + "<div id='v_match'><div class='card'><div class='header'><button class='back-btn' onclick='goAdd()'>← 返回</button><h3>⚡ 智能匹配</h3></div><div class='match-info'>正在测试第 <b id='midx'>1</b> 套库<br><span>共 <span id='mtotal'>0</span> 套</span></div><button class='btn btn-p' style='height:70px;font-size:18px;margin-bottom:15px' onclick='testPwr()'>📡 测试电源键</button><div style='display:grid;grid-template-columns:1fr 1fr;gap:15px'><button class='btn btn-w' onclick='next()'>❌ 无反应</button><button class='btn btn-g' onclick='preSave()'>✅ 有反应，保存</button></div></div></div>"
                          
                          // 保存页面
                          + "<div id='v_save'><div class='card'><div class='header'><button class='back-btn' onclick='goMatch()'>← 返回</button><h3>💾 保存设备</h3></div><label>设备名称</label><input id='d_name' placeholder='例如：客厅空调'><button class='btn btn-g' onclick='doSave()'>确认保存</button><button class='btn btn-w' onclick='goHome()'>取消</button></div></div>"
                          
                          // 控制页面
                          + "<div id='v_ctrl'><div class='card'><div class='header'><button class='back-btn' onclick='goHome()'>← 返回</button><h3 id='c_title'>控制设备</h3></div><div class='status-bar' id='ac_st' style='display:none'></div><div class='panel' id='btns'></div><button class='btn btn-w' style='margin-top:20px;color:#ff4d4f;border-color:#ff4d4f' onclick='delDev()'>🗑️ 删除设备</button></div></div>"
                          
                          + "</div><div id='log'></div>"
                          
                          + "<script>"
                          // 工具函数
                          + "const $=i=>document.getElementById(i);"
                          + "function log(m){let l=$('log');if(!l)return;l.innerHTML+=new Date().toLocaleTimeString()+' '+m+'<br>';l.scrollTop=l.scrollHeight;console.log(m);}"
                          + "function view(id){document.querySelectorAll('#views>div').forEach(d=>d.style.display='none');let el=$(id);if(el)el.style.display='block';}"
                          
                          // 数据
                          + "let cs=[],bs=[],is=[],curr=0,ac={p:0,m:0,t:8},devs=[],curDev=null,curIdx=-1;"
                          
                          // 加载设备列表
                          + "async function loadDevs(){"
                          + "  try{let r=await fetch('/api/devices list');let d=await r.json();devs=Array.isArray(d)?d:[];log('加载到'+devs.length+'个设备');"
                          + "    let h='';if(devs.length===0){h='<div class=\\\"empty\\\">还没有设备，点击右上角添加</div>';}"
                          + "    else{devs.forEach((x,i)=>{h+=`<div class='dev-card' onclick='openDev(${i})'><div class='dev-info'><b>${x.name||'未命名'}</b><span>${x.brand||''} | ${x.cate||''}</span></div><span style='color:#ccc'>›</span></div>`});}"
                          + "    $('dev_list').innerHTML=h;}"
                          + "  catch(e){log('加载失败:'+e.message);$('dev_list').innerHTML='<div class=\\\"empty\\\" style=\\\"color:red\\\">加载失败</div>';}"
                          + "}"
                          
                          // 导航
                          + "function goHome(){loadDevs();view('v_home');if(window.Android)Android.refresh();}"
                          + "async function goAdd(){view('v_add');$('sc').innerHTML='<option>加载中...</option>';try{let r=await fetch('/api/proxy?path=/irext-server/indexing/list_categories&body=\\\"from\\\":\\\"0\\\",\\\"count\\\":\\\"100\\\"');cs=await r.json();$('sc').innerHTML='<option value=>选择设备类型</option>'+cs.map((c,i)=>'<option value='+i+'>'+(c.name_cn||c.name)+'</option>').join('');}catch(e){log('加载失败:'+e);}}"
                          + "function goMatch(){view('v_match');}"
                          
                          // 加载品牌
                          + "async function lb(){let v=$('sc').value;if(v==='')return;let cid=cs[v].id||cs[v].categoryId;$('sb').innerHTML='<option>加载中...</option>';try{let r=await fetch('/api/proxy?path=/irext-server/indexing/list_brands&body=\\\"categoryId\\\":\\\"'+cid+'\\\",\\\"from\\\":\\\"0\\\",\\\"count\\\":\\\"500\\\"');bs=await r.json();$('sb').innerHTML='<option value=>选择品牌</option>'+bs.map((b,i)=>'<option value='+i+'>'+(b.name_cn||b.name)+'</option>').join('');}catch(e){log('加载失败:'+e);}}"
                          
                          // 开始匹配
                          + "async function startMatch(){let vc=$('sc').value,vb=$('sb').value;if(vc===''||vb==='')return;let cid=cs[vc].id||cs[vc].categoryId,bid=bs[vb].id||bs[vb].brandId;try{let r=await fetch('/api/proxy?path=/irext-server/indexing/list_indexes&body=\\\"categoryId\\\":\\\"'+cid+'\\\",\\\"brandId\\\":\\\"'+bid+'\\\",\\\"cityCode\\\":\\\"\\\",\\\"from\\\":\\\"0\\\",\\\"count\\\":\\\"500\\\"');is=await r.json();curr=0;showMatchUI();}catch(e){log('加载失败:'+e);}}"
                          + "function showMatchUI(){view('v_match');$('midx').innerText=curr+1;$('mtotal').innerText=is.length;}"
                          
                          // 测试和保存
                          + "function testPwr(){if(is[curr])tx(0,is[curr],cs[$('sc').value]);}"
                          + "function next(){if(curr<is.length-1){curr++;showMatchUI();}else{alert('已到最后一套库');}}"
                          + "function preSave(){view('v_save');let c=cs[$('sc').value],b=bs[$('sb').value];$('d_name').value=(b.name_cn||b.name)+' '+(c.name_cn||c.name);}"
                          
                          // 保存设备
                          + "async function doSave(){"
                          + "  let name=$('d_name').value.trim();if(!name){alert('请输入设备名称');return;}"
                          + "  let d={name:name,cate:cs[$('sc').value].name_cn||cs[$('sc').value].name,brand:bs[$('sb').value].name_cn||bs[$('sb').value].name,idx:is[curr],cid:cs[$('sc').value].id||cs[$('sc').value].categoryId};"
                          + "  log('保存:'+JSON.stringify(d));"
                          + "  try{"
                          + "    let r=await fetch('/api/devices/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});"
                          + "    let t=await r.text();"
                          + "    if(t==='OK'){alert('保存成功');goHome();}else{alert('保存失败:'+t);}"
                          + "  }catch(e){alert('保存失败:'+e.message);}"
                          + "}"
                          
                          // 打开设备
                          + "function openDev(i){curDev=devs[i];curIdx=i;view('v_ctrl');$('c_title').innerText=curDev.name||'控制设备';renderPanel();}"
                          + "async function delDev(){if(!confirm('确定删除 '+curDev.name+'?'))return;try{await fetch('/api/devices/delete?index='+curIdx);goHome();}catch(e){alert('删除失败');}}"
                          
                          // 渲染控制面板
                          + "function renderPanel(){let cid=curDev.cid||1;let h='';if(cid===1||curDev.cate==='空调'||curDev.cate?.includes('空调')){"
                          + "  h='<button class=\"btn btn-p\" onclick=\"fire(0)\">电源</button><button class=\"btn btn-w\" onclick=\"fire(1)\">模式</button><button class=\"btn\" onclick=\"fire(2)\">温度+</button><button class=\"btn\" onclick=\"fire(3)\">温度-</button><button class=\"btn\" onclick=\"fire(9)\">风速</button><button class=\"btn\" onclick=\"fire(10)\">扫风</button>';"
                          + "  $('ac_st').style.display='flex';updateAcUI();"
                          + "}else{"
                          + "  h='<button class=\"btn btn-p\" onclick=\"fire(0)\">电源</button><button class=\"btn btn-g\" onclick=\"fire(6)\">确认</button><button class=\"btn\" onclick=\"fire(2)\">上</button><button class=\"btn\" onclick=\"fire(3)\">下</button><button class=\"btn\" onclick=\"fire(4)\">左</button><button class=\"btn\" onclick=\"fire(5)\">右</button><button class=\"btn\" onclick=\"fire(7)\">音量+</button><button class=\"btn\" onclick=\"fire(8)\">音量-</button><button class=\"btn\" onclick=\"fire(9)\">返回</button>';"
                          + "  $('ac_st').style.display='none';"
                          + "}$('btns').innerHTML=h;}"
                          
                          // 空调状态
                          + "const modeMap=['制冷','制热','自动','送风','除湿'];"
                          + "function updateAcUI(){$('ac_st').innerHTML='<span>'+(ac.p?'🟢 开启':'⚪ 关闭')+'</span><span>'+modeMap[ac.m]+'</span><span>'+(ac.t+16)+'°C</span>';}"
                          
                          // 发射红外
                          + "function fire(k){"
                          + "  let cid=curDev.cid||1;"
                          + "  if(cid===1||curDev.cate?.includes('空调')){"
                          + "    if(k===0)ac.p=1-ac.p;if(k===1)ac.m=(ac.m+1)%5;if(k===2)ac.t=Math.min(14,ac.t+1);if(k===3)ac.t=Math.max(0,ac.t-1);"
                          + "    updateAcUI();"
                          + "  }"
                          + "  let idx=curDev.idx;"
                          + "  if(!idx){log('错误: 没有设备索引');return;}"
                          + "  let url='/api/transmit?indexId='+(idx.id||idx.indexId)+'&categoryId='+cid+'&keyCode='+k;"
                          + "  if(cid===1)url+='&ap='+ac.p+'&am='+ac.m+'&at='+ac.t;"
                          + "  log('发射: key='+k);"
                          + "  fetch(url).then(r=>r.text()).then(t=>{if(t!=='OK')alert('发射失败:'+t);});"
                          + "}"
                          
                          // 初始化
                          + "goHome();"
                          + "</script></body></html>";
                      
                      // 关键修复：使用 UTF-8 字节数组返回，避免中文乱码
                      byte[] bytes = html.getBytes(StandardCharsets.UTF_8);
                      return newFixedLengthResponse(Response.Status.OK, "text/html; charset=UTF-8", new ByteArrayInputStream(bytes), bytes.length);
                  }
              }
              @Override public IBinder onBind(Intent intent) { return null; }
          }
          EOF

      - name: 3. 编写主界面 (修复输入和返回)
        run: |
          cat <<EOF > app/src/main/java/hap/re00660/re/MainActivity.java
          package hap.re00660.re;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.*;
          import android.webkit.*;
          import android.widget.*;
          import android.graphics.Color;
          import com.google.gson.*;
          import java.net.*;
          import java.util.*;

          public class MainActivity extends Activity {
              private SharedPreferences dbPrefs, cfgPrefs;
              private LinearLayout devListLayout, mainLayout;
              private WebView webView;
              private boolean isWebMode = false;
              private TextView statusText;
              private EditText ipInput;

              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  dbPrefs = getSharedPreferences("IREXT_DB", MODE_PRIVATE);
                  cfgPrefs = getSharedPreferences("IREXT_CFG", MODE_PRIVATE);

                  FrameLayout root = new FrameLayout(this);
                  
                  ScrollView scroll = new ScrollView(this);
                  mainLayout = new LinearLayout(this);
                  mainLayout.setOrientation(LinearLayout.VERTICAL);
                  mainLayout.setPadding(40, 40, 40, 40);
                  
                  TextView title = new TextView(this);
                  title.setText("📡 ha红外网关"); 
                  title.setTextSize(26); 
                  title.setTextColor(Color.parseColor("#1890ff"));
                  title.setPadding(0, 0, 0, 10);
                  mainLayout.addView(title);
                  
                  statusText = new TextView(this);
                  statusText.setText("服务未启动");
                  statusText.setTextColor(Color.GRAY);
                  statusText.setPadding(0, 0, 0, 20);
                  mainLayout.addView(statusText);

                  // 服务器配置 - 简化输入，自动补全协议
                  TextView serverLabel = new TextView(this);
                  serverLabel.setText("私有云服务器地址 (IP:端口):");
                  serverLabel.setTextSize(14);
                  mainLayout.addView(serverLabel);
                  
                  // 显示默认提示
                  TextView hint = new TextView(this);
                  hint.setText("例如: 192.168.1.100:8081 (无需输入http://)");
                  hint.setTextSize(12);
                  hint.setTextColor(Color.GRAY);
                  hint.setPadding(0, 0, 0, 10);
                  mainLayout.addView(hint);

                  ipInput = new EditText(this);
                  // 加载保存的地址（去掉协议前缀显示）
                  String savedUrl = cfgPrefs.getString("docker_ip", "192.168.1.100:8081");
                  if(savedUrl.startsWith("http://")) savedUrl = savedUrl.substring(7);
                  else if(savedUrl.startsWith("https://")) savedUrl = savedUrl.substring(8);
                  ipInput.setText(savedUrl);
                  mainLayout.addView(ipInput);

                  // 启动按钮
                  Button btnStart = new Button(this);
                  btnStart.setText("启动网关服务");
                  btnStart.setBackgroundColor(Color.parseColor("#1890ff"));
                  btnStart.setTextColor(Color.WHITE);
                  btnStart.setOnClickListener(v -> startService());
                  mainLayout.addView(btnStart);

                  // 添加设备按钮
                  Button btnAdd = new Button(this);
                  btnAdd.setText("+ 添加红外设备");
                  btnAdd.setBackgroundColor(Color.parseColor("#52c41a"));
                  btnAdd.setTextColor(Color.WHITE);
                  btnAdd.setOnClickListener(v -> openAddDevice());
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, 
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  );
                  params.setMargins(0, 20, 0, 20);
                  mainLayout.addView(btnAdd, params);

                  // 设备列表
                  TextView listTitle = new TextView(this);
                  listTitle.setText("已保存的设备:");
                  listTitle.setTextSize(16);
                  listTitle.setPadding(0, 20, 0, 10);
                  mainLayout.addView(listTitle);

                  devListLayout = new LinearLayout(this);
                  devListLayout.setOrientation(LinearLayout.VERTICAL);
                  mainLayout.addView(devListLayout);
                  
                  scroll.addView(mainLayout);
                  root.addView(scroll);

                  // WebView
                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setCacheMode(WebSettings.LOAD_NO_CACHE);
                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface 
                      public void refresh() { 
                          runOnUiThread(() -> refreshList()); 
                      }
                  }, "Android");
                  webView.setVisibility(View.GONE);
                  root.addView(webView);

                  setContentView(root);
                  refreshList();
              }

              private void startService() {
                  String input = ipInput.getText().toString().trim();
                  if(input.isEmpty()) {
                      Toast.makeText(this, "请输入服务器地址", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  
                  // 自动补全协议
                  String url = input;
                  if(!url.startsWith("http://") && !url.startsWith("https://")) {
                      url = "http://" + url;
                  }
                  
                  cfgPrefs.edit().putString("docker_ip", url).apply();
                  Intent i = new Intent(this, IRService.class);
                  i.putExtra("DOCKER_URL", url);
                  startForegroundService(i);
                  statusText.setText("服务已启动 | " + url);
                  statusText.setTextColor(Color.parseColor("#52c41a"));
                  Toast.makeText(this, "服务已启动", Toast.LENGTH_SHORT).show();
              }

              private void openAddDevice() {
                  isWebMode = true;
                  mainLayout.setVisibility(View.GONE);
                  webView.setVisibility(View.VISIBLE);
                  webView.loadUrl("http://127.0.0.1:8080");
              }

              @Override
              public void onBackPressed() {
                  if (isWebMode) {
                      if(webView.canGoBack()) {
                          webView.goBack();
                      } else {
                          isWebMode = false;
                          webView.stopLoading();
                          webView.setVisibility(View.GONE);
                          mainLayout.setVisibility(View.VISIBLE);
                          refreshList();
                      }
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if(!isWebMode) refreshList();
              }

              private void refreshList() {
                  devListLayout.removeAllViews();
                  try {
                      String json = dbPrefs.getString("devices", "[]");
                      JsonArray list = JsonParser.parseString(json).getAsJsonArray();
                      
                      if(list.size() == 0) {
                          TextView empty = new TextView(this);
                          empty.setText("暂无设备，点击上方按钮添加");
                          empty.setTextColor(Color.GRAY);
                          empty.setPadding(20, 20, 20, 20);
                          devListLayout.addView(empty);
                          return;
                      }
                      
                      for (int i = 0; i < list.size(); i++) {
                          JsonObject dev = list.get(i).getAsJsonObject();
                          LinearLayout item = new LinearLayout(this);
                          item.setOrientation(LinearLayout.VERTICAL);
                          item.setPadding(30, 20, 30, 20);
                          item.setBackgroundColor(Color.WHITE);
                          
                          LinearLayout.LayoutParams margin = new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          );
                          margin.setMargins(0, 0, 0, 15);
                          item.setLayoutParams(margin);
                          
                          TextView name = new TextView(this);
                          name.setText(dev.get("name").getAsString());
                          name.setTextSize(18);
                          name.setTextColor(Color.BLACK);
                          item.addView(name);
                          
                          TextView info = new TextView(this);
                          info.setText(dev.get("brand").getAsString() + " | " + dev.get("cate").getAsString());
                          info.setTextSize(14);
                          info.setTextColor(Color.GRAY);
                          item.addView(info);
                          
                          final int index = i;
                          item.setOnClickListener(v -> {
                              curDevIndex = index;
                              openAddDevice();
                          });
                          
                          devListLayout.addView(item);
                      }
                  } catch (Exception e) {
                      TextView error = new TextView(this);
                      error.setText("加载失败");
                      error.setTextColor(Color.RED);
                      devListLayout.addView(error);
                  }
              }
              
              private int curDevIndex = -1;
              private String getLocalIp() {
                  try {
                      List<NetworkInterface> interfaces = Collections.list(NetworkInterface.getNetworkInterfaces());
                      for (NetworkInterface intf : interfaces) {
                          List<InetAddress> addrs = Collections.list(intf.getInetAddresses());
                          for (InetAddress addr : addrs) {
                              if (!addr.isLoopbackAddress() && addr.getHostAddress().indexOf(':')<0) 
                                  return addr.getHostAddress();
                          }
                      }
                  } catch (Exception e) {}
                  return "127.0.0.1";
              }
          }
          EOF

