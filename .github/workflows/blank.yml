name: IR_APK_ULTIMATE_BUILD

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 清理并准备环境
        run: |
          rm -rf *  # 把之前建错的乱七八糟全删了
          mkdir -p app/src/main/java/com/ir/test
          mkdir -p app/src/main/res/layout

      - name: 2. 在云端直接生成代码 (确保零错误)
        run: |
          # 生成清单文件
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.ir.test">
              <uses-permission android:name="android.permission.TRANSMIT_IR" />
              <application android:label="老表红外测试">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 生成界面文件
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:padding="20dp">
              <EditText android:id="@+id/freq" android:layout_width="match_parent" 
                  android:layout_height="wrap_content" android:text="38000" />
              <EditText android:id="@+id/pattern" android:layout_width="match_parent" 
                  android:layout_height="wrap_content" android:hint="红外码(逗号隔开)" />
              <Button android:id="@+id/send" android:layout_width="match_parent" 
                  android:layout_height="wrap_content" android:text="发射" />
          </LinearLayout>
          EOF

          # 生成 Java 逻辑代码
          cat <<EOF > app/src/main/java/com/ir/test/MainActivity.java
          package com.ir.test;
          import android.app.Activity;
          import android.hardware.ConsumerIrManager;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.EditText;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  final ConsumerIrManager ir = (ConsumerIrManager) getSystemService(CONSUMER_IR_SERVICE);
                  findViewById(R.id.send).setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          try {
                              String fStr = ((EditText)findViewById(R.id.freq)).getText().toString();
                              String pStrRaw = ((EditText)findViewById(R.id.pattern)).getText().toString();
                              int f = Integer.parseInt(fStr);
                              String[] pArr = pStrRaw.split(",");
                              int[] p = new int[pArr.length];
                              for (int i=0; i<pArr.length; i++) p[i] = Integer.parseInt(pArr[i].trim());
                              if (ir.hasIrEmitter()) {
                                  ir.transmit(f, p);
                                  Toast.makeText(MainActivity.this, "已发送", Toast.LENGTH_SHORT).show();
                              } else {
                                  Toast.makeText(MainActivity.this, "此手机无红外", Toast.LENGTH_LONG).show();
                              }
                          } catch (Exception e) { 
                              Toast.makeText(MainActivity.this, "输入格式有误", Toast.LENGTH_SHORT).show(); 
                          }
                      }
                  });
              }
          }
          EOF

      - name: 3. 强制重写配置 (解决 Gradle 报错)
        run: |
          echo "include ':app'" > settings.gradle
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              compileSdk 33
              namespace "com.ir.test"
              defaultConfig {
                  applicationId "com.ir.test"
                  minSdk 19
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

      - name: 4. 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: 5. 执行编译
        run: gradle assembleDebug

      - name: 6. 导出最终成品 APK
        uses: actions/upload-artifact@v4
        with:
          name: LaoBiao_IR_Fixed_APK
          path: app/build/outputs/apk/debug/app-debug.apk
