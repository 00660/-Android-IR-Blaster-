                      Toast.makeText(this, "服务已停止", Toast.LENGTH_SHORT).show();
                      checkServiceStatus();
                  });
                  main.addView(stopBtn);
                  
                  Button btnMagisk = new Button(this);
                  btnMagisk.setText("🔥 Root部署面具守护");
                  btnMagisk.setBackgroundColor(Color.parseColor("#ef4444"));
                  btnMagisk.setTextColor(Color.WHITE);
                  btnMagisk.setOnClickListener(v -> deployMagiskModule());
                  main.addView(btnMagisk);
                  
                  Button add = new Button(this); 
                  add.setText("+ 设备管理面板");
                  add.setOnClickListener(v -> openWeb());
                  main.addView(add);
                  
                  TextView lt = new TextView(this); 
                  lt.setText("\n📱 已存设备:");
                  main.addView(lt);
                  
                  ScrollView scView = new ScrollView(this);
                  listArea = new LinearLayout(this); 
                  listArea.setOrientation(LinearLayout.VERTICAL);
                  scView.addView(listArea); 
                  main.addView(scView);
                  
                  root.addView(main);
                  
                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface 
                      public void refresh() { runOnUiThread(() -> refreshList()); }
                  }, "Android");
                  webView.setVisibility(View.GONE);
                  root.addView(webView);
                  
                  setContentView(root);
                  refreshList();
                  checkServiceStatus();
              }
              
              @Override
              protected void onResume() {
                  super.onResume();
                  checkServiceStatus();
                  refreshList();
              }
              
              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  if(statusReceiver != null) unregisterReceiver(statusReceiver);
              }
              
              private void updateStatus(boolean running, int port) {
                  runOnUiThread(() -> {
                      if(running) {
                          statusText.setText("\n🟢 服务运行中 (端口:" + port + ")");
                          statusText.setTextColor(Color.parseColor("#22c55e"));
                      } else {
                          statusText.setText("\n🔴 服务未运行");
                          statusText.setTextColor(Color.parseColor("#ef4444"));
                      }
                  });
              }
              
              private void checkServiceStatus() {
                  new Thread(() -> {
                      try {
                          URL url = new URL("http://127.0.0.1:8080/api/status");
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setConnectTimeout(1500);
                          conn.setRequestMethod("GET");
                          int code = conn.getResponseCode();
                          if(code == 200) {
                              BufferedReader br = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                              String line = br.readLine();
                              JsonObject obj = JsonParser.parseString(line).getAsJsonObject();
                              updateStatus(obj.get("running").getAsBoolean(), obj.get("port").getAsInt());
                          } else {
                              updateStatus(false, 8080);
                          }
                      } catch(Exception e) {
                          updateStatus(false, 8080);
                      }
                  }).start();
              }
              
              private void requestBatteryWhitelist() {
                  if(Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      String packageName = getPackageName();
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      if(pm.isIgnoringBatteryOptimizations(packageName)) {
                          Toast.makeText(this, "已在白名单中", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      Intent intent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                      intent.setData(Uri.parse("package:" + packageName));
                      startActivity(intent);
                  } else {
                      Toast.makeText(this, "Android 6.0以下无需申请", Toast.LENGTH_SHORT).show();
                  }
              }
              
              private void deployMagiskModule() {
                  new Thread(() -> {
                      try {
                          Process p = Runtime.getRuntime().exec("su");
                          DataOutputStream os = new DataOutputStream(p.getOutputStream());
                          String apkPath = getApplicationInfo().sourceDir;
                          String script = "MOD=\"/data/adb/modules/irext_daemon\"\nrm -rf $MOD\nmkdir -p $MOD/system/priv-app/IRGateway\ncp \"" + apkPath + "\" $MOD/system/priv-app/IRGateway/IRGateway.apk\necho 'id=irext_daemon\nname=HA红外特权守护\nversion=vMax\nversionCode=99\nauthor=极客\ndescription=免疫一切杀后台。' > $MOD/module.prop\necho '#!/system/bin/sh\nuntil [ \"$(getprop sys.boot_completed)\" = \"1\" ]; do sleep 1; done\nsleep 3\ndumpsys deviceidle whitelist +hap.re00660.re\nam start-foreground-service -n hap.re00660.re/.IRService' > $MOD/service.sh\nchmod 755 $MOD/service.sh\nexit\n";
                          os.writeBytes(script); os.flush(); p.waitFor();
                          runOnUiThread(() -> Toast.makeText(this, "部署完成，请重启手机！", Toast.LENGTH_LONG).show());
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(this, "无 Root 权限！", Toast.LENGTH_SHORT).show());
                      }
                  }).start();
              }
              
              private void openWeb() {
                  isWeb = true; 
                  webView.setVisibility(View.VISIBLE);
                  webView.loadUrl("http://127.0.0.1:8080");
              }
              
              @Override
              public void onBackPressed() {
                  if(isWeb) { 
                      isWeb = false; 
                      webView.setVisibility(View.GONE); 
                      refreshList(); 
                  } else {
                      super.onBackPressed();
                  }
              }
              
              private void refreshList() {
                  listArea.removeAllViews();
                  try {
                      SharedPreferences db = getSharedPreferences("IREXT_DB", MODE_PRIVATE);
                      String devsStr = db.getString("devs", "[]");
                      JsonArray arr = JsonParser.parseString(devsStr).getAsJsonArray();
                      for (int i = 0; i < arr.size(); i++) {
                          final int idx = i; // 🌟 修复: 声明 final 变量供 Lambda 使用
                          JsonObject o = arr.get(i).getAsJsonObject();
                          LinearLayout item = new LinearLayout(this);
                          item.setOrientation(LinearLayout.HORIZONTAL);
                          item.setPadding(20, 20, 20, 20);
                          
                          TextView tv = new TextView(this);
                          tv.setText(o.get("name").getAsString() + "\n" + o.get("brand").getAsString() + " | " + o.get("cate").getAsString());
                          tv.setTextSize(14);
                          tv.setLayoutParams(new LinearLayout.LayoutParams(0, -2, 1.0f));
                          item.addView(tv);
                          
                          Button del = new Button(this);
                          del.setText("删除");
                          del.setTextSize(12);
                          del.setOnClickListener(v -> {
                              JsonArray newList = new JsonArray();
                              // 🌟 修复: 使用 idx 替代 i
                              for(int j=0; j<arr.size(); j++) if(j!=idx) newList.add(arr.get(j));
                              db.edit().putString("devs", newList.toString()).apply();
                              refreshList();
                          });
                          item.addView(del);
                          
                          listArea.addView(item);
                      }
                      if(arr.size() == 0) {
                          TextView empty = new TextView(this);
                          empty.setText("暂无设备，点击上方添加");
                          empty.setTextColor(Color.GRAY);
                          empty.setPadding(40, 40, 40, 40);
                          listArea.addView(empty);
                      }
                  } catch(Exception e) {
                      TextView err = new TextView(this);
                      err.setText("加载失败: " + e.getMessage());
                      err.setTextColor(Color.RED);
                      listArea.addView(err);
                  }
              }
              
              private String getLocalIp() {
                  try {
                      for (NetworkInterface n : Collections.list(NetworkInterface.getNetworkInterfaces())) {
                          for (InetAddress a : Collections.list(n.getInetAddresses())) {
                              if (!a.isLoopbackAddress() && a instanceof Inet4Address) return a.getHostAddress();
                          }
                      }
                  } catch (Exception e) {}
                  return "127.0.0.1";
              }
          }
          EOF

