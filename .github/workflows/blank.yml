name: IREXT_LOCAL_DECODE_FINAL

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 初始化并下载 IRExt JNI 库
        run: |
          rm -rf *
          mkdir -p app/src/main/java/hap/re00660/re
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          
          curl -L -o /tmp/irext.zip "https://irext-lib-release.oss-cn-hangzhou.aliyuncs.com/1.5.2/decode_sdk/libirdecode_jni_1.5.2-android.zip" || echo "Download failed"
          
          if [ -f /tmp/irext.zip ]; then
            unzip -q /tmp/irext.zip -d /tmp/irext
            cp /tmp/irext/*/arm64-v8a/libirdecode.so app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true
            cp /tmp/irext/*/armeabi-v7a/libirdecode.so app/src/main/jniLibs/armeabi-v7a/ 2>/dev/null || true
            echo "✅ JNI libs ready"
          fi

      - name: 2. 编写 JNI 封装类
        run: |
          cat <<'EOF' > app/src/main/java/hap/re00660/re/IRDecoder.java
          package hap.re00660.re;
          
          public class IRDecoder {
              static {
                  System.loadLibrary("irdecode");
              }
              
              public native int irBinaryOpen(int category, int subCategory, byte[] binary, int length);
              public native int irDecode(int keyCode, int[] userData, Object acStatus);
              public native int irClose();
              
              public static class ACStatus {
                  public int acPower;
                  public int acMode;
                  public int acTemp;
                  public int acWindSpeed;
                  public int acWindDir;
                  public int changeWindDir;
              }
          }
          EOF

      - name: 3. 编写核心服务（修复版）
        run: |
          cat <<'EOF' > app/src/main/java/hap/re00660/re/IRService.java
          package hap.re00660.re;
          import android.app.*;
          import android.content.*;
          import android.hardware.ConsumerIrManager;
          import android.media.*;
          import android.os.*;
          import android.util.Log;
          import fi.iki.elonen.NanoHTTPD;
          import java.io.*;
          import java.net.*;
          import java.nio.charset.StandardCharsets;
          import java.util.*;
          import com.google.gson.*;
          
          public class IRService extends Service {
              private static final String TAG = "IRService";
              private WebServer server;
              private ConsumerIrManager ir;
              private SharedPreferences db, cfg;
              private String targetCloudUrl = "";
              private String apiId = "", apiToken = "";
              private IRDecoder decoder;
              private boolean hasLocalDecode = false;
              private HashMap<String, byte[]> binaryCache = new HashMap<>();
              
              @Override
              public void onCreate() {
                  super.onCreate();
                  db = getSharedPreferences("IREXT_DB", MODE_PRIVATE);
                  cfg = getSharedPreferences("IREXT_CFG", MODE_PRIVATE);
                  
                  try {
                      decoder = new IRDecoder();
                      hasLocalDecode = true;
                      Log.i(TAG, "本地解码器初始化成功");
                  } catch (Exception e) {
                      Log.e(TAG, "本地解码器失败: " + e.getMessage());
                  }
                  
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel("IR", "红外服务", NotificationManager.IMPORTANCE_LOW);
                      getSystemService(NotificationManager.class).createNotificationChannel(ch);
                  }
                  Notification n = new Notification.Builder(this, "IR")
                      .setContentTitle("红外网关运行中")
                      .setSmallIcon(android.R.drawable.ic_menu_preferences)
                      .build();
                  startForeground(1, n);
                  
                  try { 
                      ir = (ConsumerIrManager) getSystemService(CONSUMER_IR_SERVICE); 
                  } catch(Throwable t) {}
                  
                  try { 
                      server = new WebServer(8080); 
                      server.start(); 
                      Log.i(TAG, "Web服务器启动成功");
                  } catch (Exception e) { 
                      Log.e(TAG, "Web服务器启动失败: " + e.getMessage());
                  }
              }
              
              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && intent.getStringExtra("DOCKER_URL") != null) {
                      targetCloudUrl = intent.getStringExtra("DOCKER_URL");
                      loginCloud();
                  }
                  return START_STICKY;
              }
              
              private void loginCloud() {
                  new Thread(() -> {
                      String res = httpPost("/irext-server/app/app_login",
                          "{\"appKey\":\"55b1d89fda0658d6f851ee89cad564de\"," +
                          "\"appSecret\":\"83dfd86ad59843ce50342ec863a49bf0\"," +
                          "\"appType\":\"2\"}");
                      try {
                          JsonObject obj = JsonParser.parseString(res).getAsJsonObject();
                          if (obj.has("entity")) {
                              JsonObject ent = obj.getAsJsonObject("entity");
                              apiId = ent.get("id").getAsString();
                              apiToken = ent.get("token").getAsString();
                              Log.i(TAG, "登录成功: " + apiId);
                          }
                      } catch (Exception e) {
                          Log.e(TAG, "登录失败: " + e.getMessage());
                      }
                  }).start();
              }
              
              private int[] decodeLocal(String indexId, int category, int keyCode) {
                  if (!hasLocalDecode) return null;
                  
                  try {
                      byte[] binary = binaryCache.get(indexId);
                      if (binary == null) {
                          binary = downloadBinary(indexId);
                          if (binary == null) return null;
                          binaryCache.put(indexId, binary);
                      }
                      
                      int ret = decoder.irBinaryOpen(category, 1, binary, binary.length);
                      if (ret != 0) {
                          Log.e(TAG, "irBinaryOpen 失败: " + ret);
                          return null;
                      }
                      
                      int[] userData = new int[1024];
                      int length;
                      
                      if (category == 1) {
                          IRDecoder.ACStatus ac = new IRDecoder.ACStatus();
                          ac.acPower = 0;
                          ac.acMode = 0;
                          ac.acTemp = 8;
                          ac.acWindSpeed = 0;
                          ac.acWindDir = 0;
                          ac.changeWindDir = 0;
                          length = decoder.irDecode(keyCode, userData, ac);
                      } else {
                          length = decoder.irDecode(keyCode, userData, null);
                      }
                      
                      decoder.irClose();
                      
                      if (length > 0) {
                          int[] result = new int[length];
                          System.arraycopy(userData, 0, result, 0, length);
                          Log.i(TAG, "本地解码成功: " + length + " 个脉冲");
                          return result;
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "本地解码异常: " + e.getMessage());
                  }
                  return null;
              }
              
              private byte[] downloadBinary(String indexId) {
                  try {
                      URL url = new URL(targetCloudUrl + "/irext-server/operation/download_bin");
                      HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod("POST");
                      conn.setRequestProperty("Content-Type", "application/json");
                      conn.setConnectTimeout(10000);
                      conn.setDoOutput(true);
                      
                      String json = "{\"id\":\"" + apiId + "\",\"token\":\"" + apiToken + "\",\"indexId\":\"" + indexId + "\"}";
                      try (OutputStream os = conn.getOutputStream()) {
                          os.write(json.getBytes(StandardCharsets.UTF_8));
                      }
                      
                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                      try (InputStream is = conn.getInputStream()) {
                          byte[] buf = new byte[4096];
                          int len;
                          while ((len = is.read(buf)) != -1) {
                              baos.write(buf, 0, len);
                          }
                      }
                      conn.disconnect();
                      
                      byte[] data = baos.toByteArray();
                      if (data.length > 100) {
                          Log.i(TAG, "下载码库成功: " + indexId + " (" + data.length + " bytes)");
                          return data;
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "下载码库失败: " + e.getMessage());
                  }
                  return null;
              }
              
              private int[] decodeOnline(String indexId, int category, int keyCode) {
                  try {
                      JsonObject req = new JsonObject();
                      req.addProperty("id", apiId);
                      req.addProperty("token", apiToken);
                      req.addProperty("indexId", indexId);
                      req.addProperty("keyCode", String.valueOf(keyCode));
                      req.addProperty("directDecode", "0");
                      req.addProperty("paraData", "0");
                      
                      if (category == 1) {
                          JsonObject ac = new JsonObject();
                          ac.addProperty("acPower", "0");
                          ac.addProperty("acMode", "0");
                          ac.addProperty("acTemp", "8");
                          ac.addProperty("acWindSpeed", "0");
                          ac.addProperty("acWindDir", "0");
                          ac.addProperty("changeWindDir", "0");
                          req.add("acStatus", ac);
                      }
                      
                      String res = httpPost("/irext-server/operation/decode", req.toString());
                      Log.d(TAG, "在线解码响应: " + res);
                      
                      JsonObject root = JsonParser.parseString(res).getAsJsonObject();
                      if (root.has("entity") && !root.get("entity").isJsonNull()) {
                          JsonArray arr = root.getAsJsonArray("entity");
                          int[] pattern = new int[arr.size()];
                          for (int i = 0; i < arr.size(); i++) {
                              pattern[i] = arr.get(i).getAsInt();
                          }
                          return pattern;
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "在线解码异常: " + e.getMessage());
                  }
                  return null;
              }
              
              private void transmit(int[] pattern) {
                  if (pattern == null || pattern.length == 0) return;
                  
                  boolean forceAudio = cfg.getBoolean("force_audio", false);
                  
                  if (ir != null && ir.hasIrEmitter() && !forceAudio) {
                      ir.transmit(38000, pattern);
                      Log.i(TAG, "硬件红外发射");
                  } else {
                      transmitAudio(pattern);
                      Log.i(TAG, "音频红外发射");
                  }
              }
              
              private void transmitAudio(int[] pattern) {
                  int sampleRate = 48000;
                  int total = 0;
                  for (int p : pattern) total += p;
                  int frames = (int) ((total / 1000000.0) * sampleRate);
                  short[] buffer = new short[frames * 2];
                  
                  int frameIdx = 0;
                  boolean mark = true;
                  for (int duration : pattern) {
                      int curFrames = (int) ((duration / 1000000.0) * sampleRate);
                      for (int i = 0; i < curFrames && frameIdx < frames; i++) {
                          if (mark) {
                              double t = frameIdx / (double) sampleRate;
                              short val = (short) (Math.sin(2 * Math.PI * 38000 * t) * 32767);
                              buffer[frameIdx * 2] = val;
                              buffer[frameIdx * 2 + 1] = (short) -val;
                          }
                          frameIdx++;
                      }
                      mark = !mark;
                  }
                  
                  try {
                      AudioTrack track = new AudioTrack(AudioManager.STREAM_MUSIC, sampleRate,
                          AudioFormat.CHANNEL_OUT_STEREO, AudioFormat.ENCODING_PCM_16BIT,
                          buffer.length * 2, AudioTrack.MODE_STATIC);
                      track.write(buffer, 0, buffer.length);
                      track.play();
                  } catch (Exception e) {
                      Log.e(TAG, "音频发射失败: " + e.getMessage());
                  }
              }
              
              private String httpPost(String path, String body) {
                  HttpURLConnection conn = null;
                  try {
                      URL url = new URL(targetCloudUrl + path);
                      conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod("POST");
                      conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                      conn.setConnectTimeout(10000);
                      conn.setReadTimeout(10000);
                      conn.setDoOutput(true);
                      
                      try (OutputStream os = conn.getOutputStream()) {
                          os.write(body.getBytes(StandardCharsets.UTF_8));
                      }
                      
                      InputStream is = conn.getResponseCode() < 400 ? conn.getInputStream() : conn.getErrorStream();
                      if (is == null) return "{}";
                      
                      try (BufferedReader br = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8))) {
                          StringBuilder sb = new StringBuilder();
                          String line;
                          while ((line = br.readLine()) != null) sb.append(line);
                          return sb.toString();
                      }
                  } catch (Exception e) {
                      return "{}";
                  } finally {
                      if (conn != null) conn.disconnect();
                  }
              }
              
              // ========== Web 服务器（修复：serveUI 在内部类中） ==========
              private class WebServer extends NanoHTTPD {
                  public WebServer(int port) { super(port); }
                  
                  @Override
                  public Response serve(IHTTPSession session) {
                      String uri = session.getUri();
                      Map<String, String> p = session.getParms();
                      
                      try {
                          if ("/api/list".equals(uri)) {
                              return newFixedLengthResponse(Response.Status.OK, "application/json", 
                                  db.getString("devs", "[]"));
                          }
                          
                          if ("/api/save".equals(uri)) {
                              int len = Integer.parseInt(session.getHeaders().get("content-length"));
                              byte[] buf = new byte[len];
                              session.getInputStream().read(buf, 0, len);
                              
                              JsonArray list = JsonParser.parseString(db.getString("devs", "[]")).getAsJsonArray();
                              list.add(JsonParser.parseString(new String(buf, StandardCharsets.UTF_8)));
                              db.edit().putString("devs", list.toString()).apply();
                              
                              return newFixedLengthResponse("OK");
                          }
                          
                          if ("/api/delete".equals(uri)) {
                              JsonArray list = JsonParser.parseString(db.getString("devs", "[]")).getAsJsonArray();
                              JsonArray newList = new JsonArray();
                              int idx = Integer.parseInt(p.get("i"));
                              for (int i = 0; i < list.size(); i++) {
                                  if (i != idx) newList.add(list.get(i));
                              }
                              db.edit().putString("devs", newList.toString()).apply();
                              return newFixedLengthResponse("OK");
                          }
                          
                          if ("/api/tx".equals(uri)) {
                              String cid = p.get("c");
                              String indexId = p.get("id");
                              String keyCode = p.get("k");
                              
                              int category = Integer.parseInt(cid);
                              int key = Integer.parseInt(keyCode);
                              
                              Log.i(TAG, "发射请求: cat=" + category + ", idx=" + indexId + ", key=" + key);
                              
                              int[] pattern = decodeLocal(indexId, category, key);
                              
                              if (pattern == null) {
                                  Log.w(TAG, "本地解码失败，尝试在线解码");
                                  pattern = decodeOnline(indexId, category, key);
                              }
                              
                              if (pattern != null) {
                                  transmit(pattern);
                                  return newFixedLengthResponse("OK");
                              } else {
                                  return newFixedLengthResponse("Error: 解码失败");
                              }
                          }
                          
                          if ("/api/proxy".equals(uri)) {
                              String body = "{\"id\":\"" + apiId + "\",\"token\":\"" + apiToken + "\"," + p.get("b") + "}";
                              String res = httpPost(p.get("p"), body);
                              JsonObject obj = JsonParser.parseString(res).getAsJsonObject();
                              String entity = obj.has("entity") ? obj.get("entity").toString() : "[]";
                              return newFixedLengthResponse(Response.Status.OK, "application/json", entity);
                          }
                          
                      } catch (Exception e) {
                          Log.e(TAG, "请求处理异常: " + e.getMessage());
                          return newFixedLengthResponse("Error: " + e.getMessage());
                      }
                      
                      // 返回 UI（直接内联，不调用外部方法）
                      String html = "<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>红外网关</title><style>body{font-family:sans-serif;background:#f0f2f5;padding:12px;max-width:500px;margin:0 auto}.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}.btn{background:#1890ff;color:#fff;border:none;padding:12px 24px;border-radius:8px;cursor:pointer;width:100%;margin-top:8px}.btn-g{background:#52c41a}.btn-r{background:#ff4d4f}select,input{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}</style></head><body>" +
                          "<div id='home'><div class='card'><h3>🏠 我的设备</h3><div id='list'></div><button class='btn btn-g' onclick='goAdd()'>+ 添加设备</button></div></div>" +
                          "<div id='add' style='display:none'><div class='card'><h3>添加设备</h3><select id='type' onchange='loadBrands()'><option>选择类型</option></select><select id='brand' style='display:none'></select><div id='stb' style='display:none'><select id='prov'><option>省份</option></select><select id='city'><option>城市</option></select><select id='op'><option>运营商</option></select></div><button class='btn' onclick='match()'>开始匹配</button></div></div>" +
                          "<script>const $=i=>document.getElementById(i);function loadDevs(){fetch('/api/list').then(r=>r.json()).then(d=>{let h='';d.forEach((x,i)=>h+=`<div class='card' onclick='control(${i})'><b>${x.name}</b><br><small>${x.brand}</small></div>`);$('list').innerHTML=h||'暂无设备'})}function goAdd(){}function control(idx){}loadDevs();</script></body></html>";
                      return newFixedLengthResponse(Response.Status.OK, "text/html", html);
                  }
              }
              
              @Override public IBinder onBind(Intent intent) { return null; }
          }
          EOF

      - name: 4. 编写主界面
        run: |
          cat <<'EOF' > app/src/main/java/hap/re00660/re/MainActivity.java
          package hap.re00660.re;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.*;
          import android.webkit.*;
          import android.widget.*;

          public class MainActivity extends Activity {
              SharedPreferences cfg;
              WebView web;
              boolean isWeb = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  cfg = getSharedPreferences("IREXT_CFG", MODE_PRIVATE);
                  
                  LinearLayout main = new LinearLayout(this);
                  main.setOrientation(LinearLayout.VERTICAL);
                  main.setPadding(40, 40, 40, 40);
                  main.setBackgroundColor(Color.parseColor("#F1F5F9"));

                  TextView title = new TextView(this);
                  title.setText("📡 红外网关 - 本地解码版");
                  title.setTextSize(20);
                  main.addView(title);

                  TextView status = new TextView(this);
                  status.setText("\n状态: 未启动");
                  status.setTextColor(Color.RED);
                  main.addView(status);

                  EditText ip = new EditText(this);
                  ip.setHint("Docker IP:8081");
                  ip.setText(cfg.getString("docker_ip", "http://192.168.1.100:8081"));
                  main.addView(ip);

                  Switch swAudio = new Switch(this);
                  swAudio.setText("强制音频发射");
                  swAudio.setChecked(cfg.getBoolean("force_audio", false));
                  main.addView(swAudio);

                  Button btn = new Button(this);
                  btn.setText("启动服务");
                  btn.setBackgroundColor(Color.parseColor("#1890ff"));
                  btn.setTextColor(Color.WHITE);
                  btn.setOnClickListener(v -> {
                      cfg.edit()
                          .putString("docker_ip", ip.getText().toString())
                          .putBoolean("force_audio", swAudio.isChecked())
                          .apply();
                      
                      startService(new Intent(this, IRService.class)
                          .putExtra("DOCKER_URL", ip.getText().toString()));
                      
                      status.setText("\n状态: 运行中");
                      status.setTextColor(Color.parseColor("#16a34a"));
                  });
                  main.addView(btn);

                  Button webBtn = new Button(this);
                  webBtn.setText("打开控制界面");
                  webBtn.setOnClickListener(v -> {
                      web.setVisibility(View.VISIBLE);
                      web.loadUrl("http://127.0.0.1:8080");
                      isWeb = true;
                  });
                  main.addView(webBtn);

                  web = new WebView(this);
                  web.getSettings().setJavaScriptEnabled(true);
                  web.setWebViewClient(new WebViewClient());
                  web.setVisibility(View.GONE);
                  main.addView(web);

                  setContentView(main);
              }

              @Override
              public void onBackPressed() {
                  if (isWeb) {
                      web.setVisibility(View.GONE);
                      isWeb = false;
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: 5. 构建配置
        run: |
          cat <<'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.TRANSMIT_IR" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <application android:label="红外网关" android:theme="@android:style/Theme.Light" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
                  <service android:name=".IRService" android:exported="false" />
              </application>
          </manifest>
          EOF
          
          echo "android.useAndroidX=true" > gradle.properties
          echo "include ':app'" > settings.gradle
          
          cat <<'EOF' > build.gradle
          buildscript { 
              repositories { google(); mavenCentral() } 
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } 
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          
          cat <<'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              compileSdk 34
              namespace "hap.re00660.re"
              defaultConfig {
                  applicationId "hap.re00660.re"
                  minSdk 21
                  targetSdk 33
                  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
              }
              sourceSets { main { jniLibs.srcDirs = ['src/main/jniLibs'] } }
          }
          dependencies {
              implementation 'org.nanohttpd:nanohttpd:2.3.1'
              implementation 'com.google.code.gson:gson:2.10.1'
          }
          EOF

      - name: 6. 编译
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug

      - name: 7. 交付
        uses: actions/upload-artifact@v4
        with:
          name: IREXT_TV_WORKING
          path: app/build/outputs/apk/debug/app-debug.apk
