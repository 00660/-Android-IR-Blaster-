name: IREXT_ANDROID

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 代码初始化
        run: |
          rm -rf *
          mkdir -p app/src/main/java/hap/re00660/re
          echo "✅ 初始化完成"
      
      - name: 2. 编写开机自启广播
        run: |
          cat <<'EOF' > app/src/main/java/hap/re00660/re/BootReceiver.java
          package hap.re00660.re;
          import android.content.*;
          import android.os.Build;
          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction()) || "android.intent.action.QUICKBOOT_POWERON".equals(intent.getAction())) {
                      SharedPreferences cfg = context.getSharedPreferences("IREXT_CFG", Context.MODE_PRIVATE);
                      if (cfg.getBoolean("auto_start", true)) {
                          Intent i = new Intent(context, IRService.class);
                          boolean isPublic = cfg.getBoolean("is_public_cloud", false);
                          i.putExtra("CLOUD_URL", isPublic ? "http://srv.irext.net" : cfg.getString("docker_ip", "http://192.168.1.100:8081"));
                          i.putExtra("LOCAL_DECODER_URL", cfg.getString("local_decoder", "http://192.168.1.100:8082"));
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              context.startForegroundService(i);
                          } else {
                              context.startService(i);
                          }
                      }
                  }
              }
          }
          EOF
      - name: 3. 编写核心服务 (修复8081本地Docker路径)
        run: |
          cat <<'EOF' > app/src/main/java/hap/re00660/re/IRService.java
          package hap.re00660.re;
          import android.app.*;
          import android.content.*;
          import android.hardware.ConsumerIrManager;
          import android.media.*;
          import android.os.Build;
          import android.os.IBinder;
          import fi.iki.elonen.NanoHTTPD;
          import java.io.*;
          import java.net.*;
          import java.nio.charset.StandardCharsets;
          import java.util.*;
          import com.google.gson.*;
          public class IRService extends Service {
              private WebServer server;
              private ConsumerIrManager ir;
              private SharedPreferences db, cfg;
              private String targetCloudUrl = "https://srv.irext.net";
              private String localDecoderUrl = "http://192.168.2.157:8082";
              private String apiId = "", apiToken = "";
              private String APP_KEY = "55b1d89fda0658d6f851ee89cad564de";
              private String APP_SECRET = "83dfd86ad59843ce50342ec863a49bf0";
              private Map<String, Map<String, Object>> decodeCache = new HashMap<>();
              private Map<String, JsonObject> acStateCache = new HashMap<>();
              private boolean isRunning = false;
              private int serverPort = 8080;
              private List<Map<String, Object>> rawCodeLog = new ArrayList<>();
              private static final int MAX_LOG_SIZE = 100;
              
              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if(intent != null) {
                      if(intent.getStringExtra("CLOUD_URL") != null) targetCloudUrl = intent.getStringExtra("CLOUD_URL");
                      if(intent.getStringExtra("LOCAL_DECODER_URL") != null) localDecoderUrl = intent.getStringExtra("LOCAL_DECODER_URL");
                      loginCloud();
                  }
                  return START_STICKY;
              }
              
              @Override
              public void onCreate() {
                  super.onCreate();
                  isRunning = true;
                  db = getSharedPreferences("IREXT_DATABASE", MODE_PRIVATE);
                  cfg = getSharedPreferences("IREXT_CFG", MODE_PRIVATE);
                  
                  // 🌟 Android 14 适配：启动前台服务
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                      startForeground(1, createNotification(), 
                          android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                  } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForeground(1, createNotification());
                  }
                  
                  try { 
                      ir = (ConsumerIrManager) getSystemService(CONSUMER_IR_SERVICE); 
                  } catch(Throwable t) {}
                  
                  try { 
                      server = new WebServer(serverPort); 
                      server.start(); 
                  } catch (Exception e) { 
                      isRunning = false;
                  }
                  sendStatusBroadcast();
              }
              
              private Notification createNotification() {
                  try {
                      Notification.Builder nb;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          NotificationChannel ch = new NotificationChannel("IR", "红外网关守护", NotificationManager.IMPORTANCE_LOW);
                          NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                          if(nm != null) nm.createNotificationChannel(ch);
                          nb = new Notification.Builder(this, "IR");
                      } else {
                          nb = new Notification.Builder(this);
                      }
                      nb.setContentTitle("红外网关运行中");
                      nb.setSmallIcon(android.R.drawable.ic_dialog_info);
                      return nb.build();
                  } catch(Throwable t) {
                      return new Notification();
                  }
              }
              
              @Override
              public void onDestroy() {
                  isRunning = false;
                  sendStatusBroadcast();
                  if(server != null) server.stop();
                  super.onDestroy();
              }
              
              private void sendStatusBroadcast() {
                  Intent intent = new Intent("hap.re00660.re.SERVICE_STATUS");
                  intent.putExtra("running", isRunning);
                  intent.putExtra("port", serverPort);
                  sendBroadcast(intent);
              }
              
              private void transmitAudioStereo(int[] pattern) {
                  int sampleRate = 48000;
                  int freq = 19000;
                  int total = 0;
                  for (int p : pattern) total += p;
                  final int finalSleepTime = (total / 1000) + 100;
                  int frames = (int)((total / 1000000.0) * sampleRate);
                  short[] buffer = new short[frames * 2];
                  int frameIndex = 0;
                  boolean mark = true;
                  for (int duration : pattern) {
                      int currentFrames = (int)((duration / 1000000.0) * sampleRate);
                      for (int i=0; i<currentFrames; i++) {
                          if (mark && frameIndex * 2 + 1 < buffer.length) {
                              double time = frameIndex / (double)sampleRate;
                              short val = (short)(Math.sin(2 * Math.PI * freq * time) * 32767);
                              buffer[frameIndex * 2] = val;
                              buffer[frameIndex * 2 + 1] = (short)-val;
                          }
                          frameIndex++;
                      }
                      mark = !mark;
                  }
                  try {
                      AudioTrack track = new AudioTrack(AudioManager.STREAM_MUSIC, sampleRate,
                          AudioFormat.CHANNEL_OUT_STEREO, AudioFormat.ENCODING_PCM_16BIT,
                          buffer.length * 2, AudioTrack.MODE_STATIC);
                      track.write(buffer, 0, buffer.length);
                      track.play();
                      new Thread(() -> {
                          try { Thread.sleep(finalSleepTime); track.release(); } catch(Exception e){}
                      }).start();
                  } catch (Exception e) {}
              }
              
              private String postJSON(String fullUrl, String jsonBody) {
                  HttpURLConnection conn = null;
                  try {
                      URL url = new URL(fullUrl);
                      conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod("POST");
                      conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                      conn.setConnectTimeout(8000); 
                      conn.setReadTimeout(15000); 
                      conn.setDoOutput(true);
                      try(OutputStream os = conn.getOutputStream()) { 
                          os.write(jsonBody.getBytes(StandardCharsets.UTF_8)); 
                      }
                      int responseCode = conn.getResponseCode();
                      InputStream is = responseCode >= 400 ? conn.getErrorStream() : conn.getInputStream();
                      if (is == null) return "{}";
                      try(BufferedReader br = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8))) {
                          StringBuilder sb = new StringBuilder(); 
                          String line;
                          while((line = br.readLine()) != null) sb.append(line);
                          return sb.toString();
                      }
                  } catch (Exception e) { 
                      return "{\"error\":\"" + e.getMessage() + "\"}"; 
                  } finally { 
                      if(conn!=null) conn.disconnect(); 
                  }
              }
              
              private void loginCloud() {
                  new Thread(() -> {
                      // 🌟 修复：本地Docker和公有云都使用 /irext-server/ 前缀
                      String loginUrl = targetCloudUrl.endsWith("/") ? 
                          targetCloudUrl + "irext-server/app/app_login" : 
                          targetCloudUrl + "/irext-server/app/app_login";
                      String req = "{\"appKey\":\""+APP_KEY+"\",\"appSecret\":\""+APP_SECRET+"\",\"appType\":\"2\"}";
                      String res = postJSON(loginUrl, req);
                      try {
                          JsonObject obj = JsonParser.parseString(res).getAsJsonObject();
                          if(obj.has("entity")) {
                              JsonObject entity = obj.getAsJsonObject("entity");
                              apiId = entity.get("id").getAsString(); 
                              apiToken = entity.get("token").getAsString();
                          }
                      } catch (Exception e) { }
                  }).start();
              }
              
              private int getKeyId(int cat, String k) {
                  if ((cat == 2 || cat == 3 || cat == 8) && k.matches("\\d+")) return 14 + Integer.parseInt(k);
                  String[] m = null;
                  switch(cat) {
                      case 1: m = new String[]{"电源","模式","温度+","温度-","N/A","N/A","N/A","温度+","温度-","风力","扫风","固定风"}; break;
                      case 2: m = new String[]{"电源","静音","上","下","左","右","确认","音量+","音量-","返回","信号源","菜单","主页","设置"}; break;
                      case 3: m = new String[]{"电源","静音","上","下","左","右","确认","音量+","音量-","返回","信号源","菜单","上一页","下一页"}; break;
                      case 7: m = new String[]{"电源","上","下","左","右","确认","风力+","风力-","摇头","风力","风类","返回"}; break;
                      case 8: m = new String[]{"电源","静音","上","下","左","右","确认","音量+","音量-","返回","信号源","菜单","主页","设置"}; break;
                      default: m = new String[]{"电源","上","下","左","右","确认","音量+","音量-","返回","菜单","主页"}; break;
                  }
                  if(m != null) for(int i=0; i<m.length; i++) if(m[i].equals(k)) return i;
                  return -1;
              }
              
              // 🌟 8082本地解码器 - 独立路径，不带 /irext-server/
              private Map<String, Object> batchDecodeLocal(String indexId, String type, int cat, int subCate) {
                  String cacheKey = indexId + "_" + type;
                  if(decodeCache.containsKey(cacheKey)) return decodeCache.get(cacheKey);
                  String req = String.format("{\"id\":\"%s\",\"token\":\"%s\",\"indexId\":\"%s\",\"deviceType\":\"%s\",\"categoryId\":%d,\"subCate\":%d}",
                      apiId, apiToken, indexId, type, cat, subCate);
                  // 8082本地解码器使用独立路径 /decode/all
                  String decodeUrl = localDecoderUrl.endsWith("/") ? 
                      localDecoderUrl + "decode/all" : 
                      localDecoderUrl + "/decode/all";
                  String res = postJSON(decodeUrl, req);
                  try {
                      JsonObject obj = JsonParser.parseString(res).getAsJsonObject();
                      if(obj.has("keys")) {
                          Map<String, Object> result = new HashMap<>();
                          result.put("keys", obj.get("keys").toString());
                          decodeCache.put(cacheKey, result);
                          return result;
                      }
                  } catch(Exception e) {}
                  return null;
              }
              
              // 🌟 8081云端解码 - 本地Docker和公有云都使用 /irext-server/operation/decode
              private int[] decodeOnline(String indexId, int cat, String op) {
                  JsonObject s = acStateCache.get(indexId);
                  if(s == null && cat == 1) {
                      s = new JsonObject(); 
                      s.addProperty("acPower", 1); 
                      s.addProperty("acMode", 1);
                      s.addProperty("acTemp", 10); 
                      s.addProperty("acWindSpeed", 0); 
                      s.addProperty("acWindDir", 0);
                      s.addProperty("changeWindDir", 0);
                      acStateCache.put(indexId, s);
                  }
                  JsonObject req = new JsonObject();
                  req.addProperty("id", apiId); 
                  req.addProperty("token", apiToken);
                  req.addProperty("indexId", indexId);
                  if(cat == 1) {
                      if(op.equals("电源")) s.addProperty("acPower", s.get("acPower").getAsInt() == 0 ? 1 : 0);
                      else {
                          s.addProperty("acPower", 0);
                          if(op.equals("模式")) s.addProperty("acMode", (s.get("acMode").getAsInt() + 1) % 5);
                          if(op.equals("温度+")) s.addProperty("acTemp", Math.min(14, s.get("acTemp").getAsInt() + 1));
                          if(op.equals("温度-")) s.addProperty("acTemp", Math.max(0, s.get("acTemp").getAsInt() - 1));
                      }
                      req.addProperty("keyCode", 0); 
                      req.add("acStatus", s);
                  } else {
                      int kid = getKeyId(cat, op); 
                      if(kid == -1) return null;
                      req.addProperty("keyCode", kid);
                  }
                  // 🌟 修复：本地Docker和公有云都使用 /irext-server/operation/decode
                  String decodeUrl = targetCloudUrl.endsWith("/") ? 
                      targetCloudUrl + "irext-server/operation/decode" : 
                      targetCloudUrl + "/irext-server/operation/decode";
                  String res = postJSON(decodeUrl, req.toString());
                  try {
                      JsonObject obj = JsonParser.parseString(res).getAsJsonObject();
                      if(obj.has("entity")) {
                          JsonArray arr = obj.getAsJsonArray("entity");
                          int[] t = new int[arr.size()]; 
                          for(int i=0; i<arr.size(); i++) t[i] = arr.get(i).getAsInt();
                          return t;
                      }
                  } catch(Exception e) { }
                  return null;
              }
              
              private void logRawCode(String deviceName, String keyName, int[] timings, String source) {
                  Map<String, Object> log = new HashMap<>();
                  log.put("time", new Date().toLocaleString());
                  log.put("device", deviceName);
                  log.put("key", keyName);
                  log.put("timings", timings);
                  log.put("source", source);
                  log.put("carrier", 38000);
                  rawCodeLog.add(0, log);
                  if(rawCodeLog.size() > MAX_LOG_SIZE) rawCodeLog.remove(rawCodeLog.size() - 1);
              }
              
              private class WebServer extends NanoHTTPD {
                  public WebServer(int port) { super(port); }
                  @Override
                  public Response serve(IHTTPSession session) {
                      String uri = session.getUri();
                      Map<String, String> p = session.getParms();
                      try {
                          if ("/api/status".equals(uri)) {
                              JsonObject status = new JsonObject();
                              status.addProperty("running", isRunning);
                              status.addProperty("port", serverPort);
                              status.addProperty("ir_available", ir != null && ir.hasIrEmitter());
                              status.addProperty("cloud_url", targetCloudUrl);
                              status.addProperty("local_decoder_url", localDecoderUrl);
                              status.addProperty("api_id", apiId.isEmpty() ? "未登录" : "已登录");
                              return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", status.toString());
                          }
                          if ("/api/list".equals(uri)) {
                              return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", db.getString("devs", "[]"));
                          }
                          if ("/api/save".equals(uri)) {
                              int len = Integer.parseInt(session.getHeaders().get("content-length"));
                              byte[] buf = new byte[len]; 
                              session.getInputStream().read(buf, 0, len);
                              JsonArray list = JsonParser.parseString(db.getString("devs", "[]")).getAsJsonArray();
                              list.add(JsonParser.parseString(new String(buf, StandardCharsets.UTF_8)));
                              db.edit().putString("devs", list.toString()).commit();
                              return newFixedLengthResponse("{\"ok\":true}");
                          }
                          if ("/api/delete".equals(uri)) {
                              String idxStr = p.get("i");
                              if(idxStr != null) {
                                  int idx = Integer.parseInt(idxStr);
                                  JsonArray list = JsonParser.parseString(db.getString("devs", "[]")).getAsJsonArray();
                                  JsonArray newList = new JsonArray();
                                  for(int i=0; i<list.size(); i++) {
                                      if(i != idx) newList.add(list.get(i));
                                  }
                                  db.edit().putString("devs", newList.toString()).commit();
                                  return newFixedLengthResponse("{\"ok\":true}");
                              }
                              return newFixedLengthResponse("{\"ok\":false,\"error\":\"no_index\"}");
                          }
                          if ("/api/batch_decode".equals(uri)) {
                              String indexId = p.get("indexId");
                              String type = p.getOrDefault("type", "tv");
                              int cat = Integer.parseInt(p.getOrDefault("cat", "2"));
                              int subCate = Integer.parseInt(p.getOrDefault("subCate", "1")); // 获取参数
                              Map<String, Object> res = batchDecodeLocal(indexId, type, cat, subCate); // 传入 4 个参数
                              return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", "{\"ok\":" + (res != null) + "}");
                          }
                          if ("/api/raw_logs".equals(uri)) {
                              return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", new Gson().toJson(rawCodeLog));
                          }
                          if ("/api/raw_logs/clear".equals(uri)) {
                              rawCodeLog.clear();
                              return newFixedLengthResponse("{\"ok\":true}");
                          }
                          if ("/api/tx".equals(uri)) {
                              String id = p.get("id"); 
                              String k = p.get("k"); 
                              int cat = Integer.parseInt(p.getOrDefault("cat", p.get("c")));
                              int subCate = Integer.parseInt(p.getOrDefault("subCate", "1"));
                              int[] pattern = null;
                              String source = "unknown";
                              
                              if (cat == 2 || cat == 3 || cat == 8) {
                                  String dType = (cat == 3) ? "stb" : "tv";
                                  Map<String, Object> cached = decodeCache.get(id + "_" + dType);
                                  if(cached == null) {
                                      cached = batchDecodeLocal(id, dType, cat, subCate);
                                      source = "local_decoder(8082)";
                                  } else {
                                      source = "local_cache";
                                  }
                                  if(cached != null) {
                                      JsonObject keys = JsonParser.parseString((String)cached.get("keys")).getAsJsonObject();
                                      if(keys.has(k)) {
                                          JsonArray arr = keys.getAsJsonObject(k).getAsJsonArray("timings");
                                          pattern = new int[arr.size()]; 
                                          for(int i=0; i<arr.size(); i++) pattern[i] = arr.get(i).getAsInt();
                                      }
                                  }
                              } else {
                                  pattern = decodeOnline(id, cat, k);
                                  source = "cloud_decoder(8081)";
                              }
                              
                              if(pattern != null) {
                                  logRawCode(id, k, pattern, source);
                                  if (cfg.getBoolean("force_audio", false) || ir == null || !ir.hasIrEmitter()) {
                                      transmitAudioStereo(pattern);
                                  } else {
                                      ir.transmit(38000, pattern);
                                  }
                                  return newFixedLengthResponse("{\"ok\":true,\"source\":\""+source+"\"}");
                              }
                              return newFixedLengthResponse("{\"ok\":false,\"error\":\"decode_failed\"}");
                          }
                          // 🌟 修复：代理接口 - 本地和云端都使用 /irext-server 前缀
                          if ("/api/proxy".equals(uri)) {
                              String path = p.get("p");
                              if(path != null) {
                                  if(!path.startsWith("/")) path = "/" + path;
                                  // 统一使用 /irext-server 前缀
                                  String proxyUrl = targetCloudUrl.endsWith("/") ? 
                                      targetCloudUrl.substring(0, targetCloudUrl.length()-1) + path : 
                                      targetCloudUrl + path;
                                  String body = "{\"id\":\""+apiId+"\",\"token\":\""+apiToken+"\"," + p.get("b") + "}";
                                  String res = postJSON(proxyUrl, body);
                                  JsonObject obj = JsonParser.parseString(res).getAsJsonObject();
                                  return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", obj.has("entity")?obj.get("entity").toString():"[]");
                              }
                              return newFixedLengthResponse("{\"ok\":false}");
                          }
                      } catch(Exception e) { 
                          return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", "{\"error\":\""+e.getMessage()+"\"}"); 
                      }
                      return newFixedLengthResponse(Response.Status.OK, "text/html; charset=UTF-8", getWebInterface());
                  }
              }
              
              private String getWebInterface() {
                  return "<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,user-scalable=no'><title>ha红外网关</title><style>"+
                      "body{font-family:sans-serif;background:#f0f2f5;padding:12px;margin:0 auto;max-width:500px}"+
                      ".card{background:#fff;border-radius:15px;padding:20px;box-shadow:0 4px 10px rgba(0,0,0,.08);margin-bottom:15px}"+
                      "h3{margin:0 0 15px;color:#1890ff;display:flex;justify-content:space-between;align-items:center}"+
                      ".btn-back{font-size:12px;background:#f5f5f5;padding:4px 10px;border-radius:6px;border:1px solid #ddd;cursor:pointer}"+
                      ".btn{display:block;width:100%;padding:14px 0;border:none;border-radius:12px;font-size:14px;font-weight:bold;margin-top:10px;cursor:pointer;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}"+
                      ".btn-p{background:#1890ff;color:#fff;border:none}.btn-g{background:#52c41a;color:#fff;border:none}"+
                      ".btn-r{background:#ff4d4f;color:#fff;border:none}.btn-y{background:#f59e0b;color:#fff;border:none}"+
                      ".dev-card{background:#fff;border:1px solid #eee;padding:18px;border-radius:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}"+
                      "select,input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;font-size:15px}"+
                      "#views>div{display:none}#v_home{display:block}"+
                      ".panel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}"+
                      ".num-grid{grid-template-columns:repeat(5,1fr);font-size:11px;margin-top:15px;border-top:1px dashed #eee;padding-top:15px}"+
                      "textarea{width:100%;height:350px;font-family:monospace;font-size:11px;background:#1e1e1e;color:#a9b7c6;padding:10px;border:1px solid #333;border-radius:8px}"+
                      ".log-full{background:#f8f9fa;border:1px solid #e9ecef;padding:15px;margin-bottom:10px;border-radius:8px;font-family:monospace;font-size:12px;word-break:break-all}"+
                      ".log-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #dee2e6}"+
                      ".log-time{color:#666;font-size:11px}"+
                      ".log-source{background:#1890ff;color:#fff;padding:2px 8px;border-radius:4px;font-size:10px}"+
                      ".log-device{font-weight:bold;color:#333;margin-bottom:5px}"+
                      ".log-key{color:#1890ff;font-weight:bold}"+
                      ".log-timings{background:#fff;padding:10px;border-radius:4px;margin-top:8px;border:1px solid #e9ecef;color:#495057;line-height:1.5;white-space:pre-wrap;word-break:break-all}"+
                      ".match-log-entry{background:#f0f7ff;border-left:4px solid #1890ff;padding:10px;margin-bottom:8px;border-radius:4px;font-family:monospace;font-size:11px}"+
                      "</style></head><body>" +
                      "<div id='views'>"+
                      "<div id='v_home'><h3>🏠 我的设备 <button class='btn-g' style='width:auto;padding:6px 15px' onclick='goAdd()'>+ 添加</button></h3><div id='dev_list'></div></div>" +
                      "<div id='v_add'><div class='card'><h3><span onclick='goHome()' class='btn-back'>← 返回</span> 1. 选类型品牌</h3><select id='sc' onchange='lb()'></select><select id='sb' onchange='startMatch()'></select></div></div>" +
                      "<div id='v_match'><div class='card'><h3><span onclick='view(\"v_add\")' class='btn-back'>← 返回</span> 匹配中</h3><div style='text-align:center;margin:15px 0'>方案 <b id='midx' style='color:#1890ff;font-size:24px'>1</b> / <span id='mtotal'>0</span></div><p id='bg_prog' style='font-size:12px;color:#999;text-align:center'></p><button class='btn btn-p' style='height:80px' onclick='testPwr()'>📡 发送电源测试</button><div class='panel' style='grid-template-columns:1fr 1fr'><button class='btn' onclick='next()'>❌ 无反应</button><button class='btn btn-g' onclick='preSave()'>✅ 有反应</button></div></div><div class='card' id='match_log_card' style='display:none;margin-top:15px'><h3>📟 实时发射日志</h3><div id='match_log' style='font-family:monospace;font-size:11px;background:#f8f9fa;padding:10px;border-radius:8px;max-height:300px;overflow-y:auto;word-break:break-all'></div></div></div>" +
                      "<div id='v_save'><div class='card'><h3><span onclick='view(\"v_match\")' class='btn-back'>← 返回</span> 3. 取名保存</h3><input id='d_name'><button class='btn btn-g' onclick='doSave()'>确认保存</button></div></div>" +
                      "<div id='v_ctrl'><div class='card'><h3><span id='c_title'></span> <button class='btn-back' onclick='goHome()'>关闭</button></h3><div id='ac_st' style='text-align:center;margin-bottom:15px;color:#666;font-family:monospace'></div><div class='panel' id='btns'></div><div class='panel num-grid' id='num_btns' style='display:none'></div><button class='btn btn-y' style='margin-top:20px' onclick='showRaw()'>📟 查看原始码</button><button class='btn' style='background:#fdf2f2;color:#ef4444;border-color:#fecaca;margin-top:10px' onclick='showHA()'>🛠️ HA 配置代码</button><button class='btn btn-r' style='margin-top:10px' onclick='delDev()'>删除设备</button></div></div>" +
                      "<div id='v_ha'><div class='card'><h3>🛠️ HA YAML <span onclick='goCtrl()' class='btn-back'>← 返回</span></h3><textarea id='ha_code' readonly onclick='this.select()'></textarea></div></div>" +
                      "<div id='v_raw'><div class='card'><h3>📟 原始红外码日志 <span onclick='goCtrl()' class='btn-back'>← 返回</span></h3><div id='raw_list'></div><button class='btn' onclick='clearRaw()' style='margin-top:15px'>🗑️ 清空所有记录</button></div></div>"+
                      "</div><script>" +
                      "const kmaps={'空调':{0:'电源',1:'模式',2:'温度+',3:'温度-',9:'风力',10:'扫风',11:'固定风'},'电视机':{0:'电源',1:'静音',2:'上',3:'下',4:'左',5:'右',6:'确认',7:'音量+',8:'音量-',9:'返回',10:'信号源',11:'菜单',12:'主页',13:'设置'},'机顶盒':{0:'电源',1:'静音',2:'上',3:'下',4:'左',5:'右',6:'确认',7:'音量+',8:'音量-',9:'返回',10:'信号源',11:'菜单',12:'上一页',13:'下一页'},'投影仪':{0:'电源',1:'静音',2:'上',3:'下',4:'左',5:'右',6:'确认',7:'音量+',8:'音量-',9:'返回',10:'信号源',11:'菜单',12:'主页',13:'设置'},'风扇':{0:'电源',1:'上',2:'下',3:'左',4:'右',5:'确认',6:'风力+',7:'风力-',8:'摇头',9:'风力',10:'风类',11:'返回'},'音响':{0:'电源',1:'静音',2:'上',3:'下',4:'左',5:'右',6:'确认',7:'音量+',8:'音量-',9:'返回',10:'播放',11:'暂停',12:'上一曲',13:'下一曲'},'盒子':{0:'电源',1:'静音',2:'上',3:'下',4:'左',5:'右',6:'确认',7:'音量+',8:'音量-',9:'返回',10:'主页',11:'菜单'}};"+
                      "const $=i=>document.getElementById(i);let cs=[],bs=[],is=[],curr=0,ac={p:0,m:0,t:8},devs=[],curDev=null,curIdx=-1,tvDec={};" +
                      "function view(id){document.querySelectorAll('#views>div').forEach(d=>d.style.display='none');$(id).style.display='block'}" +
                      "function loadDevs(){fetch('/api/list?t='+Date.now()).then(r=>r.json()).then(d=>{devs=d;let h='';d.forEach((x,i)=>{h+=`<div class='dev-card' onclick='openDev(${i})'><div><b>${x.name}</b><br><small>${x.brand} | ${x.cate}</small></div><b>&gt;</b></div>`});$('dev_list').innerHTML=h||'<p style=\\\"text-align:center;padding:40px;color:#999\\\">还没有设备<br>点击右上角添加</p>'})}" +
                      "function goHome(){loadDevs();view('v_home');}" +
                      "function goAdd(){view('v_add');fetch('/api/proxy?p=/irext-server/indexing/list_categories&b=\\\"from\\\":\\\"0\\\",\\\"count\\\":\\\"100\\\"').then(r=>r.json()).then(d=>{cs=d;$('sc').innerHTML='<option>选择类型</option>'+d.map((c,i)=>'<option value='+i+'>'+(c.name_cn||c.name)+'</option>')})}" +
                      "function lb(){fetch('/api/proxy?p=/irext-server/indexing/list_brands&b=\\\"categoryId\\\":\\\"'+(cs[$('sc').value].id||cs[$('sc').value].categoryId)+'\\\",\\\"from\\\":\\\"0\\\",\\\"count\\\":\\\"500\\\"').then(r=>r.json()).then(d=>{bs=d;$('sb').innerHTML='<option>选择品牌</option>'+d.map((b,i)=>'<option value='+i+'>'+(b.name_cn||b.name)+'</option>')})}" +
                      "function startMatch(){fetch('/api/proxy?p=/irext-server/indexing/list_indexes&b=\\\"categoryId\\\":\\\"'+(cs[$('sc').value].id||cs[$('sc').value].categoryId)+'\\\",\\\"brandId\\\":\\\"'+(bs[$('sb').value].id||bs[$('sb').value].brandId)+'\\\",\\\"cityCode\\\":\\\"\\\",\\\"from\\\":\\\"0\\\",\\\"count\\\":\\\"500\\\"').then(r=>r.json()).then(d=>{is=d;curr=0;tvDec={};view('v_match');$('midx').innerText=1;$('mtotal').innerText=is.length;let c=cs[$('sc').value];if((c.name_cn||c.name).includes('电视')||(c.name_cn||c.name).includes('机顶盒')||(c.name_cn||c.name).includes('投影')||(c.name_cn||c.name).includes('盒子'))bgLoop()})}" +
                      "async function bgLoop(){for(let i=0;i<is.length;i++){if(!tvDec[i]){await fetch('/api/batch_decode?indexId='+is[i].id+'&type=stb&cat=3&subCate='+(is[i].subCate||1));tvDec[i]=true;if($('bg_prog'))$('bg_prog').innerText=`后台解码: ${Object.keys(tvDec).length}/${is.length}`;}}}" +
                      "function showMatchLog(){let logDiv=$('match_log');let card=$('match_log_card');if(!logDiv||!card)return;fetch('/api/raw_logs').then(r=>r.json()).then(logs=>{if(logs.length>0){card.style.display='block';let latest=logs[0];let html=`<div class='match-log-entry'><div style='display:flex;justify-content:space-between;margin-bottom:5px'><b>${latest.device}</b><span style='color:#1890ff'>${latest.key}</span></div><div style='color:#666;font-size:10px;margin-bottom:5px'>${latest.source} | ${latest.timings.length}个时长 | ${latest.time}</div><div style='background:#fff;padding:8px;border-radius:4px;border:1px solid #e9ecef;max-height:200px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;font-size:10px;line-height:1.4'>${latest.timings.join(', ')}</div></div>`;logDiv.innerHTML=html;}})}" +
                      "function testPwr(){let c=cs[$('sc').value];let k=(c.name_cn||c.name)=='空调'?0:'电源';fire(k,is[curr],c);setTimeout(showMatchLog,500)}" +
                      "function next(){if(curr<is.length-1){curr++;$('midx').innerText=curr+1;testPwr()}else{alert('试完了')}}" +
                      "function preSave(){view('v_save');let c=$('sc').value,b=bs[$('sb').value];$('d_name').value=(b.name_cn||b.name||'')+' '+(c.name_cn||c.name||'')}" +
                      "function doSave(){let d={name:$('d_name').value,cate:cs[$('sc').value].name_cn||cs[$('sc').value].name,brand:bs[$('sb').value].name_cn||bs[$('sb').value].name,idx:is[curr],cid:cs[$('sc').value].id||cs[$('sc').value].categoryId};fetch('/api/save',{method:'POST',body:JSON.stringify(d)}).then(()=>{goHome()})}" +
                      "function openDev(i){curDev=devs[i];curIdx=i;view('v_ctrl');$('c_title').innerText=curDev.name;renderPanel()}" +
                      "function delDev(){if(confirm('确定要删除 '+curDev.name+' 吗？')){fetch('/api/delete?i='+curIdx).then(r=>r.json()).then(d=>{if(d.ok){alert('删除成功');goHome()}else{alert('删除失败')}})}}" +
                      "function goCtrl(){view('v_ctrl')}" +
                      "function renderPanel(){let n=curDev.cate,m=kmaps[n]||kmaps['电视机'];let h='';Object.keys(m).forEach(k=>{h+=`<button onclick='fireTx(\\\"${m[k]}\\\")' class='btn'>${m[k]}</button>`});$('btns').innerHTML=h;if(n=='电视机'||n=='机顶盒'||n=='投影仪'||n=='盒子'){let nh='';for(let i=0;i<=9;i++){nh+=`<button class='btn' onclick='fireTx(\\\"${i}\\\")'>${i}</button>`}$('num_btns').innerHTML=nh;$('num_btns').style.display='grid'}else{$('num_btns').style.display='none'}if(n=='空调'){updateAcUI();$('ac_st').style.display='block'}else{$('ac_st').style.display='none'}}" +
                      "function updateAcUI(){$('ac_st').innerText=(ac.p?'ON':'OFF')+' | '+['冷','热','自动','风','除湿'][ac.m]+' | '+(ac.t+16)+'°C'}" +
                      "function showHA(){view('v_ha');let u=location.origin,id=curDev.idx.id||curDev.idx.indexId,sn='ir_'+id;let code='';if(curDev.cate.includes('空调')){code='input_select:\\n  '+sn+'_mode:\\n    options: [\\'off\\',\\'cool\\',\\'heat\\',\\'auto\\',\\'fan_only\\']\\ninput_number:\\n  '+sn+'_temp:\\n    min: 16\\n    max: 30\\n    step: 1\\nrest_command:\\n  '+sn+'_set:\\n    url: \"'+u+'/api/tx?id='+id+'&cat=1&k={{k}}&p={{p}}&m={{m}}&t={{t}}\"\\ntemplate:\\n  - climate:\\n      name: \"'+curDev.name+'\"\\n      unique_id: '+sn+'_climate\\n      hvac_modes: [\\'off\\',\\'cool\\',\\'heat\\',\\'auto\\',\\'fan_only\\']\\n      min_temp: 16\\n      max_temp: 30\\n      target_temperature_step: 1';}else{code='rest_command:\\n  '+sn+'_cmd: { url: \"'+u+'/api/tx?id='+id+'&cat='+curDev.cid+'&k={{k}}\" }\\nswitch:\\n  - platform: template\\n    switches:\\n      '+sn+':\\n        friendly_name: \"'+curDev.name+'\"\\n        turn_on: { service: rest_command.'+sn+'_cmd, data: {k: \\'电源\\'} }\\n        turn_off: { service: rest_command.'+sn+'_cmd, data: {k: \\'电源\\'} }';}$('ha_code').value=code;}" +
                      "function showRaw(){view('v_raw');fetch('/api/raw_logs').then(r=>r.json()).then(logs=>{let h='';if(logs.length===0){h='<p style=\\\"text-align:center;color:#999;padding:40px\\\">暂无记录<br>请先操作设备发射红外码</p>'}else{logs.forEach(log=>{let timingsStr=log.timings.join(', ');h+=`<div class='log-full'><div class='log-header'><span class='log-time'>${log.time}</span><span class='log-source'>${log.source}</span></div><div class='log-device'>${log.device} <span class='log-key'>${log.key}</span></div><div style='color:#666;margin-top:5px'>载波频率: ${log.carrier}Hz | 时长数量: ${log.timings.length}个</div><div class='log-timings'>${timingsStr}</div></div>`;});}$('raw_list').innerHTML=h;});}" +
                      "function clearRaw(){if(confirm('确定清空所有记录？')){fetch('/api/raw_logs/clear').then(()=>showRaw())}}" +
                      "function fireTx(k){fire(k, curDev.idx, curDev.cid)}" +
                      "function fire(k, idx, cat){let cid=typeof cat==='object'?cat.id||cat.categoryId:parseInt(cat);let sc=idx.subCate!==undefined?idx.subCate:1;if(cid==1){if(k=='电源')ac.p=1-ac.p;if(k=='模式')ac.m=(ac.m+1)%5;if(k=='温度+')ac.t=Math.min(14,ac.t+1);if(k=='温度-')ac.t=Math.max(0,ac.t-1);updateAcUI()}fetch(`/api/tx?id=${idx.id||idx.indexId}&cat=${cid}&k=${encodeURIComponent(k)}&subCate=${sc}`).then(r=>r.text()).then(()=>{if($('v_match')&&$('v_match').style.display==='block')setTimeout(showMatchLog,300)})}" +
                      "goHome();</script></body></html>";
              }
              @Override public IBinder onBind(Intent intent) { return null; }
          }
          EOF
      - name: 4. 编写主控台 UI (APP内显示设备+直接操作)
        run: |
          cat <<'EOF' > app/src/main/java/hap/re00660/re/MainActivity.java
          package hap.re00660.re;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.*;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.view.*;
          import android.webkit.*;
          import android.widget.*;
          import com.google.gson.*;
          import java.net.*;
          import java.util.*;
          import java.io.*;
          
          public class MainActivity extends Activity {
              private SharedPreferences db, cfg;
              private LinearLayout deviceListContainer;
              private ScrollView deviceListScroll;
              private WebView webView;
              private EditText ipInput, decoderInput;
              private RadioGroup cloudGroup;
              private TextView statusText;
              private Button btnBattery;
              private boolean isWeb = false;
              private BroadcastReceiver statusReceiver;
              private JsonArray devices = new JsonArray();
              private int screenWidth;
              private int basePadding;
              private int cardPadding;
              private int smallMargin;
              private final String[][] KEY_MAPS = {
                  {"电源","模式","温度+","温度-","风力","扫风","固定风"},
                  {"电源","静音","上","下","左","右","确认","音量+","音量-","返回","信号源","菜单","主页","设置"},
                  {"电源","静音","上","下","左","右","确认","音量+","音量-","返回","信号源","菜单","上一页","下一页"},
                  null, null, null, null,
                  {"电源","上","下","左","右","确认","风力+","风力-","摇头","风力","风类","返回"},
                  null,
                  {"电源","静音","上","下","左","右","确认","音量+","音量-","返回","信号源","菜单","主页","设置"}
              };
              
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  db = getSharedPreferences("IREXT_DB", MODE_PRIVATE);
                  cfg = getSharedPreferences("IREXT_CFG", MODE_PRIVATE);
                      // 🌟 获取屏幕尺寸，计算自适应padding
                  android.util.DisplayMetrics dm = new android.util.DisplayMetrics();
                  getWindowManager().getDefaultDisplay().getMetrics(dm);
                  screenWidth = dm.widthPixels;
                  basePadding = Math.max(20, screenWidth / 36);
                  cardPadding = Math.max(16, screenWidth / 45);
                  smallMargin = Math.max(12, screenWidth / 60);
                  statusReceiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          boolean running = intent.getBooleanExtra("running", false);
                          int port = intent.getIntExtra("port", 8080);
                          updateStatus(running, port);
                      }
                  };
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                      registerReceiver(statusReceiver, new IntentFilter("hap.re00660.re.SERVICE_STATUS"),
                      Context.RECEIVER_NOT_EXPORTED);
                 }  else {
                      registerReceiver(statusReceiver, new IntentFilter("hap.re00660.re.SERVICE_STATUS"));
                 }
                  
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.parseColor("#F1F5F9"));
                  
                  LinearLayout main = new LinearLayout(this);
                  main.setOrientation(LinearLayout.VERTICAL);
                  main.setPadding(basePadding, basePadding, basePadding, basePadding);  // ← 改用动态值
                  
                  TextView title = new TextView(this); 
                  title.setText("📡 ha红外网关 Pro V3"); 
                  title.setTextSize(24);
                  title.setTextColor(Color.parseColor("#1e293b"));
                  main.addView(title);
                  
                  statusText = new TextView(this);
                  statusText.setText("\n🔴 服务未运行");
                  statusText.setTextColor(Color.parseColor("#ef4444"));
                  statusText.setTextSize(16);
                  main.addView(statusText);
                  
                  TextView myIp = new TextView(this);
                  myIp.setText("访问地址: http://" + getLocalIp() + ":8080");
                  myIp.setTextColor(Color.parseColor("#2563EB")); 
                  myIp.setPadding(0, 10, 0, 10);
                  main.addView(myIp);
                  
                  // 🔋 电池白名单按钮
                  btnBattery = new Button(this);
                  btnBattery.setText("🔋 申请电池优化白名单");
                  btnBattery.setBackgroundColor(Color.parseColor("#f59e0b"));
                  btnBattery.setTextColor(Color.WHITE);
                  btnBattery.setOnClickListener(v -> requestBatteryWhitelist());
                  main.addView(btnBattery);
                  
                  LinearLayout settingsPanel = new LinearLayout(this);
                  settingsPanel.setOrientation(LinearLayout.VERTICAL);
                  settingsPanel.setBackgroundColor(Color.parseColor("#ffffff"));
                  settingsPanel.setPadding(30, 30, 30, 30);
                  
                  TextView settingsTitle = new TextView(this);
                  settingsTitle.setText("⚙️ 服务器设置");
                  settingsTitle.setTextSize(18);
                  settingsTitle.setTextColor(Color.parseColor("#334155"));
                  settingsPanel.addView(settingsTitle);
                  
                  cloudGroup = new RadioGroup(this);
                  cloudGroup.setOrientation(LinearLayout.HORIZONTAL);
                  RadioButton rbPublic = new RadioButton(this); 
                  rbPublic.setText("公有云");
                  RadioButton rbPrivate = new RadioButton(this); 
                  rbPrivate.setText("私有云");
                  cloudGroup.addView(rbPublic); 
                  cloudGroup.addView(rbPrivate);
                  settingsPanel.addView(cloudGroup);
                  
                  ipInput = new EditText(this); 
                  ipInput.setHint("Docker IP:8081 (如: http://192.168.1.100:8081)");
                  ipInput.setText(cfg.getString("docker_ip", "http://192.168.2.157:8081"));
                  settingsPanel.addView(ipInput);
                  
                  TextView localLabel = new TextView(this); 
                  localLabel.setText("🖥️ 本地解码器 (8082):");
                  localLabel.setPadding(0, 20, 0, 10);
                  settingsPanel.addView(localLabel);
                  
                  decoderInput = new EditText(this);
                  decoderInput.setHint("本地解码器地址");
                  decoderInput.setText(cfg.getString("local_decoder", "http://192.168.1.100:8082"));
                  settingsPanel.addView(decoderInput);
                  
                  boolean isPublic = cfg.getBoolean("is_public_cloud", false);
                  rbPublic.setChecked(isPublic); 
                  rbPrivate.setChecked(!isPublic);
                  ipInput.setVisibility(isPublic ? View.GONE : View.VISIBLE);
                  cloudGroup.setOnCheckedChangeListener((group, checkedId) -> {
                      ipInput.setVisibility(checkedId == rbPublic.getId() ? View.GONE : View.VISIBLE);
                  });
                  
                  Switch swAuto = new Switch(this); 
                  swAuto.setText("允许开机自启");
                  swAuto.setChecked(cfg.getBoolean("auto_start", true)); 
                  settingsPanel.addView(swAuto);
                  
                  Switch swAudio = new Switch(this); 
                  swAudio.setText("强制使用音频发射(耳机孔红外)");
                  swAudio.setChecked(cfg.getBoolean("force_audio", false)); 
                  settingsPanel.addView(swAudio);
                  
                  LinearLayout btnRow = new LinearLayout(this);
                  btnRow.setOrientation(LinearLayout.HORIZONTAL);
                  
                  Button start = new Button(this); 
                  start.setText("🚀 启动服务");
                  start.setBackgroundColor(Color.parseColor("#1890ff")); 
                  start.setTextColor(Color.WHITE);
                  start.setLayoutParams(new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1));
                  start.setOnClickListener(v -> {
                      boolean usePublic = rbPublic.isChecked();
                      cfg.edit()
                         .putString("docker_ip", ipInput.getText().toString())
                         .putString("local_decoder", decoderInput.getText().toString())
                         .putBoolean("is_public_cloud", usePublic)
                         .putBoolean("auto_start", swAuto.isChecked())
                         .putBoolean("force_audio", swAudio.isChecked())
                         .apply();
                         
                      Intent i = new Intent(this, IRService.class);
                      i.putExtra("CLOUD_URL", usePublic ? "https://srv.irext.net" : ipInput.getText().toString());
                      i.putExtra("LOCAL_DECODER_URL", decoderInput.getText().toString());
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(i);
                      } else {
                          startService(i);
                      }
                      Toast.makeText(this, "服务启动中...", Toast.LENGTH_SHORT).show();
                      checkServiceStatus();
                  });
                  btnRow.addView(start);
                  
                  Button stopBtn = new Button(this);
                  stopBtn.setText("⏹️ 停止");
                  stopBtn.setBackgroundColor(Color.parseColor("#6b7280"));
                  stopBtn.setTextColor(Color.WHITE);
                  stopBtn.setLayoutParams(new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1));
                  stopBtn.setOnClickListener(v -> {
                      stopService(new Intent(this, IRService.class));
                      Toast.makeText(this, "服务已停止", Toast.LENGTH_SHORT).show();
                      checkServiceStatus();
                  });
                  btnRow.addView(stopBtn);
                  settingsPanel.addView(btnRow);
                  
                  // 🔥 Root面具按钮
                  Button btnMagisk = new Button(this);
                  btnMagisk.setText("🔥 授予Root并部署面具底层守护");
                  btnMagisk.setBackgroundColor(Color.parseColor("#ef4444"));
                  btnMagisk.setTextColor(Color.WHITE);
                  btnMagisk.setOnClickListener(v -> deployMagiskModule());
                  settingsPanel.addView(btnMagisk);
                  
                  Button btnWeb = new Button(this);
                  btnWeb.setText("🌐 打开Web管理面板(添加设备)");
                  btnWeb.setBackgroundColor(Color.parseColor("#52c41a"));
                  btnWeb.setTextColor(Color.WHITE);
                  btnWeb.setOnClickListener(v -> openWeb());
                  settingsPanel.addView(btnWeb);
                  
                  main.addView(settingsPanel);
                  
                  // 设备列表区域
                  TextView devTitle = new TextView(this); 
                  devTitle.setText("\n📱 已保存的设备 (点击操作)");
                  devTitle.setTextSize(18);
                  devTitle.setTextColor(Color.parseColor("#334155"));
                  devTitle.setPadding(0, 30, 0, 20);
                  main.addView(devTitle);
                  
                  deviceListScroll = new ScrollView(this);
                  deviceListContainer = new LinearLayout(this); 
                  deviceListContainer.setOrientation(LinearLayout.VERTICAL);
                  deviceListScroll.addView(deviceListContainer); 
                  main.addView(deviceListScroll);
                  
                  root.addView(main);
                  
                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setVisibility(View.GONE);
                  root.addView(webView);
                  
                  setContentView(root);
                  refreshDeviceList();
                  checkServiceStatus();
              }
              
               private void refreshDeviceList() {
                  deviceListContainer.removeAllViews();
                  try {
                      SharedPreferences pref = getSharedPreferences("IREXT_DATABASE", MODE_PRIVATE);
                      String devsStr = pref.getString("devs", "[]");
                      
                      if(devsStr == null || devsStr.trim().isEmpty()) {
                          devsStr = "[]";
                      }
                      
                      devices = JsonParser.parseString(devsStr).getAsJsonArray();
                      
                      if(devices.size() == 0) {
                          TextView empty = new TextView(this);
                          empty.setText("暂无设备\n请点击上方\"打开Web管理面板\"添加设备");
                          empty.setTextColor(Color.parseColor("#999999"));
                          empty.setGravity(Gravity.CENTER);
                          empty.setPadding(0, 50, 0, 50);
                          deviceListContainer.addView(empty);
                          return;
                      }
                      
                      for(int i=0; i<devices.size(); i++) {
                          JsonObject dev = devices.get(i).getAsJsonObject();
                          String name = dev.get("name").getAsString();
                          String brand = dev.get("brand").getAsString();
                          String cate = dev.get("cate").getAsString();
                          
                          // 🌟 修复：final变量用于lambda
                          final int finalIndex = i;
                          final String finalName = name;
                          
                          LinearLayout card = new LinearLayout(this);
                          card.setOrientation(LinearLayout.VERTICAL);
                          card.setBackgroundColor(Color.WHITE);
                           // 🌟 使用成员变量
                          card.setPadding(cardPadding, cardPadding, cardPadding, cardPadding);
                          LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                          lp.setMargins(0, 0, 0, smallMargin);
                          card.setLayoutParams(lp);
                          TextView tvName = new TextView(this);
                          tvName.setText(name);
                          tvName.setTextSize(18);
                          tvName.setTextColor(Color.parseColor("#1e293b"));
                          tvName.setTypeface(null, android.graphics.Typeface.BOLD);
                          card.addView(tvName);
                          
                          TextView tvInfo = new TextView(this);
                          tvInfo.setText(brand + " | " + cate);
                          tvInfo.setTextColor(Color.parseColor("#64748b"));
                          tvInfo.setPadding(0, 5, 0, 15);
                          card.addView(tvInfo);
                          
                          GridLayout grid = new GridLayout(this);
                          grid.setColumnCount(3);
                          
                          int catId = dev.get("cid").getAsInt();
                          String[] keys = getKeysForCategory(catId, cate);
                          
                          for(String key : keys) {
                              Button btn = new Button(this);
                              btn.setText(key);
                              btn.setTextSize(12);
                              btn.setPadding(5, 10, 5, 10);
                              btn.setBackgroundColor(Color.parseColor("#eff6ff"));
                              btn.setTextColor(Color.parseColor("#1d4ed8"));
                              
                              final String k = key;
                              btn.setOnClickListener(v -> sendCommand(finalIndex, k));
                              
                              GridLayout.LayoutParams glp = new GridLayout.LayoutParams();
                              glp.width = 0;
                              glp.height = ViewGroup.LayoutParams.WRAP_CONTENT;
                              glp.columnSpec = GridLayout.spec(GridLayout.UNDEFINED, 1f);
                              glp.setMargins(5, 5, 5, 5);
                              btn.setLayoutParams(glp);
                              
                              grid.addView(btn);
                          }
                          
                          Button btnDel = new Button(this);
                          btnDel.setText("🗑️ 删除");
                          btnDel.setTextSize(12);
                          btnDel.setBackgroundColor(Color.parseColor("#fee2e2"));
                          btnDel.setTextColor(Color.parseColor("#dc2626"));
                          btnDel.setOnClickListener(v -> confirmDelete(finalIndex, finalName));
                          GridLayout.LayoutParams glp = new GridLayout.LayoutParams();
                          glp.width = 0;
                          glp.height = ViewGroup.LayoutParams.WRAP_CONTENT;
                          glp.columnSpec = GridLayout.spec(GridLayout.UNDEFINED, 1f);
                          glp.setMargins(5, 5, 5, 5);
                          btnDel.setLayoutParams(glp);
                          grid.addView(btnDel);
                          
                          card.addView(grid);
                          deviceListContainer.addView(card);
                      }
                  } catch(Exception e) {
                      e.printStackTrace();
                      // 🌟 修复：异常时显示无设备，不闪退
                      TextView empty = new TextView(this);
                      empty.setText("暂无设备\n请点击上方\"打开Web管理面板\"添加设备");
                      empty.setTextColor(Color.parseColor("#999999"));
                      empty.setGravity(Gravity.CENTER);
                      empty.setPadding(0, 50, 0, 50);
                      deviceListContainer.addView(empty);
                  }
              }
              private String[] getKeysForCategory(int catId, String cateName) {
                  if(catId >= 1 && catId <= 8 && KEY_MAPS[catId-1] != null) {
                      return KEY_MAPS[catId-1];
                  }
                  return new String[]{"电源","上","下","左","右","确认","音量+","音量-","返回","菜单"};
              }
              
              private void sendCommand(int deviceIndex, String key) {
                  try {
                      JsonObject dev = devices.get(deviceIndex).getAsJsonObject();
                      JsonObject idx = dev.getAsJsonObject("idx");
                      String id = idx.get("id").getAsString();
                      int cid = dev.get("cid").getAsInt();
                      
                      new Thread(() -> {
                          try {
                              String url = "http://127.0.0.1:8080/api/tx?id=" + id + "&cat=" + cid + "&k=" + URLEncoder.encode(key, "UTF-8") + "&subCate=" + (dev.getAsJsonObject("idx").has("subCate") ? dev.getAsJsonObject("idx").get("subCate").getAsInt() : 1);
                              HttpURLConnection conn = (HttpURLConnection) new URL(url).openConnection();
                              conn.setConnectTimeout(5000);
                              conn.setRequestMethod("GET");
                              int code = conn.getResponseCode();
                              runOnUiThread(() -> {
                                  if(code == 200) {
                                      Toast.makeText(this, "已发送: " + key, Toast.LENGTH_SHORT).show();
                                  } else {
                                      Toast.makeText(this, "发送失败", Toast.LENGTH_SHORT).show();
                                  }
                              });
                          } catch(Exception e) {
                              runOnUiThread(() -> Toast.makeText(this, "错误: " + e.getMessage(), Toast.LENGTH_SHORT).show());
                          }
                      }).start();
                  } catch(Exception e) {
                      Toast.makeText(this, "错误", Toast.LENGTH_SHORT).show();
                  }
              }
              
              private void confirmDelete(int index, String name) {
                  new AlertDialog.Builder(this)
                      .setTitle("删除设备")
                      .setMessage("确定要删除 \"" + name + "\" 吗？")
                      .setPositiveButton("删除", (dialog, which) -> deleteDevice(index))
                      .setNegativeButton("取消", null)
                      .show();
              }
              
              private void deleteDevice(int index) {
                  new Thread(() -> {
                      try {
                          String url = "http://127.0.0.1:8080/api/delete?i=" + index;
                          HttpURLConnection conn = (HttpURLConnection) new URL(url).openConnection();
                          conn.setConnectTimeout(5000);
                          conn.setRequestMethod("GET");
                          int code = conn.getResponseCode();
                          if(code == 200) {
                              runOnUiThread(() -> {
                                  Toast.makeText(this, "已删除", Toast.LENGTH_SHORT).show();
                                  refreshDeviceList();
                              });
                          }
                      } catch(Exception e) {
                          runOnUiThread(() -> Toast.makeText(this, "删除失败", Toast.LENGTH_SHORT).show());
                      }
                  }).start();
              }
              
              // 🔋 电池白名单
              private void requestBatteryWhitelist() {
                  if(Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      if(pm.isIgnoringBatteryOptimizations(getPackageName())) {
                          Toast.makeText(this, "已在白名单中", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      Intent intent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                      intent.setData(Uri.parse("package:" + getPackageName()));
                      startActivity(intent);
                  } else {
                      Toast.makeText(this, "Android 6.0以下无需申请", Toast.LENGTH_SHORT).show();
                  }
              }
              
              // 🔥 Root面具部署
              private void deployMagiskModule() {
                  new Thread(() -> {
                      try {
                          Process p = Runtime.getRuntime().exec("su");
                          DataOutputStream os = new DataOutputStream(p.getOutputStream());
                          String apkPath = getApplicationInfo().sourceDir;
                          String script = "MOD=\"/data/adb/modules/irext_daemon\"\nrm -rf $MOD\nmkdir -p $MOD/system/priv-app/IRGateway\ncp \"" + apkPath + "\" $MOD/system/priv-app/IRGateway/IRGateway.apk\necho 'id=irext_daemon\nname=HA红外特权守护\nversion=vMax\nversionCode=99\nauthor=极客\ndescription=免疫一切杀后台。' > $MOD/module.prop\necho '#!/system/bin/sh\nuntil [ \"$(getprop sys.boot_completed)\" = \"1\" ]; do sleep 1; done\nsleep 3\ndumpsys deviceidle whitelist +hap.re00660.re\nam start-foreground-service -n hap.re00660.re/.IRService' > $MOD/service.sh\nchmod 755 $MOD/service.sh\nexit\n";
                          os.writeBytes(script); os.flush(); p.waitFor();
                          runOnUiThread(() -> Toast.makeText(this, "部署完成，请重启手机！", Toast.LENGTH_LONG).show());
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(this, "无 Root 权限！", Toast.LENGTH_SHORT).show());
                      }
                  }).start();
              }
              
              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  if(statusReceiver != null) unregisterReceiver(statusReceiver);
              }
              
              private void updateStatus(boolean running, int port) {
                  runOnUiThread(() -> {
                      if(running) {
                          statusText.setText("\n🟢 服务运行中 (端口:" + port + ")");
                          statusText.setTextColor(Color.parseColor("#22c55e"));
                      } else {
                          statusText.setText("\n🔴 服务未运行");
                          statusText.setTextColor(Color.parseColor("#ef4444"));
                      }
                  });
              }
              
              private void checkServiceStatus() {
                  new Thread(() -> {
                      try {
                          URL url = new URL("http://127.0.0.1:8080/api/status");
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setConnectTimeout(1000);
                          conn.setRequestMethod("GET");
                          int code = conn.getResponseCode();
                          if(code == 200) {
                              BufferedReader br = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                              String line = br.readLine();
                              JsonObject obj = JsonParser.parseString(line).getAsJsonObject();
                              updateStatus(obj.get("running").getAsBoolean(), obj.get("port").getAsInt());
                          } else {
                              updateStatus(false, 8080);
                          }
                      } catch(Exception e) {
                          updateStatus(false, 8080);
                      }
                  }).start();
              }
              
              private void openWeb() {
                  isWeb = true; 
                  webView.setVisibility(View.VISIBLE);
                  webView.loadUrl("http://127.0.0.1:8080");
              }
              
              @Override
              public void onBackPressed() {
                  if(isWeb) { 
                      if(webView.canGoBack()) {
                          webView.goBack();
                      } else {
                          isWeb = false; 
                          webView.setVisibility(View.GONE); 
                          refreshDeviceList(); 
                      }
                  } else {
                      super.onBackPressed();
                  }
              }
              
              @Override
              protected void onResume() {
                  super.onResume();
                  refreshDeviceList();
                  checkServiceStatus();
              }
              
              private String getLocalIp() {
                  try {
                      for (NetworkInterface n : Collections.list(NetworkInterface.getNetworkInterfaces())) {
                          for (InetAddress a : Collections.list(n.getInetAddresses())) {
                              if (!a.isLoopbackAddress() && a instanceof Inet4Address) return a.getHostAddress();
                          }
                      }
                  } catch (Exception e) {}
                  return "127.0.0.1";
              }
          }
