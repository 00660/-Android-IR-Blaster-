name: IREXT_PRO_ULTIMATE_GOD_MODE

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 代码初始化
        run: |
          rm -rf *
          mkdir -p app/src/main/java/hap/re00660/re
          echo "✅ 初始化完成"

      - name: 2. 编写核心服务 (🌟精准匹配 Docker 1.5.2 变态协议)
        run: |
          cat <<'EOF' > app/src/main/java/hap/re00660/re/IRService.java
          package hap.re00660.re;
          import android.app.*;
          import android.content.*;
          import android.hardware.ConsumerIrManager;
          import android.media.*;
          import android.os.Build;
          import android.os.IBinder;
          import fi.iki.elonen.NanoHTTPD;
          import java.io.*;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.*;
          import com.google.gson.*;

          public class IRService extends Service {
              private ConsumerIrManager ir;
              private SharedPreferences db, cfg;
              private String targetCloudUrl = "";
              private String apiId = "", apiToken = "";

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if(intent != null && intent.getStringExtra("DOCKER_URL") != null) {
                      targetCloudUrl = intent.getStringExtra("DOCKER_URL");
                      loginPrivateCloud();
                  }
                  return START_STICKY;
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  db = getSharedPreferences("IREXT_DATABASE", MODE_PRIVATE);
                  cfg = getSharedPreferences("IREXT_CFG", MODE_PRIVATE);
                  
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel("IR_PRO", "红外网关核心服务", NotificationManager.IMPORTANCE_HIGH);
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) nm.createNotificationChannel(ch);
                      Notification n = new Notification.Builder(this, "IR_PRO")
                          .setContentTitle("📡 HA红外网关 - 运行中")
                          .setContentText("已适配 Docker 1.5.2 变态协议")
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setOngoing(true).build();
                      startForeground(1, n);
                  }
                  try { ir = (ConsumerIrManager) getSystemService(CONSUMER_IR_SERVICE); } catch(Throwable t) {}
                  try { new WebServer(8080).start(); } catch (Exception e) { }
              }

              private void transmitAudioHeadset(int[] pattern, int freq) {
                  int sampleRate = 48000;
                  int carrier = freq / 2;
                  int total = 0; for (int p : pattern) total += p;
                  short[] buffer = new short[(int)((total/1000000.0)*sampleRate)*2];
                  int frameIndex = 0; boolean mark = true;
                  boolean isolate = cfg.getBoolean("isolate_tts", false);
                  for (int d : pattern) {
                      int c = (int)((d / 1000000.0) * sampleRate);
                      for (int i=0; i<c; i++) {
                          if (mark && frameIndex * 2 + 1 < buffer.length) {
                              double t = frameIndex / (double)sampleRate;
                              short v = (short)(Math.sin(2 * Math.PI * carrier * t) * 32767);
                              if(isolate){ buffer[frameIndex * 2] = 0; buffer[frameIndex * 2 + 1] = v; }
                              else { buffer[frameIndex * 2] = v; buffer[frameIndex * 2 + 1] = (short)-v; }
                          }
                          frameIndex++;
                      }
                      mark = !mark;
                  }
                  try {
                      AudioTrack track = new AudioTrack(AudioManager.STREAM_MUSIC, sampleRate, AudioFormat.CHANNEL_OUT_STEREO, AudioFormat.ENCODING_PCM_16BIT, buffer.length * 2, AudioTrack.MODE_STATIC);
                      track.write(buffer, 0, buffer.length); track.play();
                  } catch (Exception e) {}
              }

              private String postJSON(String path, String jsonBody) {
                  HttpURLConnection conn = null;
                  try {
                      URL url = new URL(targetCloudUrl + path);
                      conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod("POST");
                      conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                      conn.setConnectTimeout(3000); conn.setDoOutput(true);
                      try(OutputStream os = conn.getOutputStream()) { os.write(jsonBody.getBytes(StandardCharsets.UTF_8)); }
                      InputStream is = conn.getResponseCode() >= 400 ? conn.getErrorStream() : conn.getInputStream();
                      if (is == null) return "{}";
                      try(BufferedReader br = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8))) {
                          StringBuilder sb = new StringBuilder(); String line;
                          while((line = br.readLine()) != null) sb.append(line);
                          return sb.toString();
                      }
                  } catch (Exception e) { return "{}"; }
                  finally { if(conn!=null) conn.disconnect(); }
              }

              private void loginPrivateCloud() {
                  new Thread(() -> {
                      String res = postJSON("/irext-server/app/app_login", "{\"appKey\":\"55b1d89fda0658d6f851ee89cad564de\",\"appSecret\":\"83dfd86ad59843ce50342ec863a49bf0\",\"appType\":\"2\"}");
                      try {
                          JsonObject entity = JsonParser.parseString(res).getAsJsonObject().getAsJsonObject("entity");
                          apiId = entity.get("id").getAsString(); apiToken = entity.get("token").getAsString();
                      } catch (Exception e) { }
                  }).start();
              }

              private class WebServer extends NanoHTTPD {
                  public WebServer(int port) { super(port); }
                  @Override
                  public Response serve(IHTTPSession session) {
                      String uri = session.getUri();
                      Map<String, String> p = session.getParms();
                      try {
                          if ("/api/list".equals(uri)) return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", db.getString("devs", "[]"));
                          if ("/api/save".equals(uri)) {
                              int len = Integer.parseInt(session.getHeaders().get("content-length"));
                              byte[] buf = new byte[len]; session.getInputStream().read(buf, 0, len);
                              db.edit().putString("devs", db.getString("devs", "[]")).apply(); // 先占位
                              JsonArray list = JsonParser.parseString(db.getString("devs", "[]")).getAsJsonArray();
                              list.add(JsonParser.parseString(new String(buf, StandardCharsets.UTF_8)));
                              db.edit().putString("devs", list.toString()).commit();
                              return newFixedLengthResponse("OK");
                          }
                          if ("/api/delete".equals(uri)) {
                              JsonArray list = JsonParser.parseString(db.getString("devs", "[]")).getAsJsonArray();
                              JsonArray newList = new JsonArray();
                              int idx = Integer.parseInt(p.get("i"));
                              for(int i=0; i<list.size(); i++) if(i != idx) newList.add(list.get(i));
                              db.edit().putString("devs", newList.toString()).commit();
                              return newFixedLengthResponse("OK");
                          }
                          if ("/api/tx".equals(uri)) {
                              JsonObject req = new JsonObject();
                              // 🌟 修正：全部转 String，带双引号
                              req.addProperty("id", String.valueOf(apiId));
                              req.addProperty("token", apiToken);
                              req.addProperty("indexId", String.valueOf(p.get("id")));
                              req.addProperty("keyCode", String.valueOf(p.get("k")));
                              req.addProperty("directDecode", "0");
                              req.addProperty("paraData", "0");
                              
                              // 🌟 核心修正：不管是电视还是空调，全部发送 acStatus！
                              // 电视会忽略内容，但 Docker 不会再报 code:1
                              JsonObject ac = new JsonObject();
                              if ("1".equals(p.get("c"))) { // 真实空调状态
                                  ac.addProperty("acPower", "1".equals(p.get("p"))?"0":"1"); // 0=开, 1=关
                                  ac.addProperty("acMode", p.get("m"));
                                  ac.addProperty("acTemp", p.get("t"));
                              } else { // 假空调状态（欺骗电视解码接口）
                                  ac.addProperty("acPower", "0"); ac.addProperty("acMode", "0"); ac.addProperty("acTemp", "8");
                              }
                              ac.addProperty("acWindSpeed","0"); ac.addProperty("acWindDir","0"); ac.addProperty("changeWindDir","0");
                              req.add("acStatus", ac);

                              String res = postJSON("/irext-server/operation/decode", req.toString());
                              JsonObject root = JsonParser.parseString(res).getAsJsonObject();
                              if (root.has("entity") && !root.get("entity").isJsonNull()) {
                                  JsonArray arr = root.getAsJsonArray("entity");
                                  int[] pat = new int[arr.size()];
                                  for (int i=0; i<arr.size(); i++) pat[i] = arr.get(i).getAsInt();
                                  
                                  int freq = 38000;
                                  if(root.has("frequency") && "1".equals(root.get("frequency").getAsString())) freq = 56000;

                                  if (ir != null && ir.hasIrEmitter() && !cfg.getBoolean("force_audio", false)) {
                                      ir.transmit(freq, pat);
                                  } else {
                                      transmitAudioHeadset(pat, freq);
                                  }
                                  return newFixedLengthResponse("OK");
                              }
                              return newFixedLengthResponse("Fail:" + res);
                          }
                          if ("/api/proxy".equals(uri)) {
                              String req = "{\"id\":\""+apiId+"\",\"token\":\""+apiToken+"\"," + p.get("b") + "}";
                              String res = postJSON(p.get("p"), req);
                              return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", res);
                          }
                      } catch(Exception e) { return newFixedLengthResponse("ERR"); }

                      // 🌟 网页 UI：包含引导匹配、全量 15 类设备按键映射、返回键、HA 配置生成
                      String html = "<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,user-scalable=no'><title>ha红外网关</title><style>body{font-family:sans-serif;background:#f0f2f5;padding:12px;margin:0 auto;max-width:500px}.card{background:#fff;border-radius:15px;padding:20px;box-shadow:0 4px 10px rgba(0,0,0,.08);margin-bottom:15px}h3{margin:0 0 15px;color:#1890ff;display:flex;justify-content:space-between;align-items:center}.btn-back{font-size:12px;background:#f5f5f5;padding:4px 10px;border-radius:6px;border:1px solid #ddd;cursor:pointer}.btn{display:block;width:100%;padding:14px 0;border:none;border-radius:12px;font-size:14px;font-weight:bold;margin-top:10px;cursor:pointer;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}.btn-p{background:#1890ff;color:#fff;border:none}.btn-g{background:#52c41a;color:#fff;border:none}.btn-r{background:#ff4d4f;color:#fff;border:none}.dev-card{background:#fff;border:1px solid #eee;padding:18px;border-radius:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}select,input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;font-size:16px}#views>div{display:none}#v_home{display:block}.panel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.num-grid{grid-template-columns:repeat(5,1fr);margin-top:15px;border-top:1px dashed #eee;padding-top:15px}textarea{width:100%;height:300px;font-family:monospace;font-size:11px;background:#1e1e1e;color:#98c379;padding:10px;border:1px solid #333;border-radius:8px}</style></head><body>" +
                      "<div id='views'><div id='v_home'><h3>🏠 我的设备 <button class='btn-g' style='width:auto;padding:6px 15px' onclick='goAdd()'>+ 添加</button></h3><div id='dev_list'></div></div>" +
                      "<div id='v_add'><div class='card'><h3><span onclick='goHome()' class='btn-back'>← 返回</span> 1. 选品牌</h3><select id='sc' onchange='checkCate()'></select><div id='brand_area'><select id='sb' onchange='startMatch()'></select></div><div id='stb_area' style='display:none'><select id='sp' onchange='loadProv()'><option>选省份</option></select><select id='sct' onchange='loadCity()'><option>选城市</option></select><select id='sop' onchange='startMatchSTB()'><option>选运营商</option></select></div></div></div>" +
                      "<div id='v_match'><div class='card'><h3><span onclick='view(\"v_add\")' class='btn-back'>← 返回</span> 匹配向导</h3><div style='text-align:center;margin:15px 0'>方案 <b id='midx' style='color:#1890ff;font-size:24px'>1</b> / <span id='mtotal'>0</span></div><button class='btn btn-p' style='height:80px;font-size:18px' onclick='testPwr()'>📡 发送电源测试</button><div class='panel' style='grid-template-columns:1fr 1fr'><button class='btn' onclick='next()'>❌ 无反应</button><button class='btn btn-g' onclick='preSave()'>✅ 有反应</button></div></div></div>" +
                      "<div id='v_save'><div class='card'><h3>💾 取名保存</h3><input id='d_name'><button class='btn btn-g' onclick='doSave()'>确认保存到手机</button></div></div>" +
                      "<div id='v_ctrl'><div class='card'><h3><span id='c_title'></span> <button class='btn-back' onclick='goHome()'>关闭</button></h3><div id='ac_st' style='text-align:center;margin-bottom:15px;color:#666;font-family:monospace'></div><div class='panel' id='btns'></div><div class='panel num-grid' id='num_btns' style='display:none'></div><button class='btn' style='background:#fdf2f2;color:#ef4444;border-color:#fecaca;margin-top:20px' onclick='showHA()'>🛠️ 导出 HA YAML 配置</button><button class='btn btn-r' style='margin-top:10px;opacity:0.3' onclick='delDev()'>删除设备</button></div></div>" +
                      "<div id='v_ha'><div class='card'><h3>HA YAML <span onclick='goCtrl()' class='btn-back'>← 返回</span></h3><textarea id='ha_code' readonly onclick='this.select()'></textarea></div></div></div><script>" +
                      "const kmaps={'空调':{0:'电源',1:'模式',2:'温度+',3:'温度-',9:'风力',10:'扫风',11:'固定风'},'电视机':{0:'电源',1:'静音',2:'上',3:'下',4:'左',5:'右',6:'确认',7:'音量+',8:'音量-',9:'返回',10:'信号源',11:'菜单',12:'主页',13:'设置'},'机顶盒':{0:'电源',1:'静音',2:'上',3:'下',4:'左',5:'右',6:'确认',7:'音量+',8:'音量-',9:'返回',10:'信号源',11:'菜单',12:'上一页',13:'下一页'},'风扇':{0:'电源',1:'上',2:'下',3:'左',4:'右',5:'确认',6:'风+',7:'风-',8:'摇头',9:'风速',10:'风类'},'投影仪':{0:'电源',1:'上',2:'下',3:'左',4:'右',5:'确认',6:'音+',7:'音-',8:'缩小',9:'菜单',10:'放大'},'音响':{0:'电源',1:'上',2:'下',3:'左',4:'右',5:'确认',6:'音+',7:'音-',8:'静音',9:'菜单'},'灯':{0:'电源',1:'色彩1',2:'色彩2',3:'色彩3',4:'色彩4',5:'色彩0',6:'亮+',7:'亮-',8:'开',9:'流光',10:'关'},'扫地机器人':{0:'电源',1:'前',2:'后',3:'左',4:'右',5:'起/停',6:'+',7:'-',8:'自动',9:'定点',10:'速度',11:'定时',12:'回充',13:'预约'},'空气净化器':{0:'电源',1:'上',2:'下',3:'左',4:'右',5:'离子',6:'+',7:'-',8:'自动',9:'风力',10:'模式',11:'定时',12:'灯光',13:'强力'},'相机':{0:'电源',1:'上',2:'下',3:'左',4:'右',5:'拍摄',6:'焦距+',7:'焦距-',8:'照相',9:'录像',10:'定时',11:'闪光',12:'微距',13:'夜景'},'热水器':{0:'电源',1:'温+',2:'温-',3:'定时-',4:'定时+',5:'自动',6:'容积+',7:'容积-',8:'增容',9:'保温',10:'定时',11:'节能',12:'变频',13:'数显'}};const $=i=>document.getElementById(i);let cs=[],bs=[],is=[],curr=0,ac={p:0,m:0,t:8},devs=[],curDev=null,curIdx=-1;let isSTB=false;" +
                      "function view(id){document.querySelectorAll('#views>div').forEach(d=>d.style.display='none');$(id).style.display='block'}" +
                      "function loadDevs(){fetch('/api/list?t='+Date.now()).then(r=>r.json()).then(d=>{devs=d;let h='';d.forEach((x,i)=>{h+=`<div class='dev-card' onclick='openDev(${i})'><div><b>${x.name}</b><br><small>${x.brand} | ${x.cate}</small></div><b>&gt;</b></div>`});$('dev_list').innerHTML=h||'<p style=\"text-align:center\">无设备</p>'})}" +
                      "function goHome(){loadDevs();view('v_home');if(window.Android)Android.refresh()}" +
                      "function goAdd(){view('v_add');fetch('/api/proxy?p=/irext-server/indexing/list_categories&b=\"from\":\"0\",\"count\":\"100\"').then(r=>r.json()).then(res=>{let d=res.entity||[];cs=d;$('sc').innerHTML='<option>选择类型</option>'+d.map((c,i)=>'<option value='+i+'>'+(c.name_cn||c.name)+'</option>')})}" +
                      "function checkCate(){let cid=cs[$('sc').value].id||cs[$('sc').value].categoryId;isSTB=(cid==3);if(isSTB){$('brand_area').style.display='none';$('stb_area').style.display='block';loadProv();}else{$('brand_area').style.display='block';$('stb_area').style.display='none';lb()}}" +
                      "function loadProv(){fetch('/api/proxy?p=/irext-server/indexing/list_provinces&b=\"\"').then(r=>r.json()).then(res=>{let d=res.entity||[];let h='<option>选省份</option>';d.forEach(p=>h+=`<option value='${p.code}'>${p.name}</option>`);$('sp').innerHTML=h})}" +
                      "function loadCity(){fetch(`/api/proxy?p=/irext-server/indexing/list_cities&b=\"provincePrefix\":\"${$('sp').value.substring(0,2)}\"`).then(r=>r.json()).then(res=>{let d=res.entity||[];let h='<option>选城市</option>';d.forEach(c=>h+=`<option value='${c.code}'>${c.name}</option>`);$('sct').innerHTML=h})}" +
                      "function loadOp(){fetch(`/api/proxy?p=/irext-server/indexing/list_operators&b=\"cityCode\":\"${$('sct').value}\",\"from\":\"0\",\"count\":\"100\"`).then(r=>r.json()).then(res=>{let d=res.entity||[];bs=d;let h='<option>选运营商</option>';d.forEach((o,i)=>h+=`<option value='${i}'>${o.operatorName}</option>`);$('sop').innerHTML=h})}" +
                      "function lb(){fetch('/api/proxy?p=/irext-server/indexing/list_brands&b=\"categoryId\":\"'+(cs[$('sc').value].id||cs[$('sc').value].categoryId)+'\",\"from\":\"0\",\"count\":\"500\"').then(r=>r.json()).then(res=>{let d=res.entity||[];bs=d;$('sb').innerHTML='<option>选择品牌</option>'+d.map((b,i)=>'<option value='+i+'>'+(b.name_cn||b.name)+'</option>')})}" +
                      "function startMatch(){fetch('/api/proxy?p=/irext-server/indexing/list_indexes&b=\"categoryId\":\"'+(cs[$('sc').value].id||cs[$('sc').value].categoryId)+'\",\"brandId\":\"'+(bs[$('sb').value].id||bs[$('sb').value].brandId)+'\",\"cityCode\":\"\",\"from\":\"0\",\"count\":\"500\"').then(r=>r.json()).then(res=>{let d=res.entity||[];is=d;curr=0;view('v_match');$('midx').innerText=1;$('mtotal').innerText=is.length})}" +
                      "function startMatchSTB(){let cCode=$('sct').value;let opId=bs[$('sop').value].operatorId;fetch(`/api/proxy?p=/irext-server/indexing/list_indexes&b=\"categoryId\":\"3\",\"brandId\":\"0\",\"cityCode\":\"${cCode}\",\"operatorId\":\"${opId}\",\"from\":\"0\",\"count\":\"500\"`).then(r=>r.json()).then(res=>{let d=res.entity||[];is=d;curr=0;view('v_match');$('midx').innerText=1;$('mtotal').innerText=is.length})}" +
                      "function testPwr(){fire(0,is[curr],cs[$('sc').value])}" +
                      "function next(){if(curr<is.length-1){curr++;$('midx').innerText=curr+1}else{alert('没方案了')}}" +
                      "function preSave(){view('v_save');let c=cs[$('sc').value],b=isSTB?bs[$('sop').value]:bs[$('sb').value];$('d_name').value=(b.name_cn||b.operatorName||b.name||'品牌')+' '+(c.name_cn||c.name||'设备')}" +
                      "function doSave(){let c=cs[$('sc').value],b=isSTB?bs[$('sop').value]:bs[$('sb').value];let d={name:$('d_name').value,cate:c.name_cn||c.name,brand:b.name_cn||b.operatorName||b.name,idx:is[curr],cid:c.id||c.categoryId};fetch('/api/save',{method:'POST',body:JSON.stringify(d)}).then(()=>{goHome()})}" +
                      "function openDev(i){curDev=devs[i];curIdx=i;view('v_ctrl');$('c_title').innerText=curDev.name;renderPanel()}" +
                      "function delDev(){if(confirm('删除?'))fetch('/api/delete?i='+curIdx).then(goHome)}" +
                      "function goCtrl(){view('v_ctrl')}" +
                      "function renderPanel(){let n=curDev.cate;let h='';let m=kmaps[n]||kmaps['电视机'];Object.keys(m).forEach(k=>{h+=`<button onclick='fireTx(${k})' class='btn'>${m[k]}</button>`});$('btns').innerHTML=h;if(n.includes('电视')||n.includes('机顶盒')||n.includes('IPTV')){let nh='';for(let i=0;i<=9;i++){nh+=`<button class='btn' onclick='fireTx(${14+i})'>${i}</button>`}$('num_btns').innerHTML=nh;$('num_btns').style.display='grid'}else{$('num_btns').style.display='none'}if(n=='空调'||curDev.cid==1){updateAcUI();$('ac_st').style.display='block'}else{$('ac_st').style.display='none'}}" +
                      "function updateAcUI(){$('ac_st').innerText=(ac.p?'ON':'OFF')+' | '+['冷','热','自动','风','除湿'][ac.m]+' | '+(ac.t+16)+'°C'}" +
                      "function showHA(){view('v_ha');let u=location.origin;let n='ir_'+curDev.idx.id;let code='';if(curDev.cid==1){code=`# HA 现代版空调\\ntemplate:\\n  - climate:\\n      name: \"${curDev.name}\"\\n      unique_id: ${n}_climate\\n      hvac_mode_template: \"{{ states('input_select.${n}_mode') }}\"\\n      set_hvac_mode:\\n        - service: rest_command.${n}_set\\n          data: { k:0, p:\"{{0 if hvac_mode=='off' else 1}}\", m:0, t:8 }`;}else{code=`# HA 通用媒体\\nmedia_player:\\n  - platform: universal\\n    name: \"${curDev.name}\"\\n    commands:\\n      turn_on: { service: rest_command.${n}_cmd, data: {k: 0} }\\n      turn_off: { service: rest_command.${n}_cmd, data: {k: 0} }`;}$('ha_code').value=code;}" +
                      "function fireTx(k){fire(k, curDev.idx, {name_cn:curDev.cate, id:curDev.cid})}" +
                      "function fire(k, idx, cateObj){let cid=cateObj.id||cateObj.categoryId;if(cid==1){if(k==0)ac.p=1-ac.p;if(k==1)ac.m=(ac.m+1)%5;if(k==2)ac.t=Math.min(14,ac.t+1);if(k==3)ac.t=Math.max(0,ac.t-1);if($('ac_st'))updateAcUI()}fetch(`/api/tx?id=${idx.id||idx.indexId}&c=${cid}&k=${k}&p=${ac.p}&m=${ac.m}&t=${ac.t}`).then(r=>r.text())}\n goHome();</script></body></html>";
                      return newFixedLengthResponse(Response.Status.OK, "text/html; charset=UTF-8", html);
                  }
              }
              @Override public IBinder onBind(Intent intent) { return null; }
          }
          EOF

      - name: 4. 编写主控 UI (🌟安卓13完美集成：公私云切换+面具模块+通知显示)
        run: |
          cat <<EOF > app/src/main/java/hap/re00660/re/MainActivity.java
          package hap.re00660.re;
          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.*;
          import android.webkit.*;
          import android.widget.*;
          import com.google.gson.*;
          import java.net.*;
          import java.util.*;
          import java.io.*;

          public class MainActivity extends Activity {
              private SharedPreferences db, cfg;
              private LinearLayout listArea;
              private WebView webView;
              private EditText ipInput;
              private RadioGroup cloudGroup;
              private Switch rootSwitch;
              private TextView statusTv;
              private boolean isWeb = false;

              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  db = getSharedPreferences("IREXT_DATABASE", MODE_PRIVATE);
                  cfg = getSharedPreferences("IREXT_CFG", MODE_PRIVATE);
                  
                  if (Build.VERSION.SDK_INT >= 33) {
                      if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                      }
                  }

                  FrameLayout rootLayout = new FrameLayout(this);
                  rootLayout.setBackgroundColor(Color.parseColor("#F1F5F9"));
                  LinearLayout main = new LinearLayout(this);
                  main.setOrientation(LinearLayout.VERTICAL);
                  main.setPadding(40, 40, 40, 40);

                  TextView title = new TextView(this); title.setText("📡 ha红外网关 Pro Max"); title.setTextSize(24);
                  main.addView(title);

                  statusTv = new TextView(this); statusTv.setText("🔴 状态: 服务未启动");
                  statusTv.setTextColor(Color.RED); main.addView(statusTv);

                  TextView myIp = new TextView(this);
                  myIp.setText("\n访问地址: http://" + getLocalIp() + ":8080");
                  myIp.setTextColor(Color.parseColor("#2563EB")); main.addView(myIp);

                  TextView cl = new TextView(this); cl.setText("\n☁️ 云端选择:"); main.addView(cl);
                  cloudGroup = new RadioGroup(this); cloudGroup.setOrientation(LinearLayout.HORIZONTAL);
                  RadioButton rbPub = new RadioButton(this); rbPub.setText("公有云");
                  RadioButton rbPri = new RadioButton(this); rbPri.setText("私有云");
                  cloudGroup.addView(rbPub); cloudGroup.addView(rbPri); main.addView(cloudGroup);
                  
                  ipInput = new EditText(this); ipInput.setHint("Docker IP:8081");
                  ipInput.setText(cfg.getString("docker_ip", "http://192.168.1.100:8081"));
                  main.addView(ipInput);

                  boolean isPublic = cfg.getBoolean("is_public_cloud", false);
                  rbPub.setChecked(isPublic); rbPri.setChecked(!isPublic);
                  ipInput.setVisibility(isPublic ? View.GONE : View.VISIBLE);
                  cloudGroup.setOnCheckedChangeListener((g, id) -> {
                      ipInput.setVisibility(id == rbPub.getId() ? View.GONE : View.VISIBLE);
                  });

                  rootSwitch = new Switch(this); rootSwitch.setText("启用 Root 保活");
                  rootSwitch.setChecked(cfg.getBoolean("use_root", true)); main.addView(rootSwitch);

                  Switch swAuto = new Switch(this); swAuto.setText("允许开机自启");
                  swAuto.setChecked(cfg.getBoolean("auto_start", true)); main.addView(swAuto);

                  Button start = new Button(this); start.setText("保存并启动网关");
                  start.setBackgroundColor(Color.parseColor("#1890ff")); start.setTextColor(Color.WHITE);
                  start.setOnClickListener(v -> {
                      boolean pub = rbPub.isChecked();
                      cfg.edit().putString("docker_ip", ipInput.getText().toString()).putBoolean("is_public_cloud", pub)
                         .putBoolean("use_root", rootSwitch.isChecked()).putBoolean("auto_start", swAuto.isChecked()).apply();
                      
                      if(rootSwitch.isChecked()) {
                          new Thread(() -> {
                              try {
                                  Process p = Runtime.getRuntime().exec("su");
                                  DataOutputStream os = new DataOutputStream(p.getOutputStream());
                                  os.writeBytes("dumpsys deviceidle whitelist +" + getPackageName() + "\n");
                                  os.writeBytes("exit\n"); os.flush();
                              } catch (Exception e) {}
                          }).start();
                      }

                      Intent i = new Intent(this, IRService.class);
                      i.putExtra("DOCKER_URL", pub ? "http://srv.irext.net" : ipInput.getText().toString());
                      startForegroundService(i);
                      statusTv.setText("🟢 状态: 运行中 (数据互通正常)"); statusTv.setTextColor(Color.parseColor("#16a34a"));
                  });
                  main.addView(start);

                  Button btnMag = new Button(this); btnMag.setText("🔥 注入面具模块");
                  btnMag.setBackgroundColor(Color.parseColor("#ef4444")); btnMag.setTextColor(Color.WHITE);
                  btnMag.setOnClickListener(v -> deployMagisk()); main.addView(btnMag);

                  Button add = new Button(this); add.setText("+ 设备管理面板");
                  add.setOnClickListener(v -> openWeb()); main.addView(add);

                  TextView lt = new TextView(this); lt.setText("\n📱 已存设备:");
                  main.addView(lt);
                  ScrollView scView = new ScrollView(this);
                  listArea = new LinearLayout(this); listArea.setOrientation(LinearLayout.VERTICAL);
                  scView.addView(listArea); main.addView(scView);
                  rootLayout.addView(main);

                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface public void refresh() { runOnUiThread(() -> refreshList()); }
                  }, "Android");
                  webView.setVisibility(View.GONE);
                  rootLayout.addView(webView);
                  setContentView(rootLayout);
                  refreshList();
              }

              private void deployMagisk() {
                  new Thread(() -> {
                      try {
                          Process p = Runtime.getRuntime().exec("su");
                          DataOutputStream os = new DataOutputStream(p.getOutputStream());
                          String script = "MOD=\"/data/adb/modules/irext_daemon\"\nrm -rf $MOD\nmkdir -p $MOD/system/priv-app/IRGateway\n" +
                                          "cp \"" + getApplicationInfo().sourceDir + "\" $MOD/system/priv-app/IRGateway/IRGateway.apk\n" +
                                          "echo 'id=irext_daemon\nname=红外网关特权守护\nversion=vUltimate\nauthor=极客\ndescription=保活。' > $MOD/module.prop\n" +
                                          "echo '#!/system/bin/sh\nuntil [ \"$(getprop sys.boot_completed)\" = \"1\" ]; do sleep 1; done\nsleep 3\ndumpsys deviceidle whitelist +" + getPackageName() + "\nam start-foreground-service -n " + getPackageName() + "/.IRService' > $MOD/service.sh\n" +
                                          "chmod -R 755 $MOD\n" + 
                                          "touch $MOD/update\n" +
                                          "exit\n";
                          os.writeBytes(script); os.flush(); p.waitFor();
                          runOnUiThread(() -> Toast.makeText(this, "注入完成，请重启手机！", 1).show());
                      } catch (Exception e) {}
                  }).start();
              }

              private void openWeb() { isWeb = true; webView.setVisibility(View.VISIBLE); webWeb.loadUrl("http://127.0.0.1:8080"); }
              @Override public void onBackPressed() { if(isWeb) { isWeb = false; webView.setVisibility(View.GONE); refreshList(); } else super.onBackPressed(); }
              private void refreshList() {
                  listArea.removeAllViews();
                  try {
                      JsonArray arr = JsonParser.parseString(db.getString("devs", "[]")).getAsJsonArray();
                      for (int i = 0; i < arr.size(); i++) {
                          Button b = new Button(this); b.setAllCaps(false);
                          b.setText(arr.get(i).getAsJsonObject().get("name").getAsString());
                          listArea.addView(b);
                      }
                  } catch(Exception e) {}
              }
              private String getLocalIp() { try { for (NetworkInterface n : Collections.list(NetworkInterface.getNetworkInterfaces())) { for (InetAddress a : Collections.list(n.getInetAddresses())) { if (!a.isLoopbackAddress() && a instanceof Inet4Address) return a.getHostAddress(); } } } catch (Exception e) {} return "127.0.0.1"; }
          }
          EOF

      - name: 5. 构建配置与清单
        run: |
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
