name: IREXT_ANDROID5_CLOUD_SWITCH_PRO_V4

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 代码初始化
        run: |
          rm -rf *
          mkdir -p app/src/main/java/hap/re00660/re
          echo "✅ 初始化完成"
      
      - name: 2. 编写开机自启广播 (🌟兼容安卓5)
        run: |
          cat <<'EOF' > app/src/main/java/hap/re00660/re/BootReceiver.java
          package hap.re00660.re;
          import android.content.*;
          import android.os.Build;
          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction()) || "android.intent.action.QUICKBOOT_POWERON".equals(intent.getAction())) {
                      SharedPreferences cfg = context.getSharedPreferences("IREXT_CFG", Context.MODE_PRIVATE);
                      if (cfg.getBoolean("auto_start", true)) {
                          Intent i = new Intent(context, IRService.class);
                          boolean isPublic = cfg.getBoolean("is_public_cloud", false);
                          i.putExtra("CLOUD_URL", isPublic ? "https://srv.irext.net" : cfg.getString("docker_ip", "http://192.168.1.100:8081"));
                          i.putExtra("LOCAL_DECODER_URL", cfg.getString("local_decoder", "http://192.168.1.100:8082"));
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              context.startForegroundService(i);
                          } else {
                              context.startService(i);
                          }
                      }
                  }
              }
          }
          EOF

      - name: 3. 编写核心服务 (🌟修正API路径+全部设备类型)
        run: |
          cat <<'EOF' > app/src/main/java/hap/re00660/re/IRService.java
          package hap.re00660.re;
          import android.app.*;
          import android.content.*;
          import android.hardware.ConsumerIrManager;
          import android.media.*;
          import android.os.Build;
          import android.os.IBinder;
          import fi.iki.elonen.NanoHTTPD;
          import java.io.*;
          import java.net.*;
          import java.nio.charset.StandardCharsets;
          import java.util.*;
          import com.google.gson.*;
          public class IRService extends Service {
              private WebServer server;
              private ConsumerIrManager ir;
              private SharedPreferences db, cfg;
              private String targetCloudUrl = "https://srv.irext.net";
              private String localDecoderUrl = "http://192.168.1.100:8082";
              private String apiId = "", apiToken = "";
              private String APP_KEY = "55b1d89fda0658d6f851ee89cad564de";
              private String APP_SECRET = "83dfd86ad59843ce50342ec863a49bf0";
              private Map<String, Map<String, Object>> decodeCache = new HashMap<>();
              private Map<String, JsonObject> acStateCache = new HashMap<>();
              private boolean isRunning = false;
              private int serverPort = 8080;
              
              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if(intent != null) {
                      if(intent.getStringExtra("CLOUD_URL") != null) targetCloudUrl = intent.getStringExtra("CLOUD_URL");
                      if(intent.getStringExtra("LOCAL_DECODER_URL") != null) localDecoderUrl = intent.getStringExtra("LOCAL_DECODER_URL");
                      loginCloud();
                  }
                  return START_STICKY;
              }
              
              @Override
              public void onCreate() {
                  super.onCreate();
                  isRunning = true;
                  db = getSharedPreferences("IREXT_DB", MODE_PRIVATE);
                  cfg = getSharedPreferences("IREXT_CFG", MODE_PRIVATE);
                  try {
                      Notification.Builder nb;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          NotificationChannel ch = new NotificationChannel("IR", "红外网关守护", NotificationManager.IMPORTANCE_LOW);
                          NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                          if(nm != null) nm.createNotificationChannel(ch);
                          nb = new Notification.Builder(this, "IR");
                      } else {
                          nb = new Notification.Builder(this);
                      }
                      nb.setContentTitle("红外网关运行中 (支持安卓5)");
                      nb.setSmallIcon(android.R.drawable.ic_dialog_info);
                      startForeground(1, nb.build());
                  } catch(Throwable t) {}
                  try { ir = (ConsumerIrManager) getSystemService(CONSUMER_IR_SERVICE); } catch(Throwable t) {}
                  try { 
                      server = new WebServer(serverPort); 
                      server.start(); 
                  } catch (Exception e) { 
                      isRunning = false;
                  }
                  sendStatusBroadcast();
              }
              
              @Override
              public void onDestroy() {
                  isRunning = false;
                  sendStatusBroadcast();
                  if(server != null) server.stop();
                  super.onDestroy();
              }
              
              private void sendStatusBroadcast() {
                  Intent intent = new Intent("hap.re00660.re.SERVICE_STATUS");
                  intent.putExtra("running", isRunning);
                  intent.putExtra("port", serverPort);
                  sendBroadcast(intent);
              }
              
              private void transmitAudioStereo(int[] pattern) {
                  int sampleRate = 48000;
                  int freq = 19000;
                  int total = 0;
                  for (int p : pattern) total += p;
                  final int finalSleepTime = (total / 1000) + 100;
                  int frames = (int)((total / 1000000.0) * sampleRate);
                  short[] buffer = new short[frames * 2];
                  int frameIndex = 0;
                  boolean mark = true;
                  for (int duration : pattern) {
                      int currentFrames = (int)((duration / 1000000.0) * sampleRate);
                      for (int i=0; i<currentFrames; i++) {
                          if (mark && frameIndex * 2 + 1 < buffer.length) {
                              double time = frameIndex / (double)sampleRate;
                              short val = (short)(Math.sin(2 * Math.PI * freq * time) * 32767);
                              buffer[frameIndex * 2] = val;
                              buffer[frameIndex * 2 + 1] = (short)-val;
                          }
                          frameIndex++;
                      }
                      mark = !mark;
                  }
                  try {
                      AudioTrack track = new AudioTrack(AudioManager.STREAM_MUSIC, sampleRate,
                          AudioFormat.CHANNEL_OUT_STEREO, AudioFormat.ENCODING_PCM_16BIT,
                          buffer.length * 2, AudioTrack.MODE_STATIC);
                      track.write(buffer, 0, buffer.length);
                      track.play();
                      new Thread(() -> {
                          try { Thread.sleep(finalSleepTime); track.release(); } catch(Exception e){}
                      }).start();
                  } catch (Exception e) {}
              }
              
              private String postJSON(String path, String jsonBody, String baseUrl) {
                  HttpURLConnection conn = null;
                  try {
                      String fullUrl = baseUrl;
                      if(!fullUrl.endsWith("/")) fullUrl += "/";
                      if(!path.startsWith("irext-server") && !path.startsWith("/irext-server")) {
                          fullUrl += "irext-server/";
                      }
                      fullUrl += path.replaceFirst("^irext-server/", "").replaceFirst("^/irext-server/", "");
                      
                      URL url = new URL(fullUrl);
                      conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod("POST");
                      conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                      if(baseUrl.contains("irext.net")) conn.setRequestProperty("user-lang", "zh-CN");
                      conn.setConnectTimeout(8000); conn.setReadTimeout(15000); conn.setDoOutput(true);
                      try(OutputStream os = conn.getOutputStream()) { os.write(jsonBody.getBytes(StandardCharsets.UTF_8)); }
                      InputStream is = conn.getResponseCode() >= 400 ? conn.getErrorStream() : conn.getInputStream();
                      if (is == null) return "{}";
                      try(BufferedReader br = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8))) {
                          StringBuilder sb = new StringBuilder(); String line;
                          while((line = br.readLine()) != null) sb.append(line);
                          return sb.toString();
                      }
                  } catch (Exception e) { return "{\"error\":\"" + e.getMessage() + "\"}"; }
                  finally { if(conn!=null) conn.disconnect(); }
              }
              
              private void loginCloud() {
                  new Thread(() -> {
                      String req = "{\"appKey\":\""+APP_KEY+"\",\"appSecret\":\""+APP_SECRET+"\",\"appType\":\"2\"}";
                      String res = postJSON("app/app_login", req, targetCloudUrl);
                      try {
                          JsonObject entity = JsonParser.parseString(res).getAsJsonObject().getAsJsonObject("entity");
                          apiId = entity.get("id").getAsString(); apiToken = entity.get("token").getAsString();
                      } catch (Exception e) { }
                  }).start();
              }
              
              private int getKeyId(int cat, String k) {
                  if ((cat == 2 || cat == 3 || cat == 4 || cat == 5 || cat == 8 || cat == 11) && k.matches("\\d+")) return 14 + Integer.parseInt(k);
                  String[] m = null;
                  switch(cat) {
                      case 1: m = new String[]{"电源","模式","温度+","温度-","N/A","N/A","N/A","温度+","温度-","风力","扫风","固定风"}; break;
                      case 2: case 8: m = new String[]{"电源","静音","上","下","左","右","确认","音量+","音量-","返回","信号源","菜单","主页","设置"}; break;
                      case 3: case 4: case 5: case 11: m = new String[]{"电源","静音","上","下","左","右","确认","音量+","音量-","返回","信号源","菜单","上一页","下一页"}; break;
                      case 6: m = new String[]{"电源","播放","暂停","停止","快进","快退","上一曲","下一曲","菜单","返回"}; break;
                      case 7: m = new String[]{"电源","上","下","左","右","确认","风力+","风力-","摇头","风力","风类","返回"}; break;
                      case 9: m = new String[]{"电源","静音","上","下","左","右","确认","音量+","音量-","返回","播放","暂停","上一曲","下一曲"}; break;
                      case 10: m = new String[]{"电源","亮度+","亮度-","颜色","模式","定时"}; break;
                      case 12: m = new String[]{"电源","启动","暂停","回充","模式"}; break;
                      case 13: m = new String[]{"电源","模式","风速","定时","负离子"}; break;
                      default: m = new String[]{"电源","上","下","左","右","确认","返回","菜单"}; break;
                  }
                  if(m != null) for(int i=0; i<m.length; i++) if(m[i].equals(k)) return i;
                  return -1;
              }
              
              private Map<String, Object> batchDecodeLocal(String indexId, String type, int cat) {
                  String cacheKey = indexId + "_" + type;
                  if(decodeCache.containsKey(cacheKey)) return decodeCache.get(cacheKey);
                  if(apiId.isEmpty() || apiToken.isEmpty()) return null;
                  String req = String.format("{\"id\":\"%s\",\"token\":\"%s\",\"indexId\":\"%s\",\"deviceType\":\"%s\",\"categoryId\":%d}",
                      apiId, apiToken, indexId, type, cat);
                  String res = postJSON("decode/all", req, localDecoderUrl);
                  try {
                      JsonObject obj = JsonParser.parseString(res).getAsJsonObject();
                      if(obj.has("keys")) {
                          Map<String, Object> result = new HashMap<>();
                          result.put("keys", obj.get("keys").toString());
                          decodeCache.put(cacheKey, result);
                          return result;
                      }
                  } catch(Exception e) {}
                  return null;
              }
              
              private int[] decodeOnline(String indexId, int cat, String op) {
                  if(apiId.isEmpty() || apiToken.isEmpty()) return null;
                  JsonObject s = acStateCache.get(indexId);
                  if(s == null && cat == 1) {
                      s = new JsonObject(); 
                      s.addProperty("acPower", 1); s.addProperty("acMode", 1);
                      s.addProperty("acTemp", 10); s.addProperty("acWindSpeed", 0); 
                      s.addProperty("acWindDir", 0); s.addProperty("changeWindDir", 0);
                      acStateCache.put(indexId, s);
                  }
                  JsonObject req = new JsonObject();
                  req.addProperty("id", apiId); req.addProperty("token", apiToken);
                  req.addProperty("indexId", indexId);
                  if(cat == 1) {
                      if(op.equals("电源")) s.addProperty("acPower", s.get("acPower").getAsInt() == 0 ? 1 : 0);
                      else {
                          s.addProperty("acPower", 0);
                          if(op.equals("模式")) s.addProperty("acMode", (s.get("acMode").getAsInt() + 1) % 5);
                          if(op.equals("温度+")) s.addProperty("acTemp", Math.min(14, s.get("acTemp").getAsInt() + 1));
                          if(op.equals("温度-")) s.addProperty("acTemp", Math.max(0, s.get("acTemp").getAsInt() - 1));
                      }
                      req.addProperty("keyCode", 0); req.add("acStatus", s);
                  } else {
                      int kid = getKeyId(cat, op); if(kid == -1) return null;
                      req.addProperty("keyCode", kid);
                  }
                  String res = postJSON("operation/decode", req.toString(), targetCloudUrl);
                  try {
                      JsonArray arr = JsonParser.parseString(res).getAsJsonObject().getAsJsonArray("entity");
                      int[] t = new int[arr.size()]; for(int i=0; i<arr.size(); i++) t[i] = arr.get(i).getAsInt();
                      return t;
                  } catch(Exception e) { return null; }
              }
              
              private class WebServer extends NanoHTTPD {
                  public WebServer(int port) { super(port); }
                  @Override
                  public Response serve(IHTTPSession session) {
                      String uri = session.getUri();
                      Map<String, String> p = session.getParms();
                      try {
                          if ("/api/status".equals(uri)) {
                              JsonObject status = new JsonObject();
                              status.addProperty("running", isRunning);
                              status.addProperty("port", serverPort);
                              status.addProperty("ir_available", ir != null && ir.hasIrEmitter());
                              status.addProperty("cloud_url", targetCloudUrl);
                              status.addProperty("api_ready", !apiId.isEmpty() && !apiToken.isEmpty());
                              return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", status.toString());
                          }
                          if ("/api/list".equals(uri)) {
                              String devs = db.getString("devs", "[]");
                              return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", devs);
                          }
                          if ("/api/save".equals(uri)) {
                              int len = Integer.parseInt(session.getHeaders().get("content-length"));
                              byte[] buf = new byte[len]; session.getInputStream().read(buf, 0, len);
                              String body = new String(buf, StandardCharsets.UTF_8);
                              JsonArray list = JsonParser.parseString(db.getString("devs", "[]")).getAsJsonArray();
                              list.add(JsonParser.parseString(body));
                              db.edit().putString("devs", list.toString()).apply();
                              return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", "{\"ok\":true}");
                          }
                          if ("/api/delete".equals(uri)) {
                              JsonArray list = JsonParser.parseString(db.getString("devs", "[]")).getAsJsonArray();
                              JsonArray newList = new JsonArray();
                              int idx = Integer.parseInt(p.get("i"));
                              for(int i=0; i<list.size(); i++) if(i != idx) newList.add(list.get(i));
                              db.edit().putString("devs", newList.toString()).apply();
                              return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", "{\"ok\":true}");
                          }
                          if ("/api/batch_decode".equals(uri)) {
                              Map<String, Object> res = batchDecodeLocal(p.get("indexId"), "tv", 2);
                              return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", "{\"ok\":" + (res != null) + "}");
                          }
                          if ("/api/tx".equals(uri)) {
                              String id = p.get("id"); String k = p.get("k"); 
                              int cat = Integer.parseInt(p.getOrDefault("cat", p.getOrDefault("c", "2")));
                              int[] pattern = null;
                              if (cat == 2 || cat == 3 || cat == 4 || cat == 5 || cat == 8 || cat == 11) {
                                  Map<String, Object> cached = decodeCache.get(id + "_tv");
                                  if(cached == null) cached = batchDecodeLocal(id, "tv", cat);
                                  if(cached != null) {
                                      JsonObject keys = JsonParser.parseString((String)cached.get("keys")).getAsJsonObject();
                                      if(keys.has(k)) {
                                          JsonArray arr = keys.getAsJsonObject(k).getAsJsonArray("timings");
                                          pattern = new int[arr.size()]; 
                                          for(int i=0; i<arr.size(); i++) pattern[i] = arr.get(i).getAsInt();
                                      }
                                  }
                              }
                              if(pattern == null) {
                                  pattern = decodeOnline(id, cat, k);
                              }
                              if(pattern != null) {
                                  if (cfg.getBoolean("force_audio", false) || ir == null || !ir.hasIrEmitter()) {
                                      transmitAudioStereo(pattern);
                                  } else {
                                      ir.transmit(38000, pattern);
                                  }
                                  return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", "{\"ok\":true}");
                              }
                              return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", "{\"ok\":false,\"error\":\"decode failed\"}");
                          }
                          if ("/api/proxy".equals(uri)) {
                              String path = p.get("p");
                              String body = p.get("b");
                              if(!body.contains("\"id\"") && !body.contains("\"token\"")) {
                                  body = "{\"id\":\""+apiId+"\",\"token\":\""+apiToken+"\"," + body + "}";
                              }
                              String res = postJSON(path, body, targetCloudUrl);
                              JsonObject obj = JsonParser.parseString(res).getAsJsonObject();
                              if(obj.has("entity")) {
                                  return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", obj.get("entity").toString());
                              } else {
                                  return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", obj.toString());
                              }
                          }
                      } catch(Exception e) { 
                          return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", "{\"error\":\""+e.getMessage()+"\"}"); 
                      }
                      return newFixedLengthResponse(Response.Status.OK, "text/html; charset=UTF-8", getWebInterface());
                  }
              }
              
              private String getWebInterface() {
                  return "<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,user-scalable=no'><title>ha红外网关</title><style>body{font-family:sans-serif;background:#f0f2f5;padding:12px;margin:0 auto;max-width:500px}.card{background:#fff;border-radius:15px;padding:20px;box-shadow:0 4px 10px rgba(0,0,0,.08);margin-bottom:15px}h3{margin:0 0 15px;color:#1890ff;display:flex;justify-content:space-between;align-items:center}.btn-back{font-size:12px;background:#f5f5f5;padding:4px 10px;border-radius:6px;border:1px solid #ddd;cursor:pointer}.btn{display:block;width:100%;padding:14px 0;border:none;border-radius:12px;font-size:14px;font-weight:bold;margin-top:10px;cursor:pointer;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}.btn-p{background:#1890ff;color:#fff;border:none}.btn-g{background:#52c41a;color:#fff;border:none}.btn-r{background:#ff4d4f;color:#fff;border:none}.dev-card{background:#fff;border:1px solid #eee;padding:18px;border-radius:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}select,input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;font-size:15px}#views>div{display:none}#v_home{display:block}.panel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.num-grid{grid-template-columns:repeat(5,1fr);font-size:11px;margin-top:15px;border-top:1px dashed #eee;padding-top:15px}textarea{width:100%;height:350px;font-family:monospace;font-size:11px;background:#1e1e1e;color:#a9b7c6;padding:10px;border:1px solid #333;border-radius:8px}</style></head><body>" +
                      "<div id='views'><div id='v_home'><h3>🏠 我的设备 <button class='btn-g' style='width:auto;padding:6px 15px' onclick='goAdd()'>+ 添加</button></h3><div id='dev_list'></div></div>" +
                      "<div id='v_add'><div class='card'><h3><span onclick='goHome()' class='btn-back'>← 返回</span> 1. 选类型品牌</h3><select id='sc' onchange='lb()'></select><select id='sb' onchange='startMatch()'></select></div></div>" +
                      "<div id='v_match'><div class='card'><h3><span onclick='view(\"v_add\")' class='btn-back'>← 返回</span> 匹配中</h3><div style='text-align:center;margin:15px 0'>方案 <b id='midx' style='color:#1890ff;font-size:24px'>1</b> / <span id='mtotal'>0</span></div><p id='bg_prog' style='font-size:12px;color:#999;text-align:center'></p><button class='btn btn-p' style='height:80px' onclick='testPwr()'>📡 发送电源测试</button><div class='panel' style='grid-template-columns:1fr 1fr'><button class='btn' onclick='next()'>❌ 无反应</button><button class='btn btn-g' onclick='preSave()'>✅ 有反应</button></div></div></div>" +
                      "<div id='v_save'><div class='card'><h3><span onclick='view(\"v_match\")' class='btn-back'>← 返回</span> 3. 取名保存</h3><input id='d_name'><button class='btn btn-g' onclick='doSave()'>确认保存</button></div></div>" +
                      "<div id='v_ctrl'><div class='card'><h3><span id='c_title'></span> <button class='btn-back' onclick='goHome()'>关闭</button></h3><div id='ac_st' style='text-align:center;margin-bottom:15px;color:#666;font-family:monospace'></div><div class='panel' id='btns'></div><div class='panel num-grid' id='num_btns' style='display:none'></div><button class='btn' style='background:#fdf2f2;color:#ef4444;border-color:#fecaca;margin-top:20px' onclick='showHA()'>🛠️ HA 配置代码</button><button class='btn btn-r' style='margin-top:10px;opacity:0.3' onclick='delDev()'>删除设备</button></div></div>" +
                      "<div id='v_ha'><div class='card'><h3>🛠️ HA YAML <span onclick='goCtrl()' class='btn-back'>← 返回</span></h3><textarea id='ha_code' readonly onclick='this.select()'></textarea></div></div></div><script>" +
                      "const kmaps={'空调':{0:'电源',1:'模式',2:'温度+',3:'温度-',9:'风力',10:'扫风',11:'固定风'},'电视机':{0:'电源',1:'静音',2:'上',3:'下',4:'左',5:'右',6:'确认',7:'音量+',8:'音量-',9:'返回',10:'信号源',11:'菜单',12:'主页',13:'设置'},'机顶盒':{0:'电源',1:'静音',2:'上',3:'下',4:'左',5:'右',6:'确认',7:'音量+',8:'音量-',9:'返回',10:'信号源',11:'菜单',12:'上一页',13:'下一页'},'IPTV':{0:'电源',1:'静音',2:'上',3:'下',4:'左',5:'右',6:'确认',7:'音量+',8:'音量-',9:'返回',10:'信号源',11:'菜单',12:'上一页',13:'下一页'},'网络盒子':{0:'电源',1:'静音',2:'上',3:'下',4:'左',5:'右',6:'确认',7:'音量+',8:'音量-',9:'返回',10:'主页',11:'菜单',12:'上一页',13:'下一页'},'投影仪':{0:'电源',1:'静音',2:'上',3:'下',4:'左',5:'右',6:'确认',7:'音量+',8:'音量-',9:'返回',10:'信号源',11:'菜单',12:'主页',13:'设置'},'风扇':{0:'电源',1:'上',2:'下',3:'左',4:'右',5:'确认',6:'风力+',7:'风力-',8:'摇头',9:'风力',10:'风类',11:'返回'},'音响':{0:'电源',1:'静音',2:'上',3:'下',4:'左',5:'右',6:'确认',7:'音量+',8:'音量-',9:'返回',10:'播放',11:'暂停',12:'上一曲',13:'下一曲'},'DVD':{0:'电源',1:'播放',2:'暂停',3:'停止',4:'快进',5:'快退',6:'上一曲',7:'下一曲',8:'菜单',9:'返回'},'灯':{0:'电源',1:'亮度+',2:'亮度-',3:'颜色',4:'模式',5:'定时'},'扫地机器人':{0:'电源',1:'启动',2:'暂停',3:'回充',4:'模式'},'空气净化器':{0:'电源',1:'模式',2:'风速',3:'定时',4:'负离子'}};const $=i=>document.getElementById(i);let cs=[],bs=[],is=[],curr=0,ac={p:0,m:0,t:8},devs=[],curDev=null,curIdx=-1,tvDec={};" +
                      "function view(id){document.querySelectorAll('#views>div').forEach(d=>d.style.display='none');$(id).style.display='block'}" +
                      "function loadDevs(){fetch('/api/list?t='+Date.now()).then(r=>r.json()).then(d=>{devs=d;let h='';d.forEach((x,i)=>{h+=`<div class='dev-card' onclick='openDev(${i})'><div><b>${x.name}</b><br><small>${x.brand} | ${x.cate}</small></div><b>&gt;</b></div>`});$('dev_list').innerHTML=h||'<p style=\"text-align:center;padding:40px;color:#999\">还没有设备</p>'})}" +
                      "function goHome(){loadDevs();view('v_home');if(window.Android)Android.refresh()}" +
                      "function goAdd(){view('v_add');fetch('/api/proxy?p=indexing/list_categories&b=\"from\":\"0\",\"count\":\"100\"').then(r=>r.json()).then(d=>{cs=d;$('sc').innerHTML='<option>选择类型</option>'+d.map((c,i)=>'<option value='+i+'>'+(c.name_cn||c.name)+'</option>')})}" +
                      "function lb(){let c=cs[$('sc').value];fetch('/api/proxy?p=indexing/list_brands&b=\"categoryId\":\"'+c.id+'\",\"from\":\"0\",\"count\":\"500\"').then(r=>r.json()).then(d=>{bs=d;$('sb').innerHTML='<option>选择品牌</option>'+d.map((b,i)=>'<option value='+i+'>'+(b.name_cn||b.name)+'</option>')})}" +
                      "function startMatch(){let c=cs[$('sc').value],b=bs[$('sb').value];fetch('/api/proxy?p=indexing/list_indexes&b=\"categoryId\":\"'+c.id+'\",\"brandId\":\"'+b.id+'\",\"cityCode\":\"\",\"from\":\"0\",\"count\":\"500\"').then(r=>r.json()).then(d=>{is=d;curr=0;tvDec={};view('v_match');$('midx').innerText=1;$('mtotal').innerText=is.length;let cn=c.name_cn||c.name;if(cn.includes('电视')||cn.includes('机顶盒')||cn.includes('IPTV')||cn.includes('盒子')||cn.includes('投影'))bgLoop()})}" +
                      "async function bgLoop(){for(let i=0;i<is.length;i++){if(!tvDec[i]){await fetch('/api/batch_decode?indexId='+is[i].id);tvDec[i]=true;if($('bg_prog'))$('bg_prog').innerText=`后台解码: ${Object.keys(tvDec).length}/${is.length}`;}}}" +
                      "function testPwr(){let c=cs[$('sc').value];let k=(c.name_cn||c.name)=='空调'?0:'电源';fire(k,is[curr],c.id)}" +
                      "function next(){if(curr<is.length-1){curr++;$('midx').innerText=curr+1;testPwr()}else{alert('试完了')}}" +
                      "function preSave(){view('v_save');let c=cs[$('sc').value],b=bs[$('sb').value];$('d_name').value=(b.name_cn||b.name||'')+' '+(c.name_cn||c.name||'')}" +
                      "function doSave(){let c=cs[$('sc').value],b=bs[$('sb').value];let d={name:$('d_name').value,cate:c.name_cn||c.name,brand:b.name_cn||b.name,idx:is[curr],cid:c.id};fetch('/api/save',{method:'POST',body:JSON.stringify(d)}).then(()=>{goHome()})}" +
                      "function openDev(i){curDev=devs[i];curIdx=i;view('v_ctrl');$('c_title').innerText=curDev.name;renderPanel()}" +
                      "function delDev(){if(confirm('删除?'))fetch('/api/delete?i='+curIdx).then(goHome)}" +
                      "function goCtrl(){view('v_ctrl')}" +
                      "function renderPanel(){let n=curDev.cate,m=kmaps[n]||kmaps['电视机'];let h='';Object.keys(m).forEach(k=>{h+=`<button onclick='fireTx(\"${m[k]}\")' class='btn'>${m[k]}</button>`});$('btns').innerHTML=h;if(n=='电视机'||n=='机顶盒'||n=='IPTV'||n=='网络盒子'||n=='投影仪'){let nh='';for(let i=0;i<=9;i++){nh+=`<button class='btn' onclick='fireTx(\"${i}\")'>${i}</button>`}$('num_btns').innerHTML=nh;$('num_btns').style.display='grid'}else{$('num_btns').style.display='none'}if(n=='空调'){updateAcUI();$('ac_st').style.display='block'}else{$('ac_st').style.display='none'}}" +
                      "function updateAcUI(){$('ac_st').innerText=(ac.p?'ON':'OFF')+' | '+['冷','热','自动','风','除湿'][ac.m]+' | '+(ac.t+16)+'°C'}" +
                      "function showHA(){view('v_ha');let u=location.origin,id=curDev.idx.id||curDev.idx.indexId,sn='ir_'+id;let code='';if(curDev.cate.includes('空调')){code=`# 新版HA原生空调配置\\ninput_select:\\n  ${sn}_mode:\\n    options: ['off','cool','heat','auto','fan_only']\\ninput_number:\\n  ${sn}_temp:\\n    min: 16\\n    max: 30\\n    step: 1\\nrest_command:\\n  ${sn}_set:\\n    url: \"${u}/api/tx?id=${id}&cat=1&k={{k}}&p={{p}}&m={{m}}&t={{t}}\"\\n\\ntemplate:\\n  - climate:\\n      name: \"${curDev.name}\"\\n      unique_id: ${sn}_climate\\n      hvac_modes: ['off','cool','heat','auto','fan_only']\\n      min_temp: 16\\n      max_temp: 30\\n      target_temperature_step: 1\\n      hvac_mode_template: \"{{ states('input_select.${sn}_mode') }}\"\\n      target_temperature_template: \"{{ states('input_number.${sn}_temp') }}\"\\n      set_hvac_mode:\\n        - service: input_select.select_option\\n          target: { entity_id: input_select.${sn}_mode }\\n          data: { option: \"{{ hvac_mode }}\" }\\n        - service: rest_command.${sn}_set\\n          data:\\n            k: '电源'\\n            p: \"{{ 0 if hvac_mode == 'off' else 1 }}\"\\n            m: \"{{ 0 if hvac_mode == 'cool' else (1 if hvac_mode == 'heat' else 2) }}\"\\n            t: 8\\n      set_temperature:\\n        - service: input_number.set_value\\n          target: { entity_id: input_number.${sn}_temp }\\n          data: { value: \"{{ temperature }}\" }\\n        - service: rest_command.${sn}_set\\n          data:\\n            k: '温度+'\\n            p: 1\\n            m: 0\\n            t: \"{{ (temperature - 16)|int }}\"`;}else{code=`# 通用设备配置\\nrest_command:\\n  ${sn}_cmd: { url: \"${u}/api/tx?id=${id}&cat=${curDev.cid}&k={{k}}\" }\\n\\nswitch:\\n  - platform: template\\n    switches:\\n      ${sn}:\\n        friendly_name: \"${curDev.name}\"\\n        turn_on: { service: rest_command.${sn}_cmd, data: {k: '电源'} }\\n        turn_off: { service: rest_command.${sn}_cmd, data: {k: '电源'} }`}$('ha_code').value=code;}" +
                      "function fireTx(k){fire(k, curDev.idx, curDev.cid)}" +
                      "function fire(k, idx, cat){let cid=typeof cat==='object'?cat.id||cat.categoryId:parseInt(cat);if(cid==1){if(k=='电源')ac.p=1-ac.p;if(k=='模式')ac.m=(ac.m+1)%5;if(k=='温度+')ac.t=Math.min(14,ac.t+1);if(k=='温度-')ac.t=Math.max(0,ac.t-1);updateAcUI()}fetch(`/api/tx?id=${idx.id||idx.indexId}&cat=${cid}&k=${k}`).then(r=>r.text())}\n goHome();</script></body></html>";
              }
              @Override public IBinder onBind(Intent intent) { return null; }
          }
          EOF

      - name: 4. 编写主控台 UI (🌟修正SharedPreferences+服务状态+电池白名单)
        run: |
          cat <<EOF > app/src/main/java/hap/re00660/re/MainActivity.java
          package hap.re00660.re;
          import android.app.Activity;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.view.*;
          import android.webkit.*;
          import android.widget.*;
          import com.google.gson.*;
          import java.net.*;
          import java.util.*;
          import java.io.*;
          public class MainActivity extends Activity {
              private SharedPreferences cfg;
              private LinearLayout listArea;
              private WebView webView;
              private EditText ipInput, decoderInput;
              private RadioGroup cloudGroup;
              private TextView statusText;
              private Button btnBattery;
              private boolean isWeb = false;
              private BroadcastReceiver statusReceiver;
              
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  cfg = getSharedPreferences("IREXT_CFG", MODE_PRIVATE);
                  
                  statusReceiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          boolean running = intent.getBooleanExtra("running", false);
                          int port = intent.getIntExtra("port", 8080);
                          updateStatus(running, port);
                      }
                  };
                  registerReceiver(statusReceiver, new IntentFilter("hap.re00660.re.SERVICE_STATUS"));
                  
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.parseColor("#F1F5F9"));
                  LinearLayout main = new LinearLayout(this);
                  main.setOrientation(LinearLayout.VERTICAL);
                  main.setPadding(40, 40, 40, 40);
                  
                  TextView title = new TextView(this); 
                  title.setText("📡 ha红外网关 Pro V4"); 
                  title.setTextSize(24);
                  main.addView(title);
                  
                  statusText = new TextView(this);
                  statusText.setText("\n🔴 服务未运行");
                  statusText.setTextColor(Color.parseColor("#ef4444"));
                  statusText.setTextSize(16);
                  main.addView(statusText);
                  
                  TextView myIp = new TextView(this);
                  myIp.setText("访问地址: http://" + getLocalIp() + ":8080");
                  myIp.setTextColor(Color.parseColor("#2563EB")); 
                  main.addView(myIp);
                  
                  btnBattery = new Button(this);
                  btnBattery.setText("🔋 申请电池优化白名单");
                  btnBattery.setBackgroundColor(Color.parseColor("#f59e0b"));
                  btnBattery.setTextColor(Color.WHITE);
                  btnBattery.setOnClickListener(v -> requestBatteryWhitelist());
                  main.addView(btnBattery);
                  
                  TextView cloudLabel = new TextView(this); 
                  cloudLabel.setText("\n☁️ 云端解码服务器 (8081):");
                  main.addView(cloudLabel);
                  
                  cloudGroup = new RadioGroup(this);
                  cloudGroup.setOrientation(LinearLayout.HORIZONTAL);
                  RadioButton rbPublic = new RadioButton(this); 
                  rbPublic.setText("公有云");
                  RadioButton rbPrivate = new RadioButton(this); 
                  rbPrivate.setText("私有云");
                  cloudGroup.addView(rbPublic); 
                  cloudGroup.addView(rbPrivate);
                  main.addView(cloudGroup);
                  
                  ipInput = new EditText(this); 
                  ipInput.setHint("http://192.168.1.100:8081");
                  ipInput.setText(cfg.getString("docker_ip", "http://192.168.1.100:8081"));
                  main.addView(ipInput);
                  
                  TextView localLabel = new TextView(this); 
                  localLabel.setText("\n🖥️ 本地解码服务 (8082):");
                  main.addView(localLabel);
                  
                  decoderInput = new EditText(this);
                  decoderInput.setHint("http://192.168.1.100:8082");
                  decoderInput.setText(cfg.getString("local_decoder", "http://192.168.1.100:8082"));
                  main.addView(decoderInput);
                  
                  boolean isPublic = cfg.getBoolean("is_public_cloud", true);
                  rbPublic.setChecked(isPublic); 
                  rbPrivate.setChecked(!isPublic);
                  ipInput.setEnabled(!isPublic);
                  
                  cloudGroup.setOnCheckedChangeListener((group, checkedId) -> {
                      boolean isPub = (checkedId == rbPublic.getId());
                      ipInput.setEnabled(!isPub);
                  });
                  
                  Switch swAuto = new Switch(this); 
                  swAuto.setText("允许开机自启");
                  swAuto.setChecked(cfg.getBoolean("auto_start", true)); 
                  main.addView(swAuto);
                  
                  Switch swAudio = new Switch(this); 
                  swAudio.setText("耳机孔红外发射");
                  swAudio.setChecked(cfg.getBoolean("force_audio", false)); 
                  main.addView(swAudio);
                  
                  Button start = new Button(this); 
                  start.setText("🚀 保存并启动服务");
                  start.setBackgroundColor(Color.parseColor("#1890ff")); 
                  start.setTextColor(Color.WHITE);
                  start.setOnClickListener(v -> {
                      boolean usePublic = rbPublic.isChecked();
                      String cloudUrl = usePublic ? "https://srv.irext.net" : ipInput.getText().toString();
                      cfg.edit()
                         .putString("docker_ip", ipInput.getText().toString())
                         .putString("local_decoder", decoderInput.getText().toString())
                         .putBoolean("is_public_cloud", usePublic)
                         .putBoolean("auto_start", swAuto.isChecked())
                         .putBoolean("force_audio", swAudio.isChecked())
                         .apply();
                         
                      Intent i = new Intent(this, IRService.class);
                      i.putExtra("CLOUD_URL", cloudUrl);
