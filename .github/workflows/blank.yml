name: IREXT_MD5_EXTRACTION_SUCCESS_BUILD

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取代码与环境初始化
        run: |
          rm -rf *
          mkdir -p app/src/main/java/com/irext/decodesdk
          mkdir -p app/src/main/java/hap/re00660/re
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/jniLibs
          echo "✅ 兵工厂已就绪"

      - name: 2. 自动化注入 JNI 硬件驱动
        run: |
          wget "https://irext-lib-release.oss-cn-hangzhou.aliyuncs.com/1.5.2/decode_sdk/libirdecode_jni_1.5.2-android.zip" -O jni.zip
          unzip jni.zip -d jni_temp
          SOURCE_DIR=$(find jni_temp -name "arm64-v8a" -type d | head -n 1 | xargs dirname)
          cp -r $SOURCE_DIR/* app/src/main/jniLibs/
          echo "✅ 硬件解码库注入成功"

      - name: 3. 编写 JNI 桥接层代码
        run: |
          cat <<EOF > app/src/main/java/com/irext/decodesdk/IRDecode.java
          package com.irext.decodesdk;
          public class IRDecode {
              static { System.loadLibrary("irdecode"); }
              public native int init();
              public native int open(int category, int subCategory, byte[] bin, int binLength);
              public native int[] decode(int keyCode, int[] acStatus);
              public native void close();
          }
          EOF

      - name: 4. 编写核心服务 (简体中文 + 动态认证 UI)
        run: |
          cat <<EOF > app/src/main/java/hap/re00660/re/IRService.java
          package hap.re00660.re;
          import android.app.*;
          import android.content.*;
          import android.hardware.ConsumerIrManager;
          import android.os.IBinder;
          import com.irext.decodesdk.IRDecode;
          import fi.iki.elonen.NanoHTTPD;
          import java.util.Map;

          public class IRService extends Service {
              private WebServer server;
              private ConsumerIrManager ir;
              private IRDecode decoder = new IRDecode();
              private SharedPreferences pref;

              @Override
              public void onCreate() {
                  super.onCreate();
                  pref = getSharedPreferences("IREXT_CFG", MODE_PRIVATE);
                  NotificationChannel ch = new NotificationChannel("IR", "HAP", NotificationManager.IMPORTANCE_LOW);
                  getSystemService(NotificationManager.class).createNotificationChannel(ch);
                  startForeground(1, new Notification.Builder(this, "IR").setContentTitle("红外网关在线").setContentText("API端口: 8080").setSmallIcon(android.R.drawable.ic_dialog_info).build());
                  
                  ir = (ConsumerIrManager) getSystemService(CONSUMER_IR_SERVICE);
                  decoder.init();
                  try { server = new WebServer(8080); server.start(); } catch (Exception e) {}
              }

              private class WebServer extends NanoHTTPD {
                  public WebServer(int port) { super(port); }
                  @Override
                  public Response serve(IHTTPSession session) {
                      Map<String, String> p = session.getParms();
                      if (p.get("save") != null) {
                          pref.edit().putString("ak", p.get("ak")).putString("as", p.get("as")).apply();
                          return newFixedLengthResponse("配置保存成功");
                      }
                      if (p.get("raw") != null) {
                          try {
                              String[] s = p.get("raw").split(",");
                              int[] pat = new int[s.length];
                              for(int i=0; i<s.length; i++) pat[i] = Integer.parseInt(s[i].trim());
                              ir.transmit(38000, pat);
                              return newFixedLengthResponse("已发射");
                          } catch (Exception e) { return newFixedLengthResponse("错误"); }
                      }

                      String html = "<html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><style>body{background:#f0f2f5;font-family:sans-serif;text-align:center;padding:20px;} .card{background:#fff;border-radius:15px;padding:20px;box-shadow:0 4px 15px rgba(0,0,0,0.1);margin-bottom:20px;} button{width:100%;padding:15px;margin:8px 0;border:none;border-radius:10px;background:#1890ff;color:white;font-size:16px;font-weight:bold;} input{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px;}</style></head><body>" +
                          "<h2>📡 IREXT 官方终端网关</h2>" +
                          "<div class='card'><h3>1. 授权配置</h3>" +
                          "<input id='ak' placeholder='App Key' value='"+pref.getString("ak","")+"'/>" +
                          "<input id='as' placeholder='App Secret' value='"+pref.getString("as","")+"'/>" +
                          "<button onclick='save()'>确认保存</button></div>" +
                          "<div class='card'><h3>2. 快速匹配</h3>" +
                          "<button style='background:#52c41a' onclick='tx()'>测试格力开机</button></div>" +
                          "<script>function save(){ fetch(\"/?save=1&ak=\"+document.getElementById(\"ak\").value+\"&as=\"+document.getElementById(\"as\").value).then(()=>alert(\"保存成功\")); } " +
                          "function tx(){ fetch(\"/?raw=9000,4500,560,1690,560,560,560,1690\").then(()=>alert(\"信号已发\")); }</script></body></html>";
                      return newFixedLengthResponse(html);
                  }
              }
              @Override public IBinder onBind(Intent intent) { return null; }
          }
          EOF

      - name: 5. 编写 MainActivity (简体中文 + Root白名单)
        run: |
          cat <<EOF > app/src/main/java/hap/re00660/re/MainActivity.java
          package hap.re00660.re;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.TextView;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  TextView tv = new TextView(this); tv.setTextSize(18); tv.setPadding(40,40,40,40); setContentView(tv);
                  new Thread(() -> {
                      try {
                          Process p = Runtime.getRuntime().exec("su");
                          java.io.DataOutputStream os = new java.io.DataOutputStream(p.getOutputStream());
                          os.writeBytes("dumpsys deviceidle whitelist +" + getPackageName() + "\n");
                          os.writeBytes("exit\n"); os.flush();
                      } catch (Exception e) {}
                  }).start();
                  startService(new Intent(this, IRService.class));
                  tv.setText("🚀 不死鸟网关已启动\n\n✅ 简体中文版\n✅ 合法包名: hap.re00660.re\n✅ 端口: 8080\n\n👇 请查看 GitHub 日志里的 MD5 指纹！");
              }
          }
          EOF

      - name: 6. 编写清单文件 (合规声明)
        run: |
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.TRANSMIT_IR" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <application android:label="HAP红外网关" android:theme="@android:style/Theme.DeviceDefault">
                  <activity android:name="hap.re00660.re.MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
                  <service android:name="hap.re00660.re.IRService" android:exported="false" />
              </application>
          </manifest>
          EOF

      - name: 7. 环境配置 (开启 AndroidX)
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: 8. 最终构建配置 (强制 API 26+)
        run: |
          echo "include ':app'" > settings.gradle
          cat <<EOF > build.gradle
          buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral(); maven { url "http://maven.irext.net/"; allowInsecureProtocol = true } } }
          EOF
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              compileSdk 34
              namespace "hap.re00660.re"
              defaultConfig { applicationId "hap.re00660.re"; minSdk 26; targetSdk 34; ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' } }
          }
          dependencies {
              implementation 'org.nanohttpd:nanohttpd:2.3.1'
              implementation 'net.irext.webapi:irext-androidapi:1.5.2'
          }
          EOF

      - name: 9. 执行编译
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: 10. 编译并【从 APK 直接提取 MD5】(暴力必出)
        run: |
          gradle assembleDebug
          echo "************************************************************"
          echo "老表！这是直接从编译出的 APK 里提取的指纹，绝对不会错："
          # 关键命令：直接读包抠指纹
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | grep MD5
          echo "************************************************************"

      - name: 11. 导出最终成品 APK
        uses: actions/upload-artifact@v4
        with:
          name: IREXT_SUCCESS_STABLE_APK
          path: app/build/outputs/apk/debug/app-debug.apk
