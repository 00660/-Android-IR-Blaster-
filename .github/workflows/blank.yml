name: IREXT_HA_PERFECT_CLIMATE

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 代码初始化
        run: |
          rm -rf *
          mkdir -p app/src/main/java/hap/re00660/re
          echo "✅ 初始化完成"

      - name: 2. 编写后端服务 (🌟集成 HA 智能空调生成器)
        run: |
          cat <<'EOF' > app/src/main/java/hap/re00660/re/IRService.java
          package hap.re00660.re;
          import android.app.*;
          import android.content.*;
          import android.hardware.ConsumerIrManager;
          import android.os.IBinder;
          import fi.iki.elonen.NanoHTTPD;
          import java.io.*;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.*;
          import com.google.gson.*;

          public class IRService extends Service {
              private WebServer server;
              private ConsumerIrManager ir;
              private SharedPreferences db;
              private String dockerUrl = "";
              private String apiId = "", apiToken = "";

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if(intent != null && intent.getStringExtra("DOCKER_URL") != null) {
                      dockerUrl = intent.getStringExtra("DOCKER_URL");
                      loginPrivateCloud();
                  }
                  return START_STICKY;
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  db = getSharedPreferences("IREXT_DB", MODE_PRIVATE);
                  try {
                      NotificationChannel ch = new NotificationChannel("IR", "ha红外网关", NotificationManager.IMPORTANCE_LOW);
                      getSystemService(NotificationManager.class).createNotificationChannel(ch);
                      startForeground(1, new Notification.Builder(this, "IR").setContentTitle("红外网关运行中").setSmallIcon(android.R.drawable.ic_dialog_info).build());
                  } catch(Throwable t) {}
                  try { ir = (ConsumerIrManager) getSystemService(CONSUMER_IR_SERVICE); } catch(Throwable t) {}
                  try { server = new WebServer(8080); server.start(); } catch (Exception e) { }
              }

              private String postJSON(String path, String jsonBody) {
                  HttpURLConnection conn = null;
                  try {
                      URL url = new URL(dockerUrl + path);
                      conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod("POST");
                      conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                      conn.setConnectTimeout(3000);
                      conn.setDoOutput(true);
                      try(OutputStream os = conn.getOutputStream()) { os.write(jsonBody.getBytes(StandardCharsets.UTF_8)); }
                      InputStream is = conn.getResponseCode() >= 400 ? conn.getErrorStream() : conn.getInputStream();
                      if (is == null) return "{}";
                      try(BufferedReader br = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8))) {
                          StringBuilder sb = new StringBuilder(); String line;
                          while((line = br.readLine()) != null) sb.append(line);
                          return sb.toString();
                      }
                  } catch (Exception e) { return "{\"error\":\""+e.getMessage()+"\"}"; }
                  finally { if(conn!=null) conn.disconnect(); }
              }

              private void loginPrivateCloud() {
                  new Thread(() -> {
                      String req = "{\"appKey\":\"55b1d89fda0658d6f851ee89cad564de\",\"appSecret\":\"83dfd86ad59843ce50342ec863a49bf0\",\"appType\":\"2\"}";
                      String res = postJSON("/irext-server/app/app_login", req);
                      try {
                          JsonObject entity = JsonParser.parseString(res).getAsJsonObject().getAsJsonObject("entity");
                          apiId = entity.get("id").getAsString();
                          apiToken = entity.get("token").getAsString();
                      } catch (Exception e) { }
                  }).start();
              }

              private class WebServer extends NanoHTTPD {
                  public WebServer(int port) { super(port); }
                  @Override
                  public Response serve(IHTTPSession session) {
                      String uri = session.getUri();
                      Map<String, String> p = session.getParms();
                      try {
                          if ("/api/list".equals(uri)) return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", db.getString("devs", "[]"));
                          
                          if ("/api/save".equals(uri)) {
                              int len = Integer.parseInt(session.getHeaders().get("content-length"));
                              byte[] buf = new byte[len]; session.getInputStream().read(buf, 0, len);
                              String body = new String(buf, StandardCharsets.UTF_8);
                              JsonArray list = JsonParser.parseString(db.getString("devs", "[]")).getAsJsonArray();
                              list.add(JsonParser.parseString(body));
                              db.edit().putString("devs", list.toString()).commit();
                              return newFixedLengthResponse("OK");
                          }
                          
                          if ("/api/delete".equals(uri)) {
                              JsonArray list = JsonParser.parseString(db.getString("devs", "[]")).getAsJsonArray();
                              JsonArray newList = new JsonArray();
                              int idx = Integer.parseInt(p.get("i"));
                              for(int i=0; i<list.size(); i++) if(i != idx) newList.add(list.get(i));
                              db.edit().putString("devs", newList.toString()).commit();
                              return newFixedLengthResponse("OK");
                          }

                          if ("/api/tx".equals(uri)) {
                              JsonObject req = new JsonObject();
                              req.addProperty("id", apiId); req.addProperty("token", apiToken);
                              req.addProperty("indexId", p.get("id")); req.addProperty("keyCode", p.get("k"));
                              req.addProperty("directDecode", "0"); req.addProperty("paraData", "0");
                              if ("1".equals(p.get("c"))) {
                                  JsonObject ac = new JsonObject();
                                  ac.addProperty("acPower", "1".equals(p.get("p"))?"0":"1");
                                  ac.addProperty("acMode", p.get("m")); ac.addProperty("acTemp", p.get("t"));
                                  ac.addProperty("acWindSpeed","0"); ac.addProperty("acWindDir","0"); ac.addProperty("changeWindDir","0");
                                  req.add("acStatus", ac);
                              }
                              String res = postJSON("/irext-server/operation/decode", req.toString());
                              JsonObject root = JsonParser.parseString(res).getAsJsonObject();
                              if (root.has("entity") && !root.get("entity").isJsonNull()) {
                                  JsonArray arr = root.getAsJsonArray("entity");
                                  int[] pat = new int[arr.size()];
                                  for (int i=0; i<arr.size(); i++) pat[i] = arr.get(i).getAsInt();
                                  ir.transmit(38000, pat);
                                  return newFixedLengthResponse("OK");
                              }
                              return newFixedLengthResponse("Fail");
                          }
                          
                          if ("/api/proxy".equals(uri)) {
                              String req = "{\"id\":\""+apiId+"\",\"token\":\""+apiToken+"\"," + p.get("b") + "}";
                              String res = postJSON(p.get("p"), req);
                              JsonObject obj = JsonParser.parseString(res).getAsJsonObject();
                              String result = obj.has("entity") ? obj.get("entity").toString() : "[]";
                              return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", result);
                          }
                      } catch(Exception e) { return newFixedLengthResponse("ERR"); }

                      // Web UI
                      String html = "<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,user-scalable=no'><title>IR Pro</title><style>body{font-family:sans-serif;background:#f0f2f5;padding:12px;margin:0 auto;max-width:500px}.card{background:#fff;border-radius:15px;padding:20px;box-shadow:0 4px 10px rgba(0,0,0,.08);margin-bottom:15px}h3{margin:0 0 15px;color:#1890ff;display:flex;justify-content:space-between;align-items:center}.btn-back{font-size:12px;background:#f5f5f5;padding:4px 10px;border-radius:6px;border:1px solid #ddd;cursor:pointer}.btn{display:block;width:100%;padding:14px 0;border:none;border-radius:12px;font-size:14px;font-weight:bold;margin-top:10px;cursor:pointer;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}.btn-p{background:#1890ff;color:#fff;border:none}.btn-g{background:#52c41a;color:#fff;border:none}.btn-r{background:#ff4d4f;color:#fff;border:none}.dev-card{background:#fff;border:1px solid #eee;padding:18px;border-radius:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}select,input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;font-size:15px}#views>div{display:none}#v_home{display:block}.panel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.num-grid{grid-template-columns:repeat(5,1fr);font-size:11px;margin-top:15px;border-top:1px dashed #eee;padding-top:15px}textarea{width:100%;height:350px;font-family:monospace;font-size:11px;background:#1e1e1e;color:#a9b7c6;padding:10px;border:1px solid #333;border-radius:8px}</style></head><body>" +
                      "<div id='views'><div id='v_home'><h3>🏠 我的设备 <button class='btn-g' style='width:auto;padding:6px 15px' onclick='goAdd()'>+ 添加</button></h3><div id='dev_list'></div></div>" +
                      "<div id='v_add'><div class='card'><h3><span onclick='goHome()' class='btn-back'>← 返回</span> 1. 选类型品牌</h3><select id='sc' onchange='lb()'></select><select id='sb' onchange='startMatch()'></select></div></div>" +
                      "<div id='v_match'><div class='card'><h3><span onclick='view(\"v_add\")' class='btn-back'>← 返回</span> 匹配中</h3><div style='text-align:center;margin:15px 0'>方案 <b id='midx' style='color:#1890ff;font-size:24px'>1</b> / <span id='mtotal'>0</span></div><button class='btn btn-p' style='height:80px' onclick='testPwr()'>📡 发送电源测试</button><div class='panel' style='grid-template-columns:1fr 1fr'><button class='btn' onclick='next()'>❌ 无反应</button><button class='btn btn-g' onclick='preSave()'>✅ 有反应</button></div></div></div>" +
                      "<div id='v_save'><div class='card'><h3><span onclick='view(\"v_match\")' class='btn-back'>← 返回</span> 3. 取名保存</h3><input id='d_name'><button class='btn btn-g' onclick='doSave()'>确认保存到手机</button></div></div>" +
                      "<div id='v_ctrl'><div class='card'><h3><span id='c_title'></span> <button class='btn-back' onclick='goHome()'>关闭</button></h3><div id='ac_st' style='text-align:center;margin-bottom:15px;color:#666;font-family:monospace'></div><div class='panel' id='btns'></div><div class='panel num-grid' id='num_btns' style='display:none'></div><button class='btn' style='background:#fdf2f2;color:#ef4444;border-color:#fecaca;margin-top:20px' onclick='showHA()'>🛠️ 生成 HA 配置</button><button class='btn btn-r' style='margin-top:10px;opacity:0.3' onclick='delDev()'>删除设备</button></div></div>" +
                      "<div id='v_ha'><div class='card'><h3>🛠️ HA 配置 <span onclick='goCtrl()' class='btn-back'>← 返回</span></h3><p style='font-size:12px;color:#999;margin-top:0'>请将以下代码追加到 configuration.yaml 最底部 (不要缩进)：</p><textarea id='ha_code' readonly onclick='this.select()'></textarea></div></div></div><script>" +
                      "const kmaps={'空调':{0:'电源',1:'模式',2:'温度+',3:'温度-',9:'风力',10:'扫风',11:'固定风'},'电视机':{0:'电源',1:'静音',2:'上',3:'下',4:'左',5:'右',6:'确认',7:'音量+',8:'音量-',9:'返回',10:'信号源',11:'菜单',12:'主页',13:'设置'},'机顶盒':{0:'电源',1:'静音',2:'上',3:'下',4:'左',5:'右',6:'确认',7:'音量+',8:'音量-',9:'返回',10:'信号源',11:'菜单',12:'上一页',13:'下一页'}};const $=i=>document.getElementById(i);let cs=[],bs=[],is=[],curr=0,ac={p:0,m:0,t:8},devs=[],curDev=null,curIdx=-1;" +
                      "function view(id){document.querySelectorAll('#views>div').forEach(d=>d.style.display='none');$(id).style.display='block'}" +
                      "function loadDevs(){fetch('/api/list?t='+Date.now()).then(r=>r.json()).then(d=>{devs=d;let h='';d.forEach((x,i)=>{h+=`<div class='dev-card' onclick='openDev(${i})'><div><b>${x.name}</b><br><small>${x.brand} | ${x.cate}</small></div><b>&gt;</b></div>`});$('dev_list').innerHTML=h||'<p style=\"text-align:center;padding:40px;color:#999\">还没有设备</p>'})}" +
                      "function goHome(){loadDevs();view('v_home');if(window.Android)Android.refresh()}" +
                      "function goAdd(){view('v_add');fetch('/api/proxy?p=/irext-server/indexing/list_categories&b=\"from\":\"0\",\"count\":\"100\"').then(r=>r.json()).then(d=>{cs=d;$('sc').innerHTML='<option>选择类型</option>'+d.map((c,i)=>'<option value='+i+'>'+(c.name_cn||c.name)+'</option>')})}" +
                      "function lb(){fetch('/api/proxy?p=/irext-server/indexing/list_brands&b=\"categoryId\":\"'+(cs[$('sc').value].id||cs[$('sc').value].categoryId)+'\",\"from\":\"0\",\"count\":\"500\"').then(r=>r.json()).then(d=>{bs=d;$('sb').innerHTML='<option>选择品牌</option>'+d.map((b,i)=>'<option value='+i+'>'+(b.name_cn||b.name)+'</option>')})}" +
                      "function startMatch(){fetch('/api/proxy?p=/irext-server/indexing/list_indexes&b=\"categoryId\":\"'+(cs[$('sc').value].id||cs[$('sc').value].categoryId)+'\",\"brandId\":\"'+(bs[$('sb').value].id||bs[$('sb').value].brandId)+'\",\"cityCode\":\"\",\"from\":\"0\",\"count\":\"500\"').then(r=>r.json()).then(d=>{is=d;curr=0;view('v_match');$('midx').innerText=1;$('mtotal').innerText=is.length})}" +
                      "function testPwr(){fire(0,is[curr],cs[$('sc').value])}" +
                      "function next(){if(curr<is.length-1){curr++;$('midx').innerText=curr+1}else{alert('试完了')}}" +
                      "function preSave(){view('v_save');let c=cs[$('sc').value],b=bs[$('sb').value];$('d_name').value=(b.name_cn||b.name||'')+' '+(c.name_cn||c.name||'')}" +
                      "function doSave(){let d={name:$('d_name').value,cate:cs[$('sc').value].name_cn||cs[$('sc').value].name,brand:bs[$('sb').value].name_cn||bs[$('sb').value].name,idx:is[curr],cid:cs[$('sc').value].id||cs[$('sc').value].categoryId};fetch('/api/save',{method:'POST',body:JSON.stringify(d)}).then(()=>{goHome()})}" +
                      "function openDev(i){curDev=devs[i];curIdx=i;view('v_ctrl');$('c_title').innerText=curDev.name;renderPanel()}" +
                      "function delDev(){if(confirm('删除?'))fetch('/api/delete?i='+curIdx).then(goHome)}" +
                      "function goCtrl(){view('v_ctrl')}" +
                      "function renderPanel(){let n=curDev.cate;let h='';let m=kmaps[n]||kmaps['电视机'];Object.keys(m).forEach(k=>{h+=`<button onclick='fireTx(${k})'>${m[k]}</button>`});$('btns').innerHTML=h;if(n=='电视机'||n=='机顶盒'||n=='IPTV'){let nh='';for(let i=0;i<=9;i++){nh+=`<button onclick='fireTx(${14+i})'>${i}</button>`}$('num_btns').innerHTML=nh;$('num_btns').style.display='grid'}else{$('num_btns').style.display='none'}if(n=='空调'||curDev.cid==1){updateAcUI();$('ac_st').style.display='block'}else{$('ac_st').style.display='none'}}" +
                      "function updateAcUI(){$('ac_st').innerText=(ac.p?'ON':'OFF')+' | '+['冷','热','自动','风','除湿'][ac.m]+' | '+(ac.t+16)+'°C'}" +
                      // 🌟 核心：智能生成带状态记忆的 HA 配置
                      "function showHA(){view('v_ha');let u='http://'+window.location.host;let id=curDev.idx.id||curDev.idx.indexId;let cid=curDev.cid;let safeName='ir_dev_'+id;let code='';if(cid==1||curDev.cate.includes('空调')){code=`# 1. 粘贴到 configuration.yaml\ninput_select:\n  ${safeName}_mode:\n    options: ['off', 'cool', 'heat', 'auto', 'fan_only']\ninput_number:\n  ${safeName}_temp:\n    min: 16\n    max: 30\n    step: 1\nrest_command:\n  ${safeName}_set:\n    url: \"${u}/api/tx?id=${id}&c=1&k={{k}}&p={{p}}&m={{m}}&t={{t}}\"\n    method: GET\n\nclimate:\n  - platform: template\n    name: \"${curDev.name}\"\n    hvac_mode_template: \"{{ states('input_select.${safeName}_mode') }}\"\n    target_temperature_template: \"{{ states('input_number.${safeName}_temp') }}\"\n    set_hvac_mode:\n      - service: input_select.select_option\n        target: { entity_id: input_select.${safeName}_mode }\n        data: { option: \"{{ hvac_mode }}\" }\n      - service: rest_command.${safeName}_set\n        data:\n          k: 0\n          p: \"{{ 0 if hvac_mode == 'off' else 1 }}\"\n          m: \"{{ 0 if hvac_mode == 'cool' else 1 }}\"\n          t: 8\n    set_temperature:\n      - service: input_number.set_value\n        target: { entity_id: input_number.${safeName}_temp }\n        data: { value: \"{{ temperature }}\" }\n      - service: rest_command.${safeName}_set\n        data:\n          k: 2\n          p: 1\n          m: 0\n          t: \"{{ (temperature - 16)|int }}\"`;}else{code=`# 2. 粘贴到 configuration.yaml\nrest_command:\n  ${safeName}_cmd:\n    url: \"${u}/api/tx?id=${id}&c=${cid}&k={{k}}&p=0&m=0&t=0\"\n\nmedia_player:\n  - platform: universal\n    name: \"${curDev.name}\"\n    commands:\n      turn_on: { service: rest_command.${safeName}_cmd, data: {k: 0} }\n      turn_off: { service: rest_command.${safeName}_cmd, data: {k: 0} }\n      volume_up: { service: rest_command.${safeName}_cmd, data: {k: 7} }\n      volume_down: { service: rest_command.${safeName}_cmd, data: {k: 8} }`;}$('ha_code').value=code;}" +
                      "function fireTx(k){fire(k, curDev.idx, {name_cn:curDev.cate, id:curDev.cid})}" +
                      "function fire(k, idx, cateObj){let cid=cateObj.id;if(cid==1){if(k==0)ac.p=1-ac.p;if(k==1)ac.m=(ac.m+1)%5;if(k==2)ac.t=Math.min(14,ac.t+1);if(k==3)ac.t=Math.max(0,ac.t-1);updateAcUI()}fetch(`/api/tx?id=${idx.id||idx.indexId}&c=${cid}&k=${k}&p=${ac.p}&m=${ac.m}&t=${ac.t}`).then(r=>r.text())}\n goHome();</script></body></html>";
                      return newFixedLengthResponse(Response.Status.OK, "text/html; charset=UTF-8", html);
                  }
              }
              @Override public IBinder onBind(Intent intent) { return null; }
          }
          EOF

      - name: 3. 编写控制台 UI (🌟Root 开关/状态显示 完美回归)
        run: |
          cat <<EOF > app/src/main/java/hap/re00660/re/MainActivity.java
          package hap.re00660.re;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.*;
          import android.webkit.*;
          import android.widget.*;
          import com.google.gson.*;
          import java.net.*;
          import java.util.*;
          import java.io.*;

          public class MainActivity extends Activity {
              private SharedPreferences db, cfg;
              private LinearLayout listArea;
              private WebView webView;
              private EditText ipInput;
              private Switch rootSwitch;
              private TextView statusTv;
              private boolean isWeb = false;

              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  db = getSharedPreferences("IREXT_DB", MODE_PRIVATE);
                  cfg = getSharedPreferences("IREXT_CFG", MODE_PRIVATE);

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.parseColor("#F1F5F9"));

                  LinearLayout main = new LinearLayout(this);
                  main.setOrientation(LinearLayout.VERTICAL);
                  main.setPadding(40, 40, 40, 40);

                  TextView title = new TextView(this); title.setText("📡 ha红外网关 Pro"); title.setTextSize(24);
                  main.addView(title);

                  statusTv = new TextView(this); statusTv.setText("状态: 未启动");
                  statusTv.setTextColor(Color.RED); main.addView(statusTv);

                  TextView myIp = new TextView(this);
                  myIp.setText("\n访问地址: http://" + getLocalIp() + ":8080");
                  myIp.setTextColor(Color.parseColor("#2563EB")); main.addView(myIp);

                  EditText ip = new EditText(this); ip.setHint("Docker IP:8081");
                  ip.setText(cfg.getString("docker_ip", "http://192.168.1.100:8081"));
                  ipInput = ip; main.addView(ip);

                  rootSwitch = new Switch(this); rootSwitch.setText("Root 保活 (推荐开启)");
                  rootSwitch.setChecked(cfg.getBoolean("use_root", false)); main.addView(rootSwitch);

                  Button start = new Button(this); start.setText("保存并启动网关");
                  start.setOnClickListener(v -> {
                      String dockerIp = ipInput.getText().toString();
                      boolean useRoot = rootSwitch.isChecked();
                      cfg.edit().putString("docker_ip", dockerIp).putBoolean("use_root", useRoot).apply();
                      
                      if(useRoot) {
                          new Thread(() -> {
                              try {
                                  Process p = Runtime.getRuntime().exec("su");
                                  DataOutputStream os = new DataOutputStream(p.getOutputStream());
                                  os.writeBytes("dumpsys deviceidle whitelist +" + getPackageName() + "\n");
                                  os.writeBytes("exit\n"); os.flush();
                              } catch (Exception e) {}
                          }).start();
                      } else {
                          try { startActivity(new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:"+getPackageName()))); } catch(Exception e){}
                      }

                      Intent i = new Intent(this, IRService.class);
                      i.putExtra("DOCKER_URL", dockerIp);
                      startForegroundService(i);
                      statusTv.setText("状态: 运行中 (HA已连接)"); statusTv.setTextColor(Color.parseColor("#16a34a"));
                  });
                  main.addView(start);

                  Button add = new Button(this); add.setText("+ 添加红外设备");
                  add.setOnClickListener(v -> openWeb());
                  main.addView(add);

                  TextView lt = new TextView(this); lt.setText("\n📱 已存设备 (同步):");
                  main.addView(lt);

                  ScrollView scView = new ScrollView(this);
                  listArea = new LinearLayout(this); listArea.setOrientation(LinearLayout.VERTICAL);
                  scView.addView(listArea); main.addView(scView);
                  root.addView(main);

                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface public void refresh() { runOnUiThread(() -> refreshList()); }
                  }, "Android");
                  webView.setVisibility(View.GONE);
                  root.addView(webView);

                  setContentView(root);
                  refreshList();
              }

              private void openWeb() {
                  isWeb = true; webView.setVisibility(View.VISIBLE);
                  webView.loadUrl("http://127.0.0.1:8080");
              }

              @Override
              public void onBackPressed() {
                  if(isWeb) { isWeb = false; webView.setVisibility(View.GONE); refreshList(); }
                  else super.onBackPressed();
              }

              private void refreshList() {
                  listArea.removeAllViews();
                  try {
                      JsonArray arr = JsonParser.parseString(db.getString("devs", "[]")).getAsJsonArray();
                      for (int i = 0; i < arr.size(); i++) {
                          JsonObject o = arr.get(i).getAsJsonObject();
                          Button b = new Button(this); b.setAllCaps(false);
                          b.setText(o.get("name").getAsString() + " (" + o.get("brand").getAsString() + ")");
                          listArea.addView(b);
                      }
                  } catch(Exception e) {}
              }

              private String getLocalIp() {
                  try {
                      for (NetworkInterface n : Collections.list(NetworkInterface.getNetworkInterfaces())) {
                          for (InetAddress a : Collections.list(n.getInetAddresses())) {
                              if (!a.isLoopbackAddress() && a instanceof Inet4Address) return a.getHostAddress();
                          }
                      }
                  } catch (Exception e) {}
                  return "127.0.0.1";
              }
          }
          EOF

      - name: 4. 构建配置与清单
