name: IREXT_CRASH_FIX_ANDROID14

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 代码初始化
        run: |
          rm -rf *
          mkdir -p app/src/main/java/hap/re00660/re
          echo "✅ 初始化完成"

      - name: 2. 编写核心服务 (🌟修复 Android 14 前台服务崩溃问题)
        run: |
          cat <<'EOF' > app/src/main/java/hap/re00660/re/IRService.java
          package hap.re00660.re;
          import android.app.*;
          import android.content.*;
          import android.content.pm.ServiceInfo;
          import android.hardware.ConsumerIrManager;
          import android.media.*;
          import android.os.Build;
          import android.os.IBinder;
          import fi.iki.elonen.NanoHTTPD;
          import java.io.*;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.*;
          import com.google.gson.*;

          public class IRService extends Service {
              private ConsumerIrManager ir;
              private SharedPreferences db, cfg;
              private String targetCloudUrl = "";
              private String apiId = "", apiToken = "";

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if(intent != null && intent.getStringExtra("DOCKER_URL") != null) {
                      targetCloudUrl = intent.getStringExtra("DOCKER_URL");
                      loginPrivateCloud();
                  }
                  return START_STICKY;
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  db = getSharedPreferences("IREXT_DATABASE", MODE_PRIVATE);
                  cfg = getSharedPreferences("IREXT_CFG", MODE_PRIVATE);
                  
                  try {
                      String chId = "IR_SRV_FG";
                      if (Build.VERSION.SDK_INT >= 26) {
                          NotificationChannel ch = new NotificationChannel(chId, "网关保活", NotificationManager.IMPORTANCE_HIGH);
                          getSystemService(NotificationManager.class).createNotificationChannel(ch);
                      }
                      
                      Notification.Builder nb = (Build.VERSION.SDK_INT >= 26) ? 
                          new Notification.Builder(this, chId) : new Notification.Builder(this);
                          
                      Notification n = nb.setContentTitle("📡 红外网关运行中")
                          .setContentText("端口: 8080 | 服务正常")
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setOngoing(true)
                          .build();

                      // 🌟 核心防崩修复：适配 Android 14 的带类型启动
                      if (Build.VERSION.SDK_INT >= 29) {
                          startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC);
                      } else {
                          startForeground(1, n);
                      }
                  } catch (Exception e) {
                      // 就算通知栏炸了，也不要让应用闪退
                      e.printStackTrace();
                  }

                  try { ir = (ConsumerIrManager) getSystemService(CONSUMER_IR_SERVICE); } catch(Throwable t) {}
                  
                  // 端口防冲撞
                  try { new WebServer(8080).start(); } catch (Exception e) { 
                      try { new WebServer(8081).start(); } catch(Exception ex){} 
                  }
              }

              private void transmitAudioHeadset(int[] pattern, int freq) {
                  int sampleRate = 48000; int carrier = freq / 2;
                  int total = 0; for (int p : pattern) total += p;
                  short[] buffer = new short[(int)((total/1000000.0)*sampleRate)*2];
                  int frameIndex = 0; boolean mark = true;
                  boolean isolate = cfg.getBoolean("isolate_tts", false);
                  for (int d : pattern) {
                      int c = (int)((d / 1000000.0) * sampleRate);
                      for (int i=0; i<c; i++) {
                          if (mark && frameIndex*2+1 < buffer.length) {
                              short v = (short)(Math.sin(2 * Math.PI * carrier * (frameIndex/(double)sampleRate)) * 32767);
                              if(isolate){ buffer[frameIndex * 2] = 0; buffer[frameIndex * 2 + 1] = v; } 
                              else { buffer[frameIndex * 2] = v; buffer[frameIndex * 2 + 1] = (short)-v; }
                          }
                          frameIndex++;
                      }
                      mark = !mark;
                  }
                  try {
                      AudioTrack track = new AudioTrack(AudioManager.STREAM_MUSIC, sampleRate, AudioFormat.CHANNEL_OUT_STEREO, AudioFormat.ENCODING_PCM_16BIT, buffer.length * 2, AudioTrack.MODE_STATIC);
                      track.write(buffer, 0, buffer.length); track.play();
                  } catch (Exception e) {}
              }

              private String postJSON(String path, String jsonBody) {
                  HttpURLConnection conn = null;
                  try {
                      URL url = new URL(targetCloudUrl + path);
                      conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod("POST");
                      conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                      conn.setConnectTimeout(3000); conn.setDoOutput(true);
                      try(OutputStream os = conn.getOutputStream()) { os.write(jsonBody.getBytes(StandardCharsets.UTF_8)); }
                      InputStream is = conn.getResponseCode() >= 400 ? conn.getErrorStream() : conn.getInputStream();
                      if (is == null) return "{\"status\":{\"code\":1}}";
                      try(BufferedReader br = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8))) {
                          StringBuilder sb = new StringBuilder(); String line;
                          while((line = br.readLine()) != null) sb.append(line);
                          return sb.toString();
                      }
                  } catch (Exception e) { return "{\"status\":{\"code\":1}}"; }
                  finally { if(conn!=null) conn.disconnect(); }
              }

              private void loginPrivateCloud() {
                  new Thread(() -> {
                      String res = postJSON("/irext-server/app/app_login", "{\"appKey\":\"55b1d89fda0658d6f851ee89cad564de\",\"appSecret\":\"83dfd86ad59843ce50342ec863a49bf0\",\"appType\":\"2\"}");
                      try {
                          JsonObject entity = JsonParser.parseString(res).getAsJsonObject().getAsJsonObject("entity");
                          apiId = entity.get("id").getAsString(); apiToken = entity.get("token").getAsString();
                      } catch (Exception e) { }
                  }).start();
              }

              private class WebServer extends NanoHTTPD {
                  public WebServer(int port) { super(port); }
                  @Override
                  public Response serve(IHTTPSession session) {
                      String uri = session.getUri();
                      Map<String, String> p = session.getParms();
                      try {
                          if ("/api/list".equals(uri)) return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", db.getString("devs", "[]"));
                          if ("/api/save".equals(uri)) {
                              int len = Integer.parseInt(session.getHeaders().get("content-length"));
                              byte[] buf = new byte[len]; session.getInputStream().read(buf, 0, len);
                              JsonArray list = JsonParser.parseString(db.getString("devs", "[]")).getAsJsonArray();
                              list.add(JsonParser.parseString(new String(buf, StandardCharsets.UTF_8)));
                              db.edit().putString("devs", list.toString()).commit();
                              return newFixedLengthResponse("OK");
                          }
                          if ("/api/delete".equals(uri)) {
                              JsonArray list = JsonParser.parseString(db.getString("devs", "[]")).getAsJsonArray();
                              JsonArray newList = new JsonArray();
                              int idx = Integer.parseInt(p.get("i"));
                              for(int i=0; i<list.size(); i++) if(i != idx) newList.add(list.get(i));
                              db.edit().putString("devs", newList.toString()).commit();
                              return newFixedLengthResponse("OK");
                          }
                          if ("/api/tx".equals(uri)) {
                              JsonObject req = new JsonObject();
                              req.addProperty("id", String.valueOf(apiId));
                              req.addProperty("token", apiToken);
                              req.addProperty("indexId", String.valueOf(p.get("id")));
                              req.addProperty("keyCode", String.valueOf(p.get("k")));
                              req.addProperty("directDecode", "0");
                              req.addProperty("paraData", "0");
                              if ("1".equals(p.get("c"))) {
                                  JsonObject ac = new JsonObject();
                                  ac.addProperty("acPower", "1".equals(p.get("p"))?"0":"1");
                                  ac.addProperty("acMode", p.get("m")); ac.addProperty("acTemp", p.get("t"));
                                  ac.addProperty("acWindSpeed","0"); ac.addProperty("acWindDir","0"); ac.addProperty("changeWindDir","0");
                                  req.add("acStatus", ac);
                              }
                              String res = postJSON("/irext-server/operation/decode", req.toString());
                              JsonObject root = JsonParser.parseString(res).getAsJsonObject();
                              if (root.has("entity") && !root.get("entity").isJsonNull()) {
                                  JsonArray arr = root.getAsJsonArray("entity");
                                  int[] pat = new int[arr.size()];
                                  for (int i=0; i<arr.size(); i++) pat[i] = arr.get(i).getAsInt();
                                  int freq = 38000;
                                  if(root.has("frequency") && "1".equals(root.get("frequency").getAsString())) freq = 56000;
                                  if (ir != null && ir.hasIrEmitter() && !cfg.getBoolean("force_audio", false)) {
                                      ir.transmit(freq, pat);
                                  } else { transmitAudioHeadset(pat, freq); }
                                  return newFixedLengthResponse("OK");
                              }
                              return newFixedLengthResponse("Fail");
                          }
                          if ("/api/proxy".equals(uri)) {
                              String res = postJSON(p.get("p"), "{\"id\":\""+apiId+"\",\"token\":\""+apiToken+"\"," + p.get("b") + "}");
                              return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", JsonParser.parseString(res).getAsJsonObject().has("entity")?JsonParser.parseString(res).getAsJsonObject().get("entity").toString():"[]");
                          }
                      } catch(Exception e) { return newFixedLengthResponse("ERR"); }
                      
                      // 🌟 UI: 完美保持不变
                      String html = "<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>IR Pro</title><style>body{font-family:sans-serif;background:#f0f2f5;padding:12px;margin:0 auto;max-width:500px}.card{background:#fff;padding:20px;border-radius:15px;margin-bottom:15px;box-shadow:0 2px 5px rgba(0,0,0,.05)}select,input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}.btn{width:100%;padding:14px;margin-top:10px;background:#1890ff;color:#fff;border:none;border-radius:10px;font-weight:bold}.btn-gray{background:#f5f5f5;color:#333}.panel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}#views>div{display:none}#v_home{display:block}</style></head><body>" +
                      "<div id='views'><div id='v_home'><h3>🏠 设备列表 <button class='btn' style='width:auto;float:right;margin:0;padding:5px 15px;background:#52c41a' onclick='goAdd()'>+ 添加</button></h3><div id='dev_list'></div></div>" +
                      "<div id='v_add'><div class='card'><h3>1. 选品牌</h3><select id='sc' onchange='checkCate()'></select><div id='brand_area'><select id='sb' onchange='startMatch()'></select></div><div id='stb_area' style='display:none'><select id='sp' onchange='loadProv()'></select><select id='sct' onchange='loadCity()'></select><select id='sop' onchange='startMatchSTB()'></select></div><button class='btn btn-gray' onclick='goHome()'>返回</button></div></div>" +
                      "<div id='v_match'><div class='card'><h3>匹配中 <span id='midx'>1</span>/<span id='mtotal'>0</span></h3><button class='btn' onclick='testPwr()'>📡 测试电源</button><div class='panel' style='grid-template-columns:1fr 1fr'><button class='btn btn-gray' onclick='next()'>❌ 无反应</button><button class='btn' style='background:#52c41a' onclick='preSave()'>✅ 保存</button></div><button class='btn btn-gray' onclick='view(\"v_add\")'>返回</button></div></div>" +
                      "<div id='v_save'><div class='card'><h3>保存设备</h3><input id='d_name'><button class='btn' onclick='doSave()'>确认</button><button class='btn btn-gray' onclick='view(\"v_match\")'>返回</button></div></div>" +
                      "<div id='v_ctrl'><div class='card'><h3 id='c_title'></h3><div id='ac_st' style='text-align:center;margin-bottom:10px;color:#666'></div><div class='panel' id='btns'></div><div class='panel' id='num_btns' style='display:none;grid-template-columns:repeat(5,1fr);margin-top:10px'></div><button class='btn btn-gray' onclick='showHA()'>HA 配置</button><button class='btn' style='background:#ff4d4f' onclick='delDev()'>删除</button><button class='btn btn-gray' onclick='goHome()'>关闭</button></div></div>" +
                      "<div id='v_ha'><div class='card'><h3>HA YAML</h3><textarea id='ha_code' style='width:100%;height:300px'></textarea><button class='btn btn-gray' onclick='goCtrl()'>返回</button></div></div></div>" +
                      "<script>const kmaps={'空调':{0:'电源',1:'模式',2:'温度+',3:'温度-',9:'风力',10:'扫风',11:'固定风'},'电视机':{0:'电源',1:'静音',2:'上',3:'下',4:'左',5:'右',6:'确认',7:'音量+',8:'音量-',9:'返回',10:'源',11:'菜单',12:'主页',13:'设置'},'机顶盒':{0:'电源',1:'静音',2:'上',3:'下',4:'左',5:'右',6:'确认',7:'音量+',8:'音量-',9:'返回',10:'源',11:'菜单',12:'上页',13:'下页'}};const $=i=>document.getElementById(i);let cs=[],bs=[],is=[],curr=0,ac={p:0,m:0,t:8},devs=[],curDev=null,curIdx=-1,isSTB=false;" +
                      "function view(id){document.querySelectorAll('#views>div').forEach(d=>d.style.display='none');$(id).style.display='block'}" +
                      "function loadDevs(){fetch('/api/list?t='+Date.now()).then(r=>r.json()).then(d=>{devs=d;let h='';d.forEach((x,i)=>{h+=`<div style='padding:15px;background:#fff;border-bottom:1px solid #eee' onclick='openDev(${i})'><b>${x.name}</b> <small style='color:#999'>${x.brand}</small></div>`});$('dev_list').innerHTML=h||'<div style=\"padding:20px;text-align:center\">无设备</div>'})}" +
                      "function goHome(){loadDevs();view('v_home');if(window.Android)Android.refresh()}" +
                      "function goAdd(){view('v_add');fetch('/api/proxy?p=/irext-server/indexing/list_categories&b=\"from\":\"0\",\"count\":\"100\"').then(r=>r.json()).then(res=>{cs=res.entity;$('sc').innerHTML='<option>类型</option>'+cs.map((c,i)=>(`<option value=${i}>${c.name_cn||c.name}</option>`))})}" +
                      "function checkCate(){let cid=cs[$('sc').value].id;isSTB=(cid==3);if(isSTB){$('brand_area').style.display='none';$('stb_area').style.display='block';loadProv();}else{$('brand_area').style.display='block';$('stb_area').style.display='none';lb()}}" +
                      "function lb(){fetch('/api/proxy?p=/irext-server/indexing/list_brands&b=\"categoryId\":\"'+cs[$('sc').value].id+'\",\"from\":\"0\",\"count\":\"500\"').then(r=>r.json()).then(res=>{bs=res.entity;$('sb').innerHTML='<option>品牌</option>'+bs.map((b,i)=>(`<option value=${i}>${b.name_cn||b.name}</option>`))})}" +
                      "function loadProv(){fetch('/api/proxy?p=/irext-server/indexing/list_provinces&b=\"\"').then(r=>r.json()).then(res=>{let d=res.entity;$('sp').innerHTML='<option>选省</option>'+d.map(p=>`<option value=${p.code}>${p.name}</option>`)} )}" +
                      "function loadCity(){fetch('/api/proxy?p=/irext-server/indexing/list_cities&b=\"provincePrefix\":\"'+$('sp').value.substring(0,2)+'\"').then(r=>r.json()).then(res=>{let d=res.entity;$('sct').innerHTML='<option>选市</option>'+d.map(c=>`<option value=${c.code}>${c.name}</option>`)} )}" +
                      "function loadOp(){fetch('/api/proxy?p=/irext-server/indexing/list_operators&body=\"cityCode\":\"'+$('sct').value+'\",\"from\":\"0\",\"count\":\"100\"').then(r=>r.json()).then(res=>{bs=res.entity;$('sop').innerHTML='<option>选运营商</option>'+bs.map((o,i)=>`<option value=${i}>${o.operatorName}</option>`)} )}" +
                      "function startMatch(){fetch('/api/proxy?p=/irext-server/indexing/list_indexes&body=\"categoryId\":\"'+cs[$('sc').value].id+'\",\"brandId\":\"'+bs[$('sb').value].id+'\",\"cityCode\":\"\",\"from\":\"0\",\"count\":\"500\"').then(r=>r.json()).then(res=>{is=res.entity;curr=0;view('v_match');$('midx').innerText=1;$('mtotal').innerText=is.length})}" +
                      "function startMatchSTB(){fetch('/api/proxy?p=/irext-server/indexing/list_indexes&body=\"categoryId\":\"3\",\"brandId\":\"0\",\"cityCode\":\"'+$('sct').value+'\",\"operatorId\":\"'+bs[$('sop').value].operatorId+'\",\"from\":\"0\",\"count\":\"500\"').then(r=>r.json()).then(res=>{is=res.entity;curr=0;view('v_match');$('midx').innerText=1;$('mtotal').innerText=is.length})}" +
                      "function testPwr(){fire(0,is[curr],cs[$('sc').value])}" +
                      "function next(){if(curr<is.length-1){curr++;$('midx').innerText=curr+1}else{alert('没方案了')}}" +
                      "function preSave(){view('v_save');let b=isSTB?bs[$('sop').value].operatorName:bs[$('sb').value].name_cn;$('d_name').value=b+' '+(cs[$('sc').value].name_cn||'设备')}" +
                      "function doSave(){let b=isSTB?bs[$('sop').value].operatorName:bs[$('sb').value].name_cn;let d={name:$('d_name').value,cate:cs[$('sc').value].name_cn||cs[$('sc').value].name,brand:b,idx:is[curr],cid:cs[$('sc').value].id};fetch('/api/save',{method:'POST',body:JSON.stringify(d)}).then(()=>goHome())}" +
                      "function openDev(i){curDev=devs[i];view('v_ctrl');$('c_title').innerText=curDev.name;renderPanel()}" +
                      "function delDev(){if(confirm('删除?'))fetch('/api/delete?i='+devs.indexOf(curDev)).then(goHome)}" +
                      "function renderPanel(){let n=curDev.cate;let h='';let m=kmaps[n]||kmaps['电视机'];Object.keys(m).forEach(k=>{h+=`<button onclick='fireTx(${k})' class='btn'>${m[k]}</button>`});$('btns').innerHTML=h;if(n.includes('电视')||n.includes('机顶盒')){let nh='';for(let i=0;i<=9;i++)nh+=`<button class='btn' onclick='fireTx(${14+i})'>${i}</button>`;$('num_btns').innerHTML=nh;$('num_btns').style.display='grid'}else{$('num_btns').style.display='none'}if(n.includes('空调')||curDev.cid==1){updateAcUI();$('ac_st').style.display='block'}else{$('ac_st').style.display='none'}}" +
                      "function updateAcUI(){$('ac_st').innerText=(ac.p?'ON':'OFF')+' | '+['冷','热','自动','风','除湿'][ac.m]+' | '+(ac.t+16)+'°C'}" +
                      "function showHA(){view('v_ha');let u=location.origin;let n='ir_'+curDev.idx.id;let code='';if(curDev.cid==1){code=`template:\\n  - climate:\\n      name: \"${curDev.name}\"\\n      unique_id: ${n}_climate\\n      hvac_modes: ['off','cool','heat']\\n      set_hvac_mode:\\n        service: rest_command.${n}_set\\n          data: { k:0, p:\"{{0 if hvac_mode==\\'off\\' else 1}}\", m:0, t:8 }`;}else{code=`media_player:\\n  - platform: universal\\n    name: \"${curDev.name}\"\\n    commands:\\n      turn_on: { service: rest_command.${n}_cmd, data: {k: 0} }\\n      turn_off: { service: rest_command.${n}_cmd, data: {k: 0} }`;}$('ha_code').value=`rest_command:\\n  ${n}_${curDev.cid==1?'set':'cmd'}: { url: \"${u}/api/tx?id=${curDev.idx.id}&c=${curDev.cid}&k={{k}}&p={{p}}&m={{m}}&t={{t}}\" }\\n\\n`+code}" +
                      "function fireTx(k){fire(k, curDev.idx, {name_cn:curDev.cate, id:curDev.cid})}" +
                      "function fire(k, idx, cateObj){if(cateObj.id==1){if(k==0)ac.p=1-ac.p;if(k==1)ac.m=(ac.m+1)%5;if(k==2)ac.t=Math.min(14,ac.t+1);if(k==3)ac.t=Math.max(0,ac.t-1);if(k==10)ac.wd=1-ac.wd;updateAcUI()}fetch(`/api/tx?id=${idx.id||idx.indexId}&c=${cateObj.id}&k=${k}&p=${ac.p}&m=${ac.m}&t=${ac.t}&wd=${ac.wd}`).then(r=>r.text())}\n goHome();</script></body></html>";
                      return newFixedLengthResponse(Response.Status.OK, "text/html; charset=UTF-8", html);
                  }
              }
              @Override public IBinder onBind(Intent intent) { return null; }
          }
          EOF

      - name: 3. 编写主控 UI (保持不变)
        run: |
          cat <<EOF > app/src/main/java/hap/re00660/re/MainActivity.java
          package hap.re00660.re;
          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.*;
          import android.webkit.*;
          import android.widget.*;
          import com.google.gson.*;
          import java.net.*;
          import java.util.*;
          import java.io.*;

          public class MainActivity extends Activity {
              private SharedPreferences db, cfg;
              private LinearLayout listArea;
              private WebView webView;
              private EditText ipInput;
              private RadioGroup cloudGroup;
              private Switch rootSwitch;
              private TextView statusTv;
              private boolean isWeb = false;

              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  db = getSharedPreferences("IREXT_DATABASE", MODE_PRIVATE);
                  cfg = getSharedPreferences("IREXT_CFG", MODE_PRIVATE);
                  
                  if (Build.VERSION.SDK_INT >= 33) {
                      if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                      }
                  }

                  FrameLayout rootLayout = new FrameLayout(this);
                  rootLayout.setBackgroundColor(Color.parseColor("#F1F5F9"));
                  LinearLayout main = new LinearLayout(this);
                  main.setOrientation(LinearLayout.VERTICAL);
                  main.setPadding(40, 40, 40, 40);

                  TextView title = new TextView(this); title.setText("📡 ha红外网关 Pro Max"); title.setTextSize(22);
                  main.addView(title);

                  statusTv = new TextView(this); statusTv.setText("🔴 状态: 未启动");
                  statusTv.setTextColor(Color.RED); main.addView(statusTv);

                  TextView myIp = new TextView(this);
                  myIp.setText("\n访问地址: http://" + getLocalIp() + ":8080");
                  myIp.setTextColor(Color.parseColor("#2563EB")); main.addView(myIp);

                  TextView cl = new TextView(this); cl.setText("\n☁️ 云端选择:"); main.addView(cl);
                  cloudGroup = new RadioGroup(this); cloudGroup.setOrientation(LinearLayout.HORIZONTAL);
                  RadioButton rbPub = new RadioButton(this); rbPub.setText("公有云");
                  RadioButton rbPri = new RadioButton(this); rbPri.setText("私有云");
                  cloudGroup.addView(rbPub); cloudGroup.addView(rbPri); main.addView(cloudGroup);
                  
                  ipInput = new EditText(this); ipInput.setHint("Docker IP:8081");
                  ipInput.setText(cfg.getString("docker_ip", "http://192.168.2.157:8081"));
                  main.addView(ipInput);

                  boolean isPublic = cfg.getBoolean("is_public_cloud", false);
                  rbPub.setChecked(isPublic); rbPri.setChecked(!isPublic);
                  ipInput.setVisibility(isPublic ? View.GONE : View.VISIBLE);
                  cloudGroup.setOnCheckedChangeListener((g, id) -> {
                      ipInput.setVisibility(id == rbPub.getId() ? View.GONE : View.VISIBLE);
                  });

                  rootSwitch = new Switch(this); rootSwitch.setText("启用 Root 保活");
                  rootSwitch.setChecked(cfg.getBoolean("use_root", true)); main.addView(rootSwitch);

                  Switch swAuto = new Switch(this); swAuto.setText("允许开机自启");
                  swAuto.setChecked(cfg.getBoolean("auto_start", true)); main.addView(swAuto);

                  Switch swAudio = new Switch(this); swAudio.setText("强制耳机孔红外");
                  swAudio.setChecked(cfg.getBoolean("force_audio", false)); main.addView(swAudio);
                  
                  Switch swIso = new Switch(this); swIso.setText("隔离TTS (左声到喇叭)");
                  swIso.setChecked(cfg.getBoolean("isolate_tts", false)); main.addView(swIso);

                  Button start = new Button(this); start.setText("保存并启动网关");
                  start.setBackgroundColor(Color.parseColor("#1890ff")); start.setTextColor(Color.WHITE);
                  start.setOnClickListener(v -> {
                      boolean pub = rbPub.isChecked();
                      cfg.edit().putString("docker_ip", ipInput.getText().toString()).putBoolean("is_public_cloud", pub)
                         .putBoolean("use_root", rootSwitch.isChecked()).putBoolean("auto_start", swAuto.isChecked())
                         .putBoolean("force_audio", swAudio.isChecked()).putBoolean("isolate_tts", swIso.isChecked()).apply();
                      
                      if(rootSwitch.isChecked()) {
                          new Thread(() -> {
                              try {
                                  Process p = Runtime.getRuntime().exec("su");
                                  DataOutputStream os = new DataOutputStream(p.getOutputStream());
                                  os.writeBytes("dumpsys deviceidle whitelist +" + getPackageName() + "\n");
                                  os.writeBytes("exit\n"); os.flush();
                              } catch (Exception e) {}
                          }).start();
                      }

                      Intent i = new Intent(this, IRService.class);
                      i.putExtra("DOCKER_URL", pub ? "http://srv.irext.net" : ipInput.getText().toString());
                      startForegroundService(i);
                      statusTv.setText("🟢 状态: 运行中 (HA已连接)"); statusTv.setTextColor(Color.parseColor("#16a34a"));
                  });
                  main.addView(start);

                  Button btnMag = new Button(this); btnMag.setText("🔥 注入面具模块");
                  btnMag.setBackgroundColor(Color.parseColor("#ef4444")); btnMag.setTextColor(Color.WHITE);
                  btnMag.setOnClickListener(v -> deployMagisk()); main.addView(btnMag);

                  Button add = new Button(this); add.setText("+ 设备管理面板");
                  add.setOnClickListener(v -> openWeb()); main.addView(add);

                  TextView lt = new TextView(this); lt.setText("\n📱 已存设备列表:");
                  main.addView(lt);
                  ScrollView scView = new ScrollView(this);
                  listArea = new LinearLayout(this); listArea.setOrientation(LinearLayout.VERTICAL);
                  scView.addView(listArea); main.addView(scView);
                  rootLayout.addView(main);

                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface public void refresh() { runOnUiThread(() -> refreshList()); }
                  }, "Android");
                  webView.setVisibility(View.GONE);
                  rootLayout.addView(webView);
                  setContentView(rootLayout);
                  refreshList();
              }

              private void deployMagisk() {
                  new Thread(() -> {
                      try {
                          Process p = Runtime.getRuntime().exec("su");
                          DataOutputStream os = new DataOutputStream(p.getOutputStream());
                          String script = "MOD=\"/data/adb/modules/irext_daemon\"\nrm -rf $MOD\nmkdir -p $MOD/system/priv-app/IRGateway\n" +
                                          "cp \"" + getApplicationInfo().sourceDir + "\" $MOD/system/priv-app/IRGateway/IRGateway.apk\n" +
                                          "echo 'id=irext_daemon\nname=红外网关守护\nversion=vMax\nauthor=极客\ndescription=保活。' > $MOD/module.prop\n" +
                                          "echo '#!/system/bin/sh\nuntil [ \"$(getprop sys.boot_completed)\" = \"1\" ]; do sleep 1; done\ndumpsys deviceidle whitelist +" + getPackageName() + "\nam start-foreground-service -n " + getPackageName() + "/.IRService' > $MOD/service.sh\n" +
                                          "chmod -R 755 $MOD\ntouch $MOD/update\nexit\n";
                          os.writeBytes(script); os.flush(); p.waitFor();
                          runOnUiThread(() -> Toast.makeText(this, "成功，请重启！", 1).show());
                      } catch (Exception e) {}
                  }).start();
              }

              private void openWeb() { isWeb = true; webView.setVisibility(View.VISIBLE); webView.loadUrl("http://127.0.0.1:8080"); }
              @Override public void onBackPressed() { if(isWeb) { isWeb = false; webView.setVisibility(View.GONE); refreshList(); } else super.onBackPressed(); }
              private void refreshList() {
                  listArea.removeAllViews();
                  try {
                      JsonArray arr = JsonParser.parseString(db.getString("devs", "[]")).getAsJsonArray();
                      for (int i = 0; i < arr.size(); i++) {
                          Button b = new Button(this); b.setAllCaps(false);
                          b.setText(arr.get(i).getAsJsonObject().get("name").getAsString());
                          listArea.addView(b);
                      }
                  } catch(Exception e) {}
              }
              private String getLocalIp() { try { for (NetworkInterface n : Collections.list(NetworkInterface.getNetworkInterfaces())) { for (InetAddress a : Collections.list(n.getInetAddresses())) { if (!a.isLoopbackAddress() && a instanceof Inet4Address) return a.getHostAddress(); } } } catch (Exception e) {} return "127.0.0.1"; }
          }
          EOF

      - name: 4. 构建配置与清单
        run: |
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.TRANSMIT_IR" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <application android:label="ha红外网关" android:theme="@android:style/Theme.DeviceDefault.Light" android:usesCleartextTraffic="true">
                  <activity android:name="hap.re00660.re.MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity>
                  <service android:name="hap.re00660.re.IRService" android:exported="false" />
                  <receiver android:name="hap.re00660.re.BootReceiver" android:exported="true"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /></intent-filter></receiver>
              </application>
          </manifest>
          EOF
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "include ':app'" > settings.gradle
          cat <<EOF > build.gradle
          buildscript { repositories { google(); mavenCentral() } ; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral(); } }
          EOF
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android { compileSdk 34; namespace "hap.re00660.re"; defaultConfig { applicationId "hap.re00660.re"; minSdk 21; targetSdk 34; } 
          compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 } }
          dependencies { implementation 'org.nanohttpd:nanohttpd:2.3.1'; implementation 'com.google.code.gson:gson:2.10.1' }
          EOF

