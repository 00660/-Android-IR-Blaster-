name: Build Android IR Engine

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build and Package
        run: |
          ANDROID_JAR=$(find $ANDROID_HOME/platforms -name "android.jar" | sort -r | head -n 1)
          D8_TOOL=$(find $ANDROID_HOME/build-tools -name "d8" | sort -r | head -n 1)
          
          javac -source 1.8 -target 1.8 -cp "$ANDROID_JAR" IrBlaster.java
          "$D8_TOOL" --output . IrBlaster.class
          jar cvf ir_engine.jar classes.dex

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ir_engine_build
          path: ir_engine.jar
