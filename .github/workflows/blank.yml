name: IR_GATEWAY_ROOT_BOOT

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 清理战场
        run: rm -rf * && mkdir -p app/src/main/java/com/ir/gateway && mkdir -p app/src/main/res/layout

      - name: 2. 注入“不死鸟”架构代码
        run: |
          # 1. 清单文件 (注册广播、服务、权限)
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.TRANSMIT_IR" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application android:label="红外网关(Root增强版)" android:theme="@android:style/Theme.DeviceDefault">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
                  
                  <!-- 开机广播接收器 -->
                  <receiver android:name=".BootReceiver" android:exported="true" android:enabled="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>

                  <!-- 核心前台服务 (保活的关键) -->
                  <service android:name=".IRService" android:exported="false" />
              </application>
          </manifest>
          EOF

          # 2. 界面布局
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:orientation="vertical" android:padding="30dp" android:gravity="center" android:layout_width="match_parent" android:layout_height="match_parent">
              <TextView android:text="🔥 不死鸟网关已就绪" android:textSize="24sp" android:textStyle="bold" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
              <TextView android:id="@+id/status" android:text="正在初始化..." android:textSize="16sp" android:layout_marginTop="20dp" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
              <TextView android:text="请授予 Root 权限以获得最佳稳定性\n无 Root 亦可使用" android:textColor="#888" android:gravity="center" android:layout_marginTop="40dp" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
          </LinearLayout>
          EOF

          # 3. 广播接收器 (监听开机信号)
          cat <<EOF > app/src/main/java/com/ir/gateway/BootReceiver.java
          package com.ir.gateway;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  // 开机收到信号，立马启动服务
                  Intent serviceIntent = new Intent(context, IRService.class);
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {
                      context.startForegroundService(serviceIntent);
                  } else {
                      context.startService(serviceIntent);
                  }
              }
          }
          EOF

          # 4. 核心服务 (Web Server 驻留在此)
          cat <<EOF > app/src/main/java/com/ir/gateway/IRService.java
          package com.ir.gateway;
          import android.app.*;
          import android.content.Intent;
          import android.hardware.ConsumerIrManager;
          import android.os.IBinder;
          import android.os.PowerManager;
          import fi.iki.elonen.NanoHTTPD;
          import java.util.Map;

          public class IRService extends Service {
              private WebServer server;
              private ConsumerIrManager ir;
              private PowerManager.WakeLock wakeLock;

              @Override
              public void onCreate() {
                  super.onCreate();
                  // 1. 申请电源锁，防止CPU休眠
                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "IRGateway:KeepAlive");
                  wakeLock.acquire();

                  // 2. 变成前台服务 (状态栏常驻通知，防杀)
                  String CHANNEL_ID = "IR_GATEWAY_CHANNEL";
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(CHANNEL_ID, "IR Gateway", NotificationManager.IMPORTANCE_LOW);
                      getSystemService(NotificationManager.class).createNotificationChannel(channel);
                  }
                  Notification notification = new Notification.Builder(this, CHANNEL_ID)
                          .setContentTitle("红外网关运行中")
                          .setContentText("Web 服务监听端口 8080")
                          .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                          .build();
                  startForeground(1, notification);

                  // 3. 启动 Web Server
                  ir = (ConsumerIrManager) getSystemService(CONSUMER_IR_SERVICE);
                  try {
                      server = new WebServer(8080);
                      server.start();
                  } catch (Exception e) {}
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  return START_STICKY; // 如果被杀，系统会自动重启我
              }

              @Override
              public void onDestroy() {
                  if (server != null) server.stop();
                  if (wakeLock != null) wakeLock.release();
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }

              private class WebServer extends NanoHTTPD {
                  public WebServer(int port) { super(port); }
                  @Override
                  public Response serve(IHTTPSession session) {
                      Map<String, String> p = session.getParms();
                      String raw = p.get("raw");
                      if (raw != null) {
                          try {
                              String[] parts = raw.split(",");
                              int[] pat = new int[parts.length];
                              for(int i=0; i<parts.length; i++) pat[i] = Integer.parseInt(parts[i].trim());
                              if (ir.hasIrEmitter()) { ir.transmit(38000, pat); return newFixedLengthResponse("OK"); }
                          } catch (Exception e) { return newFixedLengthResponse("ERR"); }
                      }
                      return newFixedLengthResponse("Gateway is Alive! Use /?raw=...");
                  }
              }
          }
          EOF

          # 5. 主界面 (负责申请Root和展示IP)
          cat <<EOF > app/src/main/java/com/ir/gateway/MainActivity.java
          package com.ir.gateway;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.TextView;
          import java.net.*;
          import java.util.*;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  // 1. 尝试获取 Root 权限并把自己加入白名单
                  new Thread(() -> {
                      try {
                          // 申请 Root
                          Process p = Runtime.getRuntime().exec("su");
                          java.io.DataOutputStream os = new java.io.DataOutputStream(p.getOutputStream());
                          // 禁用电池优化 (强行)
                          os.writeBytes("dumpsys deviceidle whitelist +" + getPackageName() + "\n");
                          // 授予后台运行权限
                          os.writeBytes("cmd appops set " + getPackageName() + " RUN_IN_BACKGROUND allow\n");
                          os.writeBytes("exit\n");
                          os.flush();
                          p.waitFor();
                          runOnUiThread(() -> updateStatus("Root 权限已获取 ✅\n系统白名单已添加"));
                      } catch (Exception e) {
                          runOnUiThread(() -> updateStatus("Root 获取失败 (无Root模式运行中)"));
                      }
                  }).start();

                  // 2. 启动服务
                  Intent serviceIntent = new Intent(this, IRService.class);
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {
                      startForegroundService(serviceIntent);
                  } else {
                      startService(serviceIntent);
                  }
                  
                  updateStatus("IP: " + getIP() + ":8080");
              }

              private void updateStatus(String msg) {
                  TextView tv = findViewById(R.id.status);
                  tv.setText(tv.getText() + "\n" + msg);
              }

              private String getIP() {
                  try {
                      for (NetworkInterface nf : Collections.list(NetworkInterface.getNetworkInterfaces())) {
                          for (InetAddress addr : Collections.list(nf.getInetAddresses())) {
                              if (!addr.isLoopbackAddress() && addr.getHostAddress().indexOf(':') < 0) return addr.getHostAddress();
                          }
                      }
                  } catch (Exception e) {} return "0.0.0.0";
              }
          }
          EOF

      - name: 3. Gradle 配置
        run: |
          echo "include ':app'" > settings.gradle
          cat <<EOF > build.gradle
          buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android { compileSdk 34; namespace "com.ir.gateway"; defaultConfig { applicationId "com.ir.gateway"; minSdk 21; targetSdk 34; } }
          dependencies { implementation 'org.nanohttpd:nanohttpd:2.3.1' }
          EOF

      - name: 4. 编译打包
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: IR_Root_Boot_Gateway, path: app/build/outputs/apk/debug/app-debug.apk }
