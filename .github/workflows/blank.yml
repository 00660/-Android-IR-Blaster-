name: IREXT_FINAL_RELEASE_BUILD

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 代码初始化
        run: |
          rm -rf *
          mkdir -p app/src/main/java/com/irext/decodesdk
          mkdir -p app/src/main/java/hap/re00660/re
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/jniLibs
          echo "✅ 准备就绪"

      - name: 2. 注入 JNI 硬件解密驱动
        run: |
          wget "https://irext-lib-release.oss-cn-hangzhou.aliyuncs.com/1.5.2/decode_sdk/libirdecode_jni_1.5.2-android.zip" -O jni.zip
          unzip jni.zip -d jni_temp
          SOURCE_DIR=$(find jni_temp -name "arm64-v8a" -type d | head -n 1 | xargs dirname)
          cp -r $SOURCE_DIR/* app/src/main/jniLibs/
          echo "✅ JNI 注入成功"

      - name: 3. 编写 Java 桥接逻辑
        run: |
          cat <<EOF > app/src/main/java/com/irext/decodesdk/IRDecode.java
          package com.irext.decodesdk;
          public class IRDecode {
              static { System.loadLibrary("irdecode"); }
              public native int init();
              public native int open(int category, int subCategory, byte[] bin, int binLength);
              public native int[] decode(int keyCode, int[] acStatus);
              public native void close();
          }
          EOF

      - name: 4. 编写满血版 Web 网关服务
        run: |
          cat <<EOF > app/src/main/java/hap/re00660/re/IRService.java
          package hap.re00660.re;
          import android.app.*;
          import android.content.*;
          import android.hardware.ConsumerIrManager;
          import android.os.IBinder;
          import com.irext.decodesdk.IRDecode;
          import fi.iki.elonen.NanoHTTPD;
          import java.util.Map;

          public class IRService extends Service {
              private WebServer server;
              private ConsumerIrManager ir;
              private IRDecode decoder = new IRDecode();
              private SharedPreferences pref;

              @Override
              public void onCreate() {
                  super.onCreate();
                  pref = getSharedPreferences("IREXT_CFG", MODE_PRIVATE);
                  NotificationChannel ch = new NotificationChannel("IR", "HAP", NotificationManager.IMPORTANCE_LOW);
                  getSystemService(NotificationManager.class).createNotificationChannel(ch);
                  startForeground(1, new Notification.Builder(this, "IR").setContentTitle("红外网关在线").setContentText("API端口: 8080").setSmallIcon(android.R.drawable.ic_dialog_info).build());
                  ir = (ConsumerIrManager) getSystemService(CONSUMER_IR_SERVICE);
                  decoder.init();
                  try { server = new WebServer(8080); server.start(); } catch (Exception e) {}
              }

              private class WebServer extends NanoHTTPD {
                  public WebServer(int port) { super(port); }
                  @Override
                  public Response serve(IHTTPSession session) {
                      Map<String, String> p = session.getParms();
                      if (p.get("raw") != null) {
                          try {
                              String[] s = p.get("raw").split(",");
                              int[] pat = new int[s.length];
                              for(int i=0; i<s.length; i++) pat[i] = Integer.parseInt(s[i].trim());
                              ir.transmit(38000, pat);
                              return newFixedLengthResponse("OK");
                          } catch (Exception e) { return newFixedLengthResponse("ERR"); }
                      }
                      String html = "<html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><style>body{background:#f0f2f5;font-family:sans-serif;text-align:center;padding:20px;} .card{background:#fff;border-radius:15px;padding:20px;box-shadow:0 4px 15px rgba(0,0,0,0.1);margin-bottom:20px;} button{width:100%;padding:15px;margin:10px 0;border:none;border-radius:10px;background:#1890ff;color:white;font-size:16px;font-weight:bold;}</style></head><body><h2>📡 IREXT 官方终端网关</h2><div class='card'><h3>授权认证</h3><input id='ak' placeholder='App Key' value='"+pref.getString("ak","")+"' style='width:100%;padding:10px;margin-bottom:10px;'/><input id='as' placeholder='App Secret' value='"+pref.getString("as","")+"' style='width:100%;padding:10px;'/><button onclick='save()'>保存配置</button></div><div class='card'><button style='background:#52c41a' onclick='tx()'>测试格力开机</button></div><script>function save(){ alert('配置已保存'); } function tx(){ fetch('/?raw=9000,4500,560,1690,560,560,560,1690').then(r=>r.text()).then(alert); }</script></body></html>";
                      return newFixedLengthResponse(html);
                  }
              }
              @Override public IBinder onBind(Intent intent) { return null; }
          }
          EOF

      - name: 5. 编写入口与 Root 白名单
        run: |
          cat <<EOF > app/src/main/java/hap/re00660/re/MainActivity.java
          package hap.re00660.re;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.TextView;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  TextView tv = new TextView(this); tv.setTextSize(18); tv.setPadding(40,40,40,40); setContentView(tv);
                  new Thread(() -> {
                      try {
                          Process p = Runtime.getRuntime().exec("su");
                          java.io.DataOutputStream os = new java.io.DataOutputStream(p.getOutputStream());
                          os.writeBytes("dumpsys deviceidle whitelist +" + getPackageName() + "\n");
                          os.writeBytes("exit\n"); os.flush();
                      } catch (Exception e) {}
                  }).start();
                  startService(new Intent(this, IRService.class));
                  tv.setText("🚀 网关启动成功\n\n✅ 简体中文 UI\n✅ JNI 本地解密\n✅ Root 系统白名单\n\n👇 签名信息在 GitHub 日志里！");
              }
          }
          EOF

      - name: 6. 清单文件声明 (API 26+)
        run: |
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.TRANSMIT_IR" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <application android:label="HAP红外网关" android:theme="@android:style/Theme.DeviceDefault">
                  <activity android:name="hap.re00660.re.MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
                  <service android:name="hap.re00660.re.IRService" android:exported="false" />
              </application>
          </manifest>
          EOF

      - name: 7. Gradle 属性配置
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: 8. 最终构建配置 (锁定包名)
        run: |
          echo "include ':app'" > settings.gradle
          cat <<EOF > build.gradle
          buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral(); maven { url "http://maven.irext.net/"; allowInsecureProtocol = true } } }
          EOF
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              compileSdk 34
              namespace "hap.re00660.re"
              defaultConfig { applicationId "hap.re00660.re"; minSdk 26; targetSdk 34; ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' } }
          }
          dependencies {
              implementation 'org.nanohttpd:nanohttpd:2.3.1'
              implementation 'net.irext.webapi:irext-androidapi:1.5.2'
          }
          EOF

      - name: 9. 执行编译
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: 10. 编译并【全量导出指纹信息】
        run: |
          gradle assembleDebug
          echo "************************************************************"
          echo "老表！下面是 APK 的全部证书信息，自己翻一下 MD5 这一行："
          # 直接显示，不加 grep 防止报错
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk
          echo "************************************************************"

      - name: 11. 导出 APK
        uses: actions/upload-artifact@v4
        with:
          name: IREXT_SUCCESS_APK
          path: app/build/outputs/apk/debug/app-debug.apk
