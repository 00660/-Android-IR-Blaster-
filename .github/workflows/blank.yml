name: IREXT_PRO_SDK_FINAL_FIX

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 环境初始化
        run: |
          rm -rf *
          mkdir -p app/src/main/java/com/irext/decodesdk
          mkdir -p app/src/main/java/hap/00660/re
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/jniLibs
          echo "✅ 兵工厂目录初始化完成"

      - name: 2. 部署 JNI 硬件解码驱动
        run: |
          wget "https://irext-lib-release.oss-cn-hangzhou.aliyuncs.com/1.5.2/decode_sdk/libirdecode_jni_1.5.2-android.zip" -O jni.zip
          unzip jni.zip -d jni_temp
          SOURCE_DIR=$(find jni_temp -name "arm64-v8a" -type d | head -n 1 | xargs dirname)
          cp -r $SOURCE_DIR/* app/src/main/jniLibs/
          echo "✅ JNI 驱动已部署"

      - name: 3. 编写 JNI 桥接层代码
        run: |
          cat <<EOF > app/src/main/java/com/irext/decodesdk/IRDecode.java
          package com.irext.decodesdk;
          public class IRDecode {
              static { System.loadLibrary("irdecode"); }
              public native int init();
              public native int open(int category, int subCategory, byte[] bin, int binLength);
              public native int[] decode(int keyCode, int[] acStatus);
              public native void close();
          }
          EOF

      - name: 4. 编写核心服务 (Web 接口逻辑)
        run: |
          cat <<EOF > app/src/main/java/hap/00660/re/IRService.java
          package hap.00660.re;
          import android.app.*;
          import android.content.*;
          import android.hardware.ConsumerIrManager;
          import android.os.IBinder;
          import com.irext.decodesdk.IRDecode;
          import fi.iki.elonen.NanoHTTPD;
          import java.util.Map;

          public class IRService extends Service {
              private WebServer server;
              private ConsumerIrManager ir;
              private IRDecode decoder = new IRDecode();
              private SharedPreferences pref;

              @Override
              public void onCreate() {
                  super.onCreate();
                  pref = getSharedPreferences("IREXT_CFG", MODE_PRIVATE);
                  String ID = "IR_HAP";
                  if (android.os.Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel(ID, "IR", NotificationManager.IMPORTANCE_LOW);
                      getSystemService(NotificationManager.class).createNotificationChannel(ch);
                  }
                  startForeground(1, new Notification.Builder(this, ID).setContentTitle("IREXT 网关已启动").setContentText("API端口: 8080").setSmallIcon(android.R.drawable.ic_dialog_info).build());
                  ir = (ConsumerIrManager) getSystemService(CONSUMER_IR_SERVICE);
                  decoder.init();
                  try { server = new WebServer(8080); server.start(); } catch (Exception e) {}
              }

              private class WebServer extends NanoHTTPD {
                  public WebServer(int port) { super(port); }
                  @Override
                  public Response serve(IHTTPSession session) {
                      Map<String, String> p = session.getParms();
                      if (p.get("save_auth") != null) {
                          pref.edit().putString("k", p.get("k")).putString("s", p.get("s")).apply();
                          return newFixedLengthResponse("OK");
                      }
                      if (p.get("raw") != null) {
                          try {
                              String[] s = p.get("raw").split(",");
                              int[] pat = new int[s.length];
                              for(int i=0; i<s.length; i++) pat[i] = Integer.parseInt(s[i].trim());
                              ir.transmit(38000, pat);
                              return newFixedLengthResponse("Sent");
                          } catch (Exception e) { return newFixedLengthResponse("Error"); }
                      }
                      String html = "<html><body style='text-align:center;padding:20px;font-family:sans-serif;'><h2>📡 IREXT 终端网关</h2>" +
                          "<input id='ak' placeholder='App Key' value='"+pref.getString("k","")+"' style='width:80%;padding:10px;margin:10px;'/>" +
                          "<input id='as' placeholder='App Secret' value='"+pref.getString("s","")+"' style='width:80%;padding:10px;margin:10px;'/>" +
                          "<button onclick='save()' style='width:80%;padding:15px;background:#1890ff;color:white;border:none;'>保存并认证</button>" +
                          "<script>function save(){ fetch(\"/?save_auth=1&k=\"+document.getElementById(\"ak\").value+\"&s=\"+document.getElementById(\"as\").value).then(()=>alert(\"保存成功\")); }</script></body></html>";
                      return newFixedLengthResponse(html);
                  }
              }
              @Override public IBinder onBind(Intent intent) { return null; }
          }
          EOF

      - name: 5. 编写 MainActivity
        run: |
          cat <<EOF > app/src/main/java/hap/00660/re/MainActivity.java
          package hap.00660.re;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.TextView;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  TextView tv = new TextView(this); tv.setTextSize(18); tv.setPadding(40,40,40,40); setContentView(tv);
                  new Thread(() -> {
                      try {
                          Process p = Runtime.getRuntime().exec("su");
                          java.io.DataOutputStream os = new java.io.DataOutputStream(p.getOutputStream());
                          os.writeBytes("dumpsys deviceidle whitelist +" + getPackageName() + "\n");
                          os.writeBytes("exit\n"); os.flush();
                      } catch (Exception e) {}
                  }).start();
                  startService(new Intent(this, IRService.class));
                  tv.setText("🚀 IREXT 官方终端已启动\n\n最低要求: Android 8.0\n当前包名: hap.00660.re\n接口端口: 8080");
              }
          }
          EOF

      - name: 6. 清单文件 (清理过时 package 标签)
        run: |
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.TRANSMIT_IR" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <application android:label="HAP红外网关" android:theme="@android:style/Theme.DeviceDefault">
                  <activity android:name="hap.00660.re.MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
                  <service android:name="hap.00660.re.IRService" android:exported="false" />
              </application>
          </manifest>
          EOF

      - name: 7. 开启 AndroidX 并禁止 Jetifier 警告
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: 8. 最终构建配置 (强制 minSdk 26)
        run: |
          echo "include ':app'" > settings.gradle
          cat <<EOF > build.gradle
          buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral(); maven { url "http://maven.irext.net/"; allowInsecureProtocol = true } } }
          EOF
          
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              compileSdk 34
              namespace "hap.00660.re"
              defaultConfig { 
                  applicationId "hap.00660.re"
                  minSdk 26        // 关键：必须调到 26 满足 IREXT SDK 要求
                  targetSdk 34
                  ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
              }
          }
          dependencies {
              implementation 'org.nanohttpd:nanohttpd:2.3.1'
              implementation 'net.irext.webapi:irext-androidapi:1.5.2'
          }
          EOF

      - name: 9. 执行编译并输出签名
        uses: gradle/actions/setup-gradle@v4
        with: { java-version: 17, gradle-version: 8.7 }
        
      - name: 10. 编译
        run: |
          gradle assembleDebug
          echo "========================================================="
          echo "👇 拿到这个 MD5 填入 IREXT 控制台注册包名 hap.00660.re 👇"
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep MD5 | sed 's/MD5: //' | sed 's/://g' | tr '[:upper:]' '[:lower:]'
          echo "========================================================="

      - name: 11. 导出 APK
        uses: actions/upload-artifact@v4
        with: { name: IREXT_HAP_STABLE_APK, path: app/build/outputs/apk/debug/app-debug.apk }
