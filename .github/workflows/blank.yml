name: Build_IR_Engine

# 只要有代码提交，或者你点手动按钮，都会触发
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. 编译打包 (白嫖微软服务器)
        run: |
          # 自动寻找 Android SDK 路径
          ANDROID_JAR=$(find $ANDROID_HOME/platforms -name "android.jar" | sort -r | head -n 1)
          D8_TOOL=$(find $ANDROID_HOME/build-tools -name "d8" | sort -r | head -n 1)
          
          echo "Using Android Jar: $ANDROID_JAR"
          echo "Using D8 Tool: $D8_TOOL"
          
          # 编译成 Class (兼容旧版安卓)
          javac -source 8 -target 8 -cp "$ANDROID_JAR" IrBlaster.java
          
          # 转成 Dex 格式
          "$D8_TOOL" --output . IrBlaster.class
          
          # 封包为 Jar
          jar cvf ir_engine.jar classes.dex

      - name: 4. 导出成品
        uses: actions/upload-artifact@v4
        with:
          name: ir_engine_jar
          path: ir_engine.jar
