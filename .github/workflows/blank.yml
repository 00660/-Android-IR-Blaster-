name: IREXT_NATIVE_HARDWARE_JNI_FIX

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 代码初始化
        run: |
          rm -rf *
          mkdir -p app/src/main/java/hap/re00660/re
          mkdir -p app/src/main/java/net/irext/decodesdk
          mkdir -p app/src/main/jniLibs
          echo "✅ 初始化完成"

      - name: 2. 注入 JNI 库 (电视控制救星)
        run: |
          wget -q "https://irext-lib-release.oss-cn-hangzhou.aliyuncs.com/1.5.2/decode_sdk/libirdecode_jni_1.5.2-android.zip" -O jni.zip
          unzip -q jni.zip -d jni_temp
          find jni_temp -name "arm64-v8a" -type d -exec cp -r {} app/src/main/jniLibs/ \;
          find jni_temp -name "armeabi-v7a" -type d -exec cp -r {} app/src/main/jniLibs/ \;
          echo "✅ SO库就位"

      - name: 3. JNI 桥接类
        run: |
          cat <<'EOF' > app/src/main/java/net/irext/decodesdk/IRDecode.java
          package net.irext.decodesdk;
          public class IRDecode {
              static { try { System.loadLibrary("irdecode"); } catch (Throwable e) {} }
              public native int ir_binary_open(int category, int sub_category, byte[] binary, int binary_length);
              public native int[] ir_decode(int key_code, int[] user_data, ACStatus ac_status, int change_wind_direction);
              public native int ir_close();
              public static class ACStatus { public int acPower, acTemp, acMode, acWindDir, acWindSpeed, acDirectType; }
          }
          EOF

      - name: 4. 开机自启
        run: |
          cat <<'EOF' > app/src/main/java/hap/re00660/re/BootReceiver.java
          package hap.re00660.re;
          import android.content.*;
          import android.os.Build;
          public class BootReceiver extends BroadcastReceiver {
              public void onReceive(Context context, Intent intent) {
                  SharedPreferences cfg = context.getSharedPreferences("IREXT_CFG", Context.MODE_PRIVATE);
                  if (cfg.getBoolean("auto_start", true)) {
                      Intent i = new Intent(context, IRService.class);
                      i.putExtra("DOCKER_URL", cfg.getString("docker_ip", "http://192.168.1.100:8081"));
                      if (Build.VERSION.SDK_INT >= 26) context.startForegroundService(i);
                      else context.startService(i);
                  }
              }
          }
          EOF

      - name: 5. 核心服务 (🌟删除音频，只留原生IR + JNI)
        run: |
          cat <<'EOF' > app/src/main/java/hap/re00660/re/IRService.java
          package hap.re00660.re;
          import android.app.*;
          import android.content.*;
          import android.hardware.ConsumerIrManager;
          import android.os.*;
          import fi.iki.elonen.NanoHTTPD;
          import java.io.*;
          import java.net.*;
          import java.nio.charset.StandardCharsets;
          import java.util.*;
          import com.google.gson.*;
          import net.irext.decodesdk.IRDecode;

          public class IRService extends Service {
              private ConsumerIrManager ir;
              private SharedPreferences db, cfg;
              private String targetCloudUrl = "";
              private String apiId = "", apiToken = "";
              private IRDecode jni;

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if(intent != null && intent.getStringExtra("DOCKER_URL") != null) {
                      targetCloudUrl = intent.getStringExtra("DOCKER_URL");
                      loginPrivateCloud();
                  }
                  return START_STICKY;
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  db = getSharedPreferences("IREXT_DATABASE", MODE_PRIVATE);
                  cfg = getSharedPreferences("IREXT_CFG", MODE_PRIVATE);
                  try { jni = new IRDecode(); } catch(Throwable t){}
                  
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel("IR_CORE", "红外服务", NotificationManager.IMPORTANCE_HIGH);
                      getSystemService(NotificationManager.class).createNotificationChannel(ch);
                  }
                  Notification n = (Build.VERSION.SDK_INT >= 26) ? 
                      new Notification.Builder(this, "IR_CORE").setContentTitle("📡 红外网关运行中").setSmallIcon(android.R.drawable.ic_dialog_info).setOngoing(true).build() :
                      new Notification.Builder(this).setContentTitle("📡 红外网关运行中").setSmallIcon(android.R.drawable.ic_dialog_info).setOngoing(true).build();
                  startForeground(1, n);

                  try { ir = (ConsumerIrManager) getSystemService(CONSUMER_IR_SERVICE); } catch(Throwable t) {}
                  
                  // Root 保活：移到这里并使用安全线程，防止主界面卡死
                  if(cfg.getBoolean("use_root", false)) {
                      new Thread(() -> {
                          try {
                              Process p = Runtime.getRuntime().exec("su");
                              DataOutputStream os = new DataOutputStream(p.getOutputStream());
                              os.writeBytes("dumpsys deviceidle whitelist +" + getPackageName() + "\nexit\n");
                              os.flush();
                              p.waitFor();
                          } catch(Exception e){}
                      }).start();
                  }

                  try { new WebServer(8080).start(); } catch (Exception e) { }
              }

              // JNI 本地解码
              private int[] localDecode(String indexId, int category, int keyCode) {
                  try {
                      File file = new File(getCacheDir(), indexId + ".bin");
                      if (!file.exists() || file.length() == 0) {
                          URL url = new URL(targetCloudUrl + "/irext-server/operation/download_bin");
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setRequestProperty("Content-Type", "application/json");
                          conn.setDoOutput(true);
                          String json = "{\"id\":\""+apiId+"\",\"token\":\""+apiToken+"\",\"indexId\":\""+indexId+"\"}";
                          try(OutputStream os = conn.getOutputStream()) { os.write(json.getBytes()); }
                          if (conn.getResponseCode() == 200) {
                              try(InputStream is = conn.getInputStream(); FileOutputStream fos = new FileOutputStream(file)) {
                                  byte[] buf = new byte[1024]; int len;
                                  while ((len = is.read(buf)) != -1) fos.write(buf, 0, len);
                              }
                          } else return null;
                      }
                      byte[] binData = new byte[(int) file.length()];
                      try(FileInputStream fis = new FileInputStream(file)) { fis.read(binData); }
                      jni.ir_binary_open(category, 0, binData, binData.length);
                      int[] pattern = jni.ir_decode(keyCode, null, null, 0);
                      jni.ir_close();
                      return pattern;
                  } catch(Exception e) { return null; }
              }

              private String postJSON(String path, String jsonBody) {
                  HttpURLConnection conn = null;
                  try {
                      URL url = new URL(targetCloudUrl + path);
                      conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod("POST");
                      conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                      conn.setConnectTimeout(3000); conn.setDoOutput(true);
                      try(OutputStream os = conn.getOutputStream()) { os.write(jsonBody.getBytes(StandardCharsets.UTF_8)); }
                      InputStream is = conn.getResponseCode() >= 400 ? conn.getErrorStream() : conn.getInputStream();
                      if (is == null) return "{\"status\":{\"code\":1}}";
                      try(BufferedReader br = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8))) {
                          StringBuilder sb = new StringBuilder(); String line;
                          while((line = br.readLine()) != null) sb.append(line);
                          return sb.toString();
                      }
                  } catch (Exception e) { return "{\"status\":{\"code\":1}}"; }
                  finally { if(conn!=null) conn.disconnect(); }
              }

              private void loginPrivateCloud() {
                  new Thread(() -> {
                      String res = postJSON("/irext-server/app/app_login", "{\"appKey\":\"55b1d89fda0658d6f851ee89cad564de\",\"appSecret\":\"83dfd86ad59843ce50342ec863a49bf0\",\"appType\":\"2\"}");
                      try {
                          JsonObject entity = JsonParser.parseString(res).getAsJsonObject().getAsJsonObject("entity");
                          apiId = entity.get("id").getAsString(); apiToken = entity.get("token").getAsString();
                      } catch (Exception e) { }
                  }).start();
              }

              private class WebServer extends NanoHTTPD {
                  public WebServer(int port) { super(port); }
                  @Override
                  public Response serve(IHTTPSession session) {
                      String uri = session.getUri();
                      Map<String, String> p = session.getParms();
                      try {
                          if ("/api/list".equals(uri)) return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", db.getString("devs", "[]"));
                          if ("/api/save".equals(uri)) {
                              int len = Integer.parseInt(session.getHeaders().get("content-length"));
                              byte[] buf = new byte[len]; session.getInputStream().read(buf, 0, len);
                              JsonArray list = JsonParser.parseString(db.getString("devs", "[]")).getAsJsonArray();
                              list.add(JsonParser.parseString(new String(buf, StandardCharsets.UTF_8)));
                              db.edit().putString("devs", list.toString()).commit();
                              return newFixedLengthResponse("OK");
                          }
                          if ("/api/delete".equals(uri)) {
                              int idx = Integer.parseInt(p.get("i"));
                              JsonArray list = JsonParser.parseString(db.getString("devs", "[]")).getAsJsonArray();
                              JsonArray newList = new JsonArray();
                              for(int i=0; i<list.size(); i++) if(i != idx) newList.add(list.get(i));
                              db.edit().putString("devs", newList.toString()).commit();
                              return newFixedLengthResponse("OK");
                          }
                          if ("/api/tx".equals(uri)) {
                              if (ir == null || !ir.hasIrEmitter()) return newFixedLengthResponse("No IR Hardware");
                              
                              int[] pat = null;
                              String idx = p.get("id");
                              int k = Integer.parseInt(p.get("k"));
                              int c = Integer.parseInt(p.get("c"));

                              // 🌟 核心：开关控制 -> 强制本地解码
                              if (cfg.getBoolean("local_decode", false) && c != 1) {
                                  pat = localDecode(idx, c, k);
                              } else {
                                  // 云端解码
                                  JsonObject req = new JsonObject();
                                  req.addProperty("id", apiId); req.addProperty("token", apiToken);
                                  req.addProperty("indexId", idx); req.addProperty("keyCode", String.valueOf(k));
                                  req.addProperty("directDecode", "0"); req.addProperty("paraData", "0");
                                  
                                  JsonObject ac = new JsonObject();
                                  if (c == 1) {
                                      ac.addProperty("acPower", "1".equals(p.get("p"))?"0":"1");
                                      ac.addProperty("acMode", p.get("m")); ac.addProperty("acTemp", p.get("t"));
                                  } else {
                                      ac.addProperty("acPower","0"); ac.addProperty("acMode","0"); ac.addProperty("acTemp","8");
                                  }
                                  ac.addProperty("acWindSpeed","0"); ac.addProperty("acWindDir","0"); ac.addProperty("changeWindDir","0");
                                  req.add("acStatus", ac);

                                  String res = postJSON("/irext-server/operation/decode", req.toString());
                                  JsonObject root = JsonParser.parseString(res).getAsJsonObject();
                                  if (root.has("entity") && !root.get("entity").isJsonNull()) {
                                      JsonArray arr = root.getAsJsonArray("entity");
                                      pat = new int[arr.size()];
                                      for (int i=0; i<arr.size(); i++) pat[i] = arr.get(i).getAsInt();
                                  }
                              }

                              if (pat != null && pat.length > 0) {
                                  ir.transmit(38000, pat); // 🌟 纯原生发射，不搞音频花活
                                  return newFixedLengthResponse("OK");
                              }
                              return newFixedLengthResponse("Fail");
                          }
                          if ("/api/proxy".equals(uri)) {
                              String res = postJSON(p.get("p"), "{\"id\":\""+apiId+"\",\"token\":\""+apiToken+"\"," + p.get("b") + "}");
                              return newFixedLengthResponse(Response.Status.OK, "application/json; charset=UTF-8", JsonParser.parseString(res).getAsJsonObject().has("entity")?JsonParser.parseString(res).getAsJsonObject().get("entity").toString():"[]");
                          }
                      } catch(Exception e) { return newFixedLengthResponse("ERR"); }
                      
                      // Web UI (保持原样，省略长字符串)
                      return newFixedLengthResponse(Response.Status.OK, "text/html; charset=UTF-8", getUI());
                  }
                  private String getUI() { return "<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>IR</title><style>body{font-family:sans-serif;padding:10px}button{width:100%;padding:12px;margin:5px 0}</style></head><body><script>location.href='/api/list'</script></body></html>"; }
                  // 注意：实际构建时请替换为完整的 HTML 字符串，此处为防止截断简写。
              }
              @Override public IBinder onBind(Intent intent) { return null; }
          }
          EOF

      - name: 6. 编写控制台 UI (🌟移除音频开关，安全Root)
        run: |
          cat <<EOF > app/src/main/java/hap/re00660/re/MainActivity.java
          package hap.re00660.re;
          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.*;
          import android.webkit.*;
          import android.widget.*;
          import com.google.gson.*;
          import java.net.*;
          import java.util.*;
          import java.io.*;

          public class MainActivity extends Activity {
              private SharedPreferences db, cfg;
              private LinearLayout listArea;
              private WebView webView;
              private EditText ipInput;
              private RadioGroup cloudGroup;
              private Switch rootSwitch, swAuto, swLocal;
              private TextView statusTv;
              private boolean isWeb = false;

              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  db = getSharedPreferences("IREXT_DATABASE", MODE_PRIVATE);
                  cfg = getSharedPreferences("IREXT_CFG", MODE_PRIVATE);
                  
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != 0) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                  }

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.parseColor("#F1F5F9"));
                  LinearLayout main = new LinearLayout(this);
                  main.setOrientation(LinearLayout.VERTICAL);
                  main.setPadding(40, 40, 40, 40);

                  TextView title = new TextView(this); title.setText("📡 ha红外网关 (原生版)"); title.setTextSize(22);
                  main.addView(title);

                  statusTv = new TextView(this); statusTv.setText("🔴 未启动"); statusTv.setTextColor(Color.RED);
                  main.addView(statusTv);

                  TextView myIp = new TextView(this);
                  myIp.setText("\n地址: http://" + getLocalIp() + ":8080");
                  myIp.setTextColor(Color.BLUE); main.addView(myIp);

                  cloudGroup = new RadioGroup(this); cloudGroup.setOrientation(LinearLayout.HORIZONTAL);
                  RadioButton rbPub = new RadioButton(this); rbPub.setText("公有云");
                  RadioButton rbPri = new RadioButton(this); rbPri.setText("私有云");
                  cloudGroup.addView(rbPub); cloudGroup.addView(rbPri); main.addView(cloudGroup);
                  
                  ipInput = new EditText(this); ipInput.setHint("Docker IP");
                  ipInput.setText(cfg.getString("docker_ip", "http://192.168.2.157:8081"));
                  main.addView(ipInput);

                  boolean isPublic = cfg.getBoolean("is_public_cloud", false);
                  rbPub.setChecked(isPublic); rbPri.setChecked(!isPublic);
                  ipInput.setVisibility(isPublic ? View.GONE : View.VISIBLE);
                  cloudGroup.setOnCheckedChangeListener((g, id) -> ipInput.setVisibility(id == rbPub.getId() ? View.GONE : View.VISIBLE));

                  rootSwitch = new Switch(this); rootSwitch.setText("Root 保活");
                  rootSwitch.setChecked(cfg.getBoolean("use_root", true)); main.addView(rootSwitch);

                  swLocal = new Switch(this); swLocal.setText("强制本地解码 (电视专用)");
                  swLocal.setChecked(cfg.getBoolean("local_decode", false)); main.addView(swLocal);

                  swAuto = new Switch(this); swAuto.setText("开机自启");
                  swAuto.setChecked(cfg.getBoolean("auto_start", true)); main.addView(swAuto);

                  Button start = new Button(this); start.setText("启动服务");
                  start.setBackgroundColor(Color.parseColor("#1890ff")); start.setTextColor(Color.WHITE);
                  start.setOnClickListener(v -> {
                      boolean pub = rbPub.isChecked();
                      cfg.edit().putString("docker_ip", ipInput.getText().toString()).putBoolean("is_public_cloud", pub)
                         .putBoolean("use_root", rootSwitch.isChecked()).putBoolean("auto_start", swAuto.isChecked())
                         .putBoolean("local_decode", swLocal.isChecked()).apply();
                      
                      Intent i = new Intent(this, IRService.class);
                      i.putExtra("DOCKER_URL", pub ? "http://srv.irext.net" : ipInput.getText().toString());
                      if (Build.VERSION.SDK_INT >= 26) startForegroundService(i); else startService(i);
                      statusTv.setText("🟢 运行中"); statusTv.setTextColor(Color.GREEN);
                  });
                  main.addView(start);

                  Button add = new Button(this); add.setText("+ 管理设备");
                  add.setOnClickListener(v -> openWeb()); main.addView(add);

                  ScrollView sc = new ScrollView(this);
                  listArea = new LinearLayout(this); listArea.setOrientation(LinearLayout.VERTICAL);
                  sc.addView(listArea); main.addView(sc);
                  root.addView(main);

                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface public void refresh() { runOnUiThread(() -> refreshList()); }
                  }, "Android");
                  webView.setVisibility(View.GONE);
                  root.addView(webView);

                  setContentView(root);
                  refreshList();
              }

              private void openWeb() { isWeb = true; webView.setVisibility(View.VISIBLE); webView.loadUrl("http://127.0.0.1:8080"); }
              @Override public void onBackPressed() { if(isWeb) { isWeb = false; webView.setVisibility(View.GONE); refreshList(); } else super.onBackPressed(); }
              private void refreshList() {
                  listArea.removeAllViews();
                  try {
                      JsonArray arr = JsonParser.parseString(db.getString("devs", "[]")).getAsJsonArray();
                      for (int i = 0; i < arr.size(); i++) {
                          Button b = new Button(this); b.setAllCaps(false);
                          b.setText(arr.get(i).getAsJsonObject().get("name").getAsString());
                          listArea.addView(b);
                      }
                  } catch(Exception e) {}
              }
              private String getLocalIp() { try { for (NetworkInterface n : Collections.list(NetworkInterface.getNetworkInterfaces())) { for (InetAddress a : Collections.list(n.getInetAddresses())) { if (!a.isLoopbackAddress() && a instanceof Inet4Address) return a.getHostAddress(); } } } catch (Exception e) {} return "127.0.0.1"; }
          }
          EOF
          
          # 🌟 为了不截断，我把 HTML 字符串放到最后单独处理
          # 这里用 sed 命令把完整的 HTML 注入到 IRService.java
          FULL_HTML="<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,user-scalable=no'><title>IR Pro</title><style>body{font-family:sans-serif;background:#f0f2f5;padding:12px;margin:0 auto;max-width:500px}.card{background:#fff;border-radius:15px;padding:20px;box-shadow:0 4px 10px rgba(0,0,0,.08);margin-bottom:15px}h3{margin:0 0 15px;color:#1890ff;display:flex;justify-content:space-between;align-items:center}.btn-back{font-size:12px;background:#f5f5f5;padding:4px 10px;border-radius:6px;border:1px solid #ddd;cursor:pointer}.btn{display:block;width:100%;padding:14px 0;border:none;border-radius:12px;font-size:14px;font-weight:bold;margin-top:10px;cursor:pointer;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}.btn-p{background:#1890ff;color:#fff;border:none}.btn-g{background:#52c41a;color:#fff;border:none}.btn-r{background:#ff4d4f;color:#fff;border:none}.dev-card{background:#fff;border:1px solid #eee;padding:18px;border-radius:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}select,input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;font-size:15px}#views>div{display:none}#v_home{display:block}.panel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.num-grid{grid-template-columns:repeat(5,1fr);margin-top:15px;border-top:1px dashed #eee;padding-top:15px}textarea{width:100%;height:300px;font-family:monospace;font-size:11px;background:#1e1e1e;color:#98c379;padding:10px;border:1px solid #333;border-radius:8px}</style></head><body><div id='views'><div id='v_home'><h3>🏠 我的设备 <button class='btn-g' style='width:auto;padding:6px 15px' onclick='goAdd()'>+ 添加</button></h3><div id='dev_list'></div></div><div id='v_add'><div class='card'><h3><span onclick='goHome()' class='btn-back'>← 返回</span> 1. 选品牌</h3><select id='sc' onchange='checkCate()'></select><div id='brand_area'><select id='sb' onchange='startMatch()'></select></div><div id='stb_area' style='display:none'><select id='sp' onchange='loadProv()'><option>选省份</option></select><select id='sct' onchange='loadCity()'><option>选城市</option></select><select id='sop' onchange='startMatchSTB()'><option>选运营商</option></select></div></div></div><div id='v_match'><div class='card'><h3>匹配中</h3><div style='text-align:center;margin:15px 0'>方案 <b id='midx' style='color:#1890ff;font-size:24px'>1</b> / <span id='mtotal'>0</span></div><button class='btn btn-p' style='height:80px' onclick='testPwr()'>📡 发送电源测试</button><div class='panel' style='grid-template-columns:1fr 1fr'><button class='btn' onclick='next()'>❌ 无反应</button><button class='btn btn-g' onclick='preSave()'>✅ 有反应</button></div></div></div><div id='v_save'><div class='card'><h3>取名保存</h3><input id='d_name'><button class='btn btn-g' onclick='doSave()'>确认保存到手机</button></div></div><div id='v_ctrl'><div class='card'><h3><span id='c_title'></span> <button class='btn-back' onclick='goHome()'>关闭</button></h3><div id='ac_st' style='text-align:center;margin-bottom:15px;color:#666;font-family:monospace'></div><div class='panel' id='btns'></div><div class='panel num-grid' id='num_btns' style='display:none'></div><button class='btn' style='background:#fdf2f2;color:#ef4444;border-color:#fecaca;margin-top:20px' onclick='showHA()'>🛠️ 导出 HA 配置</button><button class='btn btn-r' style='margin-top:10px;opacity:0.3' onclick='delDev()'>删除设备</button></div></div><div id='v_ha'><div class='card'><h3>HA YAML <span onclick='goCtrl()' class='btn-back'>← 返回</span></h3><textarea id='ha_code' readonly onclick='this.select()'></textarea></div></div></div><script>const kmaps={'空调':{0:'电源',1:'模式',2:'温度+',3:'温度-',9:'风力',10:'扫风',11:'固定风'},'电视机':{0:'电源',1:'静音',2:'上',3:'下',4:'左',5:'右',6:'确认',7:'音量+',8:'音量-',9:'返回',10:'信号源',11:'菜单',12:'主页',13:'设置'},'机顶盒':{0:'电源',1:'静音',2:'上',3:'下',4:'左',5:'右',6:'确认',7:'音量+',8:'音量-',9:'返回',10:'信号源',11:'菜单',12:'上一页',13:'下一页'},'风扇':{0:'电源',1:'风+',2:'风-',3:'摇头',4:'定时',5:'风类'}};const $=i=>document.getElementById(i);let cs=[],bs=[],is=[],curr=0,ac={p:0,m:0,t:8},devs=[],curDev=null,curIdx=-1;let isSTB=false;function view(id){document.querySelectorAll('#views>div').forEach(d=>d.style.display='none');$(id).style.display='block'}function loadDevs(){fetch('/api/list?t='+Date.now()).then(r=>r.json()).then(d=>{devs=d;let h='';d.forEach((x,i)=>{h+=`<div class='dev-card' onclick='openDev(${i})'><div><b>${x.name}</b><br><small>${x.brand} | ${x.cate}</small></div><b>&gt;</b></div>`});$('dev_list').innerHTML=h||'<p style=\"text-align:center\">无设备</p>'})}function goHome(){loadDevs();view('v_home');if(window.Android)Android.refresh()}function goAdd(){view('v_add');fetch('/api/proxy?p=/irext-server/indexing/list_categories&b=\"from\":\"0\",\"count\":\"100\"').then(r=>r.json()).then(res=>{let d=res.entity||[];cs=d;$('sc').innerHTML='<option>选择类型</option>'+d.map((c,i)=>'<option value='+i+'>'+(c.name_cn||c.name)+'</option>')})}function checkCate(){let cid=cs[$('sc').value].id||cs[$('sc').value].categoryId;isSTB=(cid==3);if(isSTB){$('brand_area').style.display='none';$('stb_area').style.display='block';loadProv();}else{$('brand_area').style.display='block';$('stb_area').style.display='none';lb()}}function lb(){fetch('/api/proxy?p=/irext-server/indexing/list_brands&b=\"categoryId\":\"'+(cs[$('sc').value].id||cs[$('sc').value].categoryId)+'\",\"from\":\"0\",\"count\":\"500\"').then(r=>r.json()).then(res=>{let d=res.entity||[];bs=d;$('sb').innerHTML='<option>选择品牌</option>'+d.map((b,i)=>'<option value='+i+'>'+(b.name_cn||b.name)+'</option>')})}function loadProv(){fetch('/api/proxy?p=/irext-server/indexing/list_provinces&b=\"\"').then(r=>r.json()).then(res=>{let d=res.entity||[];let h='<option>选省份</option>';d.forEach(p=>h+=`<option value='${p.code}'>${p.name}</option>`);$('sp').innerHTML=h})}function loadCity(){fetch(`/api/proxy?p=/irext-server/indexing/list_cities&b=\"provincePrefix\":\"${$('sp').value.substring(0,2)}\"`).then(r=>r.json()).then(res=>{let d=res.entity||[];let h='<option>选城市</option>';d.forEach(c=>h+=`<option value='${c.code}'>${c.name}</option>`);$('sct').innerHTML=h})}function loadOp(){fetch(`/api/proxy?p=/irext-server/indexing/list_operators&b=\"cityCode\":\"${$('sct').value}\",\"from\":\"0\",\"count\":\"100\"`).then(r=>r.json()).then(res=>{let d=res.entity||[];bs=d;let h='<option>选运营商</option>';d.forEach((o,i)=>h+=`<option value='${i}'>${o.operatorName}</option>`);$('sop').innerHTML=h})}function startMatch(){fetch('/api/proxy?p=/irext-server/indexing/list_indexes&b=\"categoryId\":\"'+(cs[$('sc').value].id||cs[$('sc').value].categoryId)+'\",\"brandId\":\"'+(bs[$('sb').value].id||bs[$('sb').value].brandId)+'\",\"cityCode\":\"\",\"from\":\"0\",\"count\":\"500\"').then(r=>r.json()).then(res=>{let d=res.entity||[];is=d;curr=0;view('v_match');$('midx').innerText=1;$('mtotal').innerText=is.length})}function startMatchSTB(){let cCode=$('sct').value;let opId=bs[$('sop').value].operatorId;fetch(`/api/proxy?p=/irext-server/indexing/list_indexes&b=\"categoryId\":\"3\",\"brandId\":\"0\",\"cityCode\":\"${cCode}\",\"operatorId\":\"${opId}\",\"from\":\"0\",\"count\":\"500\"`).then(r=>r.json()).then(res=>{let d=res.entity||[];is=d;curr=0;view('v_match');$('midx').innerText=1;$('mtotal').innerText=is.length})}function testPwr(){fire(0,is[curr],cs[$('sc').value])}function next(){if(curr<is.length-1){curr++;$('midx').innerText=curr+1}else{alert('试完了')}}function preSave(){view('v_save');let c=cs[$('sc').value],b=isSTB?bs[$('sop').value].operatorName:(bs[$('sb').value].name_cn||bs[$('sb').value].name);$('d_name').value=b+' '+(c.name_cn||c.name)}function doSave(){let bName=isSTB?bs[$('sop').value].operatorName:(bs[$('sb').value].name_cn||bs[$('sb').value].name);let d={name:$('d_name').value,cate:cs[$('sc').value].name_cn||cs[$('sc').value].name,brand:bName,idx:is[curr],cid:cs[$('sc').value].id||cs[$('sc').value].categoryId};fetch('/api/save',{method:'POST',body:JSON.stringify(d)}).then(()=>{goHome()})}function openDev(i){curDev=devs[i];curIdx=i;view('v_ctrl');$('c_title').innerText=curDev.name;renderPanel()}function delDev(){if(confirm('删除?'))fetch('/api/delete?i='+curIdx).then(goHome)}function goCtrl(){view('v_ctrl')}function renderPanel(){let n=curDev.cate;let h='';let m=kmaps[n]||kmaps['电视机'];Object.keys(m).forEach(k=>{h+=`<button onclick='fireTx(${k})' class='btn'>${m[k]}</button>`});$('btns').innerHTML=h;if(n.includes('电视')||n.includes('机顶盒')){let nh='';for(let i=0;i<=9;i++)nh+=`<button class='btn' onclick='fireTx(${14+i})'>${i}</button>`;$('num_btns').innerHTML=nh;$('num_btns').style.display='grid'}else{$('num_btns').style.display='none'}if(n.includes('空调')||curDev.cid==1){updateAcUI();$('ac_st').style.display='block'}else{$('ac_st').style.display='none'}}function updateAcUI(){$('ac_st').innerText=(ac.p?'ON':'OFF')+' | '+['冷','热','自动','风','除湿'][ac.m]+' | '+(ac.t+16)+'°C'}function showHA(){view('v_ha');let u=location.origin;let n='ir_'+curDev.idx.id;let code='';if(curDev.cate.includes('空调')||curDev.cid==1){code=`template:\\n  - climate:\\n      name: \"${curDev.name}\"\\n      unique_id: ${n}_climate\\n      hvac_modes: ['off','cool','heat']\\n      set_hvac_mode:\\n        - service: rest_command.${n}_set\\n          data: { k:0, p:\"{{0 if hvac_mode==\\'off\\' else 1}}\", m:0, t:8 }`;}else{code=`media_player:\\n  - platform: universal\\n    name: \"${curDev.name}\"\\n    commands:\\n      turn_on: { service: rest_command.${n}_cmd, data: {k: 0} }\\n      turn_off: { service: rest_command.${n}_cmd, data: {k: 0} }`;}$('ha_code').value=`rest_command:\\n  ${n}_${curDev.cid==1?'set':'cmd'}: { url: \"${u}/api/tx?id=${curDev.idx.id}&c=${curDev.cid}&k={{k}}&p={{p}}&m={{m}}&t={{t}}\" }\\n\\n`+code}function fireTx(k){fire(k, curDev.idx, {name_cn:curDev.cate, id:curDev.cid})}function fire(k, idx, cateObj){let cid=cateObj.id||cateObj.categoryId;let url=`/api/tx?id=${idx.id||idx.indexId}&c=${cid}&k=${k}`;if(cid==1){if(k==0)ac.p=1-ac.p;if(k==1)ac.m=(ac.m+1)%5;if(k==2)ac.t=Math.min(14,ac.t+1);if(k==3)ac.t=Math.max(0,ac.t-1);updateAcUI();url+=`&p=${ac.p}&m=${ac.m}&t=${ac.t}`}fetch(url).then(r=>r.text())}goHome();</script></body></html>"
          # --- 接上文：执行注入 ---
          # 将超长 HTML 注入到 Java 代码的 getUI() 方法返回中
          sed -i "s|return \"PLACEHOLDER\";|return \"${FULL_HTML}\";|" app/src/main/java/hap/re00660/re/IRService.java
          
          # 确保替换成功，防止编译失败
          grep -q "goHome" app/src/main/java/hap/re00660/re/IRService.java || echo "HTML注入失败"

      - name: 6. 编写 AndroidManifest (🌟权限全开)
        run: |
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.TRANSMIT_IR" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              
              <application android:label="HA红外网关" android:theme="@android:style/Theme.DeviceDefault.Light" android:usesCleartextTraffic="true">
                  <activity android:name="hap.re00660.re.MainActivity" android:exported="true" android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name="hap.re00660.re.IRService" android:exported="false" />
                  <receiver android:name="hap.re00660.re.BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

      - name: 7. 配置 Gradle 构建环境 (🌟兼容安卓8.0+)
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          echo "include ':app'" > settings.gradle
          
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              compileSdk 34
              namespace "hap.re00660.re"
              defaultConfig {
                  applicationId "hap.re00660.re"
                  minSdk 26
                  targetSdk 34
                  ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'org.nanohttpd:nanohttpd:2.3.1'
              implementation 'com.google.code.gson:gson:2.10.1'
              implementation fileTree(dir: 'libs', include: ['*.jar'])
          }
          EOF

      - name: 8. 执行编译
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: 9. 打包 APK
        run: gradle assembleDebug

      - name: 10. 上传最终成品
        uses: actions/upload-artifact@v4
        with:
          name: IREXT_LOCAL_JNI_FINAL
          path: app/build/outputs/apk/debug/app-debug.apk
          # 将 HTML 注入到 IRService.java
          sed -i "s|getUI()|${FULL_HTML}|" app/src/main/java/hap/re00660/re/IRService.java
