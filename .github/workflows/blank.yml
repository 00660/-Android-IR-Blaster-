name: IR_GATEWAY_FIXED_BUILD

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 清理战场
        run: |
          rm -rf *
          mkdir -p app/src/main/java/com/ir/gateway
          mkdir -p app/src/main/res/layout

      - name: 2. 现场生成 Android 代码 (适配新版规范)
        run: |
          # 清单文件：删除过时的 package 属性，防止报错
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.TRANSMIT_IR" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <application android:label="老表红外网关" android:theme="@android:style/Theme.DeviceDefault">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 界面布局
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:padding="30dp" android:gravity="center">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" 
                  android:text="🚀 红外网关运行中" android:textSize="24sp" android:textStyle="bold" />
              <TextView android:id="@+id/ip_text" android:layout_width="wrap_content" 
                  android:layout_height="wrap_content" android:text="正在获取IP..." android:textSize="18sp" android:layout_marginTop="20dp" />
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" 
                  android:text="在电脑访问显示的地址控制" android:layout_marginTop="40dp" android:textColor="#666666" />
          </LinearLayout>
          EOF

          # Java核心逻辑
          cat <<EOF > app/src/main/java/com/ir/gateway/MainActivity.java
          package com.ir.gateway;
          import android.app.Activity;
          import android.hardware.ConsumerIrManager;
          import android.os.Bundle;
          import android.widget.TextView;
          import java.net.InetAddress;
          import java.net.NetworkInterface;
          import java.util.Collections;
          import java.util.List;
          import java.util.Map;
          import fi.iki.elonen.NanoHTTPD;

          public class MainActivity extends Activity {
              private WebServer server;
              private ConsumerIrManager ir;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  ir = (ConsumerIrManager) getSystemService(CONSUMER_IR_SERVICE);
                  TextView ipText = findViewById(R.id.ip_text);
                  String ip = getIP();
                  ipText.setText("http://" + ip + ":8080");
                  server = new WebServer(8080);
                  try { server.start(); } catch (Exception e) { ipText.setText("启动失败: " + e.getMessage()); }
              }
              private class WebServer extends NanoHTTPD {
                  public WebServer(int port) { super(port); }
                  @Override
                  public Response serve(IHTTPSession session) {
                      Map<String, String> p = session.getParms();
                      String freq = p.get("f");
                      String pattern = p.get("p");
                      if (freq != null && pattern != null) {
                          try {
                              int f = Integer.parseInt(freq);
                              String[] parts = pattern.split(",");
                              int[] pat = new int[parts.length];
                              for (int i=0; i<parts.length; i++) pat[i] = Integer.parseInt(parts[i].trim());
                              if (ir != null && ir.hasIrEmitter()) {
                                  ir.transmit(f, pat);
                                  return newFixedLengthResponse("OK - Signal Sent!");
                              }
                          } catch (Exception e) { return newFixedLengthResponse("Error: " + e.getMessage()); }
                      }
                      return newFixedLengthResponse("Usage: http://IP:8080/?f=38000&p=9000,4500...");
                  }
              }
              private String getIP() {
                  try {
                      List<NetworkInterface> nfs = Collections.list(NetworkInterface.getNetworkInterfaces());
                      for (NetworkInterface nf : nfs) {
                          for (InetAddress addr : Collections.list(nf.getInetAddresses())) {
                              if (!addr.isLoopbackAddress() && addr.getHostAddress().indexOf(':') < 0) return addr.getHostAddress();
                          }
                      }
                  } catch (Exception e) {}
                  return "0.0.0.0";
              }
          }
          EOF

      - name: 3. 编写 Gradle 配置 (解决 Resolved 冲突)
        run: |
          echo "include ':app'" > settings.gradle
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF
          
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              compileSdk 34
              namespace "com.ir.gateway"
              defaultConfig {
                  applicationId "com.ir.gateway"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'org.nanohttpd:nanohttpd:2.3.1'
          }
          EOF

      - name: 4. 设置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 5. 设置指定版本 Gradle (降级至 8.7 避开 9.3 兼容坑)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: 6. 执行编译 (White-Label Build)
        run: gradle assembleDebug

      - name: 7. 导出最终网关 APK
        uses: actions/upload-artifact@v4
        with:
          name: IR_Web_Gateway_Stable
          path: app/build/outputs/apk/debug/app-debug.apk
