name: IREXT_FINAL_RELEASE_BUILD

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 代码初始化
        run: |
          rm -rf *
          mkdir -p app/src/main/java/com/irext/decodesdk
          mkdir -p app/src/main/java/hap/re00660/re
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/jniLibs
          echo "✅ 准备就绪"

      - name: 2. 注入 JNI 硬件解密驱动
        run: |
          wget "https://irext-lib-release.oss-cn-hangzhou.aliyuncs.com/1.5.2/decode_sdk/libirdecode_jni_1.5.2-android.zip" -O jni.zip
          unzip jni.zip -d jni_temp
          SOURCE_DIR=$(find jni_temp -name "arm64-v8a" -type d | head -n 1 | xargs dirname)
          cp -r $SOURCE_DIR/* app/src/main/jniLibs/
          echo "✅ JNI 注入成功"

      - name: 3. 编写 Java 桥接逻辑
        run: |
          cat <<EOF > app/src/main/java/com/irext/decodesdk/IRDecode.java
          package com.irext.decodesdk;
          public class IRDecode {
              static { System.loadLibrary("irdecode"); }
              public native int init();
              public native int open(int category, int subCategory, byte[] bin, int binLength);
              public native int[] decode(int keyCode, int[] acStatus);
              public native void close();
          }
          EOF

      - name: 4. 编写满血版商用 Web 网关 (已修复 API 签名错误)
        run: |
          cat <<'EOF' > app/src/main/java/hap/re00660/re/IRService.java
          package hap.re00660.re;
          import android.app.*;
          import android.content.*;
          import android.hardware.ConsumerIrManager;
          import android.os.IBinder;
          import android.util.Log;
          import com.irext.decodesdk.IRDecode;
          import fi.iki.elonen.NanoHTTPD;
          import java.io.*;
          import java.util.*;
          import java.util.concurrent.CompletableFuture;
          import com.google.gson.Gson;
          import net.irext.webapi.WebAPIs;
          import net.irext.webapi.WebAPICallbacks;
          import net.irext.webapi.model.*;

          public class IRService extends Service {
              private WebServer server;
              private ConsumerIrManager ir;
              private IRDecode decoder = new IRDecode();
              private WebAPIs webApis;
              private Gson gson = new Gson();
              
              // 你的 Key 配置
              private static final String APP_KEY = "55b1d89fda0658d6f851ee89cad564de";
              private static final String APP_SECRET = "83dfd86ad59843ce50342ec863a49bf0";

              @Override
              public void onCreate() {
                  super.onCreate();
                  NotificationChannel ch = new NotificationChannel("IR", "ha红外网关", NotificationManager.IMPORTANCE_LOW);
                  getSystemService(NotificationManager.class).createNotificationChannel(ch);
                  startForeground(1, new Notification.Builder(this, "IR").setContentTitle("ha红外网关在线").setContentText("API端口: 8080").setSmallIcon(android.R.drawable.ic_dialog_info).build());
                  
                  ir = (ConsumerIrManager) getSystemService(CONSUMER_IR_SERVICE);
                  decoder.init();
                  
                  try {
                      // 修复1: getInstance 需要传入 Key 和 Secret
                      webApis = WebAPIs.getInstance(APP_KEY, APP_SECRET);
                      
                      webApis.signIn(this, new WebAPICallbacks.SignInCallback() {
                          @Override public void onSignInSuccess(UserApp u) { Log.d("IRext", "鉴权成功: " + u.getId()); }
                          @Override public void onSignInFailed() { Log.e("IRext", "鉴权失败"); }
                          @Override public void onSignInError() { Log.e("IRext", "鉴权错误"); }
                      });
                  } catch(Exception e) { e.printStackTrace(); }

                  try { server = new WebServer(8080); server.start(); } catch (Exception e) {}
              }

              private class WebServer extends NanoHTTPD {
                  public WebServer(int port) { super(port); }
                  @Override
                  public Response serve(IHTTPSession session) {
                      String uri = session.getUri();
                      Map<String, String> p = session.getParms();
                      
                      try {
                          if ("/api/categories".equals(uri)) {
                              CompletableFuture<String> f = new CompletableFuture<>();
                              // 修复2: listCategories 必须要传分页参数 (from:0, count:200)
                              webApis.listCategories(0, 200, new WebAPICallbacks.ListCategoriesCallback() {
                                  public void onListCategoriesSuccess(List<Category> res) { f.complete(gson.toJson(res)); }
                                  public void onListCategoriesFailed() { f.complete("[]"); }
                                  public void onListCategoriesError() { f.complete("[]"); }
                              });
                              return newFixedLengthResponse(Response.Status.OK, "application/json", f.get());
                          }
                          if ("/api/brands".equals(uri)) {
                              int cid = Integer.parseInt(p.get("categoryId"));
                              CompletableFuture<String> f = new CompletableFuture<>();
                              // 修复3: listBrands 必须要传分页参数 (cid, from:0, count:200)
                              webApis.listBrands(cid, 0, 200, new WebAPICallbacks.ListBrandsCallback() {
                                  public void onListBrandsSuccess(List<Brand> res) { f.complete(gson.toJson(res)); }
                                  public void onListBrandsFailed() { f.complete("[]"); }
                                  public void onListBrandsError() { f.complete("[]"); }
                              });
                              return newFixedLengthResponse(Response.Status.OK, "application/json", f.get());
                          }
                          if ("/api/indexes".equals(uri)) {
                              int cid = Integer.parseInt(p.get("categoryId"));
                              int bid = Integer.parseInt(p.get("brandId"));
                              CompletableFuture<String> f = new CompletableFuture<>();
                              // 修复4: listRemoteIndexes 需要传5个参数 (cid, bid, city, operator, page:0)
                              webApis.listRemoteIndexes(cid, bid, "0", "0", 0, new WebAPICallbacks.ListIndexesCallback() {
                                  public void onListIndexesSuccess(List<RemoteIndex> res) { f.complete(gson.toJson(res)); }
                                  public void onListIndexesFailed() { f.complete("[]"); }
                                  public void onListIndexesError() { f.complete("[]"); }
                              });
                              return newFixedLengthResponse(Response.Status.OK, "application/json", f.get());
                          }
                          if ("/api/transmit".equals(uri)) {
                              int idxId = Integer.parseInt(p.get("indexId"));
                              String rMap = p.get("remoteMap");
                              int cid = Integer.parseInt(p.get("categoryId"));
                              int subCate = Integer.parseInt(p.get("subCate"));
                              int keyCode = Integer.parseInt(p.get("keyCode"));

                              File binFile = new File(getCacheDir(), rMap + ".bin");
                              if (!binFile.exists()) {
                                  CompletableFuture<Boolean> dl = new CompletableFuture<>();
                                  webApis.downloadBin(rMap, idxId, new WebAPICallbacks.DownloadBinCallback() {
                                      public void onDownloadBinSuccess(InputStream is) {
                                          try {
                                              FileOutputStream fos = new FileOutputStream(binFile);
                                              byte[] buf = new byte[1024]; int l;
                                              while((l = is.read(buf)) != -1) fos.write(buf, 0, l);
                                              fos.close(); dl.complete(true);
                                          } catch(Exception e) { dl.complete(false); }
                                      }
                                      public void onDownloadBinFailed() { dl.complete(false); }
                                      public void onDownloadBinError() { dl.complete(false); }
                                  });
                                  if (!dl.get()) return newFixedLengthResponse("云端库下载失败");
                              }

                              byte[] binBytes = java.nio.file.Files.readAllBytes(binFile.toPath());
                              if (decoder.open(cid, subCate, binBytes, binBytes.length) >= 0) {
                                  int[] acStatus = null;
                                  if (cid == 1) acStatus = new int[]{0, 8, 0, 0, 0, 0, 0}; 
                                  int[] pattern = decoder.decode(keyCode, acStatus);
                                  decoder.close();
                                  if (pattern != null && pattern.length > 0) {
                                      ir.transmit(38000, pattern);
                                      return newFixedLengthResponse("OK");
                                  }
                              }
                              return newFixedLengthResponse("底层解密执行失败");
                          }
                      } catch(Exception e) { return newFixedLengthResponse("ERR: " + e.getMessage()); }

                      String html = "<!DOCTYPE html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>ha红外网关</title><script src='https://cdn.tailwindcss.com'></script><script src='https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js'></script></head><body class='bg-gray-100 font-sans antialiased text-gray-800'><div id='app' class='max-w-md mx-auto mt-8 bg-white p-6 rounded-xl shadow-lg'><h2 class='text-2xl font-bold mb-6 text-center text-blue-600'>📡 ha红外网关</h2><div class='mb-4'><label class='block text-sm font-medium mb-1'>设备类型</label><select v-model='sc' @change='lb' class='w-full border rounded p-2'><option disabled value=''>请选择类型</option><option v-for='c in cats' :value='c'>{{ c.name || c.name_cn }}</option></select></div><div class='mb-4' v-if='brands.length'><label class='block text-sm font-medium mb-1'>设备品牌</label><select v-model='sb' @change='li' class='w-full border rounded p-2'><option disabled value=''>请选择品牌</option><option v-for='b in brands' :value='b'>{{ b.name || b.name_cn }}</option></select></div><div class='mb-6' v-if='idx.length'><label class='block text-sm font-medium mb-1'>遥控型号 (云端索引)</label><select v-model='si' class='w-full border rounded p-2'><option disabled value=''>请选择型号</option><option v-for='i in idx' :value='i'>{{ i.remoteMap || i.remote_map }}</option></select></div><div v-if='si' class='grid grid-cols-2 gap-4'><button @click='tx(1)' class='bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded'>电源 (POWER)</button><button @click='tx(2)' class='bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded'>模式 (MODE)</button><button @click='tx(3)' class='bg-gray-200 hover:bg-gray-300 font-bold py-3 rounded'>温度+ / 音量+</button><button @click='tx(4)' class='bg-gray-200 hover:bg-gray-300 font-bold py-3 rounded'>温度- / 音量-</button></div></div><script>new Vue({el:'#app',data:{cats:[],brands:[],idx:[],sc:'',sb:'',si:''},mounted(){fetch('/api/categories').then(r=>r.json()).then(d=>this.cats=d);},methods:{lb(){this.brands=[];this.idx=[];this.sb='';this.si='';let cid=this.sc.id||this.sc.categoryId;fetch('/api/brands?categoryId='+cid).then(r=>r.json()).then(d=>this.brands=d);},li(){this.idx=[];this.si='';let cid=this.sc.id||this.sc.categoryId;let bid=this.sb.id||this.sb.brandId;fetch('/api/indexes?categoryId='+cid+'&brandId='+bid).then(r=>r.json()).then(d=>this.idx=d);},tx(k){let cid=this.sc.id||this.sc.categoryId;let sid=this.si.id||this.si.indexId;let map=this.si.remoteMap||this.si.remote_map;let sub=this.si.subCate||this.si.sub_cate;fetch('/api/transmit?indexId='+sid+'&remoteMap='+map+'&categoryId='+cid+'&subCate='+sub+'&keyCode='+k).then(r=>r.text()).then(t=>{if(t!=='OK')alert('失败: '+t);else alert('已发送!');});}}});</script></body></html>";
                      return newFixedLengthResponse(Response.Status.OK, "text/html", html);
                  }
              }
              @Override public IBinder onBind(Intent intent) { return null; }
          }
          EOF

      - name: 5. 编写无 Root 闪退的安全入口与保活
        run: |
          cat <<EOF > app/src/main/java/hap/re00660/re/MainActivity.java
          package hap.re00660.re;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.widget.TextView;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  TextView tv = new TextView(this); tv.setTextSize(18); tv.setPadding(40,40,40,40); setContentView(tv);
                  try {
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      if (!pm.isIgnoringBatteryOptimizations(getPackageName())) {
                          Intent intent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                          intent.setData(Uri.parse("package:" + getPackageName()));
                          startActivity(intent);
                      }
                  } catch (Exception e) {}
                  
                  startService(new Intent(this, IRService.class));
                  tv.setText("🚀 ha红外网关 启动成功\n\n✅ 已移除 Root 依赖\n✅ 接入官方云端 (API已修复)\n✅ 商用级 Web UI\n\n👇 请在局域网内用浏览器访问: http://设备IP:8080");
              }
          }
          EOF

      - name: 6. 清单文件声明
        run: |
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.TRANSMIT_IR" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <application android:label="ha红外网关" android:theme="@android:style/Theme.DeviceDefault">
                  <!-- 虽然代码里传了，但部分SDK版本可能还会读Manifest，留着保险 -->
                  <meta-data android:name="irext_app_key" android:value="55b1d89fda0658d6f851ee89cad564de" />
                  <meta-data android:name="irext_app_secret" android:value="83dfd86ad59843ce50342ec863a49bf0" />
                  
                  <activity android:name="hap.re00660.re.MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
                  <service android:name="hap.re00660.re.IRService" android:exported="false" />
              </application>
          </manifest>
          EOF

      - name: 7. Gradle 属性配置
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: 8. 最终构建配置 (增加 SDK 与序列化依赖)
        run: |
          echo "include ':app'" > settings.gradle
          cat <<EOF > build.gradle
          buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral(); maven { url "http://maven.irext.net/"; allowInsecureProtocol = true } } }
          EOF
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              compileSdk 34
              namespace "hap.re00660.re"
              defaultConfig { applicationId "hap.re00660.re"; minSdk 26; targetSdk 34; ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' } }
          }
          dependencies {
              implementation 'org.nanohttpd:nanohttpd:2.3.1'
              implementation 'net.irext.webapi:irext-androidapi:1.5.2'
              implementation 'com.google.code.gson:gson:2.10.1'
          }
          EOF

      - name: 9. 执行编译
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: 10. 导出 APK
        run: gradle assembleDebug

      - name: 11. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: IREXT_SUCCESS_APK
          path: app/build/outputs/apk/debug/app-debug.apk
