name: Build_IR_APK_AutoFix

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: 3. 强制重构项目结构 (解决路径错误)
        run: |
          # 强制创建标准的安卓目录
          mkdir -p app/src/main/java/com/ir/test
          mkdir -p app/src/main/res/layout

          # 如果你之前文件传错位置了，这行会把它们挪到正确的地方
          find . -name "MainActivity.java" -exec cp {} app/src/main/java/com/ir/test/ \;
          find . -name "activity_main.xml" -exec cp {} app/src/main/res/layout/ \;
          find . -name "AndroidManifest.xml" -exec cp {} app/src/main/ \;

      - name: 4. 强制覆盖配置文件 (解决 Gradle 报错)
        run: |
          # 写入根目录设置
          echo "include ':app'" > settings.gradle
          
          # 写入根目录 build.gradle
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # 写入 app 目录 build.gradle
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              compileSdk 33
              namespace "com.ir.test"
              defaultConfig {
                  applicationId "com.ir.test"
                  minSdk 19
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

      - name: 5. 执行编译
        # 使用系统自带的 gradle 命令
        run: gradle assembleDebug

      - name: 6. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: IR_Success_APK
          path: app/build/outputs/apk/debug/app-debug.apkapp/build/outputs/apk/debug/app-debug.apk
