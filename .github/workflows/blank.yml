name: IREXT_LAN_SYNC_BUILD

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 代码初始化
        run: |
          rm -rf *
          mkdir -p app/src/main/java/hap/re00660/re
          mkdir -p app/src/main/res/layout
          echo "✅ 准备就绪"

      - name: 2. 编写满血版商用 Web 网关 (🌟服务端存储 + HA 配置生成)
        run: |
          cat <<'EOF' > app/src/main/java/hap/re00660/re/IRService.java
          package hap.re00660.re;
          import android.app.*;
          import android.content.*;
          import android.hardware.ConsumerIrManager;
          import android.os.IBinder;
          import android.util.Log;
          import fi.iki.elonen.NanoHTTPD;
          import java.io.*;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.*;
          import com.google.gson.Gson;
          import com.google.gson.reflect.TypeToken;
          import com.google.gson.JsonObject;
          import com.google.gson.JsonParser;
          import com.google.gson.JsonArray;

          public class IRService extends Service {
              private WebServer server;
              private ConsumerIrManager ir;
              private SharedPreferences prefs;
              private Gson gson = new Gson();
              
              private String APP_KEY = "55b1d89fda0658d6f851ee89cad564de";
              private String APP_SECRET = "83dfd86ad59843ce50342ec863a49bf0";
              private String dockerUrl = "http://127.0.0.1:8081";
              private String apiId = "", apiToken = "";

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if(intent != null && intent.getStringExtra("DOCKER_URL") != null) {
                      dockerUrl = intent.getStringExtra("DOCKER_URL");
                      if(dockerUrl.endsWith("/")) dockerUrl = dockerUrl.substring(0, dockerUrl.length()-1);
                      loginPrivateCloud();
                  }
                  return START_STICKY;
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  prefs = getSharedPreferences("IREXT_DEVICES", MODE_PRIVATE);
                  try {
                      NotificationChannel ch = new NotificationChannel("IR", "ha红外网关", NotificationManager.IMPORTANCE_LOW);
                      getSystemService(NotificationManager.class).createNotificationChannel(ch);
                      startForeground(1, new Notification.Builder(this, "IR").setContentTitle("网关运行中").setContentText("API端口: 8080").setSmallIcon(android.R.drawable.ic_dialog_info).build());
                  } catch(Throwable t) {}
                  try { ir = (ConsumerIrManager) getSystemService(CONSUMER_IR_SERVICE); } catch(Throwable t) {}
                  try { server = new WebServer(8080); server.start(); } catch (Exception e) {}
              }
              
              private String postJSON(String path, String jsonBody) {
                  try {
                      URL url = new URL(dockerUrl + path);
                      HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod("POST");
                      conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                      conn.setConnectTimeout(3000);
                      conn.setDoOutput(true);
                      try(OutputStream os = conn.getOutputStream()) { os.write(jsonBody.getBytes("UTF-8")); }
                      InputStream is = conn.getResponseCode() >= 400 ? conn.getErrorStream() : conn.getInputStream();
                      if (is == null) return "{}";
                      try(BufferedReader br = new BufferedReader(new InputStreamReader(is, "UTF-8"))) {
                          StringBuilder sb = new StringBuilder();
                          String line;
                          while((line = br.readLine()) != null) sb.append(line);
                          return sb.toString();
                      }
                  } catch (Exception e) { return "{\"error\":\"" + e.getMessage() + "\"}"; }
              }

              private void loginPrivateCloud() {
                  new Thread(() -> {
                      String req = "{\"appKey\":\"" + APP_KEY + "\",\"appSecret\":\"" + APP_SECRET + "\",\"appType\":\"2\"}";
                      String res = postJSON("/irext-server/app/app_login", req);
                      try {
                          JsonObject root = JsonParser.parseString(res).getAsJsonObject();
                          JsonObject entity = root.getAsJsonObject("entity");
                          apiId = entity.get("id").getAsString();
                          apiToken = entity.get("token").getAsString();
                      } catch (Exception e) { }
                  }).start();
              }
              
              private class WebServer extends NanoHTTPD {
                  public WebServer(int port) { super(port); }
                  @Override
                  public Response serve(IHTTPSession session) {
                      String uri = session.getUri();
                      Map<String, String> p = session.getParms();
                      Method method = session.getMethod();
                      
                      try {
                          // === 1. 设备列表管理 API (服务端存储) ===
                          if ("/api/devices/list".equals(uri)) {
                              String json = prefs.getString("list", "[]");
                              return newFixedLengthResponse(Response.Status.OK, "application/json", json);
                          }
                          
                          if ("/api/devices/save".equals(uri) && Method.POST.equals(method)) {
                              Integer contentLength = Integer.parseInt(session.getHeaders().get("content-length"));
                              byte[] buffer = new byte[contentLength];
                              session.getInputStream().read(buffer, 0, contentLength);
                              String body = new String(buffer);
                              
                              String current = prefs.getString("list", "[]");
                              JsonArray list = JsonParser.parseString(current).getAsJsonArray();
                              list.add(JsonParser.parseString(body)); // 追加新设备
                              prefs.edit().putString("list", list.toString()).apply();
                              return newFixedLengthResponse("OK");
                          }

                          if ("/api/devices/delete".equals(uri)) {
                              int index = Integer.parseInt(p.get("index"));
                              String current = prefs.getString("list", "[]");
                              JsonArray list = JsonParser.parseString(current).getAsJsonArray();
                              JsonArray newList = new JsonArray();
                              for(int i=0; i<list.size(); i++) if(i != index) newList.add(list.get(i));
                              prefs.edit().putString("list", newList.toString()).apply();
                              return newFixedLengthResponse("OK");
                          }

                          // === 2. 发射 API ===
                          if ("/api/transmit".equals(uri)) {
                              if (ir == null || !ir.hasIrEmitter()) return newFixedLengthResponse("错误: 手机无红外");
                              if (apiId.isEmpty()) return newFixedLengthResponse("错误: Docker未连接");
                              
                              String idxId = p.get("indexId");
                              int cid = Integer.parseInt(p.get("categoryId"));
                              String keyCode = p.get("keyCode");

                              JsonObject reqObj = new JsonObject();
                              reqObj.addProperty("id", apiId);
                              reqObj.addProperty("token", apiToken);
                              reqObj.addProperty("indexId", idxId);
                              reqObj.addProperty("keyCode", keyCode);
                              reqObj.addProperty("directDecode", "0");
                              reqObj.addProperty("paraData", "0");

                              if (cid == 1) { // 空调特殊处理
                                  JsonObject ac = new JsonObject();
                                  int ap = Integer.parseInt(p.get("ap")); 
                                  ac.addProperty("acPower", ap == 1 ? "0" : "1");
                                  ac.addProperty("acMode", p.get("am"));
                                  ac.addProperty("acTemp", p.get("at"));
                                  ac.addProperty("acWindSpeed", "0");
                                  ac.addProperty("acWindDir", "0");
                                  ac.addProperty("changeWindDir", "0");
                                  reqObj.add("acStatus", ac);
                              }

                              String res = postJSON("/irext-server/operation/decode", reqObj.toString());
                              JsonObject root = JsonParser.parseString(res).getAsJsonObject();
                              if (root.has("entity") && !root.get("entity").isJsonNull()) {
                                  JsonArray arr = root.getAsJsonArray("entity");
                                  int[] pattern = new int[arr.size()];
                                  for (int i = 0; i < arr.size(); i++) pattern[i] = arr.get(i).getAsInt();
                                  if (pattern.length > 0) {
                                      int freq = 38000;
                                      try { freq = ir.getCarrierFrequencies()[0].getMinFrequency(); } catch(Exception e){}
                                      ir.transmit(freq, pattern);
                                      return newFixedLengthResponse("OK");
                                  }
                              }
                              return newFixedLengthResponse("Docker解码失败");
                          }
                          
                          // === 3. 代理 Docker 列表请求 ===
                          if ("/api/proxy".equals(uri)) {
                              String path = p.get("path");
                              String body = p.get("body");
                              String fullBody = "{\"id\":\""+apiId+"\",\"token\":\""+apiToken+"\"," + body + "}";
                              String res = postJSON(path, fullBody);
                              JsonObject root = JsonParser.parseString(res).getAsJsonObject();
                              String entity = root.has("entity") ? root.get("entity").toString() : "[]";
                              return newFixedLengthResponse(Response.Status.OK, "application/json", entity);
                          }

                      } catch(Exception e) { return newFixedLengthResponse("ERR: " + e.getMessage()); }

                      // 🌟 终极 UI: 仪表盘 + 向导 + HA生成器
                      String html = "<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>红外网关</title><style>body{font-family:sans-serif;background:#f0f2f5;padding:15px;margin:0;max-width:600px;margin:0 auto}.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:15px}h3{margin-top:0;color:#1890ff;display:flex;justify-content:space-between;align-items:center}.btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:bold;margin-top:10px;cursor:pointer;transition:all .2s}.btn:active{opacity:0.8}.btn-p{background:#1890ff;color:#fff}.btn-g{background:#52c41a;color:#fff}.btn-r{background:#ff4d4f;color:#fff}.btn-w{background:#f5f5f5;color:#666}.dev-item{display:flex;justify-content:space-between;align-items:center;background:#fafafa;padding:15px;border-radius:8px;margin-bottom:10px;border:1px solid #eee}.dev-item b{font-size:16px;color:#333}.dev-item span{color:#999;font-size:12px}.panel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}select,input{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:6px;box-sizing:border-box}#views>div{display:none}#v_home{display:block}textarea{width:100%;height:150px;border:1px solid #ddd;border-radius:6px;padding:10px;font-family:monospace;font-size:12px;background:#f9f9f9}</style></head><body>" +
                      "<div id='views'><div id='v_home'><h3>🏠 我的设备 <button class='btn-g' style='width:auto;padding:5px 15px' onclick='goAdd()'>+ 添加</button></h3><div id='dev_list'></div></div>" +
                      "<div id='v_add'><div class='card'><h3>📡 添加新设备</h3><label>类型</label><select id='sc' onchange='lb()'></select><label>品牌</label><select id='sb' onchange='startMatch()'></select><button class='btn btn-w' onclick='goHome()'>返回列表</button></div></div>" +
                      "<div id='v_match'><div class='card'><h3>⚡ 智能匹配向导</h3><div style='text-align:center;color:#666;margin:15px 0'>方案 <b id='midx' style='color:#1890ff;font-size:20px'>1</b> / <span id='mtotal'>0</span></div><h4 id='mname' style='text-align:center;color:#999;font-weight:normal'></h4><button class='btn btn-p' onclick='testPwr()'>📡 点击测试电源</button><div style='display:grid;grid-template-columns:1fr 1fr;gap:10px'><button class='btn btn-w' onclick='next()'>❌ 无反应</button><button class='btn btn-g' onclick='preSave()'>✅ 有反应</button></div><button class='btn btn-w' style='margin-top:15px' onclick='goAdd()'>退出匹配</button></div></div>" +
                      "<div id='v_save'><div class='card'><h3>💾 保存设备</h3><label>给设备起个名 (如: 主卧空调)</label><input id='d_name' placeholder='输入名称...'><button class='btn btn-g' onclick='doSave()'>确认保存</button><button class='btn btn-w' onclick='showMatchUI()'>返回测试</button></div></div>" +
                      "<div id='v_ctrl'><div class='card'><h3><span id='c_title'></span> <button class='btn-w' style='width:auto;padding:5px 10px;font-size:12px' onclick='goHome()'>关闭</button></h3><div id='ac_st' style='text-align:center;margin-bottom:15px;color:#666;font-size:14px'></div><div class='panel' id='btns'></div><button class='btn btn-w' style='margin-top:20px' onclick='showHA()'>🛠️ 生成 HomeAssistant 配置</button><button class='btn btn-r' onclick='delDev()'>🗑️ 删除此设备</button></div></div>" +
                      "<div id='v_ha'><div class='card'><h3>🛠️ HA 配置 <button class='btn-w' style='width:auto;padding:5px 10px' onclick='goCtrl()'>返回</button></h3><p style='font-size:12px;color:#666'>复制以下代码到 configuration.yaml，重启 HA 即可:</p><textarea id='ha_code'></textarea></div></div>" +
                      "</div><script>" +
                      "const $=i=>document.getElementById(i);let cs=[],bs=[],is=[],curr=0,ac={p:0,m:0,t:8},devs=[],curDev=null,curIdx=-1;" +
                      "function view(id){document.querySelectorAll('#views>div').forEach(d=>d.style.display='none');$(id).style.display='block'}" +
                      "function loadDevs(){fetch('/api/devices/list').then(r=>r.json()).then(d=>{devs=d;let h='';d.forEach((x,i)=>{h+=`<div class='dev-item' onclick='openDev(${i})'><div><b>${x.name}</b><br><span>${x.brand} - ${x.cate}</span></div><b style='color:#ccc'>&gt;</b></div>`});if(d.length==0)h='<p style=\"text-align:center;color:#999;padding:20px\">暂无设备，请点击右上角添加</p>';$('dev_list').innerHTML=h})}" +
                      "function goHome(){loadDevs();view('v_home')}" +
                      "function goAdd(){view('v_add');if(cs.length==0)fetch('/api/proxy?path=/irext-server/indexing/list_categories&body=\"from\":\"0\",\"count\":\"200\"').then(r=>r.json()).then(d=>{cs=d;$('sc').innerHTML='<option>请选择类型</option>'+d.map((c,i)=>'<option value='+i+'>'+(c.name||c.name_cn)+'</option>')})}" +
                      "function lb(){let i=$('sc').value;fetch('/api/proxy?path=/irext-server/indexing/list_brands&body=\"categoryId\":\"'+(cs[i].id||cs[i].categoryId)+'\",\"from\":\"0\",\"count\":\"500\"').then(r=>r.json()).then(d=>{bs=d;$('sb').innerHTML='<option>请选择品牌</option>'+d.map((b,i)=>'<option value='+i+'>'+(b.name||b.name_cn)+'</option>')})}" +
                      "function startMatch(){let ci=$('sc').value,bi=$('sb').value;$('sb').disabled=true;fetch('/api/proxy?path=/irext-server/indexing/list_indexes&body=\"categoryId\":\"'+(cs[ci].id||cs[ci].categoryId)+'\",\"brandId\":\"'+(bs[bi].id||bs[bi].brandId)+'\",\"cityCode\":\"\",\"from\":\"0\",\"count\":\"500\"').then(r=>r.json()).then(d=>{is=d;curr=0;$('sb').disabled=false;showMatchUI()})}" +
                      "function showMatchUI(){view('v_match');$('midx').innerText=curr+1;$('mtotal').innerText=is.length;$('mname').innerText=is[curr].remoteMap||is[curr].remote_map}" +
                      "function testPwr(){tx(0, is[curr], cs[$('sc').value])}" +
                      "function next(){if(curr<is.length-1){curr++;showMatchUI()}else{alert('已试完')}}" +
                      "function preSave(){view('v_save');$('d_name').value=bs[$('sb').value].name_cn+' '+cs[$('sc').value].name_cn}" +
                      "function doSave(){let d={name:$('d_name').value,cate:cs[$('sc').value].name_cn,brand:bs[$('sb').value].name_cn,idx:is[curr],cid:cs[$('sc').value].id||cs[$('sc').value].categoryId};fetch('/api/devices/save',{method:'POST',body:JSON.stringify(d)}).then(()=>{goHome()})}" +
                      "function openDev(i){curDev=devs[i];curIdx=i;view('v_ctrl');$('c_title').innerText=curDev.name;renderPanel()}" +
                      "function goCtrl(){view('v_ctrl')}" +
                      "function delDev(){if(confirm('确定删除?'))fetch('/api/devices/delete?index='+curIdx).then(goHome)}" +
                      "function renderPanel(){let n=curDev.cate;let h='';if(n==='空调'){h='<button class=\"btn btn-p\" onclick=\"fire(0)\">电源</button><button class=\"btn btn-w\" onclick=\"fire(1)\">模式</button><button class=\"btn\" onclick=\"fire(2)\">温度+</button><button class=\"btn\" onclick=\"fire(3)\">温度-</button><button class=\"btn\" onclick=\"fire(9)\">风速</button>';updateAcUI()}else{h='<button class=\"btn btn-p\" onclick=\"fire(0)\">电源</button><button class=\"btn\" onclick=\"fire(1)\">菜单</button><button class=\"btn\" onclick=\"fire(7)\">音量+</button><button class=\"btn\" onclick=\"fire(8)\">音量-</button><button class=\"btn\" onclick=\"fire(2)\">上</button><button class=\"btn\" onclick=\"fire(3)\">下</button><button class=\"btn\" onclick=\"fire(4)\">左</button><button class=\"btn\" onclick=\"fire(5)\">右</button><button class=\"btn btn-g\" onclick=\"fire(6)\">确认</button>';$('ac_st').innerText=curDev.idx.remoteMap}$('btns').innerHTML=h}" +
                      "function updateAcUI(){$('ac_st').innerText=(ac.p?'开':'关')+' | '+['冷','热','自动','风','除湿'][ac.m]+' | '+(ac.t+16)+'℃'}" +
                      "function fire(k){tx(k, curDev.idx, {name_cn:curDev.cate, id:curDev.cid})}" +
                      "function tx(k, idx, cateObj){let sid=idx.id||idx.indexId;if(cateObj.name_cn==='空调'){if(k==0)ac.p=1-ac.p;if(k==1)ac.m=(ac.m+1)%5;if(k==2)ac.t=Math.min(14,ac.t+1);if(k==3)ac.t=Math.max(0,ac.t-1);updateAcUI()}fetch('/api/transmit?indexId='+sid+'&categoryId='+cateObj.id+'&keyCode='+k+'&ap='+ac.p+'&am='+ac.m+'&at='+ac.t).then(r=>r.text()).then(t=>{if(t!='OK')alert(t)})}" +
                      "function showHA(){view('v_ha');let u=location.protocol+'//'+location.host;let n=curDev.name;let c=`rest_command:\n  ir_${n}_power:\n    url: \"${u}/api/transmit?indexId=${curDev.idx.id}&categoryId=${curDev.cid}&keyCode=0&ap=1&am=0&at=8\"\n    method: GET\n\nswitch:\n  - platform: template\n    switches:\n      ir_${n}:\n        turn_on:\n          service: rest_command.ir_${n}_power\n        turn_off:\n          service: rest_command.ir_${n}_power\n`;$('ha_code').value=c}" +
                      "loadDevs();</script></body></html>";
                      return newFixedLengthResponse(Response.Status.OK, "text/html", html);
                  }
              }
              @Override public IBinder onBind(Intent intent) { return null; }
          }
          EOF

      - name: 3. 编写控制台 UI
        run: |
          cat <<EOF > app/src/main/java/hap/re00660/re/MainActivity.java
          package hap.re00660.re;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.*;
          import android.view.Gravity;
          import android.graphics.Color;
          import java.io.*;

          public class MainActivity extends Activity {
              private TextView logTv;
              private Switch rootSwitch;
              private EditText ipInput;
              private SharedPreferences prefs;

              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  prefs = getSharedPreferences("IREXT_CFG", MODE_PRIVATE);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(50, 50, 50, 50);
                  layout.setGravity(Gravity.CENTER_HORIZONTAL);

                  TextView title = new TextView(this);
                  title.setText("📡 ha私有云红外网关");
                  title.setTextSize(24);
                  title.setTextColor(Color.BLACK);
                  layout.addView(title);
                  
                  TextView ipLabel = new TextView(this);
                  ipLabel.setText("\n👇 填入 Docker 私有云 IP:");
                  layout.addView(ipLabel);
                  
                  ipInput = new EditText(this);
                  ipInput.setSingleLine(true);
                  ipInput.setText(prefs.getString("docker_ip", "http://192.168.1.100:8081"));
                  layout.addView(ipInput);

                  rootSwitch = new Switch(this);
                  rootSwitch.setText("启用 Root 增强模式");
                  layout.addView(rootSwitch);

                  Button btnStart = new Button(this);
                  btnStart.setText("保存并启动网关");
                  btnStart.setBackgroundColor(Color.parseColor("#1890ff"));
                  btnStart.setTextColor(Color.WHITE);
                  btnStart.setOnClickListener(v -> startGW());
                  layout.addView(btnStart);
                  
                  Button btnBattery = new Button(this);
                  btnBattery.setText("申请后台保活 (必点)");
                  btnBattery.setOnClickListener(v -> ignoreBattery());
                  layout.addView(btnBattery);

                  logTv = new TextView(this);
                  logTv.setText("等待启动...");
                  logTv.setPadding(0, 30, 0, 0);
                  layout.addView(logTv);
                  setContentView(layout);
              }

              private void startGW() {
                  try {
                      String dockerIp = ipInput.getText().toString().trim();
                      prefs.edit().putString("docker_ip", dockerIp).apply();
                      log("正在连接: " + dockerIp);
                      if (rootSwitch.isChecked()) {
                          new Thread(() -> {
                              try {
                                  Process p = Runtime.getRuntime().exec("su");
                                  DataOutputStream os = new DataOutputStream(p.getOutputStream());
                                  os.writeBytes("dumpsys deviceidle whitelist +" + getPackageName() + "\n");
                                  os.writeBytes("exit\n");
                                  os.flush();
                              } catch(Exception e) {}
                          }).start();
                      }
                      Intent i = new Intent(this, IRService.class);
                      i.putExtra("DOCKER_URL", dockerIp);
                      if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {
                          startForegroundService(i);
                      } else {
                          startService(i);
                      }
                      log("✅ 启动成功! 访问 http://手机IP:8080");
                  } catch (Exception e) { log("❌ 失败: " + e.getMessage()); }
              }
              private void ignoreBattery() {
                  try { startActivity(new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:"+getPackageName()))); } catch(Exception e){}
              }
              private void log(String msg) { logTv.setText(logTv.getText() + "\n" + msg); }
          }
          EOF

      - name: 4. 清单文件声明
        run: |
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.TRANSMIT_IR" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <application android:label="ha红外网关" android:theme="@android:style/Theme.DeviceDefault.Light" android:usesCleartextTraffic="true">
                  <activity android:name="hap.re00660.re.MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
                  <service android:name="hap.re00660.re.IRService" android:exported="false" />
              </application>
          </manifest>
          EOF

      - name: 5. Gradle 属性配置
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: 6. 最终构建配置
        run: |
          echo "include ':app'" > settings.gradle
          cat <<EOF > build.gradle
          buildscript { repositories { google(); mavenCentral() } ; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral(); } }
          EOF
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              compileSdk 34
              namespace "hap.re00660.re"
              defaultConfig { applicationId "hap.re00660.re"; minSdk 26; targetSdk 34; ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' } }
          }
          dependencies {
              implementation 'org.nanohttpd:nanohttpd:2.3.1'
              implementation 'com.google.code.gson:gson:2.10.1'
          }
          EOF

      - name: 7. 执行编译
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: 8. 导出 APK
        run: gradle assembleDebug

      - name: 9. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: IREXT_SUCCESS_APK
          path: app/build/outputs/apk/debug/app-debug.apk
