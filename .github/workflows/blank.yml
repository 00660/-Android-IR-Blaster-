name: IR_GATEWAY_ROCK_SOLID

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 清理战场
        run: rm -rf * && mkdir -p app/src/main/java/com/ir/gateway && mkdir -p app/src/main/res/layout

      - name: 2. 注入“稳如磐石”的红外核心代码
        run: |
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.TRANSMIT_IR" />
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="老表红外终极网关" android:theme="@android:style/Theme.DeviceDefault">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat <<EOF > app/src/main/java/com/ir/gateway/MainActivity.java
          package com.ir.gateway;
          import android.app.Activity;
          import android.hardware.ConsumerIrManager;
          import android.os.Bundle;
          import android.widget.TextView;
          import java.net.InetAddress;
          import java.net.NetworkInterface;
          import java.util.*;
          import fi.iki.elonen.NanoHTTPD;

          public class MainActivity extends Activity {
              private WebServer server;
              private ConsumerIrManager ir;
              private String myIp;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  ir = (ConsumerIrManager) getSystemService(CONSUMER_IR_SERVICE);
                  myIp = getIP();
                  
                  TextView tv = new TextView(this);
                  tv.setTextSize(20);
                  tv.setPadding(40, 40, 40, 40);
                  tv.setText("✅ 核心发射引擎已就绪\n\n请用电脑浏览器访问:\nhttp://" + myIp + ":8080");
                  setContentView(tv);
                  
                  server = new WebServer(8080);
                  try { server.start(); } catch (Exception e) {}
              }

              private class WebServer extends NanoHTTPD {
                  public WebServer(int port) { super(port); }
                  @Override
                  public Response serve(IHTTPSession session) {
                      Map<String, String> p = session.getParms();
                      
                      // 唯一且绝对管用的发射接口
                      String raw = p.get("raw");
                      if (raw != null) {
                          try {
                              String[] parts = raw.split(",");
                              int[] pat = new int[parts.length];
                              for(int i=0; i<parts.length; i++) pat[i] = Integer.parseInt(parts[i].trim());
                              
                              if (ir != null && ir.hasIrEmitter()) {
                                  ir.transmit(38000, pat);
                                  return newFixedLengthResponse("OK_SENT");
                              } else {
                                  return newFixedLengthResponse("ERR_NO_IR");
                              }
                          } catch (Exception e) {
                              return newFixedLengthResponse("ERR_FORMAT");
                          }
                      }

                      // 前端 UI：纯净、无假码
                      String html = "<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'>" +
                          "<style>body{font-family:sans-serif;background:#eef2f5;padding:20px;max-width:600px;margin:0 auto;text-align:center;}" +
                          ".card{background:white;padding:20px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.05);margin-bottom:20px;}" +
                          "input{width:90%;padding:15px;margin:10px 0;border:1px solid #ccc;border-radius:8px;font-size:14px;}" +
                          "button{width:100%;padding:15px;margin:8px 0;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;color:white;}" +
                          ".btn-blue{background:#1890ff;} .btn-green{background:#52c41a;} .btn-red{background:#ff4d4f;}</style>" +
                          "<script>" +
                          "function sendRaw() {" +
                          "  let code = document.getElementById('raw_code').value;" +
                          "  if(!code) return alert('红外码不能为空');" +
                          "  fetch('/?raw='+code).then(r=>r.text()).then(t=>{" +
                          "     if(t=='OK_SENT') alert('发射成功！(摄像头可见紫光)'); " +
                          "     else if(t=='ERR_NO_IR') alert('失败: 手机未检测到红外模块');" +
                          "     else alert('失败: 格式错误');" +
                          "  });" +
                          "}" +
                          "function sendQuick(code) {" +
                          "  document.getElementById('raw_code').value = code;" +
                          "  sendRaw();" +
                          "}" +
                          "</script></head><body>" +
                          "<h2>📱 终极红外控制台</h2>" +
                          
                          "<div class='card'><h3>1. 真实快捷码 (点击秒发)</h3>" +
                          "<button class='btn-blue' onclick='sendQuick(\"9000,4500,560,560,560,560,560,1690,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,1690,560,20000,9000,4500,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,1690,560\")'>❄️ 格力空调 (开机/制冷/26度)</button>" +
                          "<button class='btn-red' onclick='sendQuick(\"9000,4500,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,1690,560,20000,9000,4500,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,1690,560\")'>🛑 格力空调 (一键关机)</button>" +
                          "<button class='btn-green' onclick='sendQuick(\"4500,4500,560,1690,560,1690,560,1690,560,560,560,560,560,560,560,560,560,560,560,1690,560,1690,560,1690,560,560,560,560,560,560,560,560,560,560,560,560,560,1690,560,560,560,560,560,560,560,560,560,560,560,560,560,560,560,1690,560,1690,560,1690,560,1690,560,1690,560,1690,560,1690,560,4500\")'>📺 三星电视 (电源测试专用)</button>" +
                          "</div>" +
                          
                          "<div class='card'><h3>2. 手动精准控制区</h3>" +
                          "<input type='text' id='raw_code' placeholder='粘贴长串红外码...'>" +
                          "<button class='btn-green' onclick='sendRaw()'>🚀 强制发射框内代码</button>" +
                          "</div>" +
                          
                          "</body></html>";
                      return newFixedLengthResponse(html);
                  }
              }

              private String getIP() {
                  try {
                      List<NetworkInterface> nfs = Collections.list(NetworkInterface.getNetworkInterfaces());
                      for (NetworkInterface nf : nfs) {
                          for (InetAddress addr : Collections.list(nf.getInetAddresses())) {
                              if (!addr.isLoopbackAddress() && addr.getHostAddress().indexOf(':') < 0) return addr.getHostAddress();
                          }
                      }
                  } catch (Exception e) {}
                  return "0.0.0.0";
              }
          }
          EOF

      - name: 3. 强制重写 Gradle
        run: |
          echo "include ':app'" > settings.gradle
          cat <<EOF > build.gradle
          buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android { compileSdk 34; namespace "com.ir.gateway"; defaultConfig { applicationId "com.ir.gateway"; minSdk 21; targetSdk 34; versionCode 1; versionName "4.0" } }
          dependencies { implementation 'org.nanohttpd:nanohttpd:2.3.1' }
          EOF

      - name: 4. 设置环境
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - name: 5. 限制 Gradle 版本
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: 6. 编译
        run: gradle assembleDebug
      - name: 7. 导出
        uses: actions/upload-artifact@v4
        with: { name: IR_Rock_Solid, path: app/build/outputs/apk/debug/app-debug.apk }
