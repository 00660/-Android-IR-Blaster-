name: IREXT_FINAL_STABLE_BUILD

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 代码初始化
        run: |
          rm -rf *
          mkdir -p app/src/main/java/com/irext/decodesdk
          mkdir -p app/src/main/java/hap/re00660/re
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/jniLibs
          echo "✅ 准备就绪"

      - name: 2. 注入 JNI 硬件解密驱动
        run: |
          wget "https://irext-lib-release.oss-cn-hangzhou.aliyuncs.com/1.5.2/decode_sdk/libirdecode_jni_1.5.2-android.zip" -O jni.zip
          unzip jni.zip -d jni_temp
          SOURCE_DIR=$(find jni_temp -name "arm64-v8a" -type d | head -n 1 | xargs dirname)
          cp -r $SOURCE_DIR/* app/src/main/jniLibs/
          echo "✅ JNI 注入成功"

      - name: 3. 编写 Java 桥接逻辑
        run: |
          cat <<EOF > app/src/main/java/com/irext/decodesdk/IRDecode.java
          package com.irext.decodesdk;
          public class IRDecode {
              static { 
                  try { System.loadLibrary("irdecode"); } 
                  catch (Throwable t) { t.printStackTrace(); } 
              }
              public native int init();
              public native int open(int category, int subCategory, byte[] bin, int binLength);
              public native int[] decode(int keyCode, int[] acStatus);
              public native void close();
          }
          EOF

      - name: 4. 编写满血版商用 Web 网关 (🌟前端已重写为0依赖原生方案，拒绝裸奔)
        run: |
          cat <<'EOF' > app/src/main/java/hap/re00660/re/IRService.java
          package hap.re00660.re;
          import android.app.*;
          import android.content.*;
          import android.hardware.ConsumerIrManager;
          import android.os.IBinder;
          import android.util.Log;
          import android.os.Handler;
          import android.os.Looper;
          import com.irext.decodesdk.IRDecode;
          import fi.iki.elonen.NanoHTTPD;
          import java.io.*;
          import java.util.*;
          import java.util.concurrent.CompletableFuture;
          import com.google.gson.Gson;
          import net.irext.webapi.WebAPIs;
          import net.irext.webapi.WebAPICallbacks;
          import net.irext.webapi.model.*;

          public class IRService extends Service {
              private WebServer server;
              private ConsumerIrManager ir;
              private IRDecode decoder = new IRDecode();
              private WebAPIs webApis;
              private Gson gson = new Gson();
              
              private static final String APP_KEY = "55b1d89fda0658d6f851ee89cad564de";
              private static final String APP_SECRET = "83dfd86ad59843ce50342ec863a49bf0";

              @Override
              public void onCreate() {
                  super.onCreate();
                  try {
                      NotificationChannel ch = new NotificationChannel("IR", "ha红外网关", NotificationManager.IMPORTANCE_LOW);
                      getSystemService(NotificationManager.class).createNotificationChannel(ch);
                      startForeground(1, new Notification.Builder(this, "IR").setContentTitle("ha红外网关在线").setContentText("API端口: 8080").setSmallIcon(android.R.drawable.ic_dialog_info).build());
                  } catch(Throwable t) { Log.e("IRService", "通知栏创建失败", t); }
                  
                  try {
                      ir = (ConsumerIrManager) getSystemService(CONSUMER_IR_SERVICE);
                  } catch(Throwable t) { Log.e("IRService", "红外服务获取失败", t); }

                  try { decoder.init(); } catch(Throwable t) { Log.e("IRService", "JNI init failed", t); }
                  
                  new Thread(() -> {
                      try {
                          webApis = WebAPIs.getInstance(APP_KEY, APP_SECRET);
                          webApis.signIn(IRService.this, new WebAPICallbacks.SignInCallback() {
                              @Override public void onSignInSuccess(UserApp u) { Log.d("IRext", "鉴权成功"); }
                              @Override public void onSignInFailed() { Log.e("IRext", "鉴权失败"); }
                              @Override public void onSignInError() { Log.e("IRext", "鉴权错误"); }
                          });
                      } catch(Throwable e) { e.printStackTrace(); }
                  }).start();

                  try { server = new WebServer(8080); server.start(); } catch (Exception e) {}
              }

              private class WebServer extends NanoHTTPD {
                  public WebServer(int port) { super(port); }
                  @Override
                  public Response serve(IHTTPSession session) {
                      String uri = session.getUri();
                      Map<String, String> p = session.getParms();
                      
                      try {
                          if ("/api/transmit".equals(uri)) {
                              if (ir == null || !ir.hasIrEmitter()) return newFixedLengthResponse("错误: 手机没有红外发射器");
                              
                              int idxId = Integer.parseInt(p.get("indexId"));
                              String rMap = p.get("remoteMap");
                              int cid = Integer.parseInt(p.get("categoryId"));
                              int subCate = Integer.parseInt(p.get("subCate"));
                              int keyCode = Integer.parseInt(p.get("keyCode"));

                              File binFile = new File(getCacheDir(), rMap + ".bin");
                              if (!binFile.exists()) {
                                  CompletableFuture<Boolean> dl = new CompletableFuture<>();
                                  webApis.downloadBin(rMap, idxId, new WebAPICallbacks.DownloadBinCallback() {
                                      public void onDownloadBinSuccess(InputStream is) {
                                          try {
                                              FileOutputStream fos = new FileOutputStream(binFile);
                                              byte[] buf = new byte[1024]; int l;
                                              while((l = is.read(buf)) != -1) fos.write(buf, 0, l);
                                              fos.close(); dl.complete(true);
                                          } catch(Exception e) { dl.complete(false); }
                                      }
                                      public void onDownloadBinFailed() { dl.complete(false); }
                                      public void onDownloadBinError() { dl.complete(false); }
                                  });
                                  try { if (!dl.get()) return newFixedLengthResponse("云端库下载失败"); } catch(Exception e){}
                              }

                              byte[] binBytes = java.nio.file.Files.readAllBytes(binFile.toPath());
                              if (decoder.open(cid, subCate, binBytes, binBytes.length) >= 0) {
                                  int[] acStatus = null;
                                  if (cid == 1) acStatus = new int[]{0, 8, 0, 0, 0, 0, 0}; 
                                  int[] pattern = decoder.decode(keyCode, acStatus);
                                  decoder.close();
                                  if (pattern != null && pattern.length > 0) {
                                      ir.transmit(38000, pattern);
                                      return newFixedLengthResponse("OK");
                                  }
                              }
                              return newFixedLengthResponse("解码失败");
                          }
                          
                          if (webApis != null && "/api/categories".equals(uri)) {
                              CompletableFuture<String> f = new CompletableFuture<>();
                              webApis.listCategories(0, 200, new WebAPICallbacks.ListCategoriesCallback() {
                                  public void onListCategoriesSuccess(List<Category> res) { f.complete(gson.toJson(res)); }
                                  public void onListCategoriesFailed() { f.complete("[]"); }
                                  public void onListCategoriesError() { f.complete("[]"); }
                              });
                              return newFixedLengthResponse(Response.Status.OK, "application/json", f.get());
                          }
                          
                          if (webApis != null && "/api/brands".equals(uri)) {
                              int cid = Integer.parseInt(p.get("categoryId"));
                              CompletableFuture<String> f = new CompletableFuture<>();
                              webApis.listBrands(cid, 0, 200, new WebAPICallbacks.ListBrandsCallback() {
                                  public void onListBrandsSuccess(List<Brand> res) { f.complete(gson.toJson(res)); }
                                  public void onListBrandsFailed() { f.complete("[]"); }
                                  public void onListBrandsError() { f.complete("[]"); }
                              });
                              return newFixedLengthResponse(Response.Status.OK, "application/json", f.get());
                          }

                          if (webApis != null && "/api/indexes".equals(uri)) {
                              int cid = Integer.parseInt(p.get("categoryId"));
                              int bid = Integer.parseInt(p.get("brandId"));
                              CompletableFuture<String> f = new CompletableFuture<>();
                              webApis.listRemoteIndexes(cid, bid, "0", "0", 0, new WebAPICallbacks.ListIndexesCallback() {
                                  public void onListIndexesSuccess(List<RemoteIndex> res) { f.complete(gson.toJson(res)); }
                                  public void onListIndexesFailed() { f.complete("[]"); }
                                  public void onListIndexesError() { f.complete("[]"); }
                              });
                              return newFixedLengthResponse(Response.Status.OK, "application/json", f.get());
                          }

                      } catch(Exception e) { return newFixedLengthResponse("ERR: " + e.getMessage()); }

                      // 彻底抛弃第三方 CDN，手写原生极速 UI
                      String html = "<!DOCTYPE html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>ha红外网关</title><style>body{font-family:sans-serif;background:#f3f4f6;color:#111827;padding:20px;max-width:500px;margin:0 auto}.card{background:#fff;padding:25px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.05);margin-bottom:20px}h2{text-align:center;color:#2563eb;margin-top:0}label{display:block;margin-bottom:8px;font-weight:700;font-size:14px;color:#4b5563}select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;margin-bottom:20px;font-size:16px;background:#f9fafb;outline:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}button{padding:15px;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;color:#fff;transition:all .2s}.btn-red{background:#ef4444}.btn-red:active{background:#dc2626}.btn-blue{background:#3b82f6}.btn-blue:active{background:#2563eb}.btn-gray{background:#e5e7eb;color:#374151}.btn-gray:active{background:#d1d5db}</style></head><body><div class='card'><h2>📡 ha红外网关</h2><label>设备类型</label><select id='sc' onchange='lb()'><option value=''>加载中...</option></select><label>设备品牌</label><select id='sb' onchange='li()'><option value=''>请先选择类型</option></select><label>遥控型号 (云端加载)</label><select id='si' onchange='sx()'><option value=''>请先选择品牌</option></select><div class='grid' id='bg' style='display:none;margin-top:10px'><button class='btn-red' onclick='tx(1)'>电源 (开关)</button><button class='btn-blue' onclick='tx(2)'>模式切换</button><button class='btn-gray' onclick='tx(3)'>+ (加)</button><button class='btn-gray' onclick='tx(4)'>- (减)</button></div></div><script>let cs=[],bs=[],is=[];const _c=document.getElementById('sc'),_b=document.getElementById('sb'),_i=document.getElementById('si'),_g=document.getElementById('bg');fetch('/api/categories').then(r=>r.json()).then(d=>{cs=d;_c.innerHTML='<option value=\"\">请选择设备类型</option>'+d.map((c,i)=>'<option value=\"'+i+'\">'+(c.name||c.name_cn)+'</option>').join('')});function lb(){let v=_c.value;if(v==='')return;let cid=cs[v].id||cs[v].categoryId;_b.innerHTML='<option value=\"\">数据加载中...</option>';_i.innerHTML='<option value=\"\">等待选择品牌</option>';_g.style.display='none';fetch('/api/brands?categoryId='+cid).then(r=>r.json()).then(d=>{bs=d;_b.innerHTML='<option value=\"\">请选择设备品牌</option>'+d.map((b,i)=>'<option value=\"'+i+'\">'+(b.name||b.name_cn)+'</option>').join('')})}function li(){let vc=_c.value,vb=_b.value;if(vc===''||vb==='')return;let cid=cs[vc].id||cs[vc].categoryId,bid=bs[vb].id||bs[vb].brandId;_i.innerHTML='<option value=\"\">正在匹配型号库...</option>';_g.style.display='none';fetch('/api/indexes?categoryId='+cid+'&brandId='+bid).then(r=>r.json()).then(d=>{is=d;_i.innerHTML='<option value=\"\">请选择具体遥控型号</option>'+d.map((x,i)=>'<option value=\"'+i+'\">'+(x.remoteMap||x.remote_map)+'</option>').join('')})}function sx(){if(_i.value!=='')_g.style.display='grid'}function tx(k){let v=_i.value;if(v==='')return;let cid=cs[_c.value].id||cs[_c.value].categoryId,idx=is[v],sid=idx.id||idx.indexId,map=idx.remoteMap||idx.remote_map,sub=idx.subCate||idx.sub_cate;fetch('/api/transmit?indexId='+sid+'&remoteMap='+map+'&categoryId='+cid+'&subCate='+sub+'&keyCode='+k).then(r=>r.text()).then(t=>{alert(t==='OK'?'✅ 红外信号已发射!':'❌ 失败: '+t)})}</script></body></html>";
                      return newFixedLengthResponse(Response.Status.OK, "text/html", html);
                  }
              }
              @Override public IBinder onBind(Intent intent) { return null; }
          }
          EOF

      - name: 5. 编写控制台 UI (已修复导入，100%稳定编译)
        run: |
          cat <<EOF > app/src/main/java/hap/re00660/re/MainActivity.java
          package hap.re00660.re;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.*;
          import android.view.Gravity;
          import android.graphics.Color;
          import java.io.*;

          public class MainActivity extends Activity {
              private TextView logTv;
              private Switch rootSwitch;

              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(50, 50, 50, 50);
                  layout.setGravity(Gravity.CENTER_HORIZONTAL);

                  TextView title = new TextView(this);
                  title.setText("📡 ha红外网关");
                  title.setTextSize(24);
                  title.setTextColor(Color.BLACK);
                  layout.addView(title);

                  // 1. Root 开关 (默认关闭)
                  rootSwitch = new Switch(this);
                  rootSwitch.setText("启用 Root 增强模式 (非Root手机勿开)");
                  rootSwitch.setChecked(false); 
                  rootSwitch.setPadding(0, 30, 0, 30);
                  layout.addView(rootSwitch);

                  // 2. 启动按钮
                  Button btnStart = new Button(this);
                  btnStart.setText("启动网关服务");
                  btnStart.setBackgroundColor(Color.parseColor("#1890ff"));
                  btnStart.setTextColor(Color.WHITE);
                  btnStart.setOnClickListener(v -> startGW());
                  layout.addView(btnStart);
                  
                  // 3. 电池白名单按钮 (可选)
                  Button btnBattery = new Button(this);
                  btnBattery.setText("申请后台保活 (推荐)");
                  btnBattery.setOnClickListener(v -> ignoreBattery());
                  layout.addView(btnBattery);

                  // 4. 日志显示
                  logTv = new TextView(this);
                  logTv.setText("等待启动...");
                  logTv.setPadding(0, 30, 0, 0);
                  layout.addView(logTv);

                  setContentView(layout);
              }

              private void startGW() {
                  try {
                      log("正在启动服务...");
                      if (rootSwitch.isChecked()) {
                          new Thread(() -> {
                              try {
                                  Process p = Runtime.getRuntime().exec("su");
                                  DataOutputStream os = new DataOutputStream(p.getOutputStream());
                                  os.writeBytes("dumpsys deviceidle whitelist +" + getPackageName() + "\n");
                                  os.writeBytes("exit\n");
                                  os.flush();
                                  p.waitFor();
                                  runOnUiThread(() -> log("Root 指令执行完毕"));
                              } catch(Exception e) {
                                  runOnUiThread(() -> log("Root 失败(不影响正常使用): " + e.getMessage()));
                              }
                          }).start();
                      }

                      Intent i = new Intent(this, IRService.class);
                      if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {
                          startForegroundService(i);
                      } else {
                          startService(i);
                      }
                      log("✅ 服务已启动! 浏览器访问 http://手机IP:8080");
                  } catch (Exception e) {
                      log("❌ 启动报错: " + e.getMessage());
                  }
              }

              private void ignoreBattery() {
                  try {
                      Intent intent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                      intent.setData(Uri.parse("package:" + getPackageName()));
                      startActivity(intent);
                  } catch(Exception e) {
                      log("申请白名单失败: " + e.getMessage());
                  }
              }

              private void log(String msg) {
                  logTv.setText(logTv.getText() + "\n" + msg);
              }
          }
          EOF

      - name: 6. 清单文件声明 (注入局域网流量白名单)
        run: |
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.TRANSMIT_IR" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <application android:label="ha红外网关" android:theme="@android:style/Theme.DeviceDefault.Light" android:usesCleartextTraffic="true">
                  <meta-data android:name="irext_app_key" android:value="55b1d89fda0658d6f851ee89cad564de" />
                  <meta-data android:name="irext_app_secret" android:value="83dfd86ad59843ce50342ec863a49bf0" />
                  
                  <activity android:name="hap.re00660.re.MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
                  <service android:name="hap.re00660.re.IRService" android:exported="false" />
              </application>
          </manifest>
          EOF

      - name: 7. Gradle 属性配置
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: 8. 最终构建配置
        run: |
          echo "include ':app'" > settings.gradle
          cat <<EOF > build.gradle
          buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral(); maven { url "http://maven.irext.net/"; allowInsecureProtocol = true } } }
          EOF
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              compileSdk 34
              namespace "hap.re00660.re"
              defaultConfig { applicationId "hap.re00660.re"; minSdk 26; targetSdk 34; ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' } }
          }
          dependencies {
              implementation 'org.nanohttpd:nanohttpd:2.3.1'
              implementation 'net.irext.webapi:irext-androidapi:1.5.2'
              implementation 'com.google.code.gson:gson:2.10.1'
          }
          EOF

      - name: 9. 执行编译
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: 10. 导出 APK
        run: gradle assembleDebug

      - name: 11. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: IREXT_SUCCESS_APK
          path: app/build/outputs/apk/debug/app-debug.apk
